<!doctype html>
<title>OPIc Forest</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
  rel="stylesheet"
/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #f6f2e7;
    --surface: #fffdf8;
    --surface-2: #ede6d3;
    --ink: #23291f;
    --muted: #6b7263;
    --line: #ddd3b8;
    --line-soft: #e8e0c9;
    --topic: #8a5a34;
    --topic-soft: #f0dcc4;
    --question: #3e6b4c;
    --question-soft: #dcead9;
    --paragraph: #1f7a78;
    --paragraph-soft: #d7ebe8;
    --kick: #a9761f;
    --kick-soft: #f2e3c4;
    --focus: #1f7a78;
    --shadow: 0 1px 2px rgba(35, 41, 31, 0.06), 0 8px 24px -12px rgba(35, 41, 31, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12160e;
      --surface: #1a2015;
      --surface-2: #202718;
      --ink: #eae6d8;
      --muted: #99a487;
      --line: #313a26;
      --line-soft: #262e1c;
      --topic: #dba86e;
      --topic-soft: #382a1c;
      --question: #86c795;
      --question-soft: #1e2f21;
      --paragraph: #6dd0cb;
      --paragraph-soft: #17302e;
      --kick: #e8c073;
      --kick-soft: #362a15;
      --focus: #6dd0cb;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12160e;
    --surface: #1a2015;
    --surface-2: #202718;
    --ink: #eae6d8;
    --muted: #99a487;
    --line: #313a26;
    --line-soft: #262e1c;
    --topic: #dba86e;
    --topic-soft: #382a1c;
    --question: #86c795;
    --question-soft: #1e2f21;
    --paragraph: #6dd0cb;
    --paragraph-soft: #17302e;
    --kick: #e8c073;
    --kick-soft: #362a15;
    --focus: #6dd0cb;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--paragraph-soft); }

  a { color: inherit; }
  button {
    font-family: inherit;
    color: inherit;
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .app {
    height: 100vh;
    height: 100dvh; /* mobile browsers resize the vh unit as chrome shows/hides; dvh tracks the real visible area */
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }
  /* pinned explicitly so hiding .topbar in focus mode can't let grid
     auto-placement slide .layout into its (auto-sized) row */
  .topbar { grid-row: 1; }
  .layout { grid-row: 2; min-height: 0;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-shrink: 0;
  }
  .brand h1 {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 17px;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .brand .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1 1 220px;
    min-width: 60px;
  }

  .searchwrap { position: relative; flex: 1 1 240px; max-width: 360px; }
  .searchbox {
    width: 100%;
    padding: 6px 12px 6px 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
  }
  .searchbox::placeholder { color: var(--muted); }
  .searchicon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--muted);
    pointer-events: none;
  }
  .searchresults {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    max-height: 340px;
    overflow-y: auto;
    z-index: 30;
    display: none;
  }
  .searchresults.open { display: block; }
  .sr-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--ink);
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover, .sr-item:focus-visible { background: var(--surface-2); }
  .sr-topic {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
  }
  .sr-snippet { font-size: 13px; line-height: 1.35; }
  .sr-empty { padding: 12px; font-size: 13px; color: var(--muted); }
  mark {
    background: var(--kick-soft);
    color: var(--ink);
    border-radius: 2px;
    padding: 0 1px;
  }

  .topbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 12.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted); }
  .btn[aria-pressed="true"] {
    background: var(--question-soft);
    border-color: color-mix(in srgb, var(--question) 45%, transparent);
    color: var(--question);
  }
  .topbar-status {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr 6px var(--reading-w, 300px);
    min-height: 0;
  }
  /* pinned explicitly so hiding .grove in focus mode can't let grid
     auto-placement slide .canvas-wrap/.reading-resize/.reading into its
     column */
  .grove { grid-column: 1; }
  .canvas-wrap { grid-column: 2; }
  .reading-resize { grid-column: 3; }
  .reading { grid-column: 4; }
  .reading-resize {
    cursor: col-resize;
    touch-action: none;
    position: relative;
  }
  .reading-resize::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -3px;
    right: -3px;
  }
  .reading-resize::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 3px;
    height: 32px;
    transform: translate(-50%, -50%);
    border-radius: 2px;
    background: var(--line);
  }
  .reading-resize:hover, .reading-resize.dragging {
    background: color-mix(in srgb, var(--ink) 12%, transparent);
  }
  .reading-resize:hover::before, .reading-resize.dragging::before {
    background: var(--muted);
  }
  /* mobile-only drag handle for the bottom-sheet panel's height — a
     horizontal counterpart to .reading-resize, which only makes sense as
     a side-panel width drag above the 900px breakpoint */
  .reading-resize-v { display: none; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 180px 1fr; }
    .reading-resize { display: none; }
    .reading { display: none; }
    .reading.open {
      display: block;
      position: fixed;
      inset: auto 0 0 0;
      max-height: var(--reading-h, 40vh);
      max-height: var(--reading-h, 40dvh);
      padding: 22px 16px 14px;
      z-index: 40;
      border-top: 1px solid var(--line);
      border-left: none;
      box-shadow: var(--shadow);
    }
    .reading.open h3 { font-size: 14.5px; }
    .reading.open .full-text { font-size: 12.5px; }
    .reading.open .reading-crumb { font-size: 10px; }
    .reading.open .script-box { min-height: 120px; font-size: 12.5px; }

    .reading-resize-v {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 16px;
      cursor: row-resize;
      touch-action: none;
    }
    .reading-resize-v::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
    }
    .reading-resize-v:hover::before, .reading-resize-v.dragging::before {
      background: var(--muted);
    }
  }

  /* ---------- Focus mode: a button hides the top bar + grove rail ---------- */
  .app.focus-mode .topbar,
  .app.focus-mode .grove {
    display: none;
  }
  .app.focus-mode .layout {
    grid-template-columns: 0 1fr 6px var(--reading-w, 300px);
  }
  @media (max-width: 900px) {
    .app.focus-mode .layout { grid-template-columns: 0 1fr; }
  }
  .focus-toggle {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 6;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 11px;
    box-shadow: var(--shadow);
  }
  .focus-toggle .exit-label { display: none; }
  .app.focus-mode .focus-toggle .enter-label { display: none; }
  .app.focus-mode .focus-toggle .exit-label { display: inline; }

  /* ---------- Grove rail ---------- */
  .grove {
    border-right: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    padding: 16px 12px;
  }
  .grove h2 {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 6px 10px;
    font-weight: 600;
  }
  .grove-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .grove-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: none;
    text-align: left;
  }
  .grove-item:hover { background: var(--surface-2); }
  .grove-item.active {
    background: var(--topic-soft);
    border-color: color-mix(in srgb, var(--topic) 35%, transparent);
  }
  .grove-ring {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2.5px solid var(--topic);
    flex-shrink: 0;
    display: grid;
    place-items: center;
    position: relative;
  }
  .grove-ring::after {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--topic);
  }
  .grove-name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 14.5px;
    line-height: 1.15;
    color: var(--ink);
  }
  .grove-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--muted);
  }

  .legend {
    margin-top: 18px;
    padding: 12px 10px 4px;
    border-top: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* ---------- Canvas ---------- */
  .canvas-wrap {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20px 20px, color-mix(in srgb, var(--line-soft) 70%, transparent) 1px, transparent 1.4px) 0 0/28px 28px,
      var(--bg);
  }
  svg.tree { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.tree:active { cursor: grabbing; }

  .link {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.4px;
  }
  .link.q-link { stroke: color-mix(in srgb, var(--question) 45%, var(--line)); }
  .link.p-link { stroke: color-mix(in srgb, var(--paragraph) 45%, var(--line)); }
  .link.k-link { stroke: color-mix(in srgb, var(--kick) 45%, var(--line)); }

  .node { cursor: pointer; }
  .node .pill { stroke-width: 1.6px; }
  .node.topic .pill { fill: var(--topic-soft); stroke: var(--topic); }
  .node.question .pill { fill: var(--question-soft); stroke: var(--question); }
  .node.paragraph .pill { fill: var(--paragraph-soft); stroke: var(--paragraph); }
  .node.kick .pill { fill: var(--kick-soft); stroke: var(--kick); }

  .node text {
    font-family: "Work Sans", sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    fill: var(--ink);
    text-anchor: middle;
  }
  .node.topic text {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .node.paragraph text { font-size: 12px; }
  .node.kick text { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 11px; fill: var(--muted); }

  .node.current .pill { stroke-width: 3px; }
  .node.match .pill { stroke-width: 3px; filter: drop-shadow(0 0 4px var(--focus)); }

  .node .badge circle { fill: var(--surface); stroke: currentColor; stroke-width: 1.4px; }
  .node.topic .badge circle,
  .node.question .badge circle { color: var(--question); }
  .node.paragraph .badge circle { color: var(--paragraph); }
  .node .badge text {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9px;
    font-weight: 600;
    fill: var(--ink);
  }

  /* how many times a question has been practiced — a small corner chip
     straddling the pill's top-left corner, deliberately not the branch-
     count badge's spot (that one sits centered on the pill's outward
     edge, left or right depending on which side of the topic it's on) */
  .node .take-badge rect { fill: var(--kick-soft); stroke: var(--kick); stroke-width: 1px; }
  .node .take-badge text {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9px;
    font-weight: 600;
    fill: var(--kick);
  }

  .zoom-controls {
    position: absolute;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  .zbtn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 15px;
    line-height: 1;
    box-shadow: var(--shadow);
  }

  .empty-canvas {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---------- Reading panel ---------- */
  .reading {
    border-left: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    padding: 20px;
  }
  .reading-empty {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
    margin-top: 8px;
  }
  .reading-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px 3px 7px;
    border-radius: 999px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .reading-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip-topic { background: var(--topic-soft); color: var(--topic); }
  .chip-topic .dot { background: var(--topic); }
  .chip-question { background: var(--question-soft); color: var(--question); }
  .chip-question .dot { background: var(--question); }
  .chip-paragraph { background: var(--paragraph-soft); color: var(--paragraph); }
  .chip-paragraph .dot { background: var(--paragraph); }
  .chip-kick { background: var(--kick-soft); color: var(--kick); }
  .chip-kick .dot { background: var(--kick); }

  .reading-crumb {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    line-height: 1.5;
  }
  .reading h3 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.35;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .reading .full-text {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink);
  }
  .reading-kicks {
    margin-top: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .kick-chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--kick-soft);
    color: var(--kick);
    border: 1px solid color-mix(in srgb, var(--kick) 30%, transparent);
  }
  .kick-editor-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 16px;
    margin-bottom: 6px;
  }
  .kick-actions {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .kick-add, .kick-reset {
    border: none;
    background: none;
    padding: 2px 4px;
    color: var(--paragraph);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .kick-add:hover, .kick-reset:hover { text-decoration: underline; }
  .kick-chip-edit {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px;
  }
  .kick-chip-edit.kick-dragging {
    opacity: 0.5;
  }
  .kick-grip {
    cursor: grab;
    touch-action: none;
    padding: 2px 3px;
    color: inherit;
    opacity: 0.55;
    font-size: 12px;
    line-height: 1;
    user-select: none;
  }
  .kick-grip:hover { opacity: 0.9; }
  .kick-input {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    outline: none;
    padding: 2px 0;
    min-width: 24px;
  }
  .kick-del {
    border: none;
    background: none;
    color: inherit;
    opacity: 0.6;
    font-size: 13px;
    line-height: 1;
    padding: 2px 6px;
    cursor: pointer;
  }
  .kick-del:hover { opacity: 1; }
  .kick-empty {
    font-size: 12.5px;
    color: var(--muted);
    margin: 4px 0 0;
  }
  .all-kicks-head {
    margin-top: 16px;
    margin-bottom: 8px;
  }
  .all-kicks {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .all-kicks-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .all-kicks-cue {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--paragraph);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .btn-script {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--topic);
    color: var(--surface);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }
  .script-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--question);
    color: var(--surface);
    font-size: 13px;
    font-weight: 600;
    border: none;
  }
  .script-toggle:hover { opacity: 0.9; }
  /* TEMPORARY: recording feasibility probe (see wireRecProbe) */
  .rec-probe-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--kick);
    color: var(--surface);
    font-size: 13px;
    font-weight: 600;
    border: none;
  }
  .rec-probe-btn:hover { opacity: 0.9; }
  .rec-probe-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .script-head, .practice-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 16px;
    margin-bottom: 6px;
  }
  .script-panel .script-head { margin-top: 10px; }
  .practice-count-display {
    font-family: "IBM Plex Mono", monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--kick);
    margin: 0;

<div class="app" id="app">

      </div>
