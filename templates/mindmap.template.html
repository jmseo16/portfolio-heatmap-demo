<!doctype html>
<title>OPIc Forest</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
  rel="stylesheet"
/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #f6f2e7;
    --surface: #fffdf8;
    --surface-2: #ede6d3;
    --ink: #23291f;
    --muted: #6b7263;
    --line: #ddd3b8;
    --line-soft: #e8e0c9;
    --topic: #8a5a34;
    --topic-soft: #f0dcc4;
    --question: #3e6b4c;
    --question-soft: #dcead9;
    --paragraph: #1f7a78;
    --paragraph-soft: #d7ebe8;
    --kick: #a9761f;
    --kick-soft: #f2e3c4;
    --focus: #1f7a78;
    --shadow: 0 1px 2px rgba(35, 41, 31, 0.06), 0 8px 24px -12px rgba(35, 41, 31, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12160e;
      --surface: #1a2015;
      --surface-2: #202718;
      --ink: #eae6d8;
      --muted: #99a487;
      --line: #313a26;
      --line-soft: #262e1c;
      --topic: #dba86e;
      --topic-soft: #382a1c;
      --question: #86c795;
      --question-soft: #1e2f21;
      --paragraph: #6dd0cb;
      --paragraph-soft: #17302e;
      --kick: #e8c073;
      --kick-soft: #362a15;
      --focus: #6dd0cb;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12160e;
    --surface: #1a2015;
    --surface-2: #202718;
    --ink: #eae6d8;
    --muted: #99a487;
    --line: #313a26;
    --line-soft: #262e1c;
    --topic: #dba86e;
    --topic-soft: #382a1c;
    --question: #86c795;
    --question-soft: #1e2f21;
    --paragraph: #6dd0cb;
    --paragraph-soft: #17302e;
    --kick: #e8c073;
    --kick-soft: #362a15;
    --focus: #6dd0cb;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--paragraph-soft); }

  a { color: inherit; }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .app {
    height: 100vh;
    height: 100dvh; /* mobile browsers resize the vh unit as chrome shows/hides; dvh tracks the real visible area */
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }
  /* pinned explicitly so hiding .topbar in focus mode can't let grid
     auto-placement slide .layout into its (auto-sized) row */
  .topbar { grid-row: 1; }
  .layout { grid-row: 2; min-height: 0;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-shrink: 0;
  }
  .brand h1 {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 17px;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .brand .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1 1 220px;
    min-width: 60px;
  }

  .searchwrap { position: relative; flex: 1 1 240px; max-width: 360px; }
  .searchbox {
    width: 100%;
    padding: 6px 12px 6px 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
  }
  .searchbox::placeholder { color: var(--muted); }
  .searchicon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--muted);
    pointer-events: none;
  }
  .searchresults {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    max-height: 340px;
    overflow-y: auto;
    z-index: 30;
    display: none;
  }
  .searchresults.open { display: block; }
  .sr-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--ink);
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover, .sr-item:focus-visible { background: var(--surface-2); }
  .sr-topic {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
  }
  .sr-snippet { font-size: 13px; line-height: 1.35; }
  .sr-empty { padding: 12px; font-size: 13px; color: var(--muted); }
  mark {
    background: var(--kick-soft);
    color: var(--ink);
    border-radius: 2px;
    padding: 0 1px;
  }

  .topbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 12.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted); }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr 300px;
    min-height: 0;
  }
  /* pinned explicitly so hiding .grove in focus mode can't let grid
     auto-placement slide .canvas-wrap/.reading into its column */
  .grove { grid-column: 1; }
  .canvas-wrap { grid-column: 2; }
  .reading { grid-column: 3; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 180px 1fr; }
    .reading { display: none; }
    .reading.open {
      display: block;
      position: fixed;
      inset: auto 0 0 0;
      max-height: 40vh;
      max-height: 40dvh;
      padding: 14px 16px;
      z-index: 40;
      border-top: 1px solid var(--line);
      border-left: none;
      box-shadow: var(--shadow);
    }
    .reading.open h3 { font-size: 14.5px; }
    .reading.open .full-text { font-size: 12.5px; }
    .reading.open .reading-crumb { font-size: 10px; }
    .reading.open .script-box { min-height: 120px; font-size: 12.5px; }
  }

  /* ---------- Focus mode: a button hides the top bar + grove rail ---------- */
  .app.focus-mode .topbar,
  .app.focus-mode .grove {
    display: none;
  }
  .app.focus-mode .layout {
    grid-template-columns: 0 1fr 300px;
  }
  @media (max-width: 900px) {
    .app.focus-mode .layout { grid-template-columns: 0 1fr; }
  }
  .focus-toggle {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 6;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 11px;
    box-shadow: var(--shadow);
  }
  .focus-toggle .exit-label { display: none; }
  .app.focus-mode .focus-toggle .enter-label { display: none; }
  .app.focus-mode .focus-toggle .exit-label { display: inline; }

  /* ---------- Grove rail ---------- */
  .grove {
    border-right: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    padding: 16px 12px;
  }
  .grove h2 {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 6px 10px;
    font-weight: 600;
  }
  .grove-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .grove-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: none;
    text-align: left;
  }
  .grove-item:hover { background: var(--surface-2); }
  .grove-item.active {
    background: var(--topic-soft);
    border-color: color-mix(in srgb, var(--topic) 35%, transparent);
  }
  .grove-ring {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2.5px solid var(--topic);
    flex-shrink: 0;
    display: grid;
    place-items: center;
    position: relative;
  }
  .grove-ring::after {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--topic);
  }
  .grove-name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 14.5px;
    line-height: 1.15;
  }
  .grove-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--muted);
  }

  .legend {
    margin-top: 18px;
    padding: 12px 10px 4px;
    border-top: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* ---------- Canvas ---------- */
  .canvas-wrap {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20px 20px, color-mix(in srgb, var(--line-soft) 70%, transparent) 1px, transparent 1.4px) 0 0/28px 28px,
      var(--bg);
  }
  svg.tree { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.tree:active { cursor: grabbing; }

  .link {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.4px;
  }
  .link.q-link { stroke: color-mix(in srgb, var(--question) 45%, var(--line)); }
  .link.p-link { stroke: color-mix(in srgb, var(--paragraph) 45%, var(--line)); }
  .link.k-link { stroke: color-mix(in srgb, var(--kick) 45%, var(--line)); }

  .node { cursor: pointer; }
  .node .pill { stroke-width: 1.6px; }
  .node.topic .pill { fill: var(--topic-soft); stroke: var(--topic); }
  .node.question .pill { fill: var(--question-soft); stroke: var(--question); }
  .node.paragraph .pill { fill: var(--paragraph-soft); stroke: var(--paragraph); }
  .node.kick .pill { fill: var(--kick-soft); stroke: var(--kick); }

  .node text {
    font-family: "Work Sans", sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    fill: var(--ink);
    text-anchor: middle;
  }
  .node.topic text {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .node.paragraph text { font-size: 12px; }
  .node.kick text { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 11px; fill: var(--muted); }

  .node.current .pill { stroke-width: 3px; }
  .node.match .pill { stroke-width: 3px; filter: drop-shadow(0 0 4px var(--focus)); }

  .node .badge circle { fill: var(--surface); stroke: currentColor; stroke-width: 1.4px; }
  .node.topic .badge circle,
  .node.question .badge circle { color: var(--question); }
  .node.paragraph .badge circle { color: var(--paragraph); }
  .node .badge text {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9px;
    font-weight: 600;
    fill: var(--ink);
  }

  .zoom-controls {
    position: absolute;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  .zbtn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 15px;
    line-height: 1;
    box-shadow: var(--shadow);
  }

  .empty-canvas {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---------- Reading panel ---------- */
  .reading {
    border-left: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    padding: 20px;
  }
  .reading-empty {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
    margin-top: 8px;
  }
  .reading-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px 3px 7px;
    border-radius: 999px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .reading-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip-topic { background: var(--topic-soft); color: var(--topic); }
  .chip-topic .dot { background: var(--topic); }
  .chip-question { background: var(--question-soft); color: var(--question); }
  .chip-question .dot { background: var(--question); }
  .chip-paragraph { background: var(--paragraph-soft); color: var(--paragraph); }
  .chip-paragraph .dot { background: var(--paragraph); }
  .chip-kick { background: var(--kick-soft); color: var(--kick); }
  .chip-kick .dot { background: var(--kick); }

  .reading-crumb {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    line-height: 1.5;
  }
  .reading h3 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.35;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .reading .full-text {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink);
  }
  .reading-kicks {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .kick-chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--kick-soft);
    color: var(--kick);
    border: 1px solid color-mix(in srgb, var(--kick) 30%, transparent);
  }
  .btn-script {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--topic);
    color: var(--surface);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }

  .script-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 16px;
    margin-bottom: 6px;
  }
  .script-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .script-reset {
    border: none;
    background: none;
    padding: 2px 4px;
    color: var(--paragraph);
    font-size: 11.5px;
    font-weight: 500;
  }
  .script-reset:hover { text-decoration: underline; }
  .script-box {
    width: 100%;
    min-height: 220px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-family: "Work Sans", sans-serif;
    font-size: 13.5px;
    line-height: 1.6;
    resize: vertical;
  }
  .btn-script:hover { opacity: 0.9; }

  .reading-close {
    display: none;
  }
  @media (max-width: 900px) {
    .reading-close {
      display: inline-flex;
      float: right;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 18px;
    }
  }

  @media (prefers-reduced-motion: no-preference) {
    .node, .link { transition: opacity 180ms ease; }
  }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <h1>OPIc Forest</h1>
      <span class="tag">mindmap</span>
    </div>
    <p class="hint">Click a question to branch into its script beats, click a beat for its kick phrases.</p>
    <div class="searchwrap">
      <svg class="searchicon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8.5" cy="8.5" r="6"/><line x1="13" y1="13" x2="18" y2="18"/></svg>
      <input class="searchbox" id="search" type="text" placeholder="Search every topic, question, beat, kick…" autocomplete="off" />
      <div class="searchresults" id="searchResults"></div>
    </div>
    <div class="topbar-actions">
      <button class="btn" id="expandAll" type="button">Expand tree</button>
      <button class="btn" id="collapseAll" type="button">Collapse tree</button>
    </div>
  </header>

  <div class="layout">
    <nav class="grove" aria-label="Topics">
      <h2>The Grove</h2>
      <ul class="grove-list" id="groveList"></ul>
      <div class="legend">
        <div class="legend-row"><span class="legend-dot" style="background:var(--topic)"></span>Topic</div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--question)"></span>Question</div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--paragraph)"></span>Script beat</div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--kick)"></span>Kick phrase</div>
      </div>
    </nav>

    <main class="canvas-wrap">
      <svg class="tree" id="tree" role="img" aria-label="Radial mindmap of the selected OPIc topic"></svg>
      <button class="focus-toggle" id="focusToggle" type="button">
        <span class="enter-label">⛶ Fullscreen</span>
        <span class="exit-label">✕ Exit fullscreen</span>
      </button>
      <div class="zoom-controls">
        <button class="zbtn" id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button class="zbtn" id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
        <button class="zbtn" id="zoomReset" type="button" aria-label="Reset view">&#8635;</button>
      </div>
    </main>

    <aside class="reading" id="reading">
      <button class="reading-close" id="readingClose" aria-label="Close">&times;</button>
      <div id="readingBody">
        <p class="reading-empty">Select any node to read its full text here — the tree only ever shows short labels.</p>
      </div>
    </aside>
  </div>
</div>

<script>
  const FOREST = /*__FOREST_DATA__*/[]/*__END_FOREST_DATA__*/;

  const state = { topicIndex: 0, current: null };

  const groveList = d3.select("#groveList");
  const svg = d3.select("#tree");
  const g = svg.append("g").attr("class", "viewport");
  const linkLayer = g.append("g").attr("class", "links");
  const nodeLayer = g.append("g").attr("class", "nodes");
  const readingBody = document.getElementById("readingBody");
  const reading = document.getElementById("reading");

  const zoom = d3.zoom()
    .scaleExtent([0.35, 3])
    .on("zoom", (event) => g.attr("transform", event.transform));
  svg.call(zoom).on("dblclick.zoom", null);

  // column gaps are computed fresh every render from the actual measured
  // pill widths (see fitColumns below) — this is just the minimum
  // clearance added between two adjacent columns' widest pills. Row spacing
  // is likewise computed fresh from measured pill heights (see renderTree)
  // since a script-beat pill now shows its full verbatim text and can run
  // to several lines — ROW_BUFFER is just the clearance added on top of the
  // tallest pill anywhere in the current view.
  const COLUMN_BUFFER = 34;
  const ROW_BUFFER = 16;
  const PILL_PAD_X = { topic: 16, question: 12, paragraph: 12, kick: 9 };
  const PILL_PAD_Y = { topic: 9, question: 7, paragraph: 8, kick: 5 };
  const WRAP_CHARS = { topic: 99, question: 30, paragraph: 32, kick: 18 };

  // remembers each node's last-drawn screen position, keyed by its id, so a
  // search jump can pan the camera to it right after expanding it
  const posById = new Map();

  // splits a label into as many lines as it takes to keep each one under
  // maxChars, so a pill never has to stretch to fit one very long line —
  // a script beat's full text can run to several lines, which is fine
  // since row height is measured and laid out after wrapping (see below)
  function wrapLabel(text, maxChars) {
    const words = text.split(/\s+/);
    const lines = [];
    let cur = "";
    for (const w of words) {
      const trial = cur ? `${cur} ${w}` : w;
      if (cur && trial.length > maxChars) {
        lines.push(cur);
        cur = w;
      } else {
        cur = trial;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ---- prepare per-topic hierarchy with collapse state ----
  function buildRoot(topicData) {
    const root = d3.hierarchy(topicData);
    root.descendants().forEach((d) => (d.id = d.data.id));
    root.descendants().forEach((d) => {
      if (d.depth >= 1 && d.children) {
        d._children = d.children;
        d.children = null;
      }
    });
    return root;
  }

  let roots = FOREST.map(buildRoot);

  function renderGrove() {
    const items = groveList.selectAll("li").data(FOREST, (d) => d.id);
    const li = items.enter().append("li");
    const btn = li.append("button").attr("class", "grove-item");
    btn.append("span").attr("class", "grove-ring");
    const text = btn.append("span");
    text.append("span").attr("class", "grove-name").style("display", "block");
    text.append("span").attr("class", "grove-count").style("display", "block");

    groveList.selectAll(".grove-item")
      .on("click", (event, d) => {
        state.topicIndex = FOREST.indexOf(d);
        setCurrent(null);
        renderTree(true);
        renderGrove();
      })
      .classed("active", (d, i) => i === state.topicIndex)
      .select(".grove-ring")
      .style("border-color", (d, i) => (i === state.topicIndex ? "var(--topic)" : "var(--line)"));

    groveList.selectAll(".grove-name").text((d) => d.name);
    groveList.selectAll(".grove-count").text((d) => `${d.children.length} questions`);
  }

  function crumbFor(d) {
    const chain = d
      .ancestors()
      .reverse()
      .map((n) => (n.data.tag ? `${n.data.tag} ${n.data.name}` : n.data.name));
    return chain.join(" ▸ ");
  }

  function typeLabel(t) {
    return { topic: "Topic", question: "Question", paragraph: "Script beat", kick: "Kick phrase" }[t];
  }

  function setCurrent(node) {
    state.current = node;
    nodeLayer.selectAll("g.node").classed("current", (d) => node && d.master.id === node.id);
    if (!node) {
      readingBody.innerHTML = '<p class="reading-empty">Select any node to read its full text here — the tree only ever shows short labels.</p>';
      return;
    }
    const t = node.data.type;
    let html = `<div class="reading-crumb">${crumbFor(node)}</div>`;
    html += `<div class="reading-chip chip-${t}"><span class="dot"></span>${typeLabel(t)}</div>`;
    html += `<h3>${escapeHtml(node.data.full || node.data.name)}</h3>`;
    if (t === "question") {
      html += `<p class="full-text">Tap this question in the tree to reveal its script beats, then tap a beat to reveal its kick phrases.</p>`;
      html += `<div class="script-head"><span class="script-label">Your script</span><button type="button" class="script-reset">↺ Reset to original</button></div>`;
      html += `<textarea class="script-box" spellcheck="false" aria-label="Editable script for this question"></textarea>`;
    }
    if (t === "paragraph" && node.data.children && node.data.children.length) {
      html += `<div class="reading-kicks">` + node.data.children.map((k) => `<span class="kick-chip">${escapeHtml(k.name)}</span>`).join("") + `</div>`;
    }
    if (t === "topic") {
      const qCount = node.data.children.length;
      const pCount = node.data.children.reduce((s, q) => s + q.children.length, 0);
      html += `<p class="full-text">${qCount} questions, ${pCount} script beats in this tree.</p>`;
      if (node.data.scriptUrl) {
        html += `<a class="btn-script" href="${escapeHtml(node.data.scriptUrl)}" target="_blank" rel="noopener">Show script ↗</a>`;
      }
    }
    readingBody.innerHTML = html;
    if (t === "question") wireScriptBox(node);
    if (window.matchMedia("(max-width: 900px)").matches) reading.classList.add("open");
  }

  // the editable per-question script box: defaults to that question's
  // script beats (column C, in order) stitched into one script, but a
  // viewer's own edits persist in this browser (localStorage) so the same
  // box comes back edited next time they open this question, until they
  // reset it
  function defaultScriptFor(node) {
    return (node.data.children || []).map((p) => p.full).join("\n\n");
  }

  function wireScriptBox(node) {
    const box = readingBody.querySelector(".script-box");
    const resetBtn = readingBody.querySelector(".script-reset");
    if (!box) return;
    const key = `opic-script:${node.id}`;
    const original = defaultScriptFor(node);

    let saved = null;
    try {
      saved = localStorage.getItem(key);
    } catch (e) {}
    box.value = saved !== null ? saved : original;

    box.addEventListener("input", () => {
      try {
        localStorage.setItem(key, box.value);
      } catch (e) {}
    });

    resetBtn.addEventListener("click", () => {
      box.value = original;
      try {
        localStorage.removeItem(key);
      } catch (e) {}
      box.focus();
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function toggle(d) {
    if (d.data.type !== "question" && d.data.type !== "paragraph") return;
    if (d.children) {
      d._children = d.children;
      d.children = null;
    } else if (d._children) {
      d.children = d._children;
      d._children = null;
    }
    renderTree(false);
  }

  // wraps a master (state-tracking) hierarchy node in a plain object so a
  // fresh, self-contained d3.hierarchy can be built for layout purposes
  // without disturbing the master's own .parent chain
  function mirrorVisible(masterNode) {
    return {
      master: masterNode,
      children: masterNode.children ? masterNode.children.map(mirrorVisible) : undefined,
    };
  }

  // builds one side's (an array of top-level question master-nodes)
  // self-contained hierarchy for layout purposes, without disturbing the
  // master's own .parent chain
  function buildSideHierarchy(questionNodes) {
    if (!questionNodes.length) return null;
    return d3.hierarchy({ children: questionNodes.map(mirrorVisible) });
  }

  // lays out one side's hierarchy as a tidy tree at the given row spacing,
  // converting each node's row into a screen Y recentered around this
  // side's own vertical middle so left and right can have different
  // extents. Screen X is filled in later, once every visible pill has been
  // measured (see fitColumns). Safe to call twice on the same wrapper:
  // d3.tree() re-lays-out the very same node objects in place, so calling
  // this again with the real row gap (once pill heights are known) just
  // updates .screenY on the exact objects the first, placeholder-gap call
  // already attached pill measurements to.
  function layoutSideRows(wrapper, side, rowGap) {
    if (!wrapper) return [];
    d3.tree()
      .nodeSize([rowGap, 1])
      .separation((a, b) => (a.parent === b.parent ? 1 : 1.7))(wrapper);

    const rows = wrapper.descendants().filter((d) => d.depth > 0);
    if (!rows.length) return [];
    const extent = d3.extent(rows, (d) => d.x);
    const mid = (extent[0] + extent[1]) / 2;
    rows.forEach((d) => {
      d.master = d.data.master;
      d.side = side;
      d.screenY = d.x - mid;
    });
    return rows;
  }

  // measures every node's wrapped label (as rendered, with its real font)
  // and returns a per-depth column X, wide enough that even the widest
  // pill at each depth clears its neighboring column with room to spare
  function fitColumns(nodes) {
    const maxHalf = [];
    nodes.forEach((d) => {
      maxHalf[d.depth] = Math.max(maxHalf[d.depth] || 0, d.pillW / 2);
    });
    const x = [0];
    for (let depth = 1; depth < maxHalf.length; depth++) {
      const prevHalf = maxHalf[depth - 1] || 0;
      const half = maxHalf[depth] || 0;
      x[depth] = x[depth - 1] + prevHalf + half + COLUMN_BUFFER;
    }
    return x;
  }

  function renderTree(recenter) {
    const root = roots[state.topicIndex];
    const bounds = svg.node().getBoundingClientRect();

    const rootPseudo = { master: root, depth: 0, screenX: 0, screenY: 0 };
    const rightQuestions = root.children.filter((_, i) => i % 2 === 0);
    const leftQuestions = root.children.filter((_, i) => i % 2 === 1);
    const rightWrapper = buildSideHierarchy(rightQuestions);
    const leftWrapper = buildSideHierarchy(leftQuestions);

    // pass 0: lay out rows at a placeholder gap just to get stable node
    // identities to attach measurements to — the real gap depends on pill
    // heights, which aren't known until those pills exist and are measured
    const rightRows = layoutSideRows(rightWrapper, 1, 40);
    const leftRows = layoutSideRows(leftWrapper, -1, 40);
    const nodes = [rootPseudo, ...rightRows, ...leftRows];

    const nodeSel = nodeLayer.selectAll("g.node").data(nodes, (d) => d.master.id);
    nodeSel.exit().remove();

    const nodeEnter = nodeSel.enter().append("g");
    nodeEnter.append("rect").attr("class", "pill");
    nodeEnter.append("text");
    nodeEnter.append("g").attr("class", "badge");

    const nodeMerge = nodeEnter.merge(nodeSel);
    nodeMerge.attr("class", (d) => `node ${d.master.data.type}`);

    // pass 1: set each node's label (as wrapped text) and measure the
    // rendered result to size its pill — this has to happen before we can
    // know how wide each depth's column needs to be
    nodeMerge.each(function (d) {
      const type = d.master.data.type;
      const data = d.master.data;
      let name;
      if (type === "topic") name = data.name.toUpperCase();
      else if (type === "question") name = `Q${data.tag}. ${data.name}`;
      else if (type === "paragraph") name = data.full; // the sheet's own column-C text, verbatim
      else name = data.name; // kick
      const lines = wrapLabel(name, WRAP_CHARS[type]);
      const lineH = 1.15;
      const startDy = -((lines.length - 1) * lineH) / 2 + 0.32;

      const text = d3.select(this).select("text");
      const tspans = text.selectAll("tspan").data(lines);
      tspans.exit().remove();
      tspans
        .enter()
        .append("tspan")
        .merge(tspans)
        .attr("x", 0)
        .attr("dy", (_, i) => (i === 0 ? startDy : lineH) + "em")
        .text((line) => line);

      // measure the text alone — this <g> can still hold the *previous*
      // render's pill rect and badge, which would otherwise bloat the box
      const bbox = text.node().getBBox();
      d.pillW = bbox.width + PILL_PAD_X[type] * 2;
      d.pillH = bbox.height + PILL_PAD_Y[type] * 2;

      d3.select(this)
        .select("rect.pill")
        .attr("x", -d.pillW / 2)
        .attr("y", -d.pillH / 2)
        .attr("width", d.pillW)
        .attr("height", d.pillH)
        .attr("rx", d.pillH / 2);
    });

    // pass 2: now that every pill's size is known, re-lay-out each side at
    // the real row gap (tall enough to clear the tallest pill anywhere in
    // this view — a script beat's full text can wrap to several lines) and
    // size each depth's column, then place every node (root at the origin).
    // layoutSideRows mutates the same node objects nodes[] already holds,
    // so this updates their .screenY in place — no need to rebuild nodes[].
    const rowGap = Math.max(...nodes.map((d) => d.pillH)) + ROW_BUFFER;
    layoutSideRows(rightWrapper, 1, rowGap);
    layoutSideRows(leftWrapper, -1, rowGap);

    const DEPTH_X = fitColumns(nodes);
    nodes.forEach((d) => {
      d.screenX = d.depth === 0 ? 0 : d.side * DEPTH_X[d.depth];
    });

    posById.clear();
    nodes.forEach((d) => posById.set(d.master.id, { x: d.screenX, y: d.screenY }));

    nodeMerge.attr("transform", (d) => `translate(${d.screenX},${d.screenY})`);

    nodeMerge.each(function (d) {
      const type = d.master.data.type;
      const expandable = type === "question" || type === "paragraph";
      const collapsedCount = d.master._children && !d.master.children ? d.master._children.length : 0;
      const badge = d3.select(this).select("g.badge");
      badge.selectAll("*").remove();
      if (expandable && collapsedCount > 0) {
        const dir = d.screenX < 0 ? -1 : 1;
        badge.attr("transform", `translate(${(dir * d.pillW) / 2},0)`).style("display", null);
        badge.append("circle").attr("r", 9);
        badge.append("text").attr("dy", "0.32em").attr("text-anchor", "middle").text(collapsedCount);
      } else {
        badge.style("display", "none");
      }
    });

    const links = nodes
      .filter((d) => d !== rootPseudo)
      .map((d) => ({ source: d.parent && d.parent.depth > 0 ? d.parent : rootPseudo, target: d }));

    const linkSel = linkLayer.selectAll("path.link").data(links, (d) => d.target.master.id);
    linkSel.exit().remove();
    linkSel
      .enter()
      .append("path")
      .attr("class", (d) => `link ${d.target.master.data.type[0]}-link`)
      .merge(linkSel)
      .attr("class", (d) => `link ${d.target.master.data.type[0]}-link`)
      .attr("d", (d) => {
        const sx = d.source.screenX, sy = d.source.screenY;
        const tx = d.target.screenX, ty = d.target.screenY;
        const mx = (sx + tx) / 2;
        return `M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`;
      });

    nodeMerge
      .attr("tabindex", (d) => (d.master.data.type === "topic" ? null : 0))
      .attr("role", (d) => (d.master.data.type === "topic" ? null : "button"))
      .on("click", (event, d) => {
        event.stopPropagation();
        setCurrent(d.master);
        toggle(d.master);
      })
      .on("keydown", (event, d) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          setCurrent(d.master);
          toggle(d.master);
        }
      });

    nodeMerge.classed("current", (d) => state.current && d.master.id === state.current.id);
    nodeMerge.classed("match", (d) => matchSet.has(d.master.id));

    // keep the whole visible tree in frame: every render (initial load,
    // topic switch, or a click that reveals/hides a branch) re-fits the
    // zoom so newly expanded nodes never land outside the canvas
    const pad = 130;
    const xs = nodes.map((d) => d.screenX);
    const ys = nodes.map((d) => d.screenY);
    const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
    const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
    const scale = Math.min(bounds.width / (maxX - minX), bounds.height / (maxY - minY), 1.8);
    const clamped = Math.max(scale, zoom.scaleExtent()[0]);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const t = d3.zoomIdentity.translate(bounds.width / 2 - cx * clamped, bounds.height / 2 - cy * clamped).scale(clamped);
    (recenter ? svg : svg.transition().duration(350)).call(zoom.transform, t);
  }

  // ---- expand / collapse all (within current topic) ----
  document.getElementById("expandAll").addEventListener("click", () => {
    roots[state.topicIndex].each((d) => {
      if (d._children) {
        d.children = d._children;
        d._children = null;
      }
    });
    renderTree(false);
  });
  document.getElementById("collapseAll").addEventListener("click", () => {
    roots[state.topicIndex].descendants().forEach((d) => {
      if (d.depth >= 1 && d.children) {
        d._children = d.children;
        d.children = null;
      }
    });
    renderTree(false);
  });

  // ---- zoom controls ----
  document.getElementById("zoomIn").addEventListener("click", () => svg.transition().duration(200).call(zoom.scaleBy, 1.3));
  document.getElementById("zoomOut").addEventListener("click", () => svg.transition().duration(200).call(zoom.scaleBy, 1 / 1.3));
  document.getElementById("zoomReset").addEventListener("click", () => renderTree(true));

  document.getElementById("readingClose").addEventListener("click", () => reading.classList.remove("open"));

  // ---- focus mode: a button hides the top bar + grove rail ----
  // (deliberately a button, not a tap-empty-canvas gesture: d3-zoom's touch
  // handling can swallow the synthetic click a tap would otherwise fire, so
  // a gesture-based toggle is unreliable on touch devices)
  const appEl = document.getElementById("app");
  function setFocusMode(on) {
    appEl.classList.toggle("focus-mode", on);
    renderTree(false);
  }
  document.getElementById("focusToggle").addEventListener("click", () => {
    setFocusMode(!appEl.classList.contains("focus-mode"));
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && appEl.classList.contains("focus-mode")) setFocusMode(false);
  });

  // ---- search across the whole forest ----
  let matchSet = new Set();
  const searchInput = document.getElementById("search");
  const searchResults = document.getElementById("searchResults");

  function flattenAll(topic) {
    const out = [];
    function walk(node, topicNode) {
      out.push({ node, topic: topicNode });
      (node.children || []).forEach((c) => walk(c, topicNode));
    }
    walk(topic, topic);
    return out;
  }
  const ALL_NODES = FOREST.flatMap((t) => flattenAll(t));

  function highlight(text, q) {
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return escapeHtml(text);
    return (
      escapeHtml(text.slice(0, idx)) +
      "<mark>" + escapeHtml(text.slice(idx, idx + q.length)) + "</mark>" +
      escapeHtml(text.slice(idx + q.length))
    );
  }

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim();
    matchSet = new Set();
    if (q.length < 2) {
      searchResults.classList.remove("open");
      renderTree(false);
      return;
    }
    const ql = q.toLowerCase();
    const hits = ALL_NODES.filter(({ node }) => {
      const hay = `${node.name} ${node.full || ""}`.toLowerCase();
      return hay.includes(ql);
    }).slice(0, 24);

    hits.forEach(({ node }) => matchSet.add(node.id));

    searchResults.innerHTML = hits.length
      ? hits.map(({ node, topic }) => `
          <button class="sr-item" data-topic="${topic.id}" data-node="${node.id}">
            <span class="sr-topic">${escapeHtml(topic.name)} · ${typeLabel(node.type)}</span>
            <span class="sr-snippet">${highlight(node.full || node.name, q)}</span>
          </button>`).join("")
      : `<p class="sr-empty">No matches across any topic.</p>`;
    searchResults.classList.add("open");

    renderTree(false);
  });

  // finds a node anywhere in the hierarchy (visible or collapsed) and expands
  // every ancestor on the path down to it
  function findAndReveal(root, id) {
    let target = null;
    (function walk(node) {
      if (node.id === id) {
        target = node;
        return true;
      }
      const kids = node.children || node._children;
      if (!kids) return false;
      for (const kid of kids) {
        if (walk(kid)) {
          if (node._children && !node.children) {
            node.children = node._children;
            node._children = null;
          }
          return true;
        }
      }
      return false;
    })(root);
    return target;
  }

  function focusOnNode(id) {
    const root = roots[state.topicIndex];
    let target = null;
    (function walk(n) {
      if (n.id === id) target = n;
      (n.children || []).forEach(walk);
    })(root);
    if (!target) return;
    const pos = posById.get(id);
    if (pos) {
      const bounds = svg.node().getBoundingClientRect();
      const scale = 1.1;
      const t = d3.zoomIdentity
        .translate(bounds.width / 2 - pos.x * scale, bounds.height / 2 - pos.y * scale)
        .scale(scale);
      svg.transition().duration(500).call(zoom.transform, t);
    }
    setCurrent(target);
  }

  searchResults.addEventListener("click", (e) => {
    const btn = e.target.closest(".sr-item");
    if (!btn) return;
    const topicId = btn.dataset.topic;
    const nodeId = btn.dataset.node;
    const topicIdx = FOREST.findIndex((t) => t.id === topicId);
    if (topicIdx !== state.topicIndex) {
      state.topicIndex = topicIdx;
      renderGrove();
    }
    findAndReveal(roots[topicIdx], nodeId);
    renderTree(false);
    focusOnNode(nodeId);
    searchResults.classList.remove("open");
    searchInput.blur();
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".searchwrap")) searchResults.classList.remove("open");
  });

  window.addEventListener("resize", () => renderTree(false));

  renderGrove();
  renderTree(true);
</script>
