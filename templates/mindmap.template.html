<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #f6f2e7;
    --surface: #fffdf8;
    --surface-2: #ede6d3;
    --ink: #23291f;
    --muted: #6b7263;
    --line: #ddd3b8;
    --line-soft: #e8e0c9;
    --topic: #8a5a34;
    --topic-soft: #f0dcc4;
    --question: #3e6b4c;
    --question-soft: #dcead9;
    --paragraph: #1f7a78;
    --paragraph-soft: #d7ebe8;
    --kick: #a9761f;
    --kick-soft: #f2e3c4;
    --focus: #1f7a78;
    --shadow: 0 1px 2px rgba(35, 41, 31, 0.06), 0 8px 24px -12px rgba(35, 41, 31, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12160e;
      --surface: #1a2015;
      --surface-2: #202718;
      --ink: #eae6d8;
      --muted: #99a487;
      --line: #313a26;
      --line-soft: #262e1c;
      --topic: #dba86e;
      --topic-soft: #382a1c;
      --question: #86c795;
      --question-soft: #1e2f21;
      --paragraph: #6dd0cb;
      --paragraph-soft: #17302e;
      --kick: #e8c073;
      --kick-soft: #362a15;
      --focus: #6dd0cb;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12160e;
    --surface: #1a2015;
    --surface-2: #202718;
    --ink: #eae6d8;
    --muted: #99a487;
    --line: #313a26;
    --line-soft: #262e1c;
    --topic: #dba86e;
    --topic-soft: #382a1c;
    --question: #86c795;
    --question-soft: #1e2f21;
    --paragraph: #6dd0cb;
    --paragraph-soft: #17302e;
    --kick: #e8c073;
    --kick-soft: #362a15;
    --focus: #6dd0cb;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--paragraph-soft); }

  a { color: inherit; }
  button {
    font-family: inherit;
    color: inherit;
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .app {
    height: 100vh;
    height: 100dvh; /* mobile browsers resize the vh unit as chrome shows/hides; dvh tracks the real visible area */
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }
  /* pinned explicitly so hiding .topbar in focus mode can't let grid
     auto-placement slide .layout into its (auto-sized) row */
  .topbar { grid-row: 1; }
  .layout { grid-row: 2; min-height: 0;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-shrink: 0;
  }
  .brand h1 {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 17px;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .brand .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1 1 220px;
    min-width: 60px;
  }

  .searchwrap { position: relative; flex: 1 1 240px; max-width: 360px; }
  .searchbox {
    width: 100%;
    padding: 6px 12px 6px 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
  }
  .searchbox::placeholder { color: var(--muted); }
  .searchicon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--muted);
    pointer-events: none;
  }
  .searchresults {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    max-height: 340px;
    overflow-y: auto;
    z-index: 30;
    display: none;
  }
  .searchresults.open { display: block; }
  .sr-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--ink);
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover, .sr-item:focus-visible { background: var(--surface-2); }
  .sr-topic {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
  }
  .sr-snippet { font-size: 13px; line-height: 1.35; }
  .sr-empty { padding: 12px; font-size: 13px; color: var(--muted); }
  .sr-section-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding: 8px 12px 4px;
    background: var(--surface-2);
  }
  .sr-rec-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line-soft);
    flex-wrap: wrap;
  }
  .sr-rec-item:last-child { border-bottom: none; }
  .sr-rec-title {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--ink);
    flex: 1 1 160px;
    min-width: 0;
    overflow-wrap: break-word;
  }
  .sr-rec-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .sr-rec-btn {
    border: none;
    background: none;
    color: var(--paragraph);
    font-size: 12px;
    font-weight: 500;
    padding: 2px 6px;
    cursor: pointer;
  }
  .sr-rec-btn:hover { text-decoration: underline; }
  .sr-rec-status {
    flex: 1 1 100%;
    font-size: 10.5px;
    color: var(--muted);
  }
  .sr-rec-audio {
    display: block;
    width: 100%;
    flex: 1 1 100%;
    height: 30px;
  }
  mark {
    background: var(--kick-soft);
    color: var(--ink);
    border-radius: 2px;
    padding: 0 1px;
  }

  .topbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 12.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted); }
  .btn[hidden] { display: none; }
  .btn[aria-pressed="true"] {
    background: var(--question-soft);
    border-color: color-mix(in srgb, var(--question) 45%, transparent);
    color: var(--question);
  }
  .topbar-status {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr 6px var(--reading-w, 300px);
    min-height: 0;
  }
  /* pinned explicitly so hiding .grove in focus mode can't let grid
     auto-placement slide .canvas-wrap/.reading-resize/.reading into its
     column */
  .grove { grid-column: 1; }
  .canvas-wrap { grid-column: 2; }
  .reading-resize { grid-column: 3; }
  .reading { grid-column: 4; }
  .reading-resize {
    cursor: col-resize;
    touch-action: none;
    position: relative;
  }
  .reading-resize::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -3px;
    right: -3px;
  }
  .reading-resize::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 3px;
    height: 32px;
    transform: translate(-50%, -50%);
    border-radius: 2px;
    background: var(--line);
  }
  .reading-resize:hover, .reading-resize.dragging {
    background: color-mix(in srgb, var(--ink) 12%, transparent);
  }
  .reading-resize:hover::before, .reading-resize.dragging::before {
    background: var(--muted);
  }
  /* mobile-only drag handle for the bottom-sheet panel's height — a
     horizontal counterpart to .reading-resize, which only makes sense as
     a side-panel width drag above the 900px breakpoint */
  .reading-resize-v { display: none; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 180px 1fr; }
    .reading-resize { display: none; }
    .reading { display: none; }
    .reading.open {
      display: block;
      position: fixed;
      inset: auto 0 0 0;
      max-height: var(--reading-h, 40vh);
      max-height: var(--reading-h, 40dvh);
      padding: 22px 16px 14px;
      z-index: 40;
      border-top: 1px solid var(--line);
      border-left: none;
      box-shadow: var(--shadow);
    }
    .reading.open h3 { font-size: 14.5px; }
    .reading.open .full-text { font-size: 12.5px; }
    .reading.open .reading-crumb { font-size: 10px; }

      <button class="btn" id="importAllBtn" type="button">⬆ Import data</button>
      <input type="file" id="importAllInput" accept=".json,.txt,.csv,application/json,text/plain,text/csv" style="display:none" aria-hidden="true" tabindex="-1">
      <button class="btn" id="driveSyncBtn" type="button" hidden>🔐 Sign in to sync</button>
    </div>
    <span class="topbar-status" id="topbarStatus"></span>
    <span class="topbar-status" id="driveSyncStatus"></span>
  </header>

  <div class="layout">
    <nav class="grove" aria-label="Topics">
      <h2>The Grove</h2>
      <ul class="grove-list" id="groveList"></ul>
      <div class="legend">
        <div class="legend-row"><span class="legend-dot" style="background:var(--topic)"></span>Topic</div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--question)"></span>Question</div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--paragraph)"></span>Script beat</div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--kick)"></span>Kick phrase</div>
      </div>
    </nav>

    <main class="canvas-wrap">
      <svg class="tree" id="tree" role="img" aria-label="Radial mindmap of the selected OPIc topic"></svg>
      <button class="focus-toggle" id="focusToggle" type="button">
        <span class="enter-label">⛶ Fullscreen</span>
        <span class="exit-label">✕ Exit fullscreen</span>
      </button>
      <div class="zoom-controls">
        <button class="zbtn" id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button class="zbtn" id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
        <button class="zbtn" id="zoomReset" type="button" aria-label="Reset view">&#8635;</button>
      </div>
    </main>

    <div class="reading-resize" id="readingResize" role="separator" aria-orientation="vertical" aria-label="Resize the details panel"></div>

    <aside class="reading" id="reading">
      <div class="reading-resize-v" id="readingResizeV" role="separator" aria-orientation="horizontal" aria-label="Resize the details panel height"></div>
      <button class="reading-close" id="readingClose" aria-label="Close">&times;</button>
      <div id="readingBody">
        <p class="reading-empty">Select any node to read its full text here — the tree only ever shows short labels.</p>
      </div>
    </aside>
  </div>
</div>

<script>
  const FOREST = /*__FOREST_DATA__*/[]/*__END_FOREST_DATA__*/;

  // flat index of every question across every topic, keyed by tag —
  // powers the bulk "Export all scripts" / "Import all scripts" round trip
  const questionIndex = [];
  FOREST.forEach((t) => {
    t.children.forEach((q) => {
      questionIndex.push({ tag: q.tag, id: q.id, topic: t.name, question: q.full, node: q });
    });
  });
  const questionByTag = {};
  questionIndex.forEach((e) => {
    questionByTag[e.tag] = e;
  });

  // flat lookup of every script-beat (paragraph) object across every
  // topic, keyed by its id — used to apply kick-phrase edits (from the
  // in-panel editor or a bulk import) to the right beat regardless of
  // which topic is currently on screen.
  const paragraphById = {};
  FOREST.forEach((t) => {
    t.children.forEach((q) => {
      (q.children || []).forEach((p) => {
        paragraphById[p.id] = p;
      });
    });
  });

  // whether a question's script panel starts open. On by default (the
  // script is the main thing you came here to read) — persisted so a
  // viewer who flips the topbar's "View all scripts" off gets that as the
  // default again next visit too.
  let initialScriptsVisible = true;
  try {
    const saved = localStorage.getItem("opic-scripts-visible");
    if (saved !== null) initialScriptsVisible = saved === "1";
  } catch (e) {}

  const state = { topicIndex: 0, current: null, scriptsVisible: initialScriptsVisible };

  const groveList = d3.select("#groveList");
  const svg = d3.select("#tree");
  const g = svg.append("g").attr("class", "viewport");
  const linkLayer = g.append("g").attr("class", "links");
  const nodeLayer = g.append("g").attr("class", "nodes");
  const readingBody = document.getElementById("readingBody");
  const reading = document.getElementById("reading");

  // ---- "resume where I left off": which topic tree, which node's panel
  // was open, whether it was showing the Takes page, and fullscreen —
  // saved on every change that affects any of those, restored once at the
  // very bottom of this script (after everything it needs is defined).
  // Matters most for a Home Screen shortcut, which always cold-starts the
  // page fresh rather than keeping a backgrounded tab alive. ----
  const APP_STATE_KEY = "opic-app-state";
  function persistAppState() {
    try {
      const pages = document.getElementById("readingPages");
      const appEl = document.getElementById("app");
      localStorage.setItem(
        APP_STATE_KEY,
        JSON.stringify({
          topicIndex: state.topicIndex,
          currentNodeId: state.current ? state.current.id : null,
          showTakes: !!(pages && pages.classList.contains("show-takes")),
          focusMode: !!(appEl && appEl.classList.contains("focus-mode")),
        })
      );
    } catch (e) {}
  }

  const zoom = d3.zoom()
    .scaleExtent([0.35, 3])
    .on("zoom", (event) => g.attr("transform", event.transform));
  svg.call(zoom).on("dblclick.zoom", null);

  // column gaps are computed fresh every render from the actual measured
  // pill widths (see fitColumns below) — this is just the minimum
  // clearance added between two adjacent columns' widest pills. Row spacing
  // is likewise computed fresh from measured pill heights (see renderTree)
  // since a script-beat pill now shows its full verbatim text and can run
  // to several lines — ROW_BUFFER is just the clearance added on top of the
  // tallest pill anywhere in the current view.
  const COLUMN_BUFFER = 34;
  const ROW_BUFFER = 16;
  const PILL_PAD_X = { topic: 16, question: 12, paragraph: 12, kick: 9 };
  const PILL_PAD_Y = { topic: 9, question: 7, paragraph: 8, kick: 5 };
  const WRAP_CHARS = { topic: 99, question: 30, paragraph: 32, kick: 18 };

  // remembers each node's last-drawn screen position, keyed by its id, so a
  // search jump can pan the camera to it right after expanding it
  const posById = new Map();

  // splits a label into as many lines as it takes to keep each one under
  // maxChars, so a pill never has to stretch to fit one very long line —
  // a script beat's full text can run to several lines, which is fine
  // since row height is measured and laid out after wrapping (see below)
  function wrapLabel(text, maxChars) {
    const words = text.split(/\s+/);
    const lines = [];
    let cur = "";
    for (const w of words) {
      const trial = cur ? `${cur} ${w}` : w;
      if (cur && trial.length > maxChars) {
        lines.push(cur);
        cur = w;
      } else {
        cur = trial;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ---- prepare per-topic hierarchy with collapse state ----
  function buildRoot(topicData) {
    const root = d3.hierarchy(topicData);
    root.descendants().forEach((d) => (d.id = d.data.id));
    root.descendants().forEach((d) => {
      if (d.depth >= 1 && d.children) {
        d._children = d.children;
        d.children = null;
      }
    });
    return root;
  }

  let roots = FOREST.map(buildRoot);

  function renderGrove() {
    const items = groveList.selectAll("li").data(FOREST, (d) => d.id);
    const li = items.enter().append("li");
    const btn = li.append("button").attr("class", "grove-item");
    btn.append("span").attr("class", "grove-ring");
    const text = btn.append("span");
    text.append("span").attr("class", "grove-name").style("display", "block");
    text.append("span").attr("class", "grove-count").style("display", "block");

    groveList.selectAll(".grove-item")
      .on("click", (event, d) => {
        state.topicIndex = FOREST.indexOf(d);
        setCurrent(null);
        renderTree(true);
        renderGrove();
      })
      .classed("active", (d, i) => i === state.topicIndex)
      .select(".grove-ring")
      .style("border-color", (d, i) => (i === state.topicIndex ? "var(--topic)" : "var(--line)"));

    groveList.selectAll(".grove-name").text((d) => d.name);
    groveList.selectAll(".grove-count").text((d) => `${d.children.length} questions`);
  }

  function crumbFor(d) {
    const chain = d
      .ancestors()
      .reverse()
      .map((n) => (n.data.tag ? `${n.data.tag} ${n.data.name}` : n.data.name));
    return chain.join(" ▸ ");
  }

  function typeLabel(t) {
    return { topic: "Topic", question: "Question", paragraph: "Script beat", kick: "Kick phrase" }[t];
  }

  function setCurrent(node) {
    state.current = node;
    nodeLayer.selectAll("g.node").classed("current", (d) => node && d.master.id === node.id);
    if (!node) {
      readingBody.innerHTML = '<p class="reading-empty">Select any node to read its full text here — the tree only ever shows short labels.</p>';
      persistAppState();
      return;
    }
    const t = node.data.type;
    let html = `<div class="reading-crumb">${crumbFor(node)}</div>`;
    html += `<div class="reading-chip chip-${t}"><span class="dot"></span>${typeLabel(t)}</div>`;
    html += `<h3>${escapeHtml(node.data.full || node.data.name)}</h3>`;
    if (t === "question") {
      const hasTakes = getPracticeCount(node.data.id) > 0;
      const takeCount = getPracticeCount(node.data.id);
      html += `<div class="reading-pages" id="readingPages">`;
      // page 1 (off-screen at rest, DOM-first so translateX(-50%) parks it
      // to the left, clipped by .reading's overflow-x:hidden — both pages
      // stay flex children the whole time, never display:none, since
      // removing one from the flex row would collapse the other to the
      // wrong slot): the Takes/recording view, swiped in from the right.
      html += `<div class="reading-page reading-page-takes" id="readingPageTakes">`;
      html += `<button type="button" class="reading-page-back" id="takesBack">‹ Back</button>`;
      html += `<div class="practice-head"><span class="script-label">Takes</span><div class="script-actions">`;
      html += `<button type="button" class="takes-record" id="takesRecord">🎙 Record</button>`;
      html += `<button type="button" class="practice-log" id="takesLog">+ Log without recording</button>`;
      html += `<button type="button" class="practice-reset" id="takesReset"${hasTakes ? "" : " hidden"}>↺ Reset all</button>`;
      html += `</div></div>`;
      html += `<span class="script-status" id="takesStatus"></span>`;
      html += `<div id="takesList"></div>`;
      html += `</div>`;
      // page 2 (the default view): what the panel looked like before Takes
      // was added — hint text, kicks-to-use, the script toggle — plus a
      // small nav button into the Takes page above.
      html += `<div class="reading-page reading-page-main" id="readingPageMain">`;
      html += `<p class="full-text">Tap this question in the tree to reveal its script beats, then tap a beat to reveal its kick phrases.</p>`;
      html += `<button type="button" class="reading-page-nav" id="takesNav">🎙 Takes${hasTakes ? ` · take#${takeCount}` : ""} ›</button>`;
      html += `<div id="allKicksWrap">${allKicksHtml(node.data)}</div>`;
      html += `<button type="button" class="script-toggle" id="scriptToggle" aria-expanded="${state.scriptsVisible}">${state.scriptsVisible ? "▾ Hide script" : "▸ Show script"}</button>`;
      html += `<div class="script-panel" id="scriptPanel"${state.scriptsVisible ? "" : " hidden"}>`;
      html += `<div class="script-head"><span class="script-label">Your script</span><div class="script-actions">`;
      html += `<button type="button" class="script-edit-toggle" id="scriptEditToggle" aria-pressed="false">✏️ Edit</button>`;
      html += `<button type="button" class="script-kick-mode-toggle" id="scriptKickModeToggle" aria-pressed="false">🏷️ Add to kick</button>`;
      html += `<button type="button" class="script-load">⬆ Load file</button>`;
      html += `<button type="button" class="script-download">⬇ Save as .txt</button>`;
      html += `<button type="button" class="script-reset">↺ Reset to original</button>`;
      html += `</div></div>`;
      html += `<textarea class="script-box locked" readonly spellcheck="false" aria-label="Script for this question — tap Edit above to type, or Add to kick to drag-select a phrase"></textarea>`;
      html += `<span class="script-status"></span>`;
      html += `<input type="file" class="script-file-input" accept=".txt,.csv,text/plain,text/csv" aria-hidden="true" tabindex="-1">`;
      html += `</div>`;
      html += `</div>`;
      html += `</div>`;
    }
    if (t === "paragraph") {
      html += `<div class="kick-editor-head"><span class="script-label">Kick phrases</span><div class="kick-actions">`;
      html += `<button type="button" class="kick-add">+ Add</button>`;
      html += `<button type="button" class="kick-reset">↺ Reset</button>`;
      html += `</div></div>`;
      html += `<div class="reading-kicks" id="kickEditor"></div>`;
      html += `<span class="script-status" id="kickStatus"></span>`;
    }
    if (t === "topic") {
      const qCount = node.data.children.length;
      const pCount = node.data.children.reduce((s, q) => s + q.children.length, 0);
      html += `<p class="full-text">${qCount} questions, ${pCount} script beats in this tree.</p>`;
      if (node.data.scriptUrl) {
        html += `<a class="btn-script" href="${escapeHtml(node.data.scriptUrl)}" target="_blank" rel="noopener">Show script ↗</a>`;
      }
    }
    readingBody.innerHTML = html;
    if (t === "question") {
      wireScriptBox(node);
      const toggleBtn = readingBody.querySelector("#scriptToggle");
      const panel = readingBody.querySelector("#scriptPanel");
      if (toggleBtn && panel) {
        toggleBtn.addEventListener("click", () => {
          const nowHidden = !panel.hidden;
          panel.hidden = nowHidden;
          toggleBtn.textContent = nowHidden ? "▸ Show script" : "▾ Hide script";
          toggleBtn.setAttribute("aria-expanded", String(!nowHidden));
          // was sized while hidden (offsetParent null, scrollHeight 0) if
          // "View all scripts" wasn't on — measure for real now that it's
          // actually visible.
          if (!nowHidden) autoGrowTextarea(panel.querySelector(".script-box"));
        });
      }

      wireTakesSection(node);
      wireSwipePages(node);
    }
    if (t === "paragraph") wireKickEditor(node);
    if (window.matchMedia("(max-width: 900px)").matches) reading.classList.add("open");
    persistAppState();
  }

  // the editable per-question script box: defaults to that question's
  // polished script, copied verbatim from the original Google Doc (the
  // same doc the topic's "Show script" button opens) and keyed by
  // question tag — NOT a stitching of the CSV's short script-beat labels.
  // A viewer's own edits persist in this browser (localStorage) so the
  // same box comes back edited next time they open this question, until
  // they reset it. localStorage is a convenience only, though — it can be
  // cleared or unavailable — so the box also offers a real file round
  // trip: "Save as .txt" downloads the current text, and "Load file" reads
  // a .txt/.csv back in, so edits can be handed back for the source Doc
  // to be updated from.
  // works on a raw FOREST question object (id/script/children straight off
  // the data, no d3-hierarchy wrapping) — shared by defaultScriptFor below
  // and the bulk export, which walks questionIndex directly.
  function scriptTextFor(q) {
    if (q.script) return q.script;
    // fallback for a question whose Doc script hasn't been parsed yet:
    // stitch the CSV's own script-beat text together instead of leaving
    // the box empty.
    return (q.children || []).map((p) => p.full).join("\n\n");
  }

  function defaultScriptFor(node) {
    return scriptTextFor(node.data);
  }

  // the script text a viewer would actually see for a question right now:
  // their own saved edit if there is one, else the doc-sourced default.
  function effectiveScriptFor(q) {
    let saved = null;
    try {
      saved = localStorage.getItem(`opic-script:${q.id}`);
    } catch (e) {}
    return saved !== null ? saved : scriptTextFor(q);
  }

  // ---- takes: a question's practice history. Each entry is a "take" —
  // logged with or without an actual recording — carrying a stable take
  // number, whether audio exists for it, and which kick phrases the
  // viewer self-marked as used in that attempt. Metadata (small, text)
  // lives in localStorage; the audio itself (binary, potentially
  // sizeable) lives in IndexedDB — see the recordings store further
  // below. Take numbers are permanent once assigned (never renumbered on
  // delete, so a deleted take just leaves a gap) both because renumbering
  // would require migrating its IndexedDB key too, and because a visible
  // gap ("Take #1, Take #3") is an honest record that #2 existed.
  function takesKey(questionId) {
    return `opic-takes:${questionId}`;
  }

  function saveTakes(questionId, takes) {
    try {
      if (takes.length) localStorage.setItem(takesKey(questionId), JSON.stringify(takes));
      else localStorage.removeItem(takesKey(questionId));
    } catch (e) {}
    markDriveSyncDirty();
  }

  function takesFor(questionId) {
    let raw = null;
    try {
      raw = localStorage.getItem(takesKey(questionId));
    } catch (e) {}
    if (raw !== null) {
      try {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) return arr;
      } catch (e) {}
    }
    // migration: a viewer's prior session (before takes existed) may have
    // left behind a bare integer count at the old key — synthesize that
    // many empty takes once, so their tally isn't lost.
    let legacyRaw = null;
    try {
      legacyRaw = localStorage.getItem(`opic-practice:${questionId}`);
    } catch (e) {}
    const legacyCount = parseInt(legacyRaw, 10);
    if (Number.isFinite(legacyCount) && legacyCount > 0) {
      const synthesized = [];
      for (let i = 1; i <= legacyCount; i++) {
        synthesized.push({ n: i, hasRecording: false, mimeType: null, kicksMarked: [] });
      }
      saveTakes(questionId, synthesized);
      try {
        localStorage.removeItem(`opic-practice:${questionId}`);
      } catch (e) {}
      return synthesized;
    }
    return [];
  }

  function nextTakeNumber(takes) {
    return takes.reduce((max, t) => Math.max(max, t.n), 0) + 1;
  }

  // the tree's take#N corner badge and the bulk-export [practice] section
  // both just want "how many attempts total" — the highest take number
  // ever reached, which (unlike takes.length) stays correct even after a
  // mid-list delete.
  function getPracticeCount(questionId) {
    return takesFor(questionId).reduce((max, t) => Math.max(max, t.n), 0);
  }

  // used only by bulk import, to make sure at least N takes exist —
  // deliberately never truncates (a plain count from an imported .txt
  // has no way to say which takes to discard, and destroying real
  // recordings via a text-file import would be a bad surprise). The
  // explicit "Reset all" button below is the only thing that actually
  // clears a question's takes.
  function setPracticeCount(questionId, n) {
    const clamped = Math.max(0, Math.floor(n) || 0);
    const takes = takesFor(questionId);
    let highest = takes.reduce((max, t) => Math.max(max, t.n), 0);
    while (highest < clamped) {
      highest += 1;
      takes.push({ n: highest, hasRecording: false, mimeType: null, kicksMarked: [] });
    }
    saveTakes(questionId, takes);
    return highest;
  }

  function appendTake(questionId, opts) {
    const takes = takesFor(questionId);
    takes.push({
      n: nextTakeNumber(takes),
      hasRecording: !!(opts && opts.hasRecording),
      mimeType: (opts && opts.mimeType) || null,
      kicksMarked: [],
      createdAt: (opts && opts.createdAt) || Date.now(),
      durationSec: (opts && opts.durationSec) || null,
      rating: 0,
    });
    saveTakes(questionId, takes);
    return takes;
  }

  // ---- recordings: the actual audio, in IndexedDB (Blobs don't belong in
  // localStorage — small quota, and no native Blob support). One store,
  // keyed "<questionId>:<takeNumber>". Opened lazily on first use, not at
  // page load, so viewers who never record pay nothing for it. ----
  const REC_DB_NAME = "opic-recordings";
  const REC_STORE = "takes";
  let recDbPromise = null;
  function openRecDb() {
    if (recDbPromise) return recDbPromise;
    recDbPromise = new Promise((resolve) => {
      if (!window.indexedDB) {
        resolve(null);
        return;
      }
      const req = indexedDB.open(REC_DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(REC_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
    return recDbPromise;
  }
  function recKey(questionId, takeN) {
    return `${questionId}:${takeN}`;
  }
  async function putRecording(key, value) {
    const db = await openRecDb();
    if (!db) return false;
    return new Promise((resolve) => {
      const tx = db.transaction(REC_STORE, "readwrite");
      tx.objectStore(REC_STORE).put(value, key);
      tx.oncomplete = () => {
        markDriveSyncDirty();
        resolve(true);
      };
      tx.onerror = () => resolve(false);
    });
  }
  async function getRecording(key) {
    const db = await openRecDb();
    if (!db) return null;
    return new Promise((resolve) => {
      const tx = db.transaction(REC_STORE, "readonly");
      const req = tx.objectStore(REC_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  }
  async function deleteRecording(key) {
    const db = await openRecDb();
    if (!db) return false;
    return new Promise((resolve) => {
      const tx = db.transaction(REC_STORE, "readwrite");
      tx.objectStore(REC_STORE).delete(key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  }

  async function deleteTakeOne(questionId, n) {
    const takes = takesFor(questionId);
    const idx = takes.findIndex((t) => t.n === n);
    if (idx === -1) return;
    if (takes[idx].hasRecording) await deleteRecording(recKey(questionId, n));
    takes.splice(idx, 1);
    saveTakes(questionId, takes);
  }

  async function resetAllTakes(questionId) {
    const takes = takesFor(questionId);
    for (const t of takes) {
      if (t.hasRecording) await deleteRecording(recKey(questionId, t.n));
    }
    saveTakes(questionId, []);
  }

  function mimeToExt(mimeType) {
    if (mimeType && mimeType.includes("mp4")) return "mp4";
    if (mimeType && mimeType.includes("ogg")) return "ogg";
    return "webm";
  }

  // ---- downloading a take as .mp3: browsers only ever *record* webm/opus
  // (Chrome, Firefox, Android) or mp4/AAC (Safari) — never mp3 — so a real
  // .mp3 file needs an actual conversion, not just a renamed extension
  // (which would silently produce a file that fails to open in whatever
  // it's shared to). Converts client-side: decode the recorded blob to PCM
  // via the Web Audio API, then encode that PCM with lamejs, a pure-JS MP3
  // encoder loaded lazily (only once a download is actually requested) from
  // the same CDN allow-list every other script on this page uses. ----
  let lamejsPromise = null;
  function loadLamejs() {
    if (window.lamejs) return Promise.resolve(window.lamejs);
    if (lamejsPromise) return lamejsPromise;
    lamejsPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js";
      script.onload = () => (window.lamejs ? resolve(window.lamejs) : reject(new Error("mp3 encoder didn't load")));
      script.onerror = () => reject(new Error("mp3 encoder didn't load"));
      document.head.appendChild(script);
    });
    return lamejsPromise;
  }

  function floatTo16BitPCM(input) {
    const out = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      const s = Math.max(-1, Math.min(1, input[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  // Decode a recorded blob down to raw PCM — split out from blobToMp3 so
  // the noise-reduction path (below) can get at the samples too, without
  // going through mp3 first (that would bake in a lossy encode before
  // denoising ever sees the audio).
  async function decodePCM(blob) {
    const arrayBuf = await blob.arrayBuffer();
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    let audioBuffer;
    try {
      audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
    } finally {
      audioCtx.close();
    }
    const channels = Math.min(audioBuffer.numberOfChannels, 2);
    const channelData = [];
    for (let c = 0; c < channels; c++) {
      // slice() copies the data out of the AudioBuffer's own storage,
      // which some browsers reuse/invalidate once the (already-closed)
      // AudioContext that produced it is garbage collected.
      channelData.push(audioBuffer.getChannelData(c).slice());
    }
    return { sampleRate: audioBuffer.sampleRate, channelData };
  }

  async function pcmToMp3({ sampleRate, channelData }) {
    const lamejs = await loadLamejs();
    const channels = channelData.length;
    const left16 = floatTo16BitPCM(channelData[0]);
    const right16 = channels > 1 ? floatTo16BitPCM(channelData[1]) : null;

    // mp3 is a less efficient codec than Opus per bit, so matching the
    // recording's own bitrate here isn't enough to avoid audibly
    // compounding the loss on this second, transcode pass — 192kbps keeps
    // it close to transparent too.
    const encoder = new lamejs.Mp3Encoder(channels, sampleRate, 192);
    const blockSize = 1152;
    const chunks = [];
    for (let i = 0; i < left16.length; i += blockSize) {
      const leftChunk = left16.subarray(i, i + blockSize);
      const buf = right16
        ? encoder.encodeBuffer(leftChunk, right16.subarray(i, i + blockSize))
        : encoder.encodeBuffer(leftChunk);
      if (buf.length > 0) chunks.push(buf);
    }
    const tail = encoder.flush();
    if (tail.length > 0) chunks.push(tail);
    return new Blob(chunks, { type: "audio/mpeg" });
  }

  async function blobToMp3(blob) {
    return pcmToMp3(await decodePCM(blob));
  }

  // ---- noise reduction ("🧹 Denoise" button on a take): classic
  // spectral-subtraction denoising, the same idea Audacity's "Noise
  // Reduction" effect is built on — profile what the noise floor looks
  // like, then subtract that profile out of every frame's spectrum.
  // Implemented from scratch (a small radix-2 FFT + STFT/overlap-add)
  // rather than pulling in a library: there's no noise-reduction script
  // on this page's CDN allow-list, and a WASM denoiser (e.g. RNNoise)
  // would need its binary fetched at runtime, which the CSP this page
  // also has to run under (when published as a Claude Artifact) blocks
  // for anything but a script tag from an allow-listed host. ----
  const DENOISE_FRAME = 1024;
  const DENOISE_HOP = DENOISE_FRAME / 4; // 75% overlap — matches the Hann window's constant-overlap-add property

  // Iterative in-place radix-2 Cooley-Tukey FFT. re/im are same-length
  // Float64Arrays (length a power of two); inverse=true also normalizes
  // by 1/n. Used both forward (analysis) and inverse (resynthesis) below.
  function fft(re, im, inverse) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) {
        let t = re[i]; re[i] = re[j]; re[j] = t;
        t = im[i]; im[i] = im[j]; im[j] = t;
      }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = ((inverse ? 1 : -1) * 2 * Math.PI) / len;
      const wRe = Math.cos(ang), wIm = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let curRe = 1, curIm = 0;
        const half = len / 2;
        for (let k = 0; k < half; k++) {
          const uRe = re[i + k], uIm = im[i + k];
          const vRe = re[i + k + half] * curRe - im[i + k + half] * curIm;
          const vIm = re[i + k + half] * curIm + im[i + k + half] * curRe;
          re[i + k] = uRe + vRe;
          im[i + k] = uIm + vIm;
          re[i + k + half] = uRe - vRe;
          im[i + k + half] = uIm - vIm;
          const nextRe = curRe * wRe - curIm * wIm;
          const nextIm = curRe * wIm + curIm * wRe;
          curRe = nextRe; curIm = nextIm;
        }
      }
    }
    if (inverse) {
      for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
    }
  }

  function hannWindow(size) {
    const w = new Float64Array(size);
    for (let i = 0; i < size; i++) w[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (size - 1));
    return w;
  }

  // Denoises one channel's samples. Automatically profiles the noise
  // floor from the quietest ~20% of frames (rather than asking the user
  // to manually select a "noise sample" region like Audacity does), then
  // subtracts that profile from every frame with a small residual floor
  // left in — zeroing bins completely is what produces "musical noise",
  // the metallic warble you get from over-aggressive spectral
  // subtraction. Processes frame-by-frame rather than holding every
  // frame's spectrum in memory at once (that scales with recording
  // length × FFT size and gets big fast), and yields periodically so a
  // long take doesn't freeze the tab.
  async function spectralDenoise(samples, onProgress) {
    const frame = DENOISE_FRAME;
    const hop = DENOISE_HOP;
    if (samples.length < frame * 2) return samples; // too short to profile usefully — leave as-is
    const window = hannWindow(frame);
    const numFrames = Math.max(1, Math.floor((samples.length - frame) / hop) + 1);
    const bins = frame / 2 + 1;
    const re = new Float64Array(frame);
    const im = new Float64Array(frame);

    // pass 1 (time-domain, cheap): each frame's windowed energy, just to
    // rank frames from quietest to loudest — no FFT needed yet.
    const energies = new Float64Array(numFrames);
    for (let f = 0; f < numFrames; f++) {
      const start = f * hop;
      let e = 0;
      for (let i = 0; i < frame; i++) {
        const s = (samples[start + i] || 0) * window[i];
        e += s * s;
      }
      energies[f] = e;
    }
    const sortedIdx = Array.from({ length: numFrames }, (_, i) => i).sort((a, b) => energies[a] - energies[b]);
    const noiseFrameCount = Math.max(1, Math.round(numFrames * 0.2));
    const noiseFrameSet = new Set(sortedIdx.slice(0, noiseFrameCount));

    // pass 2: FFT only the quiet frames, average their magnitude spectrum
    // into the noise profile.
    const noiseProfile = new Float64Array(bins);
    for (const f of noiseFrameSet) {
      const start = f * hop;
      for (let i = 0; i < frame; i++) {
        re[i] = (samples[start + i] || 0) * window[i];
        im[i] = 0;
      }
      fft(re, im, false);
      for (let b = 0; b < bins; b++) noiseProfile[b] += Math.hypot(re[b], im[b]) / noiseFrameCount;
    }

    // pass 3: FFT every frame, subtract the noise profile out of its
    // magnitude (keeping phase untouched), inverse-FFT, and overlap-add
    // straight into the output.
    const oversubtract = 1.8;
    const floorRatio = 0.06; // never fully zero a bin — floor at 6% of its original magnitude
    const out = new Float64Array(samples.length);
    const norm = new Float64Array(samples.length);
    for (let f = 0; f < numFrames; f++) {
      const start = f * hop;
      for (let i = 0; i < frame; i++) {
        re[i] = (samples[start + i] || 0) * window[i];
        im[i] = 0;
      }
      fft(re, im, false);
      for (let b = 0; b < bins; b++) {
        const mag = Math.hypot(re[b], im[b]);
        const phase = Math.atan2(im[b], re[b]);
        const cleaned = Math.max(mag - oversubtract * noiseProfile[b], mag * floorRatio);
        const rb = cleaned * Math.cos(phase);
        const ib = cleaned * Math.sin(phase);
        re[b] = rb;
        im[b] = ib;
        if (b > 0 && b < frame - b) {
          re[frame - b] = rb;
          im[frame - b] = -ib;
        }
      }
      fft(re, im, true);
      for (let i = 0; i < frame; i++) {
        out[start + i] += re[i] * window[i];
        norm[start + i] += window[i] * window[i];
      }
      if (f % 200 === 0) {
        if (onProgress) onProgress(f / numFrames);
        await new Promise((r) => setTimeout(r));
      }
    }
    const result = new Float32Array(samples.length);
    for (let i = 0; i < samples.length; i++) {
      result[i] = norm[i] > 1e-6 ? out[i] / norm[i] : 0;
    }
    return result;
  }

  // Full "🧹 Denoise" flow for one take: load its stored recording,
  // denoise every channel, re-encode to mp3, and overwrite the take's
  // stored recording in place (same take number/kicks/rating — only the
  // audio itself changes). Returns true on success.
  async function denoiseRecordingTake(questionId, take, status) {
    const rec = await getRecording(recKey(questionId, take.n));
    if (!rec || !rec.blob) {
      showScriptStatus(status, "Couldn't find that recording.", true);
      return false;
    }
    try {
      showScriptStatus(status, "Removing noise…");
      const pcm = await decodePCM(rec.blob);
      const cleanedChannels = [];
      for (const ch of pcm.channelData) {
        cleanedChannels.push(
          await spectralDenoise(ch, (frac) => showScriptStatus(status, `Removing noise… ${Math.round(frac * 100)}%`))
        );
      }
      const mp3Blob = await pcmToMp3({ sampleRate: pcm.sampleRate, channelData: cleanedChannels });
      const ok = await putRecording(recKey(questionId, take.n), { blob: mp3Blob, mimeType: mp3Blob.type, createdAt: rec.createdAt });
      if (!ok) {
        showScriptStatus(status, "Couldn't save the cleaned recording.", true);
        return false;
      }
      const takes = takesFor(questionId);
      const t = takes.find((x) => x.n === take.n);
      if (t) {
        t.mimeType = mp3Blob.type;
        try {
          t.durationSec = await getAudioDurationSec(mp3Blob);
        } catch (e) {}
        saveTakes(questionId, takes);
      }
      showScriptStatus(status, `Removed noise from take #${take.n}.`);
      return true;
    } catch (err) {
      showScriptStatus(status, "Couldn't remove noise: " + ((err && err.message) || err), true);
      return false;
    }
  }

  // recording length, decoded the same way blobToMp3 decodes for
  // conversion — but standalone (no lamejs needed) since this only reads
  // .duration off the decoded buffer, for the take-row title.
  async function getAudioDurationSec(blob) {
    const arrayBuf = await blob.arrayBuffer();
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    try {
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
      return audioBuffer.duration;
    } finally {
      audioCtx.close();
    }
  }

  // ---- Google Drive sync (see setupGoogleDriveSync, far below, for the
  // actual sign-in + upload/download): every place that changes anything
  // worth syncing (a script edit, a kick edit, a take/rating/kick-check
  // change, a new recording) calls markDriveSyncDirty() right where it
  // already writes to localStorage/IndexedDB, rather than this file
  // polling for changes. applyingRemoteSyncPayload guards against the
  // loop that would otherwise happen when a *pull* from Drive replays
  // through those exact same write paths — a change that came FROM Drive
  // shouldn't immediately look like a new local change to push back. ----
  let driveSyncDirty = false;
  let applyingRemoteSyncPayload = false;
  function markDriveSyncDirty() {
    if (!applyingRemoteSyncPayload) driveSyncDirty = true;
  }

  // Chrome (and other Chromium browsers) can't read a real duration out
  // of a MediaRecorder-produced blob's container up front — a fresh
  // <audio> pointed at a blob: URL for one of these recordings reports
  // .duration as Infinity/NaN, which breaks the native controls' time
  // display: it shows "0:00 / 0:00" the whole way through playback
  // instead of counting up, even though the seek bar itself still moves.
  // A well-known workaround for this specific Chromium bug: seek far
  // past the end once metadata loads, which forces Chrome to scan the
  // file and fix up its cached duration, then seek back to the start.
  function fixBlobAudioDuration(audioEl) {
    audioEl.addEventListener("loadedmetadata", () => {
      if (audioEl.duration !== Infinity && !isNaN(audioEl.duration)) return;
      audioEl.currentTime = 1e101;
      audioEl.addEventListener("timeupdate", () => (audioEl.currentTime = 0), { once: true });
    });
  }

  // "<node name>_Take#<n>_<date>_<duration>" — the date comes from the
  // take's own createdAt and the duration from its own durationSec (both
  // set when it was logged/recorded), so the on-screen title next to
  // ▶ Play always matches what actually downloads, give or take one
  // character: the title uses a colon in the duration ("02:30") since it's
  // only ever displayed, while the real saved filename swaps it for a
  // dash ("02-30") since ":" isn't valid in a Windows filename. Older
  // takes logged before these fields existed just omit that segment
  // rather than showing something wrong.
  function sanitizeFilePart(s) {
    const cleaned = String(s)
      .trim()
      .replace(/[\\/:*?"<>|]/g, "")
      .replace(/\s+/g, "_")
      .replace(/_{2,}/g, "_")
      .replace(/^[._]+|[._]+$/g, "");
    return cleaned || "recording";
  }
  function formatDateYYMMDD(ts) {
    const d = new Date(ts);
    const yy = String(d.getFullYear() % 100).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${yy}${mm}${dd}`;
  }
  function formatDurationMMSS(sec) {
    if (sec == null || !isFinite(sec)) return null;
    const total = Math.round(sec);
    const mm = Math.floor(total / 60);
    const ss = total % 60;
    return `${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
  }
  function takeTitleParts(node, take) {
    const tag = node.data.tag;
    const name = node.data.name || node.id;
    const parts = [sanitizeFilePart(tag ? `${tag} ${name}` : name), `Take#${take.n}`];
    if (take.createdAt) parts.push(formatDateYYMMDD(take.createdAt));
    const duration = formatDurationMMSS(take.durationSec);
    return { parts, duration };
  }
  // for on-screen display only (next to ▶ Play) — a colon in the duration.
  function takeDisplayTitle(node, take) {
    const { parts, duration } = takeTitleParts(node, take);
    return duration ? [...parts, duration].join("_") : parts.join("_");
  }
  // for the actual saved file — a dash instead, since ":" breaks on Windows.
  function takeDownloadFilename(node, take, ext) {
    const { parts, duration } = takeTitleParts(node, take);
    if (duration) parts.push(duration.replace(":", "-"));
    return `${parts.join("_")}.${ext}`;
  }

  // base64 <-> Blob, for folding recording audio into the JSON "Export
  // data" file (IndexedDB Blobs have no other portable text form).
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = String(reader.result || "");
        const comma = result.indexOf(",");
        resolve(comma === -1 ? result : result.slice(comma + 1));
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(blob);
    });
  }
  function base64ToBlob(base64, mimeType) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mimeType || "application/octet-stream" });
  }

  // every recording in IndexedDB, base64-encoded. The cursor walk stays
  // fully synchronous (just collecting {key, blob, ...} — an IDB
  // transaction auto-commits the moment the event loop goes idle with no
  // pending request, so awaiting blobToBase64 *between* cursor.continue()
  // calls would let it close mid-walk); base64 conversion happens
  // afterward, once the transaction is already done.
  async function collectAllRecordings() {
    const db = await openRecDb();
    if (!db) return [];
    const raw = await new Promise((resolve) => {
      const tx = db.transaction(REC_STORE, "readonly");
      const store = tx.objectStore(REC_STORE);
      const out = [];
      const req = store.openCursor();
      req.onsuccess = () => {
        const cursor = req.result;
        if (!cursor) {
          resolve(out);
          return;
        }
        const { blob, mimeType, createdAt } = cursor.value || {};
        if (blob) out.push({ key: cursor.key, blob, mimeType, createdAt });
        cursor.continue();
      };
      req.onerror = () => resolve(out);
    });
    const converted = [];
    for (const entry of raw) {
      try {
        const dataBase64 = await blobToBase64(entry.blob);
        converted.push({ key: entry.key, mimeType: entry.mimeType, dataBase64, createdAt: entry.createdAt });
      } catch (e) {}
    }
    return converted;
  }

  // ---- kick-phrase editing: same localStorage-override pattern as the
  // script box, but a kick is also a real node in the tree (not just text
  // in a panel), so an edit has to update three things in step: the raw
  // FOREST paragraph object's .children (so exports/search see it), the
  // d3-hierarchy node's own children/_children (so the tree redraws it),
  // and localStorage (so it survives a reload). ----
  function kicksKey(paragraphId) {
    return `opic-kicks:${paragraphId}`;
  }

  // works on a raw FOREST paragraph object — the kick-phrases a viewer
  // would actually see for this beat right now: their own saved edit if
  // there is one, else whatever .children currently holds (which is
  // itself the pristine parse until the first edit rewrites it in place).
  function effectiveKicksFor(paragraphData) {
    let saved = null;
    try {
      saved = localStorage.getItem(kicksKey(paragraphData.id));
    } catch (e) {}
    if (saved !== null) {
      try {
        const arr = JSON.parse(saved);
        if (Array.isArray(arr)) return arr;
      } catch (e) {}
    }
    return (paragraphData.children || []).map((k) => k.name);
  }

  // every kick phrase across every beat of a question, grouped by beat —
  // shown right under "Show script" on a question's panel, always visible
  // (unlike the script itself) so it can double as a practice cue sheet:
  // read the question, answer using just these phrases, only peek at the
  // full script if you get stuck.
  function allKicksHtml(questionData) {
    const beats = questionData.children || [];
    if (!beats.length) return "";
    let html = `<div class="all-kicks-head"><span class="script-label">Kick phrases to use</span></div>`;
    html += `<div class="all-kicks">`;
    beats.forEach((p) => {
      const kicks = effectiveKicksFor(p);
      html += `<div class="all-kicks-group">`;
      html += `<span class="all-kicks-cue">${escapeHtml(p.name)}</span>`;
      html += kicks.length
        ? `<div class="reading-kicks">` + kicks.map((k) => `<span class="kick-chip">${escapeHtml(k)}</span>`).join("") + `</div>`
        : `<p class="kick-empty">No kick phrases yet.</p>`;
      html += `</div>`;
    });
    html += `</div>`;
    return html;
  }

  // rebuilds a paragraph's kick-hierarchy children from its (already
  // updated) raw .children array. Kick nodes are leaves, so a fresh
  // d3.hierarchy() per kick — reparented onto the paragraph master node —
  // is simpler and safer than hand-patching the old node objects.
  function rebuildKickChildren(paragraphMaster, forceExpand) {
    const kickNodes = (paragraphMaster.data.children || []).map((kickData) => {
      const kn = d3.hierarchy(kickData);
      kn.parent = paragraphMaster;
      kn.depth = paragraphMaster.depth + 1;
      kn.height = 0;
      kn.id = kickData.id;
      return kn;
    });
    if (forceExpand || paragraphMaster.children) {
      paragraphMaster.children = kickNodes;
      paragraphMaster._children = null;
    } else {
      paragraphMaster._children = kickNodes;
      paragraphMaster.children = null;
    }
  }

  // ALL_NODES (built once, below, for search) is a flat list of raw data
  // objects; a kick edit has to patch it too or search would keep
  // matching removed kicks and never find new ones. Kick ids are always
  // "<paragraphId>-k<n>", so they're easy to pick out and replace. The
  // topic is looked up from the id's own "tN-" prefix rather than
  // state.topicIndex, since a bulk import can edit a paragraph that isn't
  // in the topic currently on screen.
  function reindexKicksFor(paragraphData) {
    const m = /^t(\d+)-/.exec(paragraphData.id);
    const topicData = m ? FOREST[Number(m[1])] : FOREST[state.topicIndex];
    for (let i = ALL_NODES.length - 1; i >= 0; i--) {
      if (ALL_NODES[i].node.id.startsWith(paragraphData.id + "-k")) ALL_NODES.splice(i, 1);
    }
    (paragraphData.children || []).forEach((k) => ALL_NODES.push({ node: k, topic: topicData }));
  }

  // finds a node anywhere in the (possibly partly collapsed) hierarchy by
  // id, without expanding anything on the way — unlike findAndReveal
  // (search-result jump), which deliberately does expand every ancestor.
  // Used when a kick gets added to some *other* beat than whichever one is
  // currently open, so the tree updates in place without snapping open a
  // branch the viewer didn't ask to see.
  function findNodeById(root, id) {
    let target = null;
    (function walk(n) {
      if (n.id === id) {
        target = n;
        return true;
      }
      const kids = n.children || n._children;
      if (!kids) return false;
      for (const k of kids) {
        if (walk(k)) return true;
      }
      return false;
    })(root);
    return target;
  }

  // adds one kick phrase to a beat by id — used by the "select text in the
  // script, pick a beat" popup below, where the beat being edited usually
  // isn't the one currently open (or even expanded) in the tree. Returns
  // "added", "duplicate" (already there, case-insensitive), or "error".
  function addKickToParagraph(paragraphId, kickText) {
    const p = paragraphById[paragraphId];
    const cleaned = (kickText || "").trim();
    if (!p || !cleaned) return "error";
    const kicks = effectiveKicksFor(p);
    if (kicks.some((k) => k.toLowerCase() === cleaned.toLowerCase())) return "duplicate";
    kicks.push(cleaned);
    try {
      localStorage.setItem(kicksKey(p.id), JSON.stringify(kicks));
    } catch (e) {}
    markDriveSyncDirty();
    p.children = kicks.map((text, i) => ({ id: `${p.id}-k${i}`, name: text, type: "kick", full: text }));
    reindexKicksFor(p);
    const master = findNodeById(roots[state.topicIndex], p.id);
    if (master) rebuildKickChildren(master, false);
    renderTree(false);
    return "added";
  }

  // ---- select text in "Your script", pick which beat it's a kick phrase
  // for: a small popup near the selection listing every beat of this
  // question by name. One popup element, reused across every question's
  // panel (recreated content per show, not per wireScriptBox call) — kept
  // on <body> rather than inside the reading panel because .reading-pages
  // carries a CSS transform for the swipe animation, and a transformed
  // ancestor becomes the containing block for position:fixed descendants,
  // which would break the "position near the viewport click point" math. ----
  let kickAddPopupEl = null;
  let kickAddPopupCtx = null; // { node, text } for whatever selection is pending
  let kickAddPopupShownAt = 0;
  // scroll-to-close (below) has to ignore a scroll that happens right as
  // the popup opens: focusing the textarea to select text in the first
  // place can itself trigger the browser's own "scroll the focused
  // element into view" behavior if the box wasn't already fully visible —
  // that fires asynchronously, a beat after the popup is shown, and would
  // otherwise close it before anyone actually saw it.
  const KICK_ADD_POPUP_SCROLL_GRACE_MS = 400;
  function hideKickAddPopup() {
    if (kickAddPopupEl) kickAddPopupEl.hidden = true;
    kickAddPopupCtx = null;
  }
  function ensureKickAddPopup() {
    if (kickAddPopupEl) return kickAddPopupEl;
    const el = document.createElement("div");
    el.className = "kick-add-popup";
    el.id = "kickAddPopup";
    el.hidden = true;
    document.body.appendChild(el);
    el.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-beat-id]");
      if (!btn || !kickAddPopupCtx) return;
      const { node, text } = kickAddPopupCtx;
      const result = addKickToParagraph(btn.dataset.beatId, text);
      hideKickAddPopup();
      // .script-status also matches the Takes page's own status line
      // (#takesStatus) — scope to the script panel specifically, or the
      // message lands on the wrong (currently swiped-away) page.
      const statusEl = readingBody.querySelector(".script-panel .script-status");
      if (result === "added") {
        refreshAllKicksSection(node);
        showScriptStatus(statusEl, `Added to ${btn.textContent.trim()}.`);
      } else if (result === "duplicate") {
        showScriptStatus(statusEl, "That kick's already there.", true);
      } else {
        showScriptStatus(statusEl, "Couldn't add that kick.", true);
      }
    });
    document.addEventListener("pointerdown", (e) => {
      if (!kickAddPopupEl.hidden && !kickAddPopupEl.contains(e.target)) hideKickAddPopup();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hideKickAddPopup();
    });
    kickAddPopupEl = el;
    return el;
  }
  function showKickAddPopup(node, text, x, y) {
    const beats = node.data.children || [];
    if (!beats.length) return;
    const el = ensureKickAddPopup();
    kickAddPopupCtx = { node, text };
    const shortText = text.length > 48 ? text.slice(0, 48) + "…" : text;
    el.innerHTML =
      `<div class="kick-add-popup-label">Add “${escapeHtml(shortText)}” as a kick to:</div>` +
      beats.map((p) => `<button type="button" data-beat-id="${escapeHtml(p.id)}">${escapeHtml(p.name)}</button>`).join("");
    el.hidden = false;
    kickAddPopupShownAt = Date.now();
    el.style.left = "0px";
    el.style.top = "0px";
    const rect = el.getBoundingClientRect();
    const maxX = Math.max(8, window.innerWidth - rect.width - 8);
    const maxY = Math.max(8, window.innerHeight - rect.height - 8);
    el.style.left = Math.min(Math.max(8, x), maxX) + "px";
    el.style.top = Math.min(Math.max(8, y), maxY) + "px";
  }

  // rebuilds just the "Kick phrases to use" list without touching the rest
  // of the panel — called after adding one from the script-selection
  // popup, so the new phrase shows up immediately in that list too.
  function refreshAllKicksSection(node) {
    const wrap = readingBody.querySelector("#allKicksWrap");
    if (wrap) wrap.innerHTML = allKicksHtml(node.data);
  }

  // grows a textarea to exactly fit its content (no internal scrollbar) —
  // the reading panel scrolls instead. offsetParent is null while an
  // ancestor is display:none (the script panel collapsed behind "Show
  // script", or a swiped-away page), and scrollHeight reads 0 then, which
  // would wrongly collapse the box — skip in that case, and size it for
  // real once whatever's hiding it reveals it instead.
  function autoGrowTextarea(el) {
    if (!el || el.offsetParent === null) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  function scriptFilename(node) {
    const tag = node.data.tag || node.id;
    const slug = (node.data.name || "question").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return `opic-${tag}-${slug || "script"}.txt`;
  }

  function showScriptStatus(el, text, isError) {
    if (!el) return;
    el.textContent = text;
    el.style.color = isError ? "var(--kick)" : "var(--muted)";
    window.clearTimeout(el._fadeTimer);
    el._fadeTimer = window.setTimeout(() => {
      el.textContent = "";
    }, 3200);
  }

  // shared by every "Save as .txt"/"Export all scripts"/recording-download
  // button. Inside the claude.ai artifact sandbox, a direct <a download>
  // link is inert — so this goes through the artifact's downloads
  // capability there. Outside that sandbox (e.g. this same page hosted on
  // GitHub Pages, where window.claude simply doesn't exist), a plain
  // Blob-URL download link is the normal, unblocked way to save a file in
  // any real browser tab — so it falls back to that instead of just
  // giving up, letting the one HTML file serve both contexts.
  async function saveTextFile(filename, text, statusEl, successMessage) {
    if (window.claude && typeof window.claude.use === "function") {
      try {
        const downloads = await window.claude.use("downloads");
        if (!downloads) {
          showScriptStatus(statusEl, "Downloads aren't available in this view.", true);
          return false;
        }
        await downloads.save({ filename, data: text });
        showScriptStatus(statusEl, successMessage || "Saved.");
        return true;
      } catch (err) {
        const code = err && err.code;
        if (code === "declined") {
          showScriptStatus(statusEl, "Download declined.");
        } else if (code === "rate_limited") {
          showScriptStatus(statusEl, "Try again in a moment.", true);
        } else {
          showScriptStatus(statusEl, "Couldn't save the file.", true);
        }
        return false;
      }
    }
    try {
      const blob = text instanceof Blob ? text : new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 4000);
      showScriptStatus(statusEl, successMessage || "Saved.");
      return true;
    } catch (err) {
      showScriptStatus(statusEl, "Couldn't save the file.", true);
      return false;
    }
  }

  // ---- the two-page swipeable reading panel: page 1 is the Takes/
  // recording view, page 2 is everything the panel showed before Takes
  // existed (hint text, kicks-to-use, script). A right-swipe (or the
  // "🎙 Takes ›" button) reveals page 1; a left-swipe (or "‹ Back") returns
  // to page 2. Rewired fresh on every render like wireTakesSection/
  // wireKickEditor — so its pointer listeners must stay gesture-scoped
  // (added on pointerdown, removed on pointerup/cancel) rather than bound
  // once and left on window, or repeated question-clicks over a session
  // would pile up stale closures on detached DOM. ----
  function wireSwipePages(node) {
    const pages = readingBody.querySelector("#readingPages");
    const takesPage = readingBody.querySelector("#readingPageTakes");
    const mainPage = readingBody.querySelector("#readingPageMain");
    const navBtn = readingBody.querySelector("#takesNav");
    const backBtn = readingBody.querySelector("#takesBack");
    if (!pages || !takesPage || !mainPage) return;

    // both pages stay flex children the whole time (never display:none —
    // that would drop the sole remaining item to the wrong slot); the
    // class toggle just slides the strip so only one half is in the
    // viewport, the other clipped by .reading's own overflow-x:hidden.
    function showPage(which) {
      pages.classList.toggle("show-takes", which === "takes");
      persistAppState();
    }

    if (navBtn) navBtn.addEventListener("click", () => showPage("takes"));
    if (backBtn) backBtn.addEventListener("click", () => showPage("main"));

    let startX = null;
    let startY = null;
    let dragging = false;
    let horizontal = null;

    function onPointerMove(e) {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (horizontal === null) {
        if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
        horizontal = Math.abs(dx) > Math.abs(dy);
      }
      if (horizontal) e.preventDefault();
    }
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("pointerup", endDrag);
      window.removeEventListener("pointercancel", endDrag);
      if (!horizontal) return;
      const dx = e.clientX - startX;
      if (dx <= -50) showPage("main");
      else if (dx >= 50) showPage("takes");
    }
    pages.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      // an unlocked ("✏️ Edit" on) script box handles its own drag — for
      // selecting text (the kick-add popup) or just moving the caret —
      // so don't also start tracking a swipe over it. A locked box has
      // pointer-events:none and is never the target here in the first
      // place, so this only actually matters once unlocked.
      if (e.target.closest(".script-box:not(.locked)")) return;
      startX = e.clientX;
      startY = e.clientY;
      dragging = true;
      horizontal = null;
      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", endDrag);
      window.addEventListener("pointercancel", endDrag);
    });
  }

  // ---- the "Takes" section on a question panel: record (or log without
  // recording), play back, download, or delete individual takes, and
  // self-mark which kick phrases came out in each one. Confirmed working
  // inside a real browser tab via the GitHub Pages copy of this page
  // (getUserMedia is denied outright inside the claude.ai artifact
  // sandbox — no capability governs microphone access there — so
  // recording is a Pages-only affordance; everything else in this
  // section works in both places). ----
  const REC_MIME_CANDIDATES = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
  function pickRecMimeType() {
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
    for (const m of REC_MIME_CANDIDATES) {
      if (MediaRecorder.isTypeSupported(m)) return m;
    }
    return "";
  }

  function wireTakesSection(node) {
    const recordBtn = readingBody.querySelector("#takesRecord");
    const logBtn = readingBody.querySelector("#takesLog");
    const resetBtn = readingBody.querySelector("#takesReset");
    const status = readingBody.querySelector("#takesStatus");
    const list = readingBody.querySelector("#takesList");
    if (!list) return;

    const questionId = node.id;

    // every kick phrase across every beat of this question, with the id
    // each one WOULD have right now — computed positionally
    // ("<beatId>-k<index>"), the same scheme applyKicks() itself uses, so
    // it's correct even for a beat whose data.children hasn't been
    // refreshed from a localStorage override yet this session.
    function allKicksForQuestion() {
      const out = [];
      (node.data.children || []).forEach((p) => {
        effectiveKicksFor(p).forEach((text, i) => {
          out.push({ id: `${p.id}-k${i}`, text });
        });
      });
      return out;
    }

    function renderTakes() {
      const takes = takesFor(questionId).slice().sort((a, b) => b.n - a.n);
      const allKicks = allKicksForQuestion();
      if (resetBtn) resetBtn.hidden = takes.length === 0;

      // the "🎙 Takes · take#N" nav button (on the OTHER swiped page) was
      // only ever set once, when this whole panel was first built — a take
      // recorded/logged/deleted without leaving the panel in between never
      // touched it, so it kept showing whatever count was true at that
      // first render. Recompute it here too, since renderTakes() already
      // runs after every action that changes the take count.
      const navBtn = readingBody.querySelector("#takesNav");
      if (navBtn) {
        const count = getPracticeCount(questionId);
        navBtn.textContent = `🎙 Takes${count > 0 ? ` · take#${count}` : ""} ›`;
      }

      list.innerHTML = "";
      if (!takes.length) {
        const empty = document.createElement("p");
        empty.className = "kick-empty";
        empty.textContent = "No takes yet — record one, or log a practice without recording.";
        list.appendChild(empty);
        return;
      }
      takes.forEach((take) => list.appendChild(renderTakeRow(take, allKicks)));
    }

    // click-to-rate 1-5 stars, right of a take's own "Take #N" label.
    // Clicking the star that's already the rating clears it back to 0.
    function buildStarRating(take) {
      const wrap = document.createElement("span");
      wrap.className = "take-rating";
      wrap.setAttribute("role", "group");
      wrap.setAttribute("aria-label", "Rate this take");
      const starEls = [];
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement("button");
        star.type = "button";
        star.className = "take-star";
        const setStarState = (el, filled) => {
          el.textContent = filled ? "★" : "☆";
          el.classList.toggle("filled", filled);
        };
        setStarState(star, (take.rating || 0) >= i);
        star.setAttribute("aria-label", `${i} star${i === 1 ? "" : "s"}`);
        star.addEventListener("click", () => {
          const takes = takesFor(questionId);
          const t = takes.find((x) => x.n === take.n);
          if (!t) return;
          t.rating = t.rating === i ? 0 : i;
          saveTakes(questionId, takes);
          take.rating = t.rating;
          starEls.forEach((el, idx) => setStarState(el, take.rating >= idx + 1));
        });
        starEls.push(star);
        wrap.appendChild(star);
      }
      return wrap;
    }

    function renderTakeRow(take, allKicks) {
      const row = document.createElement("div");
      row.className = "take-row";

      const head = document.createElement("div");
      head.className = "take-row-head";
      const labelWrap = document.createElement("div");
      labelWrap.className = "take-label-wrap";
      const label = document.createElement("span");
      label.className = "take-label";
      label.textContent = `Take #${take.n}`;
      labelWrap.appendChild(label);
      if (take.hasRecording) labelWrap.appendChild(buildStarRating(take));
      head.appendChild(labelWrap);

      const actions = document.createElement("div");
      actions.className = "take-actions";
      // buttons stay grouped in their own inner flex box so they wrap as
      // one unit onto their own line under a long filename, rather than
      // each icon breaking individually.
      const btnGroup = document.createElement("div");
      btnGroup.className = "take-btn-group";

      if (take.hasRecording) {
        const filenameLabel = document.createElement("span");
        filenameLabel.className = "take-filename";
        const title = takeDisplayTitle(node, take);
        filenameLabel.textContent = title;
        filenameLabel.title = title;
        actions.appendChild(filenameLabel);
        // older takes recorded before durationSec existed: fetch the blob
        // once, measure it, cache the result so this only happens once.
        if (take.durationSec == null) {
          getRecording(recKey(questionId, take.n))
            .then((rec) => (rec && rec.blob ? getAudioDurationSec(rec.blob) : null))
            .then((sec) => {
              if (sec == null) return;
              const takes = takesFor(questionId);
              const t = takes.find((x) => x.n === take.n);
              if (!t) return;
              t.durationSec = sec;
              saveTakes(questionId, takes);
              take.durationSec = sec;
              const updated = takeDisplayTitle(node, take);
              filenameLabel.textContent = updated;
              filenameLabel.title = updated;
            })
            .catch(() => {});
        }

        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "take-btn take-play";
        playBtn.textContent = "▶ Play";
        let audioEl = null;
        playBtn.addEventListener("click", async () => {
          if (audioEl) {
            if (audioEl.paused) audioEl.play();
            else audioEl.pause();
            return;
          }
          const rec = await getRecording(recKey(questionId, take.n));
          if (!rec || !rec.blob) {
            showScriptStatus(status, "Couldn't find that recording.", true);
            return;
          }
          audioEl = document.createElement("audio");
          audioEl.controls = true;
          audioEl.className = "take-audio";
          fixBlobAudioDuration(audioEl);
          audioEl.src = URL.createObjectURL(rec.blob);
          row.appendChild(audioEl);
          audioEl.addEventListener("play", () => (playBtn.textContent = "⏸ Pause"));
          audioEl.addEventListener("pause", () => (playBtn.textContent = "▶ Play"));
          audioEl.play();
        });
        btnGroup.appendChild(playBtn);

        const denoiseBtn = document.createElement("button");
        denoiseBtn.type = "button";
        denoiseBtn.className = "take-btn take-denoise";
        denoiseBtn.textContent = "🧹 Denoise";
        denoiseBtn.setAttribute("aria-label", `Remove background noise from take ${take.n}`);
        denoiseBtn.addEventListener("click", async () => {
          denoiseBtn.disabled = true;
          const prevLabel = denoiseBtn.textContent;
          const ok = await denoiseRecordingTake(questionId, take, status);
          if (ok) {
            // the stored recording changed underneath any open <audio>
            // element pointed at the old blob — simplest correct fix is
            // to rebuild the row from scratch, same as the delete button.
            renderTakes();
            renderTree(false);
          } else {
            denoiseBtn.disabled = false;
            denoiseBtn.textContent = prevLabel;
          }
        });
        btnGroup.appendChild(denoiseBtn);

        const dlBtn = document.createElement("button");
        dlBtn.type = "button";
        dlBtn.className = "take-btn take-download";
        dlBtn.textContent = "⬇";
        dlBtn.setAttribute("aria-label", `Download take ${take.n}`);
        dlBtn.addEventListener("click", async () => {
          const rec = await getRecording(recKey(questionId, take.n));
          if (!rec || !rec.blob) {
            showScriptStatus(status, "Couldn't find that recording.", true);
            return;
          }
          showScriptStatus(status, "Converting to mp3…");
          try {
            const mp3Blob = await blobToMp3(rec.blob);
            await saveTextFile(takeDownloadFilename(node, take, "mp3"), mp3Blob, status, "Saved as mp3.");
          } catch (err) {
            const saved = await saveTextFile(takeDownloadFilename(node, take, mimeToExt(rec.mimeType)), rec.blob, status);
            showScriptStatus(status, saved ? "Couldn't convert to mp3 — saved the original recording instead." : "Couldn't save the file.", true);
          }
        });
        btnGroup.appendChild(dlBtn);
      } else {
        const noRec = document.createElement("span");
        noRec.className = "take-no-rec";
        noRec.textContent = "(no recording)";
        actions.appendChild(noRec);
      }

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "take-btn take-delete";
      delBtn.textContent = "🗑";
      delBtn.setAttribute("aria-label", `Delete take ${take.n}`);
      delBtn.addEventListener("click", async () => {
        await deleteTakeOne(questionId, take.n);
        renderTakes();
        renderTree(false);
        showScriptStatus(status, `Deleted take #${take.n}.`);
      });
      btnGroup.appendChild(delBtn);
      actions.appendChild(btnGroup);

      head.appendChild(actions);
      row.appendChild(head);

      const summary = document.createElement("div");
      summary.className = "take-kick-summary";
      summary.textContent = allKicks.length ? `kick check: ${take.kicksMarked.length}/${allKicks.length} marked` : "no kick phrases yet";
      row.appendChild(summary);

      if (allKicks.length) {
        const chipWrap = document.createElement("div");
        chipWrap.className = "reading-kicks take-kick-chips";
        allKicks.forEach(({ id, text }) => {
          const chip = document.createElement("button");
          chip.type = "button";
          const marked = take.kicksMarked.includes(id);
          chip.className = "kick-chip take-kick-toggle" + (marked ? " marked" : "");
          chip.textContent = (marked ? "☑ " : "☐ ") + text;
          chip.addEventListener("click", () => {
            const takes = takesFor(questionId);
            const t = takes.find((x) => x.n === take.n);
            if (!t) return;
            const idx = t.kicksMarked.indexOf(id);
            if (idx === -1) t.kicksMarked.push(id);
            else t.kicksMarked.splice(idx, 1);
            saveTakes(questionId, takes);
            take.kicksMarked = t.kicksMarked;
            const nowMarked = t.kicksMarked.includes(id);
            chip.classList.toggle("marked", nowMarked);
            chip.textContent = (nowMarked ? "☑ " : "☐ ") + text;
            summary.textContent = `kick check: ${t.kicksMarked.length}/${allKicks.length} marked`;
          });
          chipWrap.appendChild(chip);
        });
        row.appendChild(chipWrap);
      }

      return row;
    }

    const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    if (recordBtn) {
      if (!canRecord) {
        recordBtn.disabled = true;
        recordBtn.title = "Recording isn't supported in this view — try the GitHub Pages copy of this page.";
      } else {
        let mediaRecorder = null;
        let chunks = [];
        let stream = null;
        let recording = false;
        let recordStartedAt = null;
        let recordTimerId = null;
        function stopRecordTimer() {
          if (recordTimerId != null) {
            window.clearInterval(recordTimerId);
