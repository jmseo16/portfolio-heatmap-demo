<script>
  const FOREST = /*__FOREST_DATA__*/[]/*__END_FOREST_DATA__*/;

  // flat index of every question across every topic, keyed by tag —
  // powers the bulk "Export all scripts" / "Import all scripts" round trip
  const questionIndex = [];
  FOREST.forEach((t) => {
    t.children.forEach((q) => {
      questionIndex.push({ tag: q.tag, id: q.id, topic: t.name, question: q.full, node: q });
    });
  });
  const questionByTag = {};
  questionIndex.forEach((e) => {
    questionByTag[e.tag] = e;
  });

  // flat lookup of every script-beat (paragraph) object across every
  // topic, keyed by its id — used to apply kick-phrase edits (from the
  // in-panel editor or a bulk import) to the right beat regardless of
  // which topic is currently on screen.
  const paragraphById = {};
  FOREST.forEach((t) => {
    t.children.forEach((q) => {
      (q.children || []).forEach((p) => {
        paragraphById[p.id] = p;
      });
    });
  });

  // whether a question's script panel starts open. Off by default (open it
  // per-question with its own "Show script" button) — persisted so a
  // viewer who flips the topbar's "View all scripts" on gets that as the
  // default again next visit too.
  let initialScriptsVisible = false;
  try {
    initialScriptsVisible = localStorage.getItem("opic-scripts-visible") === "1";
  } catch (e) {}

  const state = { topicIndex: 0, current: null, scriptsVisible: initialScriptsVisible };

  const groveList = d3.select("#groveList");
  const svg = d3.select("#tree");
  const g = svg.append("g").attr("class", "viewport");
  const linkLayer = g.append("g").attr("class", "links");
  const nodeLayer = g.append("g").attr("class", "nodes");
  const readingBody = document.getElementById("readingBody");
  const reading = document.getElementById("reading");

  const zoom = d3.zoom()
    .scaleExtent([0.35, 3])
    .on("zoom", (event) => g.attr("transform", event.transform));
  svg.call(zoom).on("dblclick.zoom", null);

  // column gaps are computed fresh every render from the actual measured
  // pill widths (see fitColumns below) — this is just the minimum
  // clearance added between two adjacent columns' widest pills. Row spacing
  // is likewise computed fresh from measured pill heights (see renderTree)
  // since a script-beat pill now shows its full verbatim text and can run
  // to several lines — ROW_BUFFER is just the clearance added on top of the
  // tallest pill anywhere in the current view.
  const COLUMN_BUFFER = 34;
  const ROW_BUFFER = 16;
  const PILL_PAD_X = { topic: 16, question: 12, paragraph: 12, kick: 9 };
  const PILL_PAD_Y = { topic: 9, question: 7, paragraph: 8, kick: 5 };
  const WRAP_CHARS = { topic: 99, question: 30, paragraph: 32, kick: 18 };

  // remembers each node's last-drawn screen position, keyed by its id, so a
  // search jump can pan the camera to it right after expanding it
  const posById = new Map();

  // splits a label into as many lines as it takes to keep each one under
  // maxChars, so a pill never has to stretch to fit one very long line —
  // a script beat's full text can run to several lines, which is fine
  // since row height is measured and laid out after wrapping (see below)
  function wrapLabel(text, maxChars) {
    const words = text.split(/\s+/);
    const lines = [];
    let cur = "";
    for (const w of words) {
      const trial = cur ? `${cur} ${w}` : w;
      if (cur && trial.length > maxChars) {
        lines.push(cur);
        cur = w;
      } else {
        cur = trial;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ---- prepare per-topic hierarchy with collapse state ----
  function buildRoot(topicData) {
    const root = d3.hierarchy(topicData);
    root.descendants().forEach((d) => (d.id = d.data.id));
    root.descendants().forEach((d) => {
      if (d.depth >= 1 && d.children) {
        d._children = d.children;
        d.children = null;
      }
    });
    return root;
  }

  let roots = FOREST.map(buildRoot);

  function renderGrove() {
    const items = groveList.selectAll("li").data(FOREST, (d) => d.id);
    const li = items.enter().append("li");
    const btn = li.append("button").attr("class", "grove-item");
    btn.append("span").attr("class", "grove-ring");
    const text = btn.append("span");
    text.append("span").attr("class", "grove-name").style("display", "block");
    text.append("span").attr("class", "grove-count").style("display", "block");

    groveList.selectAll(".grove-item")
      .on("click", (event, d) => {
        state.topicIndex = FOREST.indexOf(d);
        setCurrent(null);
        renderTree(true);
        renderGrove();
      })
      .classed("active", (d, i) => i === state.topicIndex)
      .select(".grove-ring")
      .style("border-color", (d, i) => (i === state.topicIndex ? "var(--topic)" : "var(--line)"));

    groveList.selectAll(".grove-name").text((d) => d.name);
    groveList.selectAll(".grove-count").text((d) => `${d.children.length} questions`);
  }

  function crumbFor(d) {
    const chain = d
      .ancestors()
      .reverse()
      .map((n) => (n.data.tag ? `${n.data.tag} ${n.data.name}` : n.data.name));
    return chain.join(" ▸ ");
  }

  function typeLabel(t) {
    return { topic: "Topic", question: "Question", paragraph: "Script beat", kick: "Kick phrase" }[t];
  }

  function setCurrent(node) {
    state.current = node;
    nodeLayer.selectAll("g.node").classed("current", (d) => node && d.master.id === node.id);
    if (!node) {
      readingBody.innerHTML = '<p class="reading-empty">Select any node to read its full text here — the tree only ever shows short labels.</p>';
      return;
    }
    const t = node.data.type;
    let html = `<div class="reading-crumb">${crumbFor(node)}</div>`;
    html += `<div class="reading-chip chip-${t}"><span class="dot"></span>${typeLabel(t)}</div>`;
    html += `<h3>${escapeHtml(node.data.full || node.data.name)}</h3>`;
    if (t === "question") {
      html += `<p class="full-text">Tap this question in the tree to reveal its script beats, then tap a beat to reveal its kick phrases.</p>`;
      const practiceCount = getPracticeCount(node.data.id);
      html += `<div class="practice-head"><span class="script-label">Practice count</span><div class="script-actions">`;
      html += `<button type="button" class="practice-log" id="practiceLog">+ Log a practice</button>`;
      html += `<button type="button" class="practice-reset" id="practiceReset"${practiceCount ? "" : " hidden"}>↺ Reset</button>`;
      html += `</div></div>`;
      html += `<p class="practice-count-display" id="practiceCountDisplay">take#${practiceCount}</p>`;
      html += `<div class="practice-head"><span class="script-label">Recording test (temporary)</span></div>`;
      html += `<p class="full-text">Checking whether this artifact can record audio at all before building the real feature. Tap Record, say a sentence, tap Stop, then try Play and Download.</p>`;
      html += `<button type="button" class="rec-probe-btn" id="recProbeBtn">🎙 Record</button>`;
      html += `<span class="script-status" id="recProbeStatus"></span>`;
      html += `<div id="recProbePlayback"></div>`;
      html += allKicksHtml(node.data);
      html += `<button type="button" class="script-toggle" id="scriptToggle" aria-expanded="${state.scriptsVisible}">${state.scriptsVisible ? "▾ Hide script" : "▸ Show script"}</button>`;
      html += `<div class="script-panel" id="scriptPanel"${state.scriptsVisible ? "" : " hidden"}>`;
      html += `<div class="script-head"><span class="script-label">Your script</span><div class="script-actions">`;
      html += `<button type="button" class="script-load">⬆ Load file</button>`;
      html += `<button type="button" class="script-download">⬇ Save as .txt</button>`;
      html += `<button type="button" class="script-reset">↺ Reset to original</button>`;
      html += `</div></div>`;
      html += `<textarea class="script-box" spellcheck="false" aria-label="Editable script for this question"></textarea>`;
      html += `<span class="script-status"></span>`;
      html += `<input type="file" class="script-file-input" accept=".txt,.csv,text/plain,text/csv" aria-hidden="true" tabindex="-1">`;
      html += `</div>`;
    }
    if (t === "paragraph") {
      html += `<div class="kick-editor-head"><span class="script-label">Kick phrases</span><div class="kick-actions">`;
      html += `<button type="button" class="kick-add">+ Add</button>`;
      html += `<button type="button" class="kick-reset">↺ Reset</button>`;
      html += `</div></div>`;
      html += `<div class="reading-kicks" id="kickEditor"></div>`;
      html += `<span class="script-status" id="kickStatus"></span>`;
    }
    if (t === "topic") {
      const qCount = node.data.children.length;
      const pCount = node.data.children.reduce((s, q) => s + q.children.length, 0);
      html += `<p class="full-text">${qCount} questions, ${pCount} script beats in this tree.</p>`;
      if (node.data.scriptUrl) {
        html += `<a class="btn-script" href="${escapeHtml(node.data.scriptUrl)}" target="_blank" rel="noopener">Show script ↗</a>`;
      }
    }
    readingBody.innerHTML = html;
    if (t === "question") {
      wireScriptBox(node);
      const toggleBtn = readingBody.querySelector("#scriptToggle");
      const panel = readingBody.querySelector("#scriptPanel");
      if (toggleBtn && panel) {
        toggleBtn.addEventListener("click", () => {
          const nowHidden = !panel.hidden;
          panel.hidden = nowHidden;
          toggleBtn.textContent = nowHidden ? "▸ Show script" : "▾ Hide script";
          toggleBtn.setAttribute("aria-expanded", String(!nowHidden));
        });
      }

      const logBtn = readingBody.querySelector("#practiceLog");
      const resetBtn = readingBody.querySelector("#practiceReset");
      const display = readingBody.querySelector("#practiceCountDisplay");
      function refreshPracticeUI(count) {
        display.textContent = `take#${count}`;
        resetBtn.hidden = count === 0;
        renderTree(false); // updates the corner chip on this question's pill
      }
      if (logBtn) {
        logBtn.addEventListener("click", () => {
          refreshPracticeUI(setPracticeCount(node.id, getPracticeCount(node.id) + 1));
        });
      }
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          refreshPracticeUI(setPracticeCount(node.id, 0));
        });
      }

      wireRecProbe();
    }
    if (t === "paragraph") wireKickEditor(node);
    if (window.matchMedia("(max-width: 900px)").matches) reading.classList.add("open");
  }

  // the editable per-question script box: defaults to that question's
  // polished script, copied verbatim from the original Google Doc (the
  // same doc the topic's "Show script" button opens) and keyed by
  // question tag — NOT a stitching of the CSV's short script-beat labels.
  // A viewer's own edits persist in this browser (localStorage) so the
  // same box comes back edited next time they open this question, until
  // they reset it. localStorage is a convenience only, though — it can be
  // cleared or unavailable — so the box also offers a real file round
  // trip: "Save as .txt" downloads the current text, and "Load file" reads
  // a .txt/.csv back in, so edits can be handed back for the source Doc
  // to be updated from.
  // works on a raw FOREST question object (id/script/children straight off
  // the data, no d3-hierarchy wrapping) — shared by defaultScriptFor below
  // and the bulk export, which walks questionIndex directly.
  function scriptTextFor(q) {
    if (q.script) return q.script;
    // fallback for a question whose Doc script hasn't been parsed yet:
    // stitch the CSV's own script-beat text together instead of leaving
    // the box empty.
    return (q.children || []).map((p) => p.full).join("\n\n");
  }

  function defaultScriptFor(node) {
    return scriptTextFor(node.data);
  }

  // the script text a viewer would actually see for a question right now:
  // their own saved edit if there is one, else the doc-sourced default.
  function effectiveScriptFor(q) {
    let saved = null;
    try {
      saved = localStorage.getItem(`opic-script:${q.id}`);
    } catch (e) {}
    return saved !== null ? saved : scriptTextFor(q);
  }

  // ---- practice-count tracking: how many times a question's been
  // rehearsed. Just a number in localStorage, keyed by question id — no
  // pristine "original" to reset to (unlike scripts/kicks, there's no
  // Doc/CSV source for this), so 0 both means "never logged" and "reset". ----
  function practiceKey(questionId) {
    return `opic-practice:${questionId}`;
  }

  function getPracticeCount(questionId) {
    let raw = null;
    try {
      raw = localStorage.getItem(practiceKey(questionId));
    } catch (e) {}
    const n = parseInt(raw, 10);
    return Number.isFinite(n) && n > 0 ? n : 0;
  }

  function setPracticeCount(questionId, n) {
    const clamped = Math.max(0, Math.floor(n) || 0);
    try {
      if (clamped > 0) localStorage.setItem(practiceKey(questionId), String(clamped));
      else localStorage.removeItem(practiceKey(questionId));
    } catch (e) {}
    return clamped;
  }

  // ---- kick-phrase editing: same localStorage-override pattern as the
  // script box, but a kick is also a real node in the tree (not just text
  // in a panel), so an edit has to update three things in step: the raw
  // FOREST paragraph object's .children (so exports/search see it), the
  // d3-hierarchy node's own children/_children (so the tree redraws it),
  // and localStorage (so it survives a reload). ----
  function kicksKey(paragraphId) {
    return `opic-kicks:${paragraphId}`;
  }

  // works on a raw FOREST paragraph object — the kick-phrases a viewer
  // would actually see for this beat right now: their own saved edit if
  // there is one, else whatever .children currently holds (which is
  // itself the pristine parse until the first edit rewrites it in place).
  function effectiveKicksFor(paragraphData) {
    let saved = null;
    try {
      saved = localStorage.getItem(kicksKey(paragraphData.id));
    } catch (e) {}
    if (saved !== null) {
      try {
        const arr = JSON.parse(saved);
        if (Array.isArray(arr)) return arr;
      } catch (e) {}
    }
    return (paragraphData.children || []).map((k) => k.name);
  }

  // every kick phrase across every beat of a question, grouped by beat —
  // shown right under "Show script" on a question's panel, always visible
  // (unlike the script itself) so it can double as a practice cue sheet:
  // read the question, answer using just these phrases, only peek at the
  // full script if you get stuck.
  function allKicksHtml(questionData) {
    const beats = questionData.children || [];
    if (!beats.length) return "";
    let html = `<div class="all-kicks-head"><span class="script-label">Kick phrases to use</span></div>`;
    html += `<div class="all-kicks">`;
    beats.forEach((p) => {
      const kicks = effectiveKicksFor(p);
      html += `<div class="all-kicks-group">`;
      html += `<span class="all-kicks-cue">${escapeHtml(p.name)}</span>`;
      html += kicks.length
        ? `<div class="reading-kicks">` + kicks.map((k) => `<span class="kick-chip">${escapeHtml(k)}</span>`).join("") + `</div>`
        : `<p class="kick-empty">No kick phrases yet.</p>`;
      html += `</div>`;
    });
    html += `</div>`;
    return html;
  }

  // rebuilds a paragraph's kick-hierarchy children from its (already
  // updated) raw .children array. Kick nodes are leaves, so a fresh
  // d3.hierarchy() per kick — reparented onto the paragraph master node —
  // is simpler and safer than hand-patching the old node objects.
  function rebuildKickChildren(paragraphMaster, forceExpand) {
    const kickNodes = (paragraphMaster.data.children || []).map((kickData) => {
      const kn = d3.hierarchy(kickData);
      kn.parent = paragraphMaster;
      kn.depth = paragraphMaster.depth + 1;
      kn.height = 0;
      kn.id = kickData.id;
      return kn;
    });
    if (forceExpand || paragraphMaster.children) {
      paragraphMaster.children = kickNodes;
      paragraphMaster._children = null;
    } else {
      paragraphMaster._children = kickNodes;
      paragraphMaster.children = null;
    }
  }

  // ALL_NODES (built once, below, for search) is a flat list of raw data
  // objects; a kick edit has to patch it too or search would keep
  // matching removed kicks and never find new ones. Kick ids are always
  // "<paragraphId>-k<n>", so they're easy to pick out and replace. The
  // topic is looked up from the id's own "tN-" prefix rather than
  // state.topicIndex, since a bulk import can edit a paragraph that isn't
  // in the topic currently on screen.
  function reindexKicksFor(paragraphData) {
    const m = /^t(\d+)-/.exec(paragraphData.id);
    const topicData = m ? FOREST[Number(m[1])] : FOREST[state.topicIndex];
    for (let i = ALL_NODES.length - 1; i >= 0; i--) {
      if (ALL_NODES[i].node.id.startsWith(paragraphData.id + "-k")) ALL_NODES.splice(i, 1);
    }
    (paragraphData.children || []).forEach((k) => ALL_NODES.push({ node: k, topic: topicData }));
  }

  function scriptFilename(node) {
    const tag = node.data.tag || node.id;
    const slug = (node.data.name || "question").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return `opic-${tag}-${slug || "script"}.txt`;
  }

  function showScriptStatus(el, text, isError) {
    if (!el) return;
    el.textContent = text;
    el.style.color = isError ? "var(--kick)" : "var(--muted)";
    window.clearTimeout(el._fadeTimer);
    el._fadeTimer = window.setTimeout(() => {
      el.textContent = "";
    }, 3200);
  }

  // shared by every "Save as .txt"/"Export all scripts"/recording-download
  // button. Inside the claude.ai artifact sandbox, a direct <a download>
  // link is inert — so this goes through the artifact's downloads
  // capability there. Outside that sandbox (e.g. this same page hosted on
  // GitHub Pages, where window.claude simply doesn't exist), a plain
  // Blob-URL download link is the normal, unblocked way to save a file in
  // any real browser tab — so it falls back to that instead of just
  // giving up, letting the one HTML file serve both contexts.
  async function saveTextFile(filename, text, statusEl, successMessage) {
    if (window.claude && typeof window.claude.use === "function") {
      try {
        const downloads = await window.claude.use("downloads");
        if (!downloads) {
          showScriptStatus(statusEl, "Downloads aren't available in this view.", true);
          return false;
        }
        await downloads.save({ filename, data: text });
        showScriptStatus(statusEl, successMessage || "Saved.");
        return true;
      } catch (err) {
        const code = err && err.code;
        if (code === "declined") {
          showScriptStatus(statusEl, "Download declined.");
        } else if (code === "rate_limited") {
          showScriptStatus(statusEl, "Try again in a moment.", true);
        } else {
          showScriptStatus(statusEl, "Couldn't save the file.", true);
        }
        return false;
      }
    }
    try {
      const blob = text instanceof Blob ? text : new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 4000);
      showScriptStatus(statusEl, successMessage || "Saved.");
      return true;
    } catch (err) {
      showScriptStatus(statusEl, "Couldn't save the file.", true);
      return false;
    }
  }

  // ---- TEMPORARY: minimal recording probe (step 0 of the voice-recording
  // plan) — just prove getUserMedia + MediaRecorder actually work inside
  // the claude.ai artifact iframe sandbox, with no takes list or kick-
  // marking UI yet. To be replaced by the real "Takes" section once this
  // is confirmed working on a real device. ----
  const REC_MIME_CANDIDATES = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
  function pickRecMimeType() {
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
    for (const m of REC_MIME_CANDIDATES) {
      if (MediaRecorder.isTypeSupported(m)) return m;
    }
    return "";
  }

  function wireRecProbe() {
    const btn = readingBody.querySelector("#recProbeBtn");
    const status = readingBody.querySelector("#recProbeStatus");
    const playback = readingBody.querySelector("#recProbePlayback");
    if (!btn) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      btn.disabled = true;
      showScriptStatus(status, "Recording isn't supported in this browser.", true);
      return;
    }

    let mediaRecorder = null;
    let chunks = [];
    let stream = null;
    let recording = false;

    btn.addEventListener("click", async () => {
      if (!recording) {
        playback.innerHTML = "";
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
          showScriptStatus(status, "Mic access denied/unavailable: " + ((err && err.name) || err), true);
          return;
        }
        const mimeType = pickRecMimeType();
        chunks = [];
        try {
          mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        } catch (err) {
          showScriptStatus(status, "Couldn't start the recorder: " + err.message, true);
          stream.getTracks().forEach((tr) => tr.stop());
          return;
        }
        mediaRecorder.addEventListener("dataavailable", (e) => {
          if (e.data && e.data.size) chunks.push(e.data);
        });
        mediaRecorder.addEventListener("stop", () => {
          stream.getTracks().forEach((tr) => tr.stop());
          const blob = new Blob(chunks, { type: mediaRecorder.mimeType || mimeType || "audio/webm" });
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.style.display = "block";
          audio.style.marginTop = "8px";
          audio.src = URL.createObjectURL(blob);
          playback.appendChild(audio);

          const dl = document.createElement("button");
          dl.type = "button";
          dl.className = "script-download";
          dl.style.display = "block";
          dl.style.marginTop = "6px";
          dl.textContent = "⬇ Download recording";
          dl.addEventListener("click", () => {
            const ext = (blob.type || "").includes("mp4") ? "mp4" : "webm";
            saveTextFile(`opic-rec-test.${ext}`, blob, status, "Saved.");
          });
          playback.appendChild(dl);

          showScriptStatus(status, `Recorded ${blob.size} bytes (${blob.type || "unknown type"}).`);
        });
        mediaRecorder.start();
        recording = true;
        btn.textContent = "⏹ Stop";
        showScriptStatus(status, "Recording…");
      } else {
        mediaRecorder.stop();
        recording = false;
        btn.textContent = "🎙 Record";
      }
    });
  }

  function wireScriptBox(node) {
    const box = readingBody.querySelector(".script-box");
    const resetBtn = readingBody.querySelector(".script-reset");
    const downloadBtn = readingBody.querySelector(".script-download");
    const loadBtn = readingBody.querySelector(".script-load");
    const fileInput = readingBody.querySelector(".script-file-input");
    const status = readingBody.querySelector(".script-status");
    if (!box) return;
    const key = `opic-script:${node.id}`;
    const original = defaultScriptFor(node);

    let saved = null;
    try {
      saved = localStorage.getItem(key);
    } catch (e) {}
    box.value = saved !== null ? saved : original;

    box.addEventListener("input", () => {
      try {
        localStorage.setItem(key, box.value);
      } catch (e) {}
    });

    resetBtn.addEventListener("click", () => {
      box.value = original;
      try {
        localStorage.removeItem(key);
      } catch (e) {}
      box.focus();
      showScriptStatus(status, "Reset to the original script.");
    });

    if (downloadBtn) {
      downloadBtn.addEventListener("click", () => saveTextFile(scriptFilename(node), box.value, status));
    }

    if (loadBtn && fileInput) {
      loadBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          box.value = String(reader.result || "");
          try {
            localStorage.setItem(key, box.value);
          } catch (e) {}
          showScriptStatus(status, `Loaded ${file.name}.`);
        };
        reader.onerror = () => showScriptStatus(status, "Couldn't read that file.", true);
        reader.readAsText(file);
      });
    }
  }

  // the editable kick-phrase list on a script-beat panel: add / edit / delete
  // a chip and the change shows up immediately as kick nodes under that beat
  // in the tree (see rebuildKickChildren) — not just in this panel — and
  // persists to localStorage the same way the script box does.
  function wireKickEditor(node) {
    const editor = readingBody.querySelector("#kickEditor");
    const addBtn = readingBody.querySelector(".kick-add");
    const resetBtn = readingBody.querySelector(".kick-reset");
    const status = readingBody.querySelector("#kickStatus");
    if (!editor) return;

    // capture the pristine kick list once, before this session's first
    // edit ever touches node.data.children — this is what "Reset" restores.
    if (!node.data.__originalKicks) {
      node.data.__originalKicks = (node.data.children || []).map((k) => k.name);
    }

    function currentKicks() {
      return effectiveKicksFor(node.data);
    }

    function applyKicks(kicks, persist) {
      const cleaned = kicks.map((k) => k.trim()).filter((k) => k.length);
      try {
        if (persist === false) localStorage.removeItem(kicksKey(node.id));
        else localStorage.setItem(kicksKey(node.id), JSON.stringify(cleaned));
      } catch (e) {}
      node.data.children = cleaned.map((text, i) => ({ id: `${node.id}-k${i}`, name: text, type: "kick", full: text }));
      reindexKicksFor(node.data);
      rebuildKickChildren(node, true);
      renderTree(false);
      renderEditor(cleaned);
    }

    // drag a chip's grip handle to reorder — visually reflows the DOM live
    // as the pointer crosses sibling chips (only for feedback; the array
    // itself is derived fresh from final DOM order on drop), then commits
    // through the same applyKicks() every other edit already goes through,
    // so persistence + tree rebuild + re-render all come for free.
    function wireChipDrag(chip) {
      const grip = chip.querySelector(".kick-grip");
      if (!grip) return;
      let dragging = false;
      function onMove(event) {
        if (!dragging) return;
        const target = document.elementFromPoint(event.clientX, event.clientY);
        const targetChip = target && target.closest(".kick-chip-edit");
        if (targetChip && targetChip !== chip && targetChip.parentElement === editor) {
          const rect = targetChip.getBoundingClientRect();
          const before = event.clientX < rect.left + rect.width / 2;
          editor.insertBefore(chip, before ? targetChip : targetChip.nextSibling);
        }
      }
      function onUp() {
        if (!dragging) return;
        dragging = false;
        chip.classList.remove("kick-dragging");
        document.body.style.userSelect = "";
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        const newOrder = Array.from(editor.querySelectorAll(".kick-input")).map((inp) => inp.value);
        applyKicks(newOrder);
        showScriptStatus(status, "Reordered.");
      }
      grip.addEventListener("pointerdown", (event) => {
        dragging = true;
        chip.classList.add("kick-dragging");
        document.body.style.userSelect = "none";
        event.preventDefault();
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
      });
    }

    function renderEditor(kicks) {
      editor.innerHTML = "";
      kicks.forEach((text, i) => {
        const chip = document.createElement("span");
        chip.className = "kick-chip kick-chip-edit";

        const grip = document.createElement("span");
        grip.className = "kick-grip";
        grip.setAttribute("aria-hidden", "true");
        grip.textContent = "⠿";
        chip.appendChild(grip);

        const input = document.createElement("input");
        input.type = "text";
        input.className = "kick-input";
        input.value = text;
        input.setAttribute("aria-label", `Kick phrase ${i + 1}`);
        input.size = Math.max(4, text.length);
        input.addEventListener("input", () => {
          input.size = Math.max(4, input.value.length);
        });
        input.addEventListener("change", () => {
          const kicks2 = currentKicks();
          kicks2[i] = input.value;
          applyKicks(kicks2);
          showScriptStatus(status, "Saved.");
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            input.blur();
          }
        });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "kick-del";
        del.setAttribute("aria-label", `Remove kick phrase ${i + 1}`);
        del.textContent = "×";
        del.addEventListener("click", () => {
          const kicks2 = currentKicks();
          kicks2.splice(i, 1);
          applyKicks(kicks2);
          showScriptStatus(status, "Removed.");
        });

        chip.appendChild(input);
        chip.appendChild(del);
        editor.appendChild(chip);
        wireChipDrag(chip);
      });
      if (!kicks.length) {
        const empty = document.createElement("p");
        empty.className = "kick-empty";
        empty.textContent = "No kick phrases yet.";
        editor.appendChild(empty);
      }
    }

    renderEditor(currentKicks());

    if (addBtn) {
      addBtn.addEventListener("click", () => {
        const kicks = currentKicks();
        kicks.push("new kick");
        applyKicks(kicks);
        showScriptStatus(status, "Added.");
        const inputs = editor.querySelectorAll(".kick-input");
        const last = inputs[inputs.length - 1];
        if (last) {
          last.focus();
          last.select();
        }
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener("click", () => {
        applyKicks(node.data.__originalKicks.slice(), false);
        showScriptStatus(status, "Reset to the original kick phrases.");
      });
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function toggle(d) {
    if (d.data.type !== "question" && d.data.type !== "paragraph") return;
    if (d.children) {
      d._children = d.children;
      d.children = null;
    } else if (d._children) {
      d.children = d._children;
      d._children = null;
    }
    renderTree(false);
  }

  // wraps a master (state-tracking) hierarchy node in a plain object so a
  // fresh, self-contained d3.hierarchy can be built for layout purposes
  // without disturbing the master's own .parent chain
  function mirrorVisible(masterNode) {
    return {
      master: masterNode,
      children: masterNode.children ? masterNode.children.map(mirrorVisible) : undefined,
    };
  }

  // builds one side's (an array of top-level question master-nodes)
  // self-contained hierarchy for layout purposes, without disturbing the
  // master's own .parent chain
  function buildSideHierarchy(questionNodes) {
    if (!questionNodes.length) return null;
    return d3.hierarchy({ children: questionNodes.map(mirrorVisible) });
  }

  // lays out one side's hierarchy as a tidy tree at the given row spacing,
  // converting each node's row into a screen Y recentered around this
  // side's own vertical middle so left and right can have different
  // extents. Screen X is filled in later, once every visible pill has been
  // measured (see fitColumns). Safe to call twice on the same wrapper:
  // d3.tree() re-lays-out the very same node objects in place, so calling
  // this again with the real row gap (once pill heights are known) just
  // updates .screenY on the exact objects the first, placeholder-gap call
  // already attached pill measurements to.
  function layoutSideRows(wrapper, side, rowGap) {
    if (!wrapper) return [];
    d3.tree()
      .nodeSize([rowGap, 1])
      .separation((a, b) => (a.parent === b.parent ? 1 : 1.7))(wrapper);

    const rows = wrapper.descendants().filter((d) => d.depth > 0);
    if (!rows.length) return [];
    const extent = d3.extent(rows, (d) => d.x);
    const mid = (extent[0] + extent[1]) / 2;
    rows.forEach((d) => {
      d.master = d.data.master;
      d.side = side;
      d.screenY = d.x - mid;
    });
    return rows;
  }

  // measures every node's wrapped label (as rendered, with its real font)
  // and returns a per-depth column X, wide enough that even the widest
  // pill at each depth clears its neighboring column with room to spare
  function fitColumns(nodes) {
    const maxHalf = [];
    nodes.forEach((d) => {
      maxHalf[d.depth] = Math.max(maxHalf[d.depth] || 0, d.pillW / 2);
    });
    const x = [0];
    for (let depth = 1; depth < maxHalf.length; depth++) {
      const prevHalf = maxHalf[depth - 1] || 0;
      const half = maxHalf[depth] || 0;
      x[depth] = x[depth - 1] + prevHalf + half + COLUMN_BUFFER;
    }
    return x;
  }

  function renderTree(recenter) {
    const root = roots[state.topicIndex];
    const bounds = svg.node().getBoundingClientRect();

    const rootPseudo = { master: root, depth: 0, screenX: 0, screenY: 0 };
    const rightQuestions = root.children.filter((_, i) => i % 2 === 0);
    const leftQuestions = root.children.filter((_, i) => i % 2 === 1);
    const rightWrapper = buildSideHierarchy(rightQuestions);
    const leftWrapper = buildSideHierarchy(leftQuestions);

    // pass 0: lay out rows at a placeholder gap just to get stable node
    // identities to attach measurements to — the real gap depends on pill
    // heights, which aren't known until those pills exist and are measured
    const rightRows = layoutSideRows(rightWrapper, 1, 40);
    const leftRows = layoutSideRows(leftWrapper, -1, 40);
    const nodes = [rootPseudo, ...rightRows, ...leftRows];

    const nodeSel = nodeLayer.selectAll("g.node").data(nodes, (d) => d.master.id);
    nodeSel.exit().remove();

    const nodeEnter = nodeSel.enter().append("g");
    nodeEnter.append("rect").attr("class", "pill");
    nodeEnter.append("text");
    nodeEnter.append("g").attr("class", "badge");
    nodeEnter.append("g").attr("class", "take-badge");

    const nodeMerge = nodeEnter.merge(nodeSel);
    nodeMerge.attr("class", (d) => `node ${d.master.data.type}`);

    // pass 1: set each node's label (as wrapped text) and measure the
    // rendered result to size its pill — this has to happen before we can
    // know how wide each depth's column needs to be
    nodeMerge.each(function (d) {
      const type = d.master.data.type;
      const data = d.master.data;
      let name;
      if (type === "topic") name = data.name.toUpperCase();
      else if (type === "question") name = `Q${data.tag}. ${data.name}`;
      else if (type === "paragraph") name = data.full; // the sheet's own column-C text, verbatim
      else name = data.name; // kick
      const lines = wrapLabel(name, WRAP_CHARS[type]);
      const lineH = 1.15;
      const startDy = -((lines.length - 1) * lineH) / 2 + 0.32;

      const text = d3.select(this).select("text");
      const tspans = text.selectAll("tspan").data(lines);
      tspans.exit().remove();
      tspans
        .enter()
        .append("tspan")
        .merge(tspans)
        .attr("x", 0)
        .attr("dy", (_, i) => (i === 0 ? startDy : lineH) + "em")
        .text((line) => line);

      // measure the text alone — this <g> can still hold the *previous*
      // render's pill rect and badge, which would otherwise bloat the box
      const bbox = text.node().getBBox();
      d.pillW = bbox.width + PILL_PAD_X[type] * 2;
      d.pillH = bbox.height + PILL_PAD_Y[type] * 2;

      d3.select(this)
        .select("rect.pill")
        .attr("x", -d.pillW / 2)
        .attr("y", -d.pillH / 2)
        .attr("width", d.pillW)
        .attr("height", d.pillH)
        .attr("rx", d.pillH / 2);
    });

    // pass 2: now that every pill's size is known, re-lay-out each side at
    // the real row gap (tall enough to clear the tallest pill anywhere in
    // this view — a script beat's full text can wrap to several lines) and
    // size each depth's column, then place every node (root at the origin).
    // layoutSideRows mutates the same node objects nodes[] already holds,
    // so this updates their .screenY in place — no need to rebuild nodes[].
    const rowGap = Math.max(...nodes.map((d) => d.pillH)) + ROW_BUFFER;
    layoutSideRows(rightWrapper, 1, rowGap);
    layoutSideRows(leftWrapper, -1, rowGap);

    const DEPTH_X = fitColumns(nodes);
    nodes.forEach((d) => {
      d.screenX = d.depth === 0 ? 0 : d.side * DEPTH_X[d.depth];
    });

    posById.clear();
    nodes.forEach((d) => posById.set(d.master.id, { x: d.screenX, y: d.screenY }));

    nodeMerge.attr("transform", (d) => `translate(${d.screenX},${d.screenY})`);

    nodeMerge.each(function (d) {
      const type = d.master.data.type;
      const expandable = type === "question" || type === "paragraph";
      const collapsedCount = d.master._children && !d.master.children ? d.master._children.length : 0;
      const badge = d3.select(this).select("g.badge");
      badge.selectAll("*").remove();
      if (expandable && collapsedCount > 0) {
        const dir = d.screenX < 0 ? -1 : 1;
        badge.attr("transform", `translate(${(dir * d.pillW) / 2},0)`).style("display", null);
        badge.append("circle").attr("r", 9);
        badge.append("text").attr("dy", "0.32em").attr("text-anchor", "middle").text(collapsedCount);
      } else {
        badge.style("display", "none");
      }

      // practice-count corner chip (questions only) — straddles the pill's
      // top-left corner so it never lands on the branch-count badge above,
      // which sits centered on the pill's outward side edge instead.
      const takeBadge = d3.select(this).select("g.take-badge");
      takeBadge.selectAll("*").remove();
      const practiceCount = type === "question" ? getPracticeCount(d.master.data.id) : 0;
      if (practiceCount > 0) {
        takeBadge.attr("transform", `translate(${-d.pillW / 2},${-d.pillH / 2})`).style("display", null);
        const label = `take#${practiceCount}`;
        const t = takeBadge.append("text").attr("text-anchor", "middle").attr("dy", "0.32em").text(label);
        const bbox = t.node().getBBox();
        const padX = 5, padY = 3;
        const w = bbox.width + padX * 2;
        const h = bbox.height + padY * 2;
        takeBadge.insert("rect", "text").attr("x", -w / 2).attr("y", -h / 2).attr("width", w).attr("height", h).attr("rx", h / 2);
      } else {
        takeBadge.style("display", "none");
      }
    });

    const links = nodes
      .filter((d) => d !== rootPseudo)
      .map((d) => ({ source: d.parent && d.parent.depth > 0 ? d.parent : rootPseudo, target: d }));

    const linkSel = linkLayer.selectAll("path.link").data(links, (d) => d.target.master.id);
    linkSel.exit().remove();
    linkSel
      .enter()
      .append("path")
      .attr("class", (d) => `link ${d.target.master.data.type[0]}-link`)
      .merge(linkSel)
      .attr("class", (d) => `link ${d.target.master.data.type[0]}-link`)
      .attr("d", (d) => {
        const sx = d.source.screenX, sy = d.source.screenY;
        const tx = d.target.screenX, ty = d.target.screenY;
        const mx = (sx + tx) / 2;
        return `M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`;
      });

    nodeMerge
      .attr("tabindex", (d) => (d.master.data.type === "topic" ? null : 0))
      .attr("role", (d) => (d.master.data.type === "topic" ? null : "button"))
      .on("click", (event, d) => {
        event.stopPropagation();
        setCurrent(d.master);
        toggle(d.master);
      })
      .on("keydown", (event, d) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          setCurrent(d.master);
          toggle(d.master);
        }
      });

    nodeMerge.classed("current", (d) => state.current && d.master.id === state.current.id);
    nodeMerge.classed("match", (d) => matchSet.has(d.master.id));

    // keep the whole visible tree in frame: every render (initial load,
    // topic switch, or a click that reveals/hides a branch) re-fits the
    // zoom so newly expanded nodes never land outside the canvas
    const pad = 130;
    const xs = nodes.map((d) => d.screenX);
    const ys = nodes.map((d) => d.screenY);
    const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
    const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
    const scale = Math.min(bounds.width / (maxX - minX), bounds.height / (maxY - minY), 1.8);
    const clamped = Math.max(scale, zoom.scaleExtent()[0]);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const t = d3.zoomIdentity.translate(bounds.width / 2 - cx * clamped, bounds.height / 2 - cy * clamped).scale(clamped);
    (recenter ? svg : svg.transition().duration(350)).call(zoom.transform, t);
  }

  // ---- expand / collapse all (within current topic) ----
  document.getElementById("expandAll").addEventListener("click", () => {
    roots[state.topicIndex].each((d) => {
      if (d._children) {
        d.children = d._children;
        d._children = null;
      }
    });
    renderTree(false);
  });
  document.getElementById("collapseAll").addEventListener("click", () => {
    roots[state.topicIndex].descendants().forEach((d) => {
      if (d.depth >= 1 && d.children) {
        d._children = d.children;
        d.children = null;
      }
    });
    renderTree(false);
  });

  // ---- global default for whether a question's script panel opens
  // expanded. The per-question "Show script" button still overrides this
  // for a single view; this just sets what a freshly opened question
  // starts as, and re-syncs the currently open one so the effect is
  // immediate rather than waiting for the next click. ----
  const scriptsVisibleToggle = document.getElementById("scriptsVisibleToggle");
  function setScriptsVisible(on) {
    state.scriptsVisible = on;
    try {
      localStorage.setItem("opic-scripts-visible", on ? "1" : "0");
    } catch (e) {}
    scriptsVisibleToggle.setAttribute("aria-pressed", String(on));
    scriptsVisibleToggle.textContent = on ? "👁 Hide all scripts" : "👁 View all scripts";
    if (state.current && state.current.data && state.current.data.type === "question") {
      setCurrent(state.current);
    }
  }
  setScriptsVisible(state.scriptsVisible);
  scriptsVisibleToggle.addEventListener("click", () => setScriptsVisible(!state.scriptsVisible));

  // ---- bulk script + kick export / import: every question, Q1-1 through
  // the last topic's last question, as one file. The heading lines
  // ("===== tag | topic | question =====") are how a re-imported file gets
  // matched back to the right question, so they're the one thing a viewer
  // (or Claude, handed this file back later) shouldn't rewrite — the body
  // under each heading is exactly what ends up in that question's script
  // box, and each "[kicks]" line under it is one script beat's kick
  // phrases, tagged with that beat's id in brackets so an edit still finds
  // its way back even if the label text or line order changes. ----
  const ALL_SCRIPTS_HEADING_RE = /^===== (\S+) \|/;
  const PRACTICE_MARKER = "[practice]";
  const KICKS_MARKER = "[kicks]";
  const KICK_LINE_RE = /^.*\[([\w-]+)\]:\s*(.*)$/;

  function buildAllScriptsText() {
    const lines = [
      "# OPIc Forest — all practice scripts and kick phrases",
      `# Exported ${new Date().toISOString().slice(0, 10)}.`,
      '# Edit the text under a heading, then use "Import all scripts" to load your edits back in.',
      "# Don't edit the heading lines themselves (===== tag | topic | question =====) or the [id] tag on a kicks line — they're how an edit gets matched back to the right question/beat.",
      "# Kick phrases for a beat go on one line, separated by semicolons.",
      "",
    ];
    questionIndex.forEach((e) => {
      lines.push(`===== ${e.tag} | ${e.topic} | ${e.question} =====`);
      lines.push(effectiveScriptFor(e.node));
      lines.push("");
      lines.push(PRACTICE_MARKER);
      lines.push(String(getPracticeCount(e.id)));
      lines.push("");
      lines.push(KICKS_MARKER);
      (e.node.children || []).forEach((p) => {
        lines.push(`${p.name} [${p.id}]: ${effectiveKicksFor(p).join("; ")}`);
      });
      lines.push("");
    });
    return lines.join("\n").trim() + "\n";
  }

  function parseAllScriptsText(text) {
    const lines = text.replace(/\r\n/g, "\n").split("\n");
    const rawEntries = [];
    let currentTag = null;
    let buf = [];
    function flush() {
      if (currentTag) rawEntries.push({ tag: currentTag, raw: buf.join("\n") });
      buf = [];
    }
    for (const line of lines) {
      const m = ALL_SCRIPTS_HEADING_RE.exec(line);
      if (m) {
        flush();
        currentTag = m[1];
      } else if (currentTag) {
        buf.push(line);
      }
    }
    flush();

    return rawEntries.map(({ tag, raw }) => {
      const kicksIdx = raw.indexOf(KICKS_MARKER);
      const beforeKicks = kicksIdx === -1 ? raw : raw.slice(0, kicksIdx);
      const kicksPart = kicksIdx === -1 ? "" : raw.slice(kicksIdx + KICKS_MARKER.length);

      const practiceIdx = beforeKicks.indexOf(PRACTICE_MARKER);
      const scriptPart = practiceIdx === -1 ? beforeKicks : beforeKicks.slice(0, practiceIdx);
      const practicePart = practiceIdx === -1 ? "" : beforeKicks.slice(practiceIdx + PRACTICE_MARKER.length);
      // null (not undefined) means "this file predates the [practice]
      // marker" — leave the existing count alone rather than reset it to 0.
      const practiceMatch = practicePart.match(/-?\d+/);
      const practiceCount = practiceMatch ? Math.max(0, parseInt(practiceMatch[0], 10)) : null;

      const kickEntries = [];
      kicksPart.split("\n").forEach((line) => {
        const km = KICK_LINE_RE.exec(line.trim());
        if (km) {
          kickEntries.push({ id: km[1], kicks: km[2].split(";").map((s) => s.trim()).filter((s) => s.length) });
        }
      });
      return { tag, body: scriptPart.trim(), practiceCount, kickEntries };
    });
  }

  function applyImportedScripts(entries) {
    let applied = 0;
    let kicksApplied = 0;
    let practiceApplied = 0;
    const unknown = [];
    entries.forEach(({ tag, body, practiceCount, kickEntries }) => {
      const e = questionByTag[tag];
      if (!e) {
        unknown.push(tag);
        return;
      }
      try {
        localStorage.setItem(`opic-script:${e.id}`, body);
      } catch (err) {}
      applied++;
      if (practiceCount !== null) {
        setPracticeCount(e.id, practiceCount);
        practiceApplied++;
      }
      if (state.current && state.current.data && state.current.data.id === e.id) {
        const box = readingBody.querySelector(".script-box");
        if (box) box.value = body;
        const display = readingBody.querySelector("#practiceCountDisplay");
        const resetBtn = readingBody.querySelector("#practiceReset");
        if (display && practiceCount !== null) {
          display.textContent = `take#${practiceCount}`;
          if (resetBtn) resetBtn.hidden = practiceCount === 0;
        }
      }

      (kickEntries || []).forEach(({ id: pid, kicks }) => {
        const paragraphData = paragraphById[pid];
        if (!paragraphData) return;
        try {
          localStorage.setItem(kicksKey(pid), JSON.stringify(kicks));
        } catch (err) {}
        paragraphData.children = kicks.map((text, i) => ({ id: `${pid}-k${i}`, name: text, type: "kick", full: text }));
        reindexKicksFor(paragraphData);
        kicksApplied++;
      });
    });
    // a bulk import can touch beats in topics that aren't on screen right
    // now, so rebuild every topic's tree fresh from the (already mutated)
    // FOREST data rather than trying to patch hierarchy nodes scattered
    // across roots we may not have visited yet.
    if (kicksApplied) {
      roots = FOREST.map(buildRoot);
      setCurrent(null);
      renderTree(true);
    } else if (practiceApplied) {
      // no hierarchy change needed for a practice-count-only import — just
      // redraw so every question's corner chip picks up its new count.
      renderTree(false);
    }
    return { applied, unknown, kicksApplied, practiceApplied };
  }

  const topbarStatus = document.getElementById("topbarStatus");

  document.getElementById("exportAllBtn").addEventListener("click", () => {
    saveTextFile(
      "opic-forest-all-scripts.txt",
      buildAllScriptsText(),
      topbarStatus,
      `Exported ${questionIndex.length} scripts.`
    );
  });

  const importAllInput = document.getElementById("importAllInput");
  document.getElementById("importAllBtn").addEventListener("click", () => importAllInput.click());
  importAllInput.addEventListener("change", () => {
    const file = importAllInput.files && importAllInput.files[0];
    importAllInput.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const entries = parseAllScriptsText(String(reader.result || ""));
      const { applied, unknown, kicksApplied, practiceApplied } = applyImportedScripts(entries);
      let msg = applied ? `Imported ${applied} script${applied === 1 ? "" : "s"}` : "No matching questions found in that file.";
      if (applied) {
        const extras = [];
        if (practiceApplied) extras.push(`${practiceApplied} practice count${practiceApplied === 1 ? "" : "s"}`);
        if (kicksApplied) extras.push(`${kicksApplied} beats' kick phrases`);
        msg += extras.length ? ` and ${extras.join(", ")}.` : ".";
      }
      if (unknown.length) msg += ` ${unknown.length} unrecognized tag${unknown.length === 1 ? "" : "s"} skipped.`;
      showScriptStatus(topbarStatus, msg, applied === 0);
    };
    reader.onerror = () => showScriptStatus(topbarStatus, "Couldn't read that file.", true);
    reader.readAsText(file);
  });

  // ---- drag the vertical handle to resize the details panel ----
  (function setupReadingResize() {
    const handle = document.getElementById("readingResize");
    if (!handle) return;
    const root = document.documentElement;
    const MIN_W = 260;
    const maxWidth = () => Math.max(MIN_W, Math.min(720, window.innerWidth - 420));
    const clamp = (w) => Math.min(Math.max(w, MIN_W), maxWidth());

    let saved = null;
    try {
      saved = localStorage.getItem("opic-reading-width");
    } catch (e) {}
    if (saved) root.style.setProperty("--reading-w", clamp(parseInt(saved, 10) || 300) + "px");

    // pointermove/pointerup are bound to window, not the (6px-wide) handle
    // itself: setPointerCapture is supposed to keep them firing on handle
    // as the finger/cursor travels off it, but that didn't hold up on at
    // least one tablet browser — the drag would go dead the instant the
    // touch point left the thin strip. Listening on window sidesteps
    // needing capture to work at all; the `dragging` flag is the only
    // gate we actually rely on.
    let dragging = false;
    handle.addEventListener("pointerdown", (event) => {
      dragging = true;
      try {
        handle.setPointerCapture(event.pointerId);
      } catch (e) {}
      handle.classList.add("dragging");
      document.body.style.cursor = "col-resize";
      document.body.style.userSelect = "none";
      event.preventDefault();
    });
    window.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      root.style.setProperty("--reading-w", clamp(window.innerWidth - event.clientX) + "px");
    });
    function stopDrag() {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove("dragging");
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
      try {
        const current = parseInt(getComputedStyle(root).getPropertyValue("--reading-w"), 10);
        if (current) localStorage.setItem("opic-reading-width", String(current));
      } catch (e) {}
    }
    window.addEventListener("pointerup", stopDrag);
    window.addEventListener("pointercancel", stopDrag);

    window.addEventListener("resize", () => {
      const current = parseInt(getComputedStyle(root).getPropertyValue("--reading-w"), 10);
      if (current) root.style.setProperty("--reading-w", clamp(current) + "px");
    });
  })();

  // ---- drag the horizontal handle at the top of the mobile bottom-sheet
  // panel to resize its height — the same idea as setupReadingResize
  // above, just vertical, and only relevant under the <=900px breakpoint
  // where .reading becomes a fixed bottom sheet instead of a side column.
  // Same window-bound listener pattern from the start (see the comment in
  // setupReadingResize about why: pointer capture alone isn't reliable
  // enough on touch to hang a drag off of). ----
  (function setupReadingResizeHeight() {
    const handle = document.getElementById("readingResizeV");
    if (!handle) return;
    const root = document.documentElement;
    const MIN_H = 120;
    const maxHeight = () => Math.max(MIN_H, Math.min(window.innerHeight * 0.85, window.innerHeight - 100));
    const clamp = (h) => Math.min(Math.max(h, MIN_H), maxHeight());

    let saved = null;
    try {
      saved = localStorage.getItem("opic-reading-height");
    } catch (e) {}
    if (saved) root.style.setProperty("--reading-h", clamp(parseInt(saved, 10) || 0) + "px");

    let dragging = false;
    let startY = 0;
    let startH = 0;
    handle.addEventListener("pointerdown", (event) => {
      dragging = true;
      startY = event.clientY;
      startH = reading.getBoundingClientRect().height;
      try {
        handle.setPointerCapture(event.pointerId);
      } catch (e) {}
      handle.classList.add("dragging");
      document.body.style.userSelect = "none";
      event.preventDefault();
    });
    window.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      // dragging the handle up (clientY decreases) should grow the sheet
      const dy = startY - event.clientY;
      root.style.setProperty("--reading-h", clamp(startH + dy) + "px");
    });
    function stopDrag() {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove("dragging");
      document.body.style.userSelect = "";
      try {
        const current = parseInt(getComputedStyle(root).getPropertyValue("--reading-h"), 10);
        if (current) localStorage.setItem("opic-reading-height", String(current));
      } catch (e) {}
    }
    window.addEventListener("pointerup", stopDrag);
    window.addEventListener("pointercancel", stopDrag);

    window.addEventListener("resize", () => {
      const current = parseInt(getComputedStyle(root).getPropertyValue("--reading-h"), 10);
      if (current) root.style.setProperty("--reading-h", clamp(current) + "px");
    });
  })();

  // ---- zoom controls ----
  document.getElementById("zoomIn").addEventListener("click", () => svg.transition().duration(200).call(zoom.scaleBy, 1.3));
  document.getElementById("zoomOut").addEventListener("click", () => svg.transition().duration(200).call(zoom.scaleBy, 1 / 1.3));
  document.getElementById("zoomReset").addEventListener("click", () => renderTree(true));

  document.getElementById("readingClose").addEventListener("click", () => reading.classList.remove("open"));

  // ---- focus mode: a button hides the top bar + grove rail ----
  // (deliberately a button, not a tap-empty-canvas gesture: d3-zoom's touch
  // handling can swallow the synthetic click a tap would otherwise fire, so
  // a gesture-based toggle is unreliable on touch devices)
  const appEl = document.getElementById("app");
  function setFocusMode(on) {
    appEl.classList.toggle("focus-mode", on);
    renderTree(false);
  }
  document.getElementById("focusToggle").addEventListener("click", () => {
    setFocusMode(!appEl.classList.contains("focus-mode"));
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && appEl.classList.contains("focus-mode")) setFocusMode(false);
  });

  // ---- search across the whole forest ----
  let matchSet = new Set();
  const searchInput = document.getElementById("search");
  const searchResults = document.getElementById("searchResults");

  function flattenAll(topic) {
    const out = [];
    function walk(node, topicNode) {
      out.push({ node, topic: topicNode });
      (node.children || []).forEach((c) => walk(c, topicNode));
    }
    walk(topic, topic);
    return out;
  }
  const ALL_NODES = FOREST.flatMap((t) => flattenAll(t));

  function highlight(text, q) {
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return escapeHtml(text);
    return (
      escapeHtml(text.slice(0, idx)) +
      "<mark>" + escapeHtml(text.slice(idx, idx + q.length)) + "</mark>" +
      escapeHtml(text.slice(idx + q.length))
    );
  }

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim();
    matchSet = new Set();
    if (q.length < 2) {
      searchResults.classList.remove("open");
      renderTree(false);
      return;
    }
    const ql = q.toLowerCase();
    const hits = ALL_NODES.filter(({ node }) => {
      const hay = `${node.name} ${node.full || ""}`.toLowerCase();
      return hay.includes(ql);
    }).slice(0, 24);

    hits.forEach(({ node }) => matchSet.add(node.id));

    searchResults.innerHTML = hits.length
      ? hits.map(({ node, topic }) => `
          <button class="sr-item" data-topic="${topic.id}" data-node="${node.id}">
            <span class="sr-topic">${escapeHtml(topic.name)} · ${typeLabel(node.type)}</span>
            <span class="sr-snippet">${highlight(node.full || node.name, q)}</span>
          </button>`).join("")
      : `<p class="sr-empty">No matches across any topic.</p>`;
    searchResults.classList.add("open");

    renderTree(false);
  });

  // finds a node anywhere in the hierarchy (visible or collapsed) and expands
  // every ancestor on the path down to it
  function findAndReveal(root, id) {
    let target = null;
    (function walk(node) {
      if (node.id === id) {
        target = node;
        return true;
      }
      const kids = node.children || node._children;
      if (!kids) return false;
      for (const kid of kids) {
        if (walk(kid)) {
          if (node._children && !node.children) {
            node.children = node._children;
            node._children = null;
          }
          return true;
        }
      }
      return false;
    })(root);
    return target;
  }

  function focusOnNode(id) {
    const root = roots[state.topicIndex];
    let target = null;
    (function walk(n) {
      if (n.id === id) target = n;
      (n.children || []).forEach(walk);
    })(root);
    if (!target) return;
    const pos = posById.get(id);
    if (pos) {
      const bounds = svg.node().getBoundingClientRect();
      const scale = 1.1;
      const t = d3.zoomIdentity
        .translate(bounds.width / 2 - pos.x * scale, bounds.height / 2 - pos.y * scale)
        .scale(scale);
      svg.transition().duration(500).call(zoom.transform, t);
    }
    setCurrent(target);
  }

  searchResults.addEventListener("click", (e) => {
    const btn = e.target.closest(".sr-item");
    if (!btn) return;
    const topicId = btn.dataset.topic;
    const nodeId = btn.dataset.node;
    const topicIdx = FOREST.findIndex((t) => t.id === topicId);
    if (topicIdx !== state.topicIndex) {
      state.topicIndex = topicIdx;
      renderGrove();
    }
    findAndReveal(roots[topicIdx], nodeId);
    renderTree(false);
    focusOnNode(nodeId);
    searchResults.classList.remove("open");
    searchInput.blur();
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".searchwrap")) searchResults.classList.remove("open");
  });

  window.addEventListener("resize", () => renderTree(false));

  renderGrove();
  renderTree(true);
</script>
