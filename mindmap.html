<!doctype html>
<title>OPIc Forest</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
  rel="stylesheet"
/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #f6f2e7;
    --surface: #fffdf8;
    --surface-2: #ede6d3;
    --ink: #23291f;
    --muted: #6b7263;
    --line: #ddd3b8;
    --line-soft: #e8e0c9;
    --topic: #8a5a34;
    --topic-soft: #f0dcc4;
    --question: #3e6b4c;
    --question-soft: #dcead9;
    --paragraph: #1f7a78;
    --paragraph-soft: #d7ebe8;
    --kick: #a9761f;
    --kick-soft: #f2e3c4;
    --focus: #1f7a78;
    --shadow: 0 1px 2px rgba(35, 41, 31, 0.06), 0 8px 24px -12px rgba(35, 41, 31, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12160e;
      --surface: #1a2015;
      --surface-2: #202718;
      --ink: #eae6d8;
      --muted: #99a487;
      --line: #313a26;
      --line-soft: #262e1c;
      --topic: #dba86e;
      --topic-soft: #382a1c;
      --question: #86c795;
      --question-soft: #1e2f21;
      --paragraph: #6dd0cb;
      --paragraph-soft: #17302e;
      --kick: #e8c073;
      --kick-soft: #362a15;
      --focus: #6dd0cb;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12160e;
    --surface: #1a2015;
    --surface-2: #202718;
    --ink: #eae6d8;
    --muted: #99a487;
    --line: #313a26;
    --line-soft: #262e1c;
    --topic: #dba86e;
    --topic-soft: #382a1c;
    --question: #86c795;
    --question-soft: #1e2f21;
    --paragraph: #6dd0cb;
    --paragraph-soft: #17302e;
    --kick: #e8c073;
    --kick-soft: #362a15;
    --focus: #6dd0cb;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -14px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--paragraph-soft); }

  a { color: inherit; }
  button {
    font-family: inherit;
    color: inherit;
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .app {
    height: 100vh;
    height: 100dvh; /* mobile browsers resize the vh unit as chrome shows/hides; dvh tracks the real visible area */
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }
  /* pinned explicitly so hiding .topbar in focus mode can't let grid
     auto-placement slide .layout into its (auto-sized) row */
  .topbar { grid-row: 1; }
  .layout { grid-row: 2; min-height: 0;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-shrink: 0;
  }
  .brand h1 {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 17px;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .brand .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1 1 220px;
    min-width: 60px;
  }

  .searchwrap { position: relative; flex: 1 1 240px; max-width: 360px; }
  .searchbox {
    width: 100%;
    padding: 6px 12px 6px 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
  }
  .searchbox::placeholder { color: var(--muted); }
  .searchicon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--muted);
    pointer-events: none;
  }
  .searchresults {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    max-height: 340px;
    overflow-y: auto;
    z-index: 30;
    display: none;
  }
  .searchresults.open { display: block; }
  .sr-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--ink);
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover, .sr-item:focus-visible { background: var(--surface-2); }
  .sr-topic {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
  }
  .sr-snippet { font-size: 13px; line-height: 1.35; }
  .sr-empty { padding: 12px; font-size: 13px; color: var(--muted); }
  mark {
    background: var(--kick-soft);
    color: var(--ink);
    border-radius: 2px;
    padding: 0 1px;
  }

  .topbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 12.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted); }
  .btn[aria-pressed="true"] {
    background: var(--question-soft);
    border-color: color-mix(in srgb, var(--question) 45%, transparent);
    color: var(--question);
  }
  .topbar-status {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr 6px var(--reading-w, 300px);
    min-height: 0;
  }
  /* pinned explicitly so hiding .grove in focus mode can't let grid
     auto-placement slide .canvas-wrap/.reading-resize/.reading into its
     column */
  .grove { grid-column: 1; }
  .canvas-wrap { grid-column: 2; }
  .reading-resize { grid-column: 3; }
  .reading { grid-column: 4; }
  .reading-resize {
    cursor: col-resize;
    touch-action: none;
    position: relative;
  }
  .reading-resize::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -3px;
    right: -3px;
  }
  .reading-resize::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 3px;
    height: 32px;
    transform: translate(-50%, -50%);
    border-radius: 2px;
    background: var(--line);
  }
  .reading-resize:hover, .reading-resize.dragging {
    background: color-mix(in srgb, var(--ink) 12%, transparent);
  }
  .reading-resize:hover::before, .reading-resize.dragging::before {
    background: var(--muted);
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 180px 1fr; }
    .reading-resize { display: none; }
    .reading { display: none; }
    .reading.open {
      display: block;
      position: fixed;
      inset: auto 0 0 0;
      max-height: 40vh;
      max-height: 40dvh;
      padding: 14px 16px;
      z-index: 40;
      border-top: 1px solid var(--line);
      border-left: none;
      box-shadow: var(--shadow);
    }
    .reading.open h3 { font-size: 14.5px; }
    .reading.open .full-text { font-size: 12.5px; }
    .reading.open .reading-crumb { font-size: 10px; }
    .reading.open .script-box { min-height: 120px; font-size: 12.5px; }
  }

  /* ---------- Focus mode: a button hides the top bar + grove rail ---------- */
  .app.focus-mode .topbar,
  .app.focus-mode .grove {
    display: none;
  }
  .app.focus-mode .layout {
    grid-template-columns: 0 1fr 6px var(--reading-w, 300px);
  }
  @media (max-width: 900px) {
    .app.focus-mode .layout { grid-template-columns: 0 1fr; }
  }
  .focus-toggle {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 6;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 11px;
    box-shadow: var(--shadow);
  }
  .focus-toggle .exit-label { display: none; }
  .app.focus-mode .focus-toggle .enter-label { display: none; }
  .app.focus-mode .focus-toggle .exit-label { display: inline; }

  /* ---------- Grove rail ---------- */
  .grove {
    border-right: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    padding: 16px 12px;
  }
  .grove h2 {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 6px 10px;
    font-weight: 600;
  }
  .grove-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .grove-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: none;
    text-align: left;
  }
  .grove-item:hover { background: var(--surface-2); }
  .grove-item.active {
    background: var(--topic-soft);
    border-color: color-mix(in srgb, var(--topic) 35%, transparent);
  }
  .grove-ring {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2.5px solid var(--topic);
    flex-shrink: 0;
    display: grid;
    place-items: center;
    position: relative;
  }
  .grove-ring::after {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--topic);
  }
  .grove-name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 14.5px;
    line-height: 1.15;
    color: var(--ink);
  }
  .grove-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--muted);
  }

  .legend {
    margin-top: 18px;
    padding: 12px 10px 4px;
    border-top: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* ---------- Canvas ---------- */
  .canvas-wrap {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20px 20px, color-mix(in srgb, var(--line-soft) 70%, transparent) 1px, transparent 1.4px) 0 0/28px 28px,
      var(--bg);
  }
  svg.tree { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.tree:active { cursor: grabbing; }

  .link {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.4px;
  }
  .link.q-link { stroke: color-mix(in srgb, var(--question) 45%, var(--line)); }
  .link.p-link { stroke: color-mix(in srgb, var(--paragraph) 45%, var(--line)); }
  .link.k-link { stroke: color-mix(in srgb, var(--kick) 45%, var(--line)); }

  .node { cursor: pointer; }
  .node .pill { stroke-width: 1.6px; }
  .node.topic .pill { fill: var(--topic-soft); stroke: var(--topic); }
  .node.question .pill { fill: var(--question-soft); stroke: var(--question); }
  .node.paragraph .pill { fill: var(--paragraph-soft); stroke: var(--paragraph); }
  .node.kick .pill { fill: var(--kick-soft); stroke: var(--kick); }

  .node text {
    font-family: "Work Sans", sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    fill: var(--ink);
    text-anchor: middle;
  }
  .node.topic text {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .node.paragraph text { font-size: 12px; }
  .node.kick text { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 11px; fill: var(--muted); }

  .node.current .pill { stroke-width: 3px; }
  .node.match .pill { stroke-width: 3px; filter: drop-shadow(0 0 4px var(--focus)); }

  .node .badge circle { fill: var(--surface); stroke: currentColor; stroke-width: 1.4px; }
  .node.topic .badge circle,
  .node.question .badge circle { color: var(--question); }
  .node.paragraph .badge circle { color: var(--paragraph); }
  .node .badge text {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9px;
    font-weight: 600;
    fill: var(--ink);
  }

  .zoom-controls {
    position: absolute;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  .zbtn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 15px;
    line-height: 1;
    box-shadow: var(--shadow);
  }

  .empty-canvas {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---------- Reading panel ---------- */
  .reading {
    border-left: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
    padding: 20px;
  }
  .reading-empty {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
    margin-top: 8px;
  }
  .reading-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px 3px 7px;
    border-radius: 999px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .reading-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip-topic { background: var(--topic-soft); color: var(--topic); }
  .chip-topic .dot { background: var(--topic); }
  .chip-question { background: var(--question-soft); color: var(--question); }
  .chip-question .dot { background: var(--question); }
  .chip-paragraph { background: var(--paragraph-soft); color: var(--paragraph); }
  .chip-paragraph .dot { background: var(--paragraph); }
  .chip-kick { background: var(--kick-soft); color: var(--kick); }
  .chip-kick .dot { background: var(--kick); }

  .reading-crumb {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    line-height: 1.5;
  }
  .reading h3 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.35;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .reading .full-text {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink);
  }
  .reading-kicks {
    margin-top: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .kick-chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--kick-soft);
    color: var(--kick);
    border: 1px solid color-mix(in srgb, var(--kick) 30%, transparent);
  }
  .kick-editor-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 16px;
    margin-bottom: 6px;
  }
  .kick-actions {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .kick-add, .kick-reset {
    border: none;
    background: none;
    padding: 2px 4px;
    color: var(--paragraph);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .kick-add:hover, .kick-reset:hover { text-decoration: underline; }
  .kick-chip-edit {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px 2px 2px 8px;
  }
  .kick-input {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    outline: none;
    padding: 2px 0;
    min-width: 24px;
  }
  .kick-del {
    border: none;
    background: none;
    color: inherit;
    opacity: 0.6;
    font-size: 13px;
    line-height: 1;
    padding: 2px 6px;
    cursor: pointer;
  }
  .kick-del:hover { opacity: 1; }
  .kick-empty {
    font-size: 12.5px;
    color: var(--muted);
    margin: 4px 0 0;
  }
  .all-kicks-head {
    margin-top: 16px;
    margin-bottom: 8px;
  }
  .all-kicks {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .all-kicks-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .all-kicks-cue {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--paragraph);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .btn-script {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--topic);
    color: var(--surface);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }
  .script-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--question);
    color: var(--surface);
    font-size: 13px;
    font-weight: 600;
    border: none;
  }
  .script-toggle:hover { opacity: 0.9; }

  .script-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 16px;
    margin-bottom: 6px;
  }
  .script-panel .script-head { margin-top: 10px; }
  .script-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .script-actions {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .script-reset, .script-download, .script-load {
    border: none;
    background: none;
    padding: 2px 4px;
    color: var(--paragraph);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .script-reset:hover, .script-download:hover, .script-load:hover { text-decoration: underline; }
  .script-file-input { display: none; }
  .script-status {
    display: block;
    min-height: 14px;
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
  }
  .script-box {
    width: 100%;
    min-height: 220px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-family: "Work Sans", sans-serif;
    font-size: 13.5px;
    line-height: 1.6;
    resize: vertical;
  }
  .btn-script:hover { opacity: 0.9; }

  .reading-close {
    display: none;
  }
  @media (max-width: 900px) {
    .reading-close {
      display: inline-flex;
      float: right;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 18px;
    }
  }

  @media (prefers-reduced-motion: no-preference) {
    .node, .link { transition: opacity 180ms ease; }
  }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <h1>OPIc Forest</h1>
      <span class="tag">mindmap</span>
    </div>
    <p class="hint">Click a question to branch into its script beats, click a beat for its kick phrases.</p>
    <div class="searchwrap">
      <svg class="searchicon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8.5" cy="8.5" r="6"/><line x1="13" y1="13" x2="18" y2="18"/></svg>
      <input class="searchbox" id="search" type="text" placeholder="Search every topic, question, beat, kick…" autocomplete="off" />
      <div class="searchresults" id="searchResults"></div>

out the most memorable movie that I have ever watched. It is \"Avengers Series\". I watched that movie about seven years ago, with my ex-girlfriend. You know it is a secret.\n\nAs you know, Robert Downey played Iron-man, and Chris Evans played Captain America, who are the leading roles in the film. the story is about fighting against villains, overcoming conflict between the heroes. The two strong personalities fought each other all time throughout the film, so it was frustrating to see the heroes having a hard time. But, at the end, the heroes finally understood each other, and they defeated evils by coming together. The scene brought the phrase to me, \"Unite we stand\"\n\nThe gorgeous AI in the film is also a killing point. The complete \"agentic AI\" exists everywhere in the film, which is still a far ideal to up-to-date AI technology. Frankly speaking, I think today's engineers have referred to this movie to develop modern AI technology. The film depicted the future so well from A to Z, showing the blueprint of future AI\n\nEva, Avengers:Doomsday will be released this December. I'm so excited to see Avengers series again!", "children": [{"id": "t0-q3-p0", "name": "intro", "type": "paragraph", "full": "(intro) the Avengers series, watched with my ex-girlfriend", "children": [{"id": "t0-q3-p0-k0", "name": "it is a secret", "type": "kick", "full": "it is a secret"}]}, {"id": "t0-q3-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) the heroes fell apart and came back together", "children": [{"id": "t0-q3-p1-k0", "name": "the leading roles", "type": "kick", "full": "the leading roles"}, {"id": "t0-q3-p1-k1", "name": "overcoming conflict", "type": "kick", "full": "overcoming conflict"}, {"id": "t0-q3-p1-k2", "name": "united we stand", "type": "kick", "full": "united we stand"}]}, {"id": "t0-q3-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the agentic AI as a killing point", "children": [{"id": "t0-q3-p2-k0", "name": "a killing point", "type": "kick", "full": "a killing point"}, {"id": "t0-q3-p2-k1", "name": "still a far ideal", "type": "kick", "full": "still a far ideal"}, {"id": "t0-q3-p2-k2", "name": "the blueprint of", "type": "kick", "full": "the blueprint of"}]}, {"id": "t0-q3-p3", "name": "closing", "type": "paragraph", "full": "(closing) waiting for Doomsday this December", "children": []}]}, {"id": "t0-q4", "name": "celebrity gossip", "tag": "1-5", "type": "question", "full": "Have you ever heard about any gossips about your favorte celebrities? If then what is it? Tell me all the things that you have heard in as detail as you can.", "script": "Oh, gossips about Robert? His life before Iron-man was so legendary. You can find tons of gossip about his drug-addicted life.\n\nAfter watching Iron-man, I wanted to know more about Robert so I searched him on google. It was quite a shock to hear that Robert had been addicted to drugs before he played Iron-man! It is the famous story that Robert wandered into a stranger's home thinking it was his own and fell asleep under the drug. He ended up in jail over this incident.\n\nIt is impressive to see how he quitted the drug. There is an interesting episode. One day, he had a bite of Burger, which was his favorite, but he couldn't taste anything because of the drug. The drug messed up everything of Robert, even the taste! He was shocked, so he decided to quit drugs. He trash all the drugs from the time, and did regular exercise, meditation, and yoga. That decision made today's Robert now.\n\nAs far as I know, celebrities are more vulnerable to drugs because they are lonely. I hope that anyone who struggles with drug addiction may overcome it and rebuild their life just like Robert did.", "children": [{"id": "t0-q4-p0", "name": "intro", "type": "paragraph", "full": "(intro) his legendary life before Iron Man", "children": [{"id": "t0-q4-p0-k0", "name": "so legendary", "type": "kick", "full": "so legendary"}, {"id": "t0-q4-p0-k1", "name": "tons of gossip", ond? I cannot imagine how labor-intensive it is! The labor did not end even in the era of Walt Disney, 1940's. Directors should draw thousands of hand-drawn pictures to make a single movie. But you know, nowadays, making computer graphics is a super-easy task with the aid of AI technology.\n\nThe method of watching movies also has been changed. When I was young, there is no way but to go to video rentals to watch movies at home. That was a point that the founder of Netflix though uncomfortable. Nowadays, OTT is very popular and I am also subscribing to a few platforms such as Netflix, amazon prime, apple tv and so on. However, it's a pity that we cannot pick out tapes at a video rental anymore, leaving it to our memory.\n\nOh, I said only the differences of the movies. You know, I feel like I'm having a time-travel with my sons. I feel like I'm going back to my youth when I'm looking at my sons happily watching Frog and Toad or pocket monster animations, which were my favorites. It is the most similar thing between the old movies and recent movies that they both bring happiness to my family.", "children": [{"id": "t0-q5-p0", "name": "intro", "type": "paragraph", "full": "(intro) watching old movies with my two little sons", "children": [{"id": "t0-q5-p0-k0", "name": "the changes of movies over time", "type": "kick", "full": "the changes of movies over time"}]}, {"id": "t0-q5-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) production, from clay animation to AI graphics", "children": [{"id": "t0-q5-p1-k0", "name": "stop-motion animation", "type": "kick", "full": "stop-motion animation"}, {"id": "t0-q5-p1-k1", "name": "so-called clay animation", "type": "kick", "full": "so-called clay animation"}, {"id": "t0-q5-p1-k2", "name": "how labor-intensive it is", "type": "kick", "full": "how labor-intensive it is"}]}, {"id": "t0-q5-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) watching, from video rentals to OTT", "children": [{"id": "t0-q5-p2-k0", "name": "there is no way but to", "type": "kick", "full": "there is no way but to"}, {"id": "t0-q5-p2-k1", "name": "it's a pity that", "type": "kick", "full": "it's a pity that"}, {"id": "t0-q5-p2-k2", "name": "leaving it to our memory", "type": "kick", "full": "leaving it to our memory"}]}, {"id": "t0-q5-p3", "name": "closing", "type": "paragraph", "full": "(closing) the same happiness, a time-travel with my sons", "children": [{"id": "t0-q5-p3-k0", "name": "having a time-travel", "type": "kick", "full": "having a time-travel"}, {"id": "t0-q5-p3-k1", "name": "going back to my youth", "type": "kick", "full": "going back to my youth"}]}]}, {"id": "t0-q6", "name": "favorite genre", "tag": "1-7", "type": "question", "full": "Please tell me about your favorite movie genre. Have there been any changes in your preference of movie genres over the years? If so, how has it changed? Please tell me everything in detail", "script": "Well, currently, I like animation movies a lot. Like I mentioned before, I usually go to a movie theater with my two little boys, so we tend to watch children's movies. You know, 'pocket monster' animation series were my most favorite when I was young, but now they are my sons' favorite! Pikachu was my favorite, but now my sons are crazy about it. I still feel like I'm living thirty years ago although time has passed a lot! Time traveling! I think this is the real charm of family animation genre.\n\nWhen I was teenager, I really enjoyed action movies as I aforementioned,  I did like Tony Stark in the \"Iron-man Series\". I felt a thrill whenever the justice of hammer smashed evils, blowing my stress away. Especially, Iron-man series were not only just action movies, but also some sci-fi themes were combined together, and that was the point I really like the action movies. But these days, I'd rather enjoy animation movies with my family, feel relaxed and laugh things off.\n\nThis is my change in my preference over the years. What about you eva? Which genre is your favorite?", "children": [{"id": "t0-q6-p0", "name": "intro", "type": "paragraph", "full": "(intro) animations now, and Pikachu passed down to my sons", "children": [{"id": "t0-q6-p0-k0", "name": "crazy about it", "type": "kick", "full": "crazy about it"}, {"id": "t0-q6-p0-k1", "name": "time traveling", "type": "kick", "full": "time traveling"}, {"id": "t0-q6-p0-k2", "name": "the real charm of", "type": "kick", "full": "the real charm of"}]}, {"id": "t0-q6-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) action movies when I was a teenager", "children": [{"id": "t0-q6-p1-k0", "name": "felt a thrill", "type": "kick", "full": "felt a thrill"}, {"id": "t0-q6-p1-k1", "name": "smashed evils", "type": "kick", "full": "smashed evils"}, {"id": "t0-q6-p1-k2", "name": "blowing my stress away", "type": "kick", "full": "blowing my stress away"}]}, {"id": "t0-q6-p2", "name": "closing", "type": "paragraph", "full": "(closing) how my preference changed over the years", "children": [{"id": "t0-q6-p2-k0", "name": "I'd rather", "type": "kick", "full": "I'd rather"}, {"id": "t0-q6-p2-k1", "name": "laugh things off", "type": "kick", "full": "laugh things off"}]}]}]}, {"id": "t1", "name": "Concert", "type": "topic", "full": "Concert", "scriptUrl": "https://docs.google.com/document/d/1BnG3r7CoET4cR8CaS4vyRPIR8--OiDZmJSprWvz1kOI/edit", "children": [{"id": "t1-q0", "name": "recent concert", "tag": "2-1", "type": "question", "full": "Please tell me about a recent concert that you've been to. Where was it and when did you go? And who did you go with? How was the concert?", "script": "Wow, I like this question because I have soooo many things to tell you. Okay, I will tell you about my experience.\n\nActually, it was about ten years ago. I heard that my favorite band, Coldplay, was coming to Korea for the Hyundai Card Super Concert. Since I was a premium cardholder at the time, I had a chance to get a VIP ticket! I didn't miss the chance, so finally I could get the seat right in front of the stage.\n\nThe concert was held at Jamsil Stadium in May. Though I had to wait in a long line - that was all worth it. Though I was alone, the performance was way better than I expected. The stage set was amazing. The lighting and visual effects were mind-blowing. I jumped and had a blast. I really had the time of my life, all of my stress was blown away. When the hit song \"Something just like this\" started playing over the speakers with famous choreography, everyone in the hall sang along and moved to the groove. Coldplay totally heated up the stage and the atmosphere was electric.\n\nEva, if you ever get the chance to go to Coldplay's concert, you should not miss it! I bet you love it.", "children": [{"id": "t1-q0-p0", "name": "intro", "type": "paragraph", "full": "(intro) soooo many things to tell about this one", "children": [{"id": "t1-q0-p0-k0", "name": "soooo many things to tell you", "type": "kick", "full": "soooo many things to tell you"}]}, {"id": "t1-q0-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) a premium cardholder, so a VIP ticket", "children": [{"id": "t1-q0-p1-k0", "name": "a premium cardholder", "type": "kick", "full": "a premium cardholder"}, {"id": "t1-q0-p1-k1", "name": "right in front of the stage", "type": "kick", "full": "right in front of the stage"}]}, {"id": "t1-q0-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the night at Jamsil Stadium", "children": [{"id": "t1-q0-p2-k0", "name": "mind-blowing", "type": "kick", "full": "mind-blowing"}, {"id": "t1-q0-p2-k1", "name": "the time of my life", "type": "kick", "full": "the time of my life"}, {"id": "t1-q0-p2-k2", "name": "the atmosphere was electric", "type": "kick", "full": "the atmosphere was electric"}]}, {"id": "t1-q0-p3", "name": "closing", "type": "paragraph", "full": "(closing) you should not miss it", "children": [{"id": "t1-q0-p3-k0", "name": "you should not miss it", "type": "kick", "full": "you should not miss it"}]}]}, {"id": "t1-q1", "name": "concert mishap", "tag": "2-2", "type": "question", "full": "Do you have any unpleasant memory when you were at the concert hall? If then, what was it? How did you solve that problem? Please tell me in detail", "script": "Oh, that just brought back some painful memories. The memory still makes me shudder.\n\nWell, it was about ten years ago, after the coldplay concert I mentioned a minute before. I fully enjoyed the concert and got on the bus to go back home. I was trying to pay for my fare, but .. oh my goodna2ess. I couldn't find my wallet! Even worse, I didn't have a single penny then.\n\nI scrambled off the bus, but kept my cool and quickly made a call to the credit card service center to deactivate my card. Oh thank god, no one had used my card! But it was a horrible moment for me. I've learned that it is dangerous to keep my wallet in my back pocket. from that incident, I always keep my wallet in my bag now, with a habit of double-checking!\n\nI still get shivers when I think about it. Eva, you should always check on your belongings whenever and wherever you are!", "children": [{"id": "t1-q1-p0", "name": "intro", "type": "paragraph", "full": "(intro) a painful memory that still makes me shudder", "children": [{"id": "t1-q1-p0-k0", "name": "brought back some painful memories", "type": "kick", "full": "brought back some painful memories"}, {"id": "t1-q1-p0-k1", "name": "makes me shudder", "type": "kick", "full": "makes me shudder"}]}, {"id": "t1-q1-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) losing my wallet on the bus home", "children": [{"id": "t1-q1-p1-k0", "name": "pay for my fare", "type": "kick", "full": "pay for my fare"}, {"id": "t1-q1-p1-k1", "name": "not a single penny", "type": "kick", "full": "not a single penny"}]}, {"id": "t1-q1-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) keeping my cool and calling the card center", "children": [{"id": "t1-q1-p2-k0", "name": "scrambled off the bus", "type": "kick", "full": "scrambled off the bus"}, {"id": "t1-q1-p2-k1", "name": "kept my cool", "type": "kick", "full": "kept my cool"}, {"id": "t1-q1-p2-k2", "name": "deactivate my card", "type": "kick", "full": "deactivate my card"}]}, {"id": "t1-q1-p3", "name": "closing", "type": "paragraph", "full": "(closing) always check on your belongings", "children": [{"id": "t1-q1-p3-k0", "name": "I still get shivers", "type": "kick", "full": "I still get shivers"}, {"id": "t1-q1-p3-k1", "name": "check on your belongings", "type": "kick", "full": "check on your belongings"}]}]}, {"id": "t1-q2", "name": "listening habits", "tag": "2-3", "type": "question", "full": "Do you have any special places or a specific time for listening to the music? When and Where do you usually listen to music? Also, do you use any special equipment for listening to music?", "script": "As a music-lover, I have my own routines for listening to music on and off the work. Let me tell you.\n\n(When/ Where) Actually, I have two playlists. One for my commute, and the other for my work. Well, I can't occasionally concentrate on my work while listening to pop-songs. Don't you Eva? So I tend to listen to my favorite pop-songs on my commute bus or when I'm off the work. During the work time, I rarely listen to pop-songs as I mentioned, rather I listen to classic or ASMR which helps me to boost up my concentration.\n\n(Equipment) When it comes to my equipment for listening to music, you know what? I just got a brand-new gadget recently. These are open-ear earphones, which look like earrings, unlike the common in-ear type. The great merit of the open-ear type is that we are free from the swimmer's ear even during the sweaty workouts! The famous brand is \"Shockz\" which advertises that its product can be even used during swimming.\n\nYeah, indeed it's a perfect gadget for heavy workouts. Eva, why don't you get one?", "children": [{"id": "t1-q2-p0", "name": "intro", "type": "paragraph", "full": "(intro) my own routines on and off the work", "children": [{"id": "t1-q2-p0-k0", "name": "as a music-lover", "type": "kick", "full": "as a music-lover"}, {"id": "t1-q2-p0-k1", "name": "on and off the work", "type": "kick", "full": "on and off the work"}]}, {"id": "t1-q2-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) two playlists, one for the commute and one for work", "children": [{"id": "t1-q2-p1-k0", "name": "two playlists", "type": "kick", "full": "two playlists"}, {"id": "t1-q2-p1-k1", "name": "boost up my concentration", "type": "kick", "full": "boost up my concentration"}]}, {"id": "t1-q2-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) open-ear earphones and the swimmer's ear", "children": [{"id": "t1-q2-p2-k0", "name": "open-ear earphones", "type": "kick", "full": "open-ear earphones"}, {"id": "t1-q2-p2-k1", "name": "look like earrings", "type": "kick", "full": "look like earrings"}, {"id": "t1-q2-p2-k2", "name": "free from the swimmer's ear", "type": "kick", "full": "free from the swimmer's ear"}]}, {"id": "t1-q2-p3", "name": "closing", "type": "paragraph", "full": "(closing) a perfect gadget, why don't you get one", "children": [{"id": "t1-q2-p3-k0", "name": "a perfect gadget for", "type": "kick", "full": "a perfect gadget for"}]}]}, {"id": "t1-q3", "name": "listening devices", "tag": "2-4", "type": "question", "full": "Tell me about the devices you use to listen to music. How are they different from the devices you have had in the past? Please tell me the differences in detail", "script": "Well, like many others do, I mostly listen to music on my smartphone app using wireless earphones. Development of technology surely changed the way we listen to music.\n\nI remember having my first CD player when I was an elementary school student. Back then, carrying a CD player and listening to music with wired earphones was the mark of a trendy student. Well, you must have seen the meme on the internet!  A few years later, the mark had been shifted to Apple's ipod as soon as it was unveiled, leaving the CD player in the old man's gadget. The true turning point was Apple's iPhone, which replaced all other music gadgets with its connectivity to the internet.\n\nYeah, the connectivity is one of the most different things that we used to have in the past. We had to download music records one-by-one to fill our playlist, which was quite a tedious job. However, nowadays we can search for music whenever we want via streaming platforms. Thanks to the AI, they recommend brand-new songs based on our preferences. All we need is a small subscription fee. I am totally satisfied with my current setup for listening to music.\n\nThat's it Eva!", "children": [{"id": "t1-q3-p0", "name": "intro", "type": "paragraph", "full": "(intro) smartphone and wireless earphones, like everyone else", "children": [{"id": "t1-q3-p0-k0", "name": "like many others do", "type": "kick", "full": "like many others do"}]}, {"id": "t1-q3-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) from the CD player to the iPod to the iPhone", "children": [{"id": "t1-q3-p1-k0", "name": "the mark of a trendy student", "type": "kick", "full": "the mark of a trendy student"}, {"id": "t1-q3-p1-k1", "name": "the old man's gadget", "type": "kick", "full": "the old man's gadget"}, {"id": "t1-q3-p1-k2", "name": "the true turning point", "type": "kick", "full": "the true turning point"}]}, {"id": "t1-q3-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) connectivity is what really changed", "children": [{"id": "t1-q3-p2-k0", "name": "one-by-one", "type": "kick", "full": "one-by-one"}, {"id": "t1-q3-p2-k1", "name": "quite a tedious job", "type": "kick", "full": "quite a tedious job"}, {"id": "t1-q3-p2-k2", "name": "a small subscription fee", "type": "kick", "full": "a small subscription fee"}]}, {"id": "t1-q3-p3", "name": "closing", "type": "paragraph", "full": "(closing) totally satisfied with my current setup", "children": []}]}, {"id": "t1-q4", "name": "favorite singers", "tag": "2-5", "type": "question", "full": "Who was your favorite singer when you were young and who is your favorite singer these days? Please tell me about some of your favorites the past and today", "script": "All right, A few names just popped up in my head that I'd like to talk about. When I was a student, I preferred ballads to upbeat music such as rock or dance. I really liked a Korean singer-sonag-writer \"IU\", who had pure and emotional voice. I listened to her song again and again, and even I signed-up her fan club, named \"U and I\". My fan-club activity was ended up with my marriage though :P . Until that time, I didn't understand why people like boys or girl groups singing upbeat music. Those kinds of music are quite noisy for me.\n\nHowever, my conviction totally crashed when I first saw the performance of BTS's. BTS was different. Their choreography was powerful and energrtic and their beat was catchy. It was very interesting how their songs caught my ears and stuck in my head. You know what? BTS had a mid-time concert in the latest world cup final. My favorite song \"Dynamite\" echoed over the stadium, and  I was very proud to see how people all over the world were humming the Korean song. Yeah, they are my favorite band now for sure.\n\nEva, are you in the fan Club of BTS, ARMY? If so, why don't we go to the concert together?", "children": [{"id": "t1-q4-p0", "name": "intro", "type": "paragraph", "full": "(intro) a few names just popped up in my head", "children": [{"id": "t1-q4-p0-k0", "name": "popped up in my head", "type": "kick", "full": "popped up in my head"}]}, {"id": "t1-q4-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) ballads and IU in my student days", "children": [{"id": "t1-q4-p1-k0", "name": "preferred ballads to upbeat music", "type": "kick", "full": "preferred ballads to upbeat music"}, {"id": "t1-q4-p1-k1", "name": "pure and emotional voice", "type": "kick", "full": "pure and emotional voice"}, {"id": "t1-q4-p1-k2", "name": "ended up with my marriage", "type": "kick", "full": "ended up with my marriage"}]}, {"id": "t1-q4-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) BTS crashed my conviction", "children": [{"id": "t1-q4-p2-k0", "name": "my conviction totally crashed", "type": "kick", "full": "my conviction totally crashed"}, {"id": "t1-q4-p2-k1", "name": "their beat was catchy", "type": "kick", "full": "their beat was catchy"}, {"id": "t1-q4-p2-k2", "name": "stuck in my head", "type": "kick", "full": "stuck in my head"}]}, {"id": "t1-q4-p3", "name": "closing", "type": "paragraph", "full": "(closing) are you in ARMY, shall we go together", "children": [{"id": "t1-q4-p3-k0", "name": "humming the Korean song", "type": "kick", "full": "humming the Korean song"}]}]}]}, {"id": "t2", "name": "Household", "type": "topic", "full": "Household", "scriptUrl": "https://docs.google.com/document/d/19B4yCg203uv4W8XwnEmmOePxiSwpeQE45BRqak_7d1I/edit", "children": [{"id": "t2-q0", "name": "household chores", "tag": "3-1", "type": "question", "full": "Tell me about your responsibilities in your house. What kinds of housework do you usually do? Tell me about them in detail", "script": "Let me think.. I live with my family and a housekeeper, so most of the household chores are cleaned-up by the housekeeper though,  there are some chores left that our families have to share.\n\nWhat I do most is washing dishes after each meal. Frankly speaking, the dish washer does it, not me. My wife always says that it is better to wash the dishes by hand, not by the machine. Well, I think I'm on the opposite side to my wife. I believe that the dishwasher is one of the best inventings that mankind has ever made. Open the door, put the dishes and detergents into the dishwasher, and press the start button! It really reduces the time to finish the dishwashing, liberating me from this tedious labor.\n\nAnother house chore on me is laundry. Our family is four, so a tremendous amount of laundry comes out every day. It may be harmful to our health if we wash the clothes and hang up the laundry every day. Well, I always have my plan. Eva, do you know that the brand-new laundry machine provides a full course from washing to drying? There is no need to pull out the washed clothes to dry! Just put a bunch of clothes to the machine, and put detergent and fabric softeners, and finally press the start button! It's easy huh?\n\nEva, my credo is to fully utilize the modern conveniences. Why don't you check out Samsung store this weekend?", "children": [{"id": "t2-q0-p0", "name": "intro", "type": "paragraph", "full": "(intro) a housekeeper handles most, some chores left to share", "children": [{"id": "t2-q0-p0-k0", "name": "left to share", "type": "kick", "full": "left to share"}]}, {"id": "t2-q0-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) dishwashing, and the dishwasher does it, not me", "children": [{"id": "t2-q0-p1-k0", "name": "frankly speaking", "type": "kick", "full": "frankly speaking"}, {"id": "t2-q0-p1-k1", "name": "the dish washer does it not me", "type": "kick", "full": "the dish washer does it not me"}, {"id": "t2-q0-p1-k2", "name": "liberating me from this tedious labor", "type": "kick", "full": "liberating me from this tedious labor"}]}, {"id": "t2-q0-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) laundry, and the full course machine", "children": [{"id": "t2-q0-p2-k0", "name": "a tremendous amount of", "type": "kick", "full": "a tremendous amount of"}, {"id": "t2-q0-p2-k1", "name": "harmful to our health", "type": "kick", "full": "harmful to our health"}, {"id": "t2-q0-p2-k2", "name": "a full course from washing to drying", "type": "kick", "full": "a full course from washing to drying"}]}, {"id": "t2-q0-p3", "name": "closing", "type": "paragraph", "full": "(closing) my credo, check out Samsung store", "children": [{"id": "t2-q0-p3-k0", "name": "my credo", "type": "kick", "full": "my credo"}, {"id": "t2-q0-p3-k1", "name": "fully utilize the modern conveniences", "type": "kick", "full": "fully utilize the modern conveniences"}]}]}, {"id": "t2-q1", "name": "chores growing up", "tag": "3-2", "type": "question", "full": "Tell me about your housework from the past. What did your parents expect you to do when you were young? How was your housework changed over the years?", "script": "The changes in my house chores over the years? Let me think. My parents didn't expect me to do much when I was young. Well, now, I got married and I have my two sons, things are bit changed from the past.\n\nWhen I was young, I didn't have to do anything special at home. The only thing I had to do was just clean up after myself and rearrange my toys after playing with them. Oh, and I also had to put my dishes into the sink after finishing my meal. I think my parents put more emphasis on doing my homework rather than doing household skills.\n\nNow, I am a husband of my wife and father of my children. I feel sorry for my family because I'm always late on weekdays. That leads me to prepare breakfast for my family on Sunday morning. I know my sons' preferences well; they love fried eggs with ketchup on top. After breakfast, I always volunteer for dishwashing because with my dishwasher, there is nothing to fear.\n\nThis is how my household responsibilities have changed over the years. Eva, what about you?", "children": [{"id": "t2-q1-p0", "name": "intro", "type": "paragraph", "full": "(intro) how things changed after marriage", "children": [{"id": "t2-q1-p0-k0", "name": "things are a bit changed", "type": "kick", "full": "things are a bit changed"}]}, {"id": "t2-q1-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) past, clean up after myself and homework first", "children": [{"id": "t2-q1-p1-k0", "name": "clean up after myself", "type": "kick", "full": "clean up after myself"}, {"id": "t2-q1-p1-k1", "name": "put more emphasis on", "type": "kick", "full": "put more emphasis on"}]}, {"id": "t2-q1-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) present, Sunday breakfast and volunteering for dishes", "children": [{"id": "t2-q1-p2-k0", "name": "feel sorry for", "type": "kick", "full": "feel sorry for"}, {"id": "t2-q1-p2-k1", "name": "ketchup on top", "type": "kick", "full": "ketchup on top"}, {"id": "t2-q1-p2-k2", "name": "there is nothing to fear", "type": "kick", "full": "there is nothing to fear"}]}, {"id": "t2-q1-p3", "name": "closing", "type": "paragraph", "full": "(closing) this is how my responsibilities changed", "children": []}]}, {"id": "t2-q2", "name": "chores gone wrong", "tag": "3-3", "type": "question", "full": "Did you ever get in trouble for not fulfilling your household responsibilities as a child? When did it happen? What were you supposed to do? Please tell me about what happened and how it turned out in the end", "script": "Sure, sure, I have had that kind of experience before and I remember it as it it were yesterday. My older brother and I were playing with toys one day, and we were told to clean up after ourselves. But after a while, it totally slipped our mind and we got distracted by cartoons on TV. When our mom came and found us watching TV while our toys were still lying around the living room, she hit the ceiling. We were scolded, and we couldn't have any sweets as a dessert that night, sadly.\n\nFrom that incident on, my brother and I cleaned after ourselves whenever we finished playing. Those habits have stuck with us ever since. Well, now I'm scolding my children for not cleaning after themselves, but they occasionally ignore my words and leave the toys lying around the living room. Well, perhaps my words totally slipped their minds just like I used to!\n\nThat's it eva!", "children": [{"id": "t2-q2-p0", "name": "intro", "type": "paragraph", "full": "(intro) I remember it as if it were yesterday", "children": [{"id": "t2-q2-p0-k0", "name": "as if it were yesterday", "type": "kick", "full": "as if it were yesterday"}, {"id": "t2-q2-p0-k1", "name": "totally slipped our mind", "type": "kick", "full": "totally slipped our mind"}, {"id": "t2-q2-p0-k2", "name": "hit the ceiling", "type": "kick", "full": "hit the ceiling"}]}, {"id": "t2-q2-p1", "name": "body", "type": "paragraph", "full": "(body) the habit stuck, and now my kids do the same", "children": [{"id": "t2-q2-p1-k0", "name": "stuck with us ever since", "type": "kick", "full": "stuck with us ever since"}, {"id": "t2-q2-p1-k1", "name": "slipped their minds", "type": "kick", "full": "slipped their minds"}, {"id": "t2-q2-p1-k2", "name": "just like I used to", "type": "kick", "full": "just like I used to"}]}, {"id": "t2-q2-p2", "name": "closing", "type": "paragraph", "full": "(closing) that's it", "children": []}]}, {"id": "t2-q3", "name": "homes then vs. now", "tag": "3-4", "type": "question", "full": "I would like to now talk about where you live. How has the style of homes changed over the past 5 years at where you live? Are the homes being built today different from the homes built 10 years ago? What developments or changes have you noticed?", "script": "Ok, now my family is living in a brand-new apartment in Seoul built a year ago, but in the past, I lived with my parents on the outskirts of Seoul. Let me tell you the differences between them.\n\nWhen I was young, as I said right before, I lived in a freestanding house with my parents in the suburbs. We had a spacious backyard and our family took full advantage of this area for a barbeque party. You know, my mother loves gardening, so red roses were all blooming surrounding the garden in summer time. Yeah, I was also joyful to catch bugs in the yard like ants, dragon flies, praying mantis, with full of memories that I cherish.\n\nAfter I got married, my wife and I moved to Seoul and now I'm living in a brand-new apartment built a year ago. Though I lost my garden, the facilities in the apartment are super. We have a huge community center where we can freely use the swimming pool, restaurants and cafe. You know what, the whole apartment is connected to the internet! I really enjoy using all the smart home features. I can check the video feed from my front door camera, locate my car in the parking lot, and even call the elevator at home! I'm very satisfied with the IOT features, so I won't return back to the freestanding house even though I don't have my backyard.\n\nEva, didn't you say that you live in an apartment? How do you like you house?", "children": [{"id": "t2-q3-p0", "name": "intro", "type": "paragraph", "full": "(intro) a brand-new apartment now, the outskirts back then", "children": [{"id": "t2-q3-p0-k0", "name": "on the outskirts of Seoul", "type": "kick", "full": "on the outskirts of Seoul"}]}, {"id": "t2-q3-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) the freestanding house with a spacious backyard", "children": [{"id": "t2-q3-p1-k0", "name": "a freestanding house", "type": "kick", "full": "a freestanding house"}, {"id": "t2-q3-p1-k1", "name": "took full advantage of", "type": "kick", "full": "took full advantage of"}, {"id": "t2-q3-p1-k2", "name": "with full of memories that I cherish", "type": "kick", "full": "with full of memories that I cherish"}]}, {"id": "t2-q3-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the apartment, the community center and the IOT features", "children": [{"id": "t2-q3-p2-k0", "name": "the video feed from my front door camera", "type": "kick", "full": "the video feed from my front door camera"}, {"id": "t2-q3-p2-k1", "name": "locate my car in the parking lot", "type": "kick", "full": "locate my car in the parking lot"}, {"id": "t2-q3-p2-k2", "name": "the IOT features", "type": "kick", "full": "the IOT features"}]}, {"id": "t2-q3-p3", "name": "closing", "type": "paragraph", "full": "(closing) how do you like your house", "children": []}]}, {"id": "t2-q4", "name": "housing problems", "tag": "3-5", "type": "question", "full": "What are some major problems people have when they rent a home or an apartment? How do people deal with these issues? How do these things affect how or where people live?", "script": "The biggest problem that people face is probably regarding rent prices, especially if you work and live in a big city like Seoul. Although there are many apartments and houses, people complain that they don't have a place to live because of the hiking prices. Simply put, over 10% of the entire population live in Seoul and there aren't enough houses to fit all of them. To make matters worse, bank interest is soaring these days because of Iran War. So tenants tend to choose to live on the outskirts of Seoul because they can no longer afford the high mortgage interest. To solve this problem, the government is constructing more and more satellite cities outside of Seoul, hoping it would scatter the population but it hasn't been so successful so far. The government also tries to replace the Yongsan Family Park with apartments to provide houses in Seoul, but many people are against the policy right now in that it may violate Seoul citizen's right to health. Honestly, I don't really know how we can solve this sort of problem. The government failed to stabilize the rent prices every now and then, so many people have no expectations any more. Building more houses is the only way to lower rental prices, well, they don't just pop out of an oven like bread ! Yeah, it's a really difficult problem to solve.", "children": [{"id": "t2-q4-p0", "name": "intro", "type": "paragraph", "full": "(intro) hiking rent prices in a big city like Seoul", "children": [{"id": "t2-q4-p0-k0", "name": "hiking prices", "type": "kick", "full": "hiking prices"}, {"id": "t2-q4-p0-k1", "name": "simply put", "type": "kick", "full": "simply put"}, {"id": "t2-q4-p0-k2", "name": "to make matters worse", "type": "kick", "full": "to make matters worse"}]}, {"id": "t2-q4-p1", "name": "body", "type": "paragraph", "full": "(body) satellite cities and the Yongsan park controversy", "children": [{"id": "t2-q4-p1-k0", "name": "scatter the population", "type": "kick", "full": "scatter the population"}, {"id": "t2-q4-p1-k1", "name": "are against", "type": "kick", "full": "are against"}, {"id": "t2-q4-p1-k2", "name": "violate the right to health", "type": "kick", "full": "violate the right to health"}]}, {"id": "t2-q4-p2", "name": "closing", "type": "paragraph", "full": "(closing) houses don't pop out of an oven like bread", "children": [{"id": "t2-q4-p2-k0", "name": "failed to stabilize", "type": "kick", "full": "failed to stabilize"}, {"id": "t2-q4-p2-k1", "name": "pop out of an oven like bread", "type": "kick", "full": "pop out of an oven like bread"}]}]}, {"id": "t2-q5", "name": "favorite furniture", "tag": "3-6", "type": "question", "full": "Tell me about your favorite piece of furniture. Why do you like that piece of furniture the most?", "script": "You know what, I recently moved to my new house and I spent a lot of my fortune on many pieces of furniture. Let me tell you two among them\n\nThe first thing is my couch. Actually, I'm such a couch potato because you know, I feel exhausted every day because of my hard work. So my couch is essential to recharge my battery. I just got a new spacious black couch because the old one was too small for me to become a couch potato!. It is a real happiness to binge-watch TV lying on my new couch!\n\nThe next one is my family bed. It is really worth every penny. You know what, my two sons often wake up at midnight and climb up the bed and lie down between my wife and me. It's so uncomfortable. They kick my body every second! Well, It is common for me to stay up all night. So my wife and I decided to get a spacious family bed of which the size is a double king. I hope to have a peaceful midnight from now on.\n\nEva, are you a homebody? Which furniture do you like most?", "children": [{"id": "t2-q5-p0", "name": "intro", "type": "paragraph", "full": "(intro) spent my fortune on new furniture", "children": [{"id": "t2-q5-p0-k0", "name": "spent a lot of my fortune", "type": "kick", "full": "spent a lot of my fortune"}]}, {"id": "t2-q5-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) the couch, because I am such a couch potato", "children": [{"id": "t2-q5-p1-k0", "name": "such a couch potato", "type": "kick", "full": "such a couch potato"}, {"id": "t2-q5-p1-k1", "name": "recharge my battery", "type": "kick", "full": "recharge my battery"}, {"id": "t2-q5-p1-k2", "name": "binge-watch TV", "type": "kick", "full": "binge-watch TV"}]}, {"id": "t2-q5-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the family bed, worth every penny", "children": [{"id": "t2-q5-p2-k0", "name": "worth every penny", "type": "kick", "full": "worth every penny"}, {"id": "t2-q5-p2-k1", "name": "kick my body every second", "type": "kick", "full": "kick my body every second"}, {"id": "t2-q5-p2-k2", "name": "stay up all night", "type": "kick", "full": "stay up all night"}]}, {"id": "t2-q5-p3", "name": "closing", "type": "paragraph", "full": "(closing) are you a homebody", "children": [{"id": "t2-q5-p3-k0", "name": "are you a homebody?", "type": "kick", "full": "are you a homebody?"}]}]}, {"id": "t2-q6", "name": "newest furniture", "tag": "3-7", "type": "question", "full": "Tell me about the newest piece of furniture in your room. Compared to the past, what furniture is in your room, and how are they different?", "script": "Actually, my room had a complete make-over when my house was renovated last month. Let me tell you about a few pieces in detail.\n\nOkay, I'd say the closet has gone through the most transformation of all. I used to have a normal wooden closet before. But it was taking up too much space and I asked for a built-in closet to create more room. After getting rid of my old closet, my room appears to be so much more spacious and open with my new white closet.\n\nAs I told you earlier, my brand-new bed has been a positive change. The size same as a double king gives me a comfortable and spacious feeling. I have carefully chosen the wooden frame so it matches the style of other furniture. The height of the bed is low enough for my kids not to get hurt even if they fall down.\n\nYes, my new closet and bed really influences the entire atmosphere of the space because they are the largest piece of furniture. Overall, I love my bright new room so much, I just wanna stay home all day!", "children": [{"id": "t2-q6-p0", "name": "intro", "type": "paragraph", "full": "(intro) a complete make-over after last month's renovation", "children": [{"id": "t2-q6-p0-k0", "name": "a complete make-over", "type": "kick", "full": "a complete make-over"}]}, {"id": "t2-q6-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) the closet, from a wooden one to a built-in", "children": [{"id": "t2-q6-p1-k0", "name": "gone through the most transformation", "type": "kick", "full": "gone through the most transformation"}, {"id": "t2-q6-p1-k1", "name": "taking up too much space", "type": "kick", "full": "taking up too much space"}, {"id": "t2-q6-p1-k2", "name": "create more room", "type": "kick", "full": "create more room"}]}, {"id": "t2-q6-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the bed, a matching frame and a safe height", "children": [{"id": "t2-q6-p2-k0", "name": "matches the style of other furniture", "type": "kick", "full": "matches the style of other furniture"}, {"id": "t2-q6-p2-k1", "name": "low enough for", "type": "kick", "full": "low enough for"}, {"id": "t2-q6-p2-k2", "name": "even if they fall down", "type": "kick", "full": "even if they fall down"}]}, {"id": "t2-q6-p3", "name": "closing", "type": "paragraph", "full": "(closing) they change the entire atmosphere of the room", "children": [{"id": "t2-q6-p3-k0", "name": "influences the entire atmosphere", "type": "kick", "full": "influences the entire atmosphere"}, {"id": "t2-q6-p3-k1", "name": "stay home all day", "type": "kick", "full": "stay home all day"}]}]}, {"id": "t2-q7", "name": "family memory", "tag": "3-8", "type": "question", "full": "Do you have any memorable experiences with your family? If so, what was it? Please tell me everything from the beginning to the end in detail", "script": "Oh Sure. My family has a special tradition of celebrating at the end of every year. You know what?  My first son's birthday is exactly December 31st! So we tend to hold an intimate party at home, celebrating the birthday, end of year, and Christmas all at once!\n\nOn the day before his birthday, my wife and I did our own part. My wife carefully chose a birthday cake for the party, keep replaying his appetite. She made sure to get a chocolate cake with some dinosaur or robot figures on top! Absolutely no vanilla! In the mean time, I went out to \"Toys Kingdom\" to get my son's favorite toy. His favorite is a transforming robot, which can switch from a dinosaur into a robot. My wife and I communicated with each other in real time to share our whereabouts. After finishing shopping, our family gathered all together at home. I lit up the candles on the cake, we all sang for my first son. He really enjoyed the moment blowing out the candle. When I gave him the gift I prepared, his face lit up and he clapped like a `seal.\n\nThrowing a party is always good fun, don't you think eva?", "children": [{"id": "t2-q7-p0", "name": "intro", "type": "paragraph", "full": "(intro) a special tradition at the end of every year", "children": [{"id": "t2-q7-p0-k0", "name": "a special tradition", "type": "kick", "full": "a special tradition"}, {"id": "t2-q7-p0-k1", "name": "an intimate party", "type": "kick", "full": "an intimate party"}, {"id": "t2-q7-p0-k2", "name": "all at once", "type": "kick", "full": "all at once"}]}, {"id": "t2-q7-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) my wife and I each did our own part", "children": [{"id": "t2-q7-p1-k0", "name": "did our own part", "type": "kick", "full": "did our own part"}, {"id": "t2-q7-p1-k1", "name": "absolutely no vanilla", "type": "kick", "full": "absolutely no vanilla"}, {"id": "t2-q7-p1-k2", "name": "in real time", "type": "kick", "full": "in real time"}]}, {"id": "t2-q7-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the candles, and his face lighting up", "children": [{"id": "t2-q7-p2-k0", "name": "blowing out the candle", "type": "kick", "full": "blowing out the candle"}, {"id": "t2-q7-p2-k1", "name": "his face lit up", "type": "kick", "full": "his face lit up"}, {"id": "t2-q7-p2-k2", "name": "clapped like a seal", "type": "kick", "full": "clapped like a seal"}]}, {"id": "t2-q7-p3", "name": "closing", "type": "paragraph", "full": "(closing) throwing a party is always good fun", "children": [{"id": "t2-q7-p3-k0", "name": "always good fun", "type": "kick", "full": "always good fun"}]}]}]}, {"id": "t3", "name": "Trip", "type": "topic", "full": "Trip", "scriptUrl": "https://docs.google.com/document/d/1V_8saPLmYYukbMmN6q1JK32SYemw-O_dKyIaxaKTJyg/edit", "children": [{"id": "t3-q0", "name": "travel interests", "tag": "4-1", "type": "question", "full": "When people think about traveling to other countries, what do you think are some of the things they are most interested in? Why do you think these things are of such interest to travelers?", "script": "I think everyone has their own interests and priorities when they travel overseas. But I think those can be narrowed down to food and drink.\n\nLet's imagine that we go overseas. The first thing we should do now is to find and save famous local restaurants. I believe the dining culture tells us much about how people are living there. I still remember that I went to New Zealand fifteen years ago. Well, I was a foodie in a hoodie, visiting famous local restaurants in every town. Eva, have you ever tried a lamb burger? I realized the reason why the lamb burger was famous there, after seeing so many lambs grazing throughout the countryside.\n\nOn the other hand, it is interesting to visit supermarkets, and I know that many people visit there intentionally to feel the local atmosphere. You know, it is interesting to look around what local people usually eat and drink ! You know what? It was quite a surprise to me that beef was actually cheaper than salads in New Zealand. But I could understand that when I heard that the cows outnumber the population of people there. Yeah, so I grabbed a steak in my left hand, and some local beer in my right hand, without any hesitation. Those made the perfect dinner that night.\n\nThat's it Eva!", "children": [{"id": "t3-q0-p0", "name": "intro", "type": "paragraph", "full": "(intro) it all narrows down to food and drink", "children": [{"id": "t3-q0-p0-k0", "name": "interests and priorities", "type": "kick", "full": "interests and priorities"}, {"id": "t3-q0-p0-k1", "name": "be narrowed down to", "type": "kick", "full": "be narrowed down to"}]}, {"id": "t3-q0-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) local restaurants and the lamb burger in New Zealand", "children": [{"id": "t3-q0-p1-k0", "name": "the dining culture tells us", "type": "kick", "full": "the dining culture tells us"}, {"id": "t3-q0-p1-k1", "name": "a foodie in a hoodie", "type": "kick", "full": "a foodie in a hoodie"}, {"id": "t3-q0-p1-k2", "name": "grazing throughout the countryside", "type": "kick", "full": "grazing throughout the countryside"}]}, {"id": "t3-q0-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) supermarkets, to feel the local atmosphere", "children": [{"id": "t3-q0-p2-k0", "name": "feel the local atmosphere", "type": "kick", "full": "feel the local atmosphere"}, {"id": "t3-q0-p2-k1", "name": "outnumber the population", "type": "kick", "full": "outnumber the population"}, {"id": "t3-q0-p2-k2", "name": "without any hesitation", "type": "kick", "full": "without any hesitation"}]}, {"id": "t3-q0-p3", "name": "closing", "type": "paragraph", "full": "(closing) that's it", "children": []}]}, {"id": "t3-q1", "name": "why vacation", "tag": "4-2", "type": "question", "full": "Why do you think people need a vacation? What is the purpose of vacations to you? How do people usually spend their vacation? What about you? Are there any specific ways you prefer to spend vacation well?", "script": "Well, I think the purpose of a vacation falls into two categories although everyone has different ways of spending their vacation. They are resting and sightseeing. I have experienced both types, and now I have my preference.\n\nWell, my first overseas trip was Italia. You know, there are a number of monuments and heritages in a single city, Rome, so I had a lot of things to look around. But, as I spend the time in Rome, I started to get tired and tired and even I thought I wanted to go back to Korea. I think that unpleasant memory has changed my attitude towards a vacation.\n\nYes, I'd rather stay home and take a rest alone when I have spare time these days. Maybe it is due to my hard work routine. Our body and mind need time to reset, especially when we are overworked. Well, I believe intermittent vacations do prevent our burn-out. That's why  I really prefer this kind of vacation to roaming around for sightseeing. What I like most for my vacation is to stay cooped in my hotel room and do nothing. It really blows my stress away and makes me feel rehabilitated and refreshed.Well, Ilove to be a hotelbody, than a homebody.\n\nThat's it Eva.", "children": [{"id": "t3-q1-p0", "name": "intro", "type": "paragraph", "full": "(intro) vacations fall into two categories", "children": [{"id": "t3-q1-p0-k0", "name": "falls into two categories", "type": "kick", "full": "falls into two categories"}, {"id": "t3-q1-p0-k1", "name": "resting and sightseeing", "type": "kick", "full": "resting and sightseeing"}]}, {"id": "t3-q1-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) Rome, too many monuments, and I got tired and tired", "children": [{"id": "t3-q1-p1-k0", "name": "monuments and heritages", "type": "kick", "full": "monuments and heritages"}, {"id": "t3-q1-p1-k1", "name": "get tired and tired", "type": "kick", "full": "get tired and tired"}, {"id": "t3-q1-p1-k2", "name": "changed my attitude towards", "type": "kick", "full": "changed my attitude towards"}]}, {"id": "t3-q1-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) now I stay cooped in my hotel room and do nothing", "children": [{"id": "t3-q1-p2-k0", "name": "intermittent vacations", "type": "kick", "full": "intermittent vacations"}, {"id": "t3-q1-p2-k1", "name": "stay cooped in", "type": "kick", "full": "stay cooped in"}, {"id": "t3-q1-p2-k2", "name": "a hotelbody than a homebody", "type": "kick", "full": "a hotelbody than a homebody"}]}, {"id": "t3-q1-p3", "name": "closing", "type": "paragraph", "full": "(closing) that's it", "children": []}]}, {"id": "t3-q2", "name": "memorable beach", "tag": "4-3", "type": "question", "full": "Please tell me about the most memorable beach that you have ever been to. When did you go? And with whom did you go? What kind of activities?", "script": "When it comes to white sandy beach and clear blue water, Jeju island comes first.\n\nYou know, Jeju island is so called \"Hawaii of Korea\" because of its emerald and crystal-clear water with palm trees along the beach. My family went there for the summer vacation.\n\nRight after we arrived at the beach, we ran into the water and splashed water on each other. My son really enjoyed it with lots of laughter and fun. On the first night, we hit the bars near the beach and celebrated our summer break. Also, it was my second son's birthday, so my wife surprised him with a birthday cake topped with a dinosaur toy. His face lit up and he clapped like a seal. That moment we spent at the beach was so precious and unforgettable.\n\nOn the second day, we went snorkeling and appreciated the beautiful marine life. We were surprised to see people enjoying snorkeling with turtles! That was our first time seeing wild turtles on the beach. Our family also tried snorkeling for the first time there, and we really enjoyed our moment. It was really beautiful and we were amazed to see a new underwater world. You know what? We saw a clown fish like Nemo hiding in a coral!  We really had the time of our lives with schools of fish and lots of beautiful coral. It was really like a dream that I didn't want to wake from.\n\nEva, we truely spent quality time last summer at the beach. I still cherish that moment.", "children": [{"id": "t3-q2-p0", "name": "intro", "type": "paragraph", "full": "(intro) Jeju comes first for white sand and clear water", "children": [{"id": "t3-q2-p0-k0", "name": "when it comes to", "type": "kick", "full": "when it comes to"}, {"id": "t3-q2-p0-k1", "name": "comes first", "type": "kick", "full": "comes first"}]}, {"id": "t3-q2-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) the Hawaii of Korea", "children": [{"id": "t3-q2-p1-k0", "name": "so called Hawaii of Korea", "type": "kick", "full": "so called Hawaii of Korea"}, {"id": "t3-q2-p1-k1", "name": "crystal-clear water", "type": "kick", "full": "crystal-clear water"}]}, {"id": "t3-q2-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) day one, splashing water and a surprise birthday cake", "children": [{"id": "t3-q2-p2-k0", "name": "splashed water on each other", "type": "kick", "full": "splashed water on each other"}, {"id": "t3-q2-p2-k1", "name": "hit the bars", "type": "kick", "full": "hit the bars"}, {"id": "t3-q2-p2-k2", "name": "clapped like a seal", "type": "kick", "full": "clapped like a seal"}]}, {"id": "t3-q2-p3", "name": "body 3", "type": "paragraph", "full": "(body 3) day two, snorkeling with turtles and a clown fish", "children": [{"id": "t3-q2-p3-k0", "name": "the time of our lives", "type": "kick", "full": "the time of our lives"}, {"id": "t3-q2-p3-k1", "name": "schools of fish", "type": "kick", "full": "schools of fish"}, {"id": "t3-q2-p3-k2", "name": "a dream I didn't want to wake from", "type": "kick", "full": "a dream I didn't want to wake from"}]}, {"id": "t3-q2-p4", "name": "closing", "type": "paragraph", "full": "(closing) quality time that I still cherish", "children": [{"id": "t3-q2-p4-k0", "name": "spent quality time", "type": "kick", "full": "spent quality time"}, {"id": "t3-q2-p4-k1", "name": "still cherish that moment", "type": "kick", "full": "still cherish that moment"}]}]}, {"id": "t3-q3", "name": "staycation", "tag": "4-4", "type": "question", "full": "You indicated in the survey that you stay at home for vacations. How do you spend your vacations at home? What do you usually do? With whom do you spend your time?", "script": "Well, I like to spend my own time at home taking a rest.\n\nYou know, I had a tough time these days, so I needed time to recharge my battery. So I try not to meet anybody during my spare time, and I'd rather spend time alone. Yes! I am a homebody. I try to be as lazy as I can. I usually sleep as late as I can, and enjoy my brunch at my favorite cafe near my house. After having brunch, I usually hit the gym and work out. Though regular exercise is not really my thing, I try to do it, otherwise I'd end up like a pig. After the workout I take a bath and unwind in the tub. Well, after taking my bath, I like to lie on my couch and binge-watch TV like a couch potato.\n\nIf I feel bored to be lazy at home, I usually imagine how to change my room. These days, I'm thinking that my closets are taking up too much room. Maybe I'm gonna change those into a built-in closet! I love brainstorming ways to renovate my living space like this.\n\nWell Eva, How do you like to spend your day when you're home? Do you do anything special?", "children": [{"id": "t3-q3-p0", "name": "intro", "type": "paragraph", "full": "(intro) my own time at home, taking a rest", "children": [{"id": "t3-q3-p0-k0", "name": "recharge my battery", "type": "kick", "full": "recharge my battery"}, {"id": "t3-q3-p0-k1", "name": "I am a homebody", "type": "kick", "full": "I am a homebody"}]}, {"id": "t3-q3-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) as lazy as I can, brunch and gym and tub and TV", "children": [{"id": "t3-q3-p1-k0", "name": "as lazy as I can", "type": "kick", "full": "as lazy as I can"}, {"id": "t3-q3-p1-k1", "name": "otherwise I'd end up like a pig", "type": "kick", "full": "otherwise I'd end up like a pig"}, {"id": "t3-q3-p1-k2", "name": "like a couch potato", "type": "kick", "full": "like a couch potato"}]}, {"id": "t3-q3-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) brainstorming how to renovate my room", "children": [{"id": "t3-q3-p2-k0", "name": "taking up too much room", "type": "kick", "full": "taking up too much room"}, {"id": "t3-q3-p2-k1", "name": "brainstorming ways to renovate", "type": "kick", "full": "brainstorming ways to renovate"}]}, {"id": "t3-q3-p3", "name": "closing", "type": "paragraph", "full": "(closing) how do you spend your day at home", "children": []}]}, {"id": "t3-q4", "name": "travel then vs. now", "tag": "4-5", "type": "question", "full": "You indicated in the survey that you take vacations internationally. How has travelling to other countries changed over the years? Is it easier or more difficult? Describe what travelling was like in the past and what changes you have seen over the years.", "script": "I can definitely say that taking vacations has become easier than in the past. Well, now we can find nice places and hidden local spots without a travel agency!\n\nYoutube has been a real game-changer in making travel so much easier. From flight tickets to local restaurants, almost every information is on Youtube. The information is no longer exclusive to travel agencies. I'm subscribing to a youtuber called \"A guy leaving again\", and I mostly refer to him whenever I want to leave somewhere. He unveils a secret to buy the cheapest tickets, high-end hotels with an affordable price, and suggests his favorite local spots. All I have to do is just to follow him, which finishes my travel planning.\n\nWell, Eva, I'm subscribing to the AI, Claude, paying a hundred dollars per month as a token fee. But it is really worth it. It generates a complete itinerary with timelines and provides musta-visit places on the google map just by pasting a video clip URL into the prompt! From must-visit spots to must-eat dishes, it gives me every tip that I should do at the destination.\n\nIn short, I gather information mostly from youtube and let Claude to generate my itinerary. This is way better than traveling with a travel agency!", "children": [{"id": "t3-q4-p0", "name": "intro", "type": "paragraph", "full": "(intro) I don't agree, it has become easier", "children": [{"id": "t3-q4-p0-k0", "name": "hidden local spots", "type": "kick", "full": "hidden local spots"}, {"id": "t3-q4-p0-k1", "name": "without a travel agency", "type": "kick", "full": "without a travel agency"}]}, {"id": "t3-q4-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) Youtube has been a real game-changer", "children": [{"id": "t3-q4-p1-k0", "name": "a real game-changer", "type": "kick", "full": "a real game-changer"}, {"id": "t3-q4-p1-k1", "name": "no longer exclusive to", "type": "kick", "full": "no longer exclusive to"}, {"id": "t3-q4-p1-k2", "name": "unveils a secret", "type": "kick", "full": "unveils a secret"}]}, {"id": "t3-q4-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) Claude and the complete itinerary", "children": [{"id": "t3-q4-p2-k0", "name": "a token fee", "type": "kick", "full": "a token fee"}, {"id": "t3-q4-p2-k1", "name": "a complete itinerary with timelines", "type": "kick", "full": "a complete itinerary with timelines"}, {"id": "t3-q4-p2-k2", "name": "must-visit spots and must-eat dishes", "type": "kick", "full": "must-visit spots and must-eat dishes"}]}, {"id": "t3-q4-p3", "name": "closing", "type": "paragraph", "full": "(closing) way better than a travel agency", "children": [{"id": "t3-q4-
