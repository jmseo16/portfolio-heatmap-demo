    (paragraphData.children || []).forEach((k) => ALL_NODES.push({ node: k, topic: topicData }));
  }

  // finds a node anywhere in the (possibly partly collapsed) hierarchy by
  // id, without expanding anything on the way — unlike findAndReveal
  // (search-result jump), which deliberately does expand every ancestor.
  // Used when a kick gets added to some *other* beat than whichever one is
  // currently open, so the tree updates in place without snapping open a
  // branch the viewer didn't ask to see.
  function findNodeById(root, id) {
    let target = null;
    (function walk(n) {
      if (n.id === id) {
        target = n;
        return true;
      }
      const kids = n.children || n._children;
      if (!kids) return false;
      for (const k of kids) {
        if (walk(k)) return true;
      }
      return false;
    })(root);
    return target;
  }

  // adds one kick phrase to a beat by id — used by the "select text in the
  // script, pick a beat" popup below, where the beat being edited usually
  // isn't the one currently open (or even expanded) in the tree. Returns
  // "added", "duplicate" (already there, case-insensitive), or "error".
  function addKickToParagraph(paragraphId, kickText) {
    const p = paragraphById[paragraphId];
    const cleaned = (kickText || "").trim();
    if (!p || !cleaned) return "error";
    const kicks = effectiveKicksFor(p);
    if (kicks.some((k) => k.toLowerCase() === cleaned.toLowerCase())) return "duplicate";
    kicks.push(cleaned);
    try {
      localStorage.setItem(kicksKey(p.id), JSON.stringify(kicks));
    } catch (e) {}
    markDriveSyncDirty();
    p.children = kicks.map((text, i) => ({ id: `${p.id}-k${i}`, name: text, type: "kick", full: text }));
    reindexKicksFor(p);
    const master = findNodeById(roots[state.topicIndex], p.id);
    if (master) rebuildKickChildren(master, false);
    renderTree(false);
    return "added";
  }

  // ---- select text in "Your script", pick which beat it's a kick phrase
  // for: a small popup near the selection listing every beat of this
  // question by name. One popup element, reused across every question's
  // panel (recreated content per show, not per wireScriptBox call) — kept
  // on <body> rather than inside the reading panel because .reading-pages
  // carries a CSS transform for the swipe animation, and a transformed
  // ancestor becomes the containing block for position:fixed descendants,
  // which would break the "position near the viewport click point" math. ----
  let kickAddPopupEl = null;
  let kickAddPopupCtx = null; // { node, text } for whatever selection is pending
  let kickAddPopupShownAt = 0;
  // scroll-to-close (below) has to ignore a scroll that happens right as
  // the popup opens: focusing the textarea to select text in the first
  // place can itself trigger the browser's own "scroll the focused
  // element into view" behavior if the box wasn't already fully visible —
  // that fires asynchronously, a beat after the popup is shown, and would
  // otherwise close it before anyone actually saw it.
  const KICK_ADD_POPUP_SCROLL_GRACE_MS = 400;
  function hideKickAddPopup() {
    if (kickAddPopupEl) kickAddPopupEl.hidden = true;
    kickAddPopupCtx = null;
  }
  function ensureKickAddPopup() {
    if (kickAddPopupEl) return kickAddPopupEl;
    const el = document.createElement("div");
    el.className = "kick-add-popup";
    el.id = "kickAddPopup";
    el.hidden = true;
    document.body.appendChild(el);
    el.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-beat-id]");
      if (!btn || !kickAddPopupCtx) return;
      const { node, text } = kickAddPopupCtx;
      const result = addKickToParagraph(btn.dataset.beatId, text);
      hideKickAddPopup();
      // .script-status also matches the Takes page's own status line
      // (#takesStatus) — scope to the script panel specifically, or the
      // message lands on the wrong (currently swiped-away) page.
      const statusEl = readingBody.querySelector(".script-panel .script-status");
      if (result === "added") {
        refreshAllKicksSection(node);
        showScriptStatus(statusEl, `Added to ${btn.textContent.trim()}.`);
      } else if (result === "duplicate") {
        showScriptStatus(statusEl, "That kick's already there.", true);
      } else {
        showScriptStatus(statusEl, "Couldn't add that kick.", true);
      }
    });
    document.addEventListener("pointerdown", (e) => {
      if (!kickAddPopupEl.hidden && !kickAddPopupEl.contains(e.target)) hideKickAddPopup();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hideKickAddPopup();
    });
    kickAddPopupEl = el;
    return el;
  }
  function showKickAddPopup(node, text, x, y) {
    const beats = node.data.children || [];
    if (!beats.length) return;
    const el = ensureKickAddPopup();
    kickAddPopupCtx = { node, text };
    const shortText = text.length > 48 ? text.slice(0, 48) + "…" : text;
    el.innerHTML =
      `<div class="kick-add-popup-label">Add “${escapeHtml(shortText)}” as a kick to:</div>` +
      beats.map((p) => `<button type="button" data-beat-id="${escapeHtml(p.id)}">${escapeHtml(p.name)}</button>`).join("");
    el.hidden = false;
    kickAddPopupShownAt = Date.now();
    el.style.left = "0px";
    el.style.top = "0px";
    const rect = el.getBoundingClientRect();
    const maxX = Math.max(8, window.innerWidth - rect.width - 8);
    const maxY = Math.max(8, window.innerHeight - rect.height - 8);
    el.style.left = Math.min(Math.max(8, x), maxX) + "px";
    el.style.top = Math.min(Math.max(8, y), maxY) + "px";
  }

  // rebuilds just the "Kick phrases to use" list without touching the rest
  // of the panel — called after adding one from the script-selection
  // popup, so the new phrase shows up immediately in that list too.
  function refreshAllKicksSection(node) {
    const wrap = readingBody.querySelector("#allKicksWrap");
    if (wrap) wrap.innerHTML = allKicksHtml(node.data);
  }

  // grows a textarea to exactly fit its content (no internal scrollbar) —
  // the reading panel scrolls instead. offsetParent is null while an
  // ancestor is display:none (the script panel collapsed behind "Show
  // script", or a swiped-away page), and scrollHeight reads 0 then, which
  // would wrongly collapse the box — skip in that case, and size it for
  // real once whatever's hiding it reveals it instead.
  function autoGrowTextarea(el) {
    if (!el || el.offsetParent === null) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  function scriptFilename(node) {
    const tag = node.data.tag || node.id;
    const slug = (node.data.name || "question").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return `opic-${tag}-${slug || "script"}.txt`;
  }

  function showScriptStatus(el, text, isError) {
    if (!el) return;
    el.textContent = text;
    el.style.color = isError ? "var(--kick)" : "var(--muted)";
    window.clearTimeout(el._fadeTimer);
    el._fadeTimer = window.setTimeout(() => {
      el.textContent = "";
    }, 3200);
  }

  // shared by every "Save as .txt"/"Export all scripts"/recording-download
  // button. Inside the claude.ai artifact sandbox, a direct <a download>
  // link is inert — so this goes through the artifact's downloads
  // capability there. Outside that sandbox (e.g. this same page hosted on
  // GitHub Pages, where window.claude simply doesn't exist), a plain
  // Blob-URL download link is the normal, unblocked way to save a file in
  // any real browser tab — so it falls back to that instead of just
  // giving up, letting the one HTML file serve both contexts.
  async function saveTextFile(filename, text, statusEl, successMessage) {
    if (window.claude && typeof window.claude.use === "function") {
      try {
        const downloads = await window.claude.use("downloads");
        if (!downloads) {
          showScriptStatus(statusEl, "Downloads aren't available in this view.", true);
          return false;
        }
        await downloads.save({ filename, data: text });
        showScriptStatus(statusEl, successMessage || "Saved.");
        return true;
      } catch (err) {
        const code = err && err.code;
        if (code === "declined") {
          showScriptStatus(statusEl, "Download declined.");
        } else if (code === "rate_limited") {
          showScriptStatus(statusEl, "Try again in a moment.", true);
        } else {
          showScriptStatus(statusEl, "Couldn't save the file.", true);
        }
        return false;
      }
    }
    try {
      const blob = text instanceof Blob ? text : new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 4000);
      showScriptStatus(statusEl, successMessage || "Saved.");
      return true;
    } catch (err) {
      showScriptStatus(statusEl, "Couldn't save the file.", true);
      return false;
    }
  }

  // ---- the two-page swipeable reading panel: page 1 is the Takes/
  // recording view, page 2 is everything the panel showed before Takes
  // existed (hint text, kicks-to-use, script). A right-swipe (or the
  // "🎙 Takes ›" button) reveals page 1; a left-swipe (or "‹ Back") returns
  // to page 2. Rewired fresh on every render like wireTakesSection/
  // wireKickEditor — so its pointer listeners must stay gesture-scoped
  // (added on pointerdown, removed on pointerup/cancel) rather than bound
  // once and left on window, or repeated question-clicks over a session
  // would pile up stale closures on detached DOM. ----
  function wireSwipePages(node) {
    const pages = readingBody.querySelector("#readingPages");
    const takesPage = readingBody.querySelector("#readingPageTakes");
    const mainPage = readingBody.querySelector("#readingPageMain");
    const navBtn = readingBody.querySelector("#takesNav");
    const backBtn = readingBody.querySelector("#takesBack");
    if (!pages || !takesPage || !mainPage) return;

    // both pages stay flex children the whole time (never display:none —
    // that would drop the sole remaining item to the wrong slot); the
    // class toggle just slides the strip so only one half is in the
    // viewport, the other clipped by .reading's own overflow-x:hidden.
    function showPage(which) {
      pages.classList.toggle("show-takes", which === "takes");
      persistAppState();
    }

    if (navBtn) navBtn.addEventListener("click", () => showPage("takes"));
    if (backBtn) backBtn.addEventListener("click", () => showPage("main"));

    let startX = null;
    let startY = null;
    let dragging = false;
    let horizontal = null;

    function onPointerMove(e) {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (horizontal === null) {
        if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
        horizontal = Math.abs(dx) > Math.abs(dy);
      }
      if (horizontal) e.preventDefault();
    }
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("pointerup", endDrag);
      window.removeEventListener("pointercancel", endDrag);
      if (!horizontal) return;
      const dx = e.clientX - startX;
      if (dx <= -50) showPage("main");
      else if (dx >= 50) showPage("takes");
    }
    pages.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      // an unlocked ("✏️ Edit" on) script box handles its own drag — for
      // selecting text (the kick-add popup) or just moving the caret —
      // so don't also start tracking a swipe over it. A locked box has
      // pointer-events:none and is never the target here in the first
      // place, so this only actually matters once unlocked.
      if (e.target.closest(".script-box:not(.locked)")) return;
      startX = e.clientX;
      startY = e.clientY;
      dragging = true;
      horizontal = null;
      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", endDrag);
      window.addEventListener("pointercancel", endDrag);
    });
  }

  // ---- the "Takes" section on a question panel: record (or log without
  // recording), play back, download, or delete individual takes, and
  // self-mark which kick phrases came out in each one. Confirmed working
  // inside a real browser tab via the GitHub Pages copy of this page
  // (getUserMedia is denied outright inside the claude.ai artifact
  // sandbox — no capability governs microphone access there — so
  // recording is a Pages-only affordance; everything else in this
  // section works in both places). ----
  const REC_MIME_CANDIDATES = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
  function pickRecMimeType() {
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
    for (const m of REC_MIME_CANDIDATES) {
      if (MediaRecorder.isTypeSupported(m)) return m;
    }
    return "";
  }

  function wireTakesSection(node) {
    const recordBtn = readingBody.querySelector("#takesRecord");
    const logBtn = readingBody.querySelector("#takesLog");
    const resetBtn = readingBody.querySelector("#takesReset");
    const status = readingBody.querySelector("#takesStatus");
    const list = readingBody.querySelector("#takesList");
    if (!list) return;

    const questionId = node.id;

    // every kick phrase across every beat of this question, with the id
    // each one WOULD have right now — computed positionally
    // ("<beatId>-k<index>"), the same scheme applyKicks() itself uses, so
    // it's correct even for a beat whose data.children hasn't been
    // refreshed from a localStorage override yet this session.
    function allKicksForQuestion() {
      const out = [];
      (node.data.children || []).forEach((p) => {
        effectiveKicksFor(p).forEach((text, i) => {
          out.push({ id: `${p.id}-k${i}`, text });
        });
      });
      return out;
    }

    function renderTakes() {
      const takes = takesFor(questionId).slice().sort((a, b) => b.n - a.n);
      const allKicks = allKicksForQuestion();
      if (resetBtn) resetBtn.hidden = takes.length === 0;

      // the "🎙 Takes · take#N" nav button (on the OTHER swiped page) was
      // only ever set once, when this whole panel was first built — a take
      // recorded/logged/deleted without leaving the panel in between never
      // touched it, so it kept showing whatever count was true at that
      // first render. Recompute it here too, since renderTakes() already
      // runs after every action that changes the take count.
      const navBtn = readingBody.querySelector("#takesNav");
      if (navBtn) {
        const count = getPracticeCount(questionId);
        navBtn.textContent = `🎙 Takes${count > 0 ? ` · take#${count}` : ""} ›`;
      }

      list.innerHTML = "";
      if (!takes.length) {
        const empty = document.createElement("p");
        empty.className = "kick-empty";
        empty.textContent = "No takes yet — record one, or log a practice without recording.";
        list.appendChild(empty);
        return;
      }
      takes.forEach((take) => list.appendChild(renderTakeRow(take, allKicks)));
    }

    // click-to-rate 1-5 stars, right of a take's own "Take #N" label.
    // Clicking the star that's already the rating clears it back to 0.
    function buildStarRating(take) {
      const wrap = document.createElement("span");
      wrap.className = "take-rating";
      wrap.setAttribute("role", "group");
      wrap.setAttribute("aria-label", "Rate this take");
      const starEls = [];
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement("button");
        star.type = "button";
        star.className = "take-star";
        const setStarState = (el, filled) => {
          el.textContent = filled ? "★" : "☆";
          el.classList.toggle("filled", filled);
        };
        setStarState(star, (take.rating || 0) >= i);
        star.setAttribute("aria-label", `${i} star${i === 1 ? "" : "s"}`);
        star.addEventListener("click", () => {
          const takes = takesFor(questionId);
          const t = takes.find((x) => x.n === take.n);
          if (!t) return;
          t.rating = t.rating === i ? 0 : i;
          saveTakes(questionId, takes);
          take.rating = t.rating;
          starEls.forEach((el, idx) => setStarState(el, take.rating >= idx + 1));
        });
        starEls.push(star);
        wrap.appendChild(star);
      }
      return wrap;
    }

    function renderTakeRow(take, allKicks) {
      const row = document.createElement("div");
      row.className = "take-row";

      const head = document.createElement("div");
      head.className = "take-row-head";
      const labelWrap = document.createElement("div");
      labelWrap.className = "take-label-wrap";
      const label = document.createElement("span");
      label.className = "take-label";
      label.textContent = `Take #${take.n}`;
      labelWrap.appendChild(label);
      if (take.hasRecording) labelWrap.appendChild(buildStarRating(take));
      head.appendChild(labelWrap);

      const actions = document.createElement("div");
      actions.className = "take-actions";
      // buttons stay grouped in their own inner flex box so they wrap as
      // one unit onto their own line under a long filename, rather than
      // each icon breaking individually.
      const btnGroup = document.createElement("div");
      btnGroup.className = "take-btn-group";

      if (take.hasRecording) {
        const filenameLabel = document.createElement("span");
        filenameLabel.className = "take-filename";
        const title = takeDisplayTitle(node, take);
        filenameLabel.textContent = title;
        filenameLabel.title = title;
        actions.appendChild(filenameLabel);
        // older takes recorded before durationSec existed: fetch the blob
        // once, measure it, cache the result so this only happens once.
        if (take.durationSec == null) {
          getRecording(recKey(questionId, take.n))
            .then((rec) => (rec && rec.blob ? getAudioDurationSec(rec.blob) : null))
            .then((sec) => {
              if (sec == null) return;
              const takes = takesFor(questionId);
              const t = takes.find((x) => x.n === take.n);
              if (!t) return;
              t.durationSec = sec;
              saveTakes(questionId, takes);
              take.durationSec = sec;
              const updated = takeDisplayTitle(node, take);
              filenameLabel.textContent = updated;
              filenameLabel.title = updated;
            })
            .catch(() => {});
        }

        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "take-btn take-play";
        playBtn.textContent = "▶ Play";
        let audioEl = null;
        playBtn.addEventListener("click", async () => {
          if (audioEl) {
            if (audioEl.paused) audioEl.play();
            else audioEl.pause();
            return;
          }
          const rec = await getRecording(recKey(questionId, take.n));
          if (!rec || !rec.blob) {
            showScriptStatus(status, "Couldn't find that recording.", true);
            return;
          }
          audioEl = document.createElement("audio");
          audioEl.controls = true;
          audioEl.className = "take-audio";
          fixBlobAudioDuration(audioEl);
          audioEl.src = URL.createObjectURL(rec.blob);
          row.appendChild(audioEl);
          audioEl.addEventListener("play", () => (playBtn.textContent = "⏸ Pause"));
          audioEl.addEventListener("pause", () => (playBtn.textContent = "▶ Play"));
          audioEl.play();
        });
        btnGroup.appendChild(playBtn);

        const dlBtn = document.createElement("button");
        dlBtn.type = "button";
        dlBtn.className = "take-btn take-download";
        dlBtn.textContent = "⬇";
        dlBtn.setAttribute("aria-label", `Download take ${take.n}`);
        dlBtn.addEventListener("click", async () => {
          const rec = await getRecording(recKey(questionId, take.n));
          if (!rec || !rec.blob) {
            showScriptStatus(status, "Couldn't find that recording.", true);
            return;
          }
          showScriptStatus(status, "Converting to mp3…");
          try {
            const mp3Blob = await blobToMp3(rec.blob);
            await saveTextFile(takeDownloadFilename(node, take, "mp3"), mp3Blob, status, "Saved as mp3.");
          } catch (err) {
            const saved = await saveTextFile(takeDownloadFilename(node, take, mimeToExt(rec.mimeType)), rec.blob, status);
            showScriptStatus(status, saved ? "Couldn't convert to mp3 — saved the original recording instead." : "Couldn't save the file.", true);
          }
        });
        btnGroup.appendChild(dlBtn);
      } else {
        const noRec = document.createElement("span");
        noRec.className = "take-no-rec";
        noRec.textContent = "(no recording)";
        actions.appendChild(noRec);
      }

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "take-btn take-delete";
      delBtn.textContent = "🗑";
      delBtn.setAttribute("aria-label", `Delete take ${take.n}`);
      delBtn.addEventListener("click", async () => {
        await deleteTakeOne(questionId, take.n);
        renderTakes();
        renderTree(false);
        showScriptStatus(status, `Deleted take #${take.n}.`);
      });
      btnGroup.appendChild(delBtn);
      actions.appendChild(btnGroup);

      head.appendChild(actions);
      row.appendChild(head);

      const summary = document.createElement("div");
      summary.className = "take-kick-summary";
      summary.textContent = allKicks.length ? `kick check: ${take.kicksMarked.length}/${allKicks.length} marked` : "no kick phrases yet";
      row.appendChild(summary);

      if (allKicks.length) {
        const chipWrap = document.createElement("div");
        chipWrap.className = "reading-kicks take-kick-chips";
        allKicks.forEach(({ id, text }) => {
          const chip = document.createElement("button");
          chip.type = "button";
          const marked = take.kicksMarked.includes(id);
          chip.className = "kick-chip take-kick-toggle" + (marked ? " marked" : "");
          chip.textContent = (marked ? "☑ " : "☐ ") + text;
          chip.addEventListener("click", () => {
            const takes = takesFor(questionId);
            const t = takes.find((x) => x.n === take.n);
            if (!t) return;
            const idx = t.kicksMarked.indexOf(id);
            if (idx === -1) t.kicksMarked.push(id);
            else t.kicksMarked.splice(idx, 1);
            saveTakes(questionId, takes);
            take.kicksMarked = t.kicksMarked;
            const nowMarked = t.kicksMarked.includes(id);
            chip.classList.toggle("marked", nowMarked);
            chip.textContent = (nowMarked ? "☑ " : "☐ ") + text;
            summary.textContent = `kick check: ${t.kicksMarked.length}/${allKicks.length} marked`;
          });
          chipWrap.appendChild(chip);
        });
        row.appendChild(chipWrap);
      }

      return row;
    }

    const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    if (recordBtn) {
      if (!canRecord) {
        recordBtn.disabled = true;
        recordBtn.title = "Recording isn't supported in this view — try the GitHub Pages copy of this page.";
      } else {
        let mediaRecorder = null;
        let chunks = [];
        let stream = null;
        let recording = false;
        let recordStartedAt = null;
        let recordTimerId = null;
        function stopRecordTimer() {
          if (recordTimerId != null) {
            window.clearInterval(recordTimerId);
            recordTimerId = null;
          }
        }
        recordBtn.addEventListener("click", async () => {
          if (!recording) {
            try {
              // a bare `{ audio: true }` gets the browser's default WebRTC
              // processing chain — echoCancellation/noiseSuppression/
              // autoGainControl all default on, tuned for VoIP calls, not
              // clean voice recording (it's the same reason a phone call
              // sounds thinner than a voice-memo of the same voice).
              // Explicitly turning that off is most of the gap against a
              // native recorder app.
              stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                  echoCancellation: false,
                  noiseSuppression: false,
                  autoGainControl: false,
                  channelCount: { ideal: 1 },
                  sampleRate: { ideal: 48000 },
                },
              });
            } catch (err) {
              showScriptStatus(status, "Mic access denied/unavailable: " + ((err && err.name) || err), true);
              return;
            }
            const mimeType = pickRecMimeType();
            chunks = [];
            // the default encoder bitrate for an unconstrained recording is
            // tuned low; 128kbps Opus is at/near transparent for a single
            // spoken voice without ballooning file size for a short take.
            const recorderOpts = { audioBitsPerSecond: 128000 };
            if (mimeType) recorderOpts.mimeType = mimeType;
            try {
              mediaRecorder = new MediaRecorder(stream, recorderOpts);
            } catch (err) {
              showScriptStatus(status, "Couldn't start the recorder: " + err.message, true);
              stream.getTracks().forEach((tr) => tr.stop());
              return;
            }
            mediaRecorder.addEventListener("dataavailable", (e) => {
              if (e.data && e.data.size) chunks.push(e.data);
            });
            mediaRecorder.addEventListener("stop", async () => {
              stopRecordTimer();
              stream.getTracks().forEach((tr) => tr.stop());
              const blob = new Blob(chunks, { type: mediaRecorder.mimeType || mimeType || "audio/webm" });
              const takes = takesFor(questionId);
              const n = nextTakeNumber(takes);
              const createdAt = Date.now();
              const ok = await putRecording(recKey(questionId, n), { blob, mimeType: blob.type, createdAt });
              let durationSec = null;
              try {
                durationSec = await getAudioDurationSec(blob);
              } catch (e) {}
              takes.push({ n, hasRecording: ok, mimeType: ok ? blob.type : null, kicksMarked: [], createdAt, durationSec, rating: 0 });
              saveTakes(questionId, takes);
              renderTakes();
              renderTree(false);
              showScriptStatus(status, ok ? `Saved take #${n}.` : "Recorded, but couldn't store it locally.", !ok);
            });
            mediaRecorder.start();
            recording = true;
            recordStartedAt = Date.now();
            recordBtn.textContent = "⏹ 00:00";
            recordBtn.classList.add("recording");
            showScriptStatus(status, "Recording…");
            stopRecordTimer();
            recordTimerId = window.setInterval(() => {
              recordBtn.textContent = "⏹ " + formatDurationMMSS((Date.now() - recordStartedAt) / 1000);
            }, 250);
          } else {
            mediaRecorder.stop();
            recording = false;
            stopRecordTimer();
            recordBtn.textContent = "🎙 Record";
            recordBtn.classList.remove("recording");
          }
        });
      }
    }

    if (logBtn) {
      logBtn.addEventListener("click", () => {
        appendTake(questionId, { hasRecording: false });
        renderTakes();
        renderTree(false);
        showScriptStatus(status, "Logged.");
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener("click", async () => {
        if (!window.confirm("Delete every take (including recordings) for this question? This can't be undone.")) return;
        await resetAllTakes(questionId);
        renderTakes();
        renderTree(false);
        showScriptStatus(status, "All takes cleared.");
      });
    }

    renderTakes();
  }

  function wireScriptBox(node) {
    const box = readingBody.querySelector(".script-box");
    const resetBtn = readingBody.querySelector(".script-reset");
    const downloadBtn = readingBody.querySelector(".script-download");
    const loadBtn = readingBody.querySelector(".script-load");
    const fileInput = readingBody.querySelector(".script-file-input");
    // .script-status also matches the Takes page's own status line
    // (#takesStatus, same class) which sits earlier in the DOM — scope to
    // the script panel specifically, or every message here (Reset,
    // Load file, Save as .txt) lands on the wrong, currently-invisible page.
    const status = readingBody.querySelector(".script-panel .script-status");
    const editToggleBtn = readingBody.querySelector("#scriptEditToggle");
    if (!box) return;
    const key = `opic-script:${node.id}`;
    const original = defaultScriptFor(node);

    let saved = null;
    try {
      saved = localStorage.getItem(key);
    } catch (e) {}
    box.value = saved !== null ? saved : original;
    autoGrowTextarea(box);

    // locked by default (pointer-events:none — see the .script-box.locked
    // CSS comment) so a touch/drag over the script area always falls
    // through to the swipe-page gesture instead of fighting it for a text
    // selection; tapping "✏️ Edit" unlocks typing and text-selection (for
    // the kick-add popup) at the cost of swiping now needing to start
    // somewhere outside the box. Starts locked every time this panel
    // opens, not remembered across questions.
    if (editToggleBtn) {
      function setEditMode(on) {
        box.classList.toggle("locked", !on);
        box.readOnly = !on;
        editToggleBtn.textContent = on ? "🔒 Done" : "✏️ Edit";
        editToggleBtn.setAttribute("aria-pressed", String(on));
        if (!on) hideKickAddPopup();
      }
      editToggleBtn.addEventListener("click", () => setEditMode(box.classList.contains("locked")));
    }

    box.addEventListener("input", () => {
      try {
        localStorage.setItem(key, box.value);
      } catch (e) {}
      markDriveSyncDirty();
      autoGrowTextarea(box);
      hideKickAddPopup();
    });

    // select a word/phrase in the script, get a small popup right there
    // asking which beat it's a kick phrase for — this page has no way to
    // know that on its own (the same words can show up in more than one
    // beat, or none), so it's always a pick, never a guess. pointerup
    // (not mouseup) so touch-drag selection on mobile triggers it too.
    box.addEventListener("pointerup", (e) => {
      const start = box.selectionStart;
      const end = box.selectionEnd;
      if (start === end) {
        hideKickAddPopup();
        return;
      }
      const text = box.value.slice(start, end).trim();
      if (!text || text.length > 200) {
        hideKickAddPopup();
        return;
      }
      showKickAddPopup(node, text, e.clientX, e.clientY);
    });

    resetBtn.addEventListener("click", () => {
      box.value = original;
      try {
        localStorage.removeItem(key);
      } catch (e) {}
      markDriveSyncDirty();
      box.focus();
      autoGrowTextarea(box);
      showScriptStatus(status, "Reset to the original script.");
    });

    // the box's needed height depends on its width too (longer lines wrap
    // less) — a desktop panel-width drag or a mobile orientation change
    // changes that without ever touching box.value, so re-measure on any
    // width change, not just on content edits. Guarded against the height
    // change autoGrowTextarea itself causes, which would otherwise retrigger
    // this on every keystroke.
    let lastBoxWidth = box.getBoundingClientRect().width;
    const boxResizeObserver = new ResizeObserver(() => {
      const w = box.getBoundingClientRect().width;
      if (Math.abs(w - lastBoxWidth) > 1) {
        lastBoxWidth = w;
        autoGrowTextarea(box);
      }
    });
    boxResizeObserver.observe(box);

    if (downloadBtn) {
      downloadBtn.addEventListener("click", () => saveTextFile(scriptFilename(node), box.value, status));
    }

    if (loadBtn && fileInput) {
      loadBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          box.value = String(reader.result || "");
          try {
            localStorage.setItem(key, box.value);
          } catch (e) {}
          markDriveSyncDirty();
          autoGrowTextarea(box);
          showScriptStatus(status, `Loaded ${file.name}.`);
        };
        reader.onerror = () => showScriptStatus(status, "Couldn't read that file.", true);
        reader.readAsText(file);
      });
    }
  }

  // the editable kick-phrase list on a script-beat panel: add / edit / delete
  // a chip and the change shows up immediately as kick nodes under that beat
  // in the tree (see rebuildKickChildren) — not just in this panel — and
  // persists to localStorage the same way the script box does.
  function wireKickEditor(node) {
    const editor = readingBody.querySelector("#kickEditor");
    const addBtn = readingBody.querySelector(".kick-add");
    const resetBtn = readingBody.querySelector(".kick-reset");
    const status = readingBody.querySelector("#kickStatus");
    if (!editor) return;

    // capture the pristine kick list once, before this session's first
    // edit ever touches node.data.children — this is what "Reset" restores.
    if (!node.data.__originalKicks) {
      node.data.__originalKicks = (node.data.children || []).map((k) => k.name);
    }

    function currentKicks() {
      return effectiveKicksFor(node.data);
    }

    function applyKicks(kicks, persist) {
      const cleaned = kicks.map((k) => k.trim()).filter((k) => k.length);
      try {
        if (persist === false) localStorage.removeItem(kicksKey(node.id));
        else localStorage.setItem(kicksKey(node.id), JSON.stringify(cleaned));
      } catch (e) {}
      markDriveSyncDirty();
      node.data.children = cleaned.map((text, i) => ({ id: `${node.id}-k${i}`, name: text, type: "kick", full: text }));
      reindexKicksFor(node.data);
      rebuildKickChildren(node, true);
      renderTree(false);
      renderEditor(cleaned);
    }

    // drag a chip's grip handle to reorder — visually reflows the DOM live
    // as the pointer crosses sibling chips (only for feedback; the array
    // itself is derived fresh from final DOM order on drop), then commits
    // through the same applyKicks() every other edit already goes through,
    // so persistence + tree rebuild + re-render all come for free.
    function wireChipDrag(chip) {
      const grip = chip.querySelector(".kick-grip");
      if (!grip) return;
      let dragging = false;
      function onMove(event) {
        if (!dragging) return;
        const target = document.elementFromPoint(event.clientX, event.clientY);
        const targetChip = target && target.closest(".kick-chip-edit");
        if (targetChip && targetChip !== chip && targetChip.parentElement === editor) {
          const rect = targetChip.getBoundingClientRect();
          const before = event.clientX < rect.left + rect.width / 2;
          editor.insertBefore(chip, before ? targetChip : targetChip.nextSibling);
        }
      }
      function onUp() {
        if (!dragging) return;
        dragging = false;
        chip.classList.remove("kick-dragging");
        document.body.style.userSelect = "";
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        const newOrder = Array.from(editor.querySelectorAll(".kick-input")).map((inp) => inp.value);
        applyKicks(newOrder);
        showScriptStatus(status, "Reordered.");
      }
      grip.addEventListener("pointerdown", (event) => {
        dragging = true;
        chip.classList.add("kick-dragging");
        document.body.style.userSelect = "none";
        event.preventDefault();
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
      });
    }

    function renderEditor(kicks) {
      editor.innerHTML = "";
      kicks.forEach((text, i) => {
        const chip = document.createElement("span");
        chip.className = "kick-chip kick-chip-edit";

        const grip = document.createElement("span");
        grip.className = "kick-grip";
        grip.setAttribute("aria-hidden", "true");
        grip.textContent = "⠿";
        chip.appendChild(grip);

        const input = document.createElement("input");
        input.type = "text";
        input.className = "kick-input";
        input.value = text;
        input.setAttribute("aria-label", `Kick phrase ${i + 1}`);
        input.size = Math.max(4, text.length);
        input.addEventListener("input", () => {
          input.size = Math.max(4, input.value.length);
        });
        input.addEventListener("change", () => {
          const kicks2 = currentKicks();
          kicks2[i] = input.value;
          applyKicks(kicks2);
          showScriptStatus(status, "Saved.");
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            input.blur();
          }
        });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "kick-del";
        del.setAttribute("aria-label", `Remove kick phrase ${i + 1}`);
        del.textContent = "×";
        del.addEventListener("click", () => {
          const kicks2 = currentKicks();
          kicks2.splice(i, 1);
          applyKicks(kicks2);
          showScriptStatus(status, "Removed.");
        });

        chip.appendChild(input);
        chip.appendChild(del);
        editor.appendChild(chip);
        wireChipDrag(chip);
      });
      if (!kicks.length) {
        const empty = document.createElement("p");
        empty.className = "kick-empty";
        empty.textContent = "No kick phrases yet.";
        editor.appendChild(empty);
      }
    }

    renderEditor(currentKicks());

    if (addBtn) {
      addBtn.addEventListener("click", () => {
        const kicks = currentKicks();
        kicks.push("new kick");
        applyKicks(kicks);
        showScriptStatus(status, "Added.");
        const inputs = editor.querySelectorAll(".kick-input");
        const last = inputs[inputs.length - 1];
        if (last) {
          last.focus();
          last.select();
        }
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener("click", () => {
        applyKicks(node.data.__originalKicks.slice(), false);
        showScriptStatus(status, "Reset to the original kick phrases.");
      });
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function toggle(d) {
    if (d.data.type !== "question" && d.data.type !== "paragraph") return;
    if (d.children) {
      d._children = d.children;
      d.children = null;
    } else if (d._children) {
      d.children = d._children;
      d._children = null;
    }
    renderTree(false);
  }

  // clicking a question folds every *other* question's beats back down and
  // fully unfolds this one's own beats and their kick phrases — so the
  // view is always "just this question's whole subtree" without manually
  // folding the last one and drilling into every beat again first. The
  // existing per-render auto-fit in renderTree (below) does the rest: with
  // only this question's branch expanded, fitting the bounds of every
  // visible node naturally zooms to fill the screen with it. Clicking an
  // already-fully-expanded question again folds it back down instead —
  // the same "click again to collapse" every other expandable node in
  // this tree already gets from toggle().
  function expandQuestionFully(questionMaster) {
    if (questionMaster.children) {
      questionMaster._children = questionMaster.children;
      questionMaster.children = null;
      renderTree(false);
      return;
    }
    const topic = questionMaster.parent;
    (topic.children || []).forEach((q) => {
      if (q !== questionMaster && q.children) {
        q._children = q.children;
        q.children = null;
      }
    });
    if (questionMaster._children) {
      questionMaster.children = questionMaster._children;
      questionMaster._children = null;
    }
    (questionMaster.children || []).forEach((p) => {
      if (p._children) {
        p.children = p._children;
        p._children = null;
      }
    });
    renderTree(false);
  }

  // wraps a master (state-tracking) hierarchy node in a plain object so a
  // fresh, self-contained d3.hierarchy can be built for layout purposes
  // without disturbing the master's own .parent chain
  function mirrorVisible(masterNode) {
    return {
      master: masterNode,
      children: masterNode.children ? masterNode.children.map(mirrorVisible) : undefined,
    };
  }

  // builds one side's (an array of top-level question master-nodes)
  // self-contained hierarchy for layout purposes, without disturbing the
  // master's own .parent chain
  function buildSideHierarchy(questionNodes) {
    if (!questionNodes.length) return null;
    return d3.hierarchy({ children: questionNodes.map(mirrorVisible) });
  }

  // shifts a node and its whole subtree down (or up) by the same amount,
  // so moving a node to resolve a collision can't introduce a new one
  // among its own already-correctly-spaced descendants.
  function shiftSubtree(node, delta) {
    node.screenY += delta;
    if (node.children) node.children.forEach((c) => shiftSubtree(c, delta));
  }

  // packs one side's hierarchy as tightly as the actual pill heights
  // allow, then recenters it around this side's own vertical middle so
  // left and right can have different extents. Screen X is filled in
  // later, once every visible pill has been measured (see fitColumns).
  //
  // This isn't a uniform-row d3.tree() layout on purpose: giving every
  // row the same height (sized off whichever pill anywhere in the view
  // happens to be tallest — often a long wrapped script-beat sentence)
  // used to space a beat's own single-line kick phrases just as far
  // apart as that unrelated tall pill needed, so a beat's kicks read as
  // scattered rather than as one cluster. Instead: walk the hierarchy
  // bottom-up (d3's own .eachAfter, post-order — every node's children
  // are placed before the node itself). A leaf (a kick, or a beat with
  // no kicks currently shown) is stacked directly under the previous
  // leaf by their own measured pillH + ROW_BUFFER — a little extra
  // breathing room where the previous leaf's immediate parent differs
  // from this one's, so one beat's kicks still read as a visible
  // cluster rather than blending into the next beat's. A parent (a
  // beat, a question) then sits at the mean of its own children, same
  // as a normal tidy tree — but first, its children are checked
  // pairwise and pushed apart (dragging each one's whole subtree along,
  // via shiftSubtree) whenever they'd sit closer than their own pill
  // heights allow, so a beat that happens to have few or no kicks can
  // never end up overlapping the beat next to it.
  //
  // Safe to call twice on the same wrapper — this mutates the very same
  // node objects in place (same as the old d3.tree() approach did), so
  // calling again once pill heights are known just updates .screenY on
  // the exact objects the first, pre-measurement call already attached
  // pill measurements to.
  function layoutSideRows(wrapper, side) {
    if (!wrapper) return [];
    const heightOf = (d) => d.pillH || 30; // placeholder before pills are measured (see caller)
    let prevLeaf = null;
    wrapper.eachAfter((d) => {
      if (!d.children || !d.children.length) {
        const gap = prevLeaf ? ROW_BUFFER * (prevLeaf.parent === d.parent ? 1 : 2) : 0;
        d.screenY = prevLeaf ? prevLeaf.screenY + heightOf(prevLeaf) / 2 + gap + heightOf(d) / 2 : 0;
        prevLeaf = d;
        return;
      }
      for (let i = 1; i < d.children.length; i++) {
        const prev = d.children[i - 1];
        const cur = d.children[i];
        const minGap = heightOf(prev) / 2 + heightOf(cur) / 2 + ROW_BUFFER;
        if (cur.screenY - prev.screenY < minGap) shiftSubtree(cur, minGap - (cur.screenY - prev.screenY));
      }
      d.screenY = d.children.reduce((sum, c) => sum + c.screenY, 0) / d.children.length;
    });

    const rows = wrapper.descendants().filter((d) => d.depth > 0);
    if (!rows.length) return [];
    const extent = d3.extent(rows, (d) => d.screenY);
    const mid = (extent[0] + extent[1]) / 2;
    rows.forEach((d) => {
      d.master = d.data.master;
      d.side = side;
      d.screenY -= mid;
    });
    return rows;
  }

  // measures every node's wrapped label (as rendered, with its real font)
  // and returns a per-depth column X, wide enough that even the widest
  // pill at each depth clears its neighboring column with room to spare
  function fitColumns(nodes) {
    const maxHalf = [];
    nodes.forEach((d) => {
      maxHalf[d.depth] = Math.max(maxHalf[d.depth] || 0, d.pillW / 2);
    });
    const x = [0];
    for (let depth = 1; depth < maxHalf.length; depth++) {
      const prevHalf = maxHalf[depth - 1] || 0;
      const half = maxHalf[depth] || 0;
      x[depth] = x[depth - 1] + prevHalf + half + COLUMN_BUFFER;
    }
    return x;
  }

  function renderTree(recenter) {
    const root = roots[state.topicIndex];
    const bounds = svg.node().getBoundingClientRect();

    const rootPseudo = { master: root, depth: 0, screenX: 0, screenY: 0 };
    const rightQuestions = root.children.filter((_, i) => i % 2 === 0);
    const leftQuestions = root.children.filter((_, i) => i % 2 === 1);
    const rightWrapper = buildSideHierarchy(rightQuestions);
    const leftWrapper = buildSideHierarchy(leftQuestions);

    // pass 0: lay out rows with placeholder pill heights, just to get
    // stable node identities to attach real measurements to — the real
    // spacing depends on pill heights, which aren't known until those
    // pills exist and are measured
    const rightRows = layoutSideRows(rightWrapper, 1);
    const leftRows = layoutSideRows(leftWrapper, -1);
    const nodes = [rootPseudo, ...rightRows, ...leftRows];

    const nodeSel = nodeLayer.selectAll("g.node").data(nodes, (d) => d.master.id);
    nodeSel.exit().remove();

    const nodeEnter = nodeSel.enter().append("g");
    nodeEnter.append("rect").attr("class", "pill");
    nodeEnter.append("text");
    nodeEnter.append("g").attr("class", "badge");
    nodeEnter.append("g").attr("class", "take-badge");

    const nodeMerge = nodeEnter.merge(nodeSel);
    nodeMerge.attr("class", (d) => `node ${d.master.data.type}`);

    // pass 1: set each node's label (as wrapped text) and measure the
    // rendered result to size its pill — this has to happen before we can
    // know how wide each depth's column needs to be
    nodeMerge.each(function (d) {
      const type = d.master.data.type;
      const data = d.master.data;
      let name;
      if (type === "topic") name = data.name.toUpperCase();
      else if (type === "question") name = `Q${data.tag}. ${data.name}`;
      else if (type === "paragraph") name = data.full; // the sheet's own column-C text, verbatim
      else name = data.name; // kick
      const lines = wrapLabel(name, WRAP_CHARS[type]);
      const lineH = 1.15;
      const startDy = -((lines.length - 1) * lineH) / 2 + 0.32;

      const text = d3.select(this).select("text");
      const tspans = text.selectAll("tspan").data(lines);
      tspans.exit().remove();
      tspans
        .enter()
        .append("tspan")
        .merge(tspans)
        .attr("x", 0)
        .attr("dy", (_, i) => (i === 0 ? startDy : lineH) + "em")
        .text((line) => line);

      // measure the text alone — this <g> can still hold the *previous*
      // render's pill rect and badge, which would otherwise bloat the box
      const bbox = text.node().getBBox();
      d.pillW = bbox.width + PILL_PAD_X[type] * 2;
      d.pillH = bbox.height + PILL_PAD_Y[type] * 2;

      d3.select(this)
        .select("rect.pill")
        .attr("x", -d.pillW / 2)
        .attr("y", -d.pillH / 2)
        .attr("width", d.pillW)
        .attr("height", d.pillH)
        .attr("rx", d.pillH / 2);
    });

    // pass 2: now that every pill's real size is known, re-pack each side
    // (see layoutSideRows) and size each depth's column, then place every
    // node (root at the origin). layoutSideRows mutates the same node
    // objects nodes[] already holds, so this updates their .screenY in
    // place — no need to rebuild nodes[].
    layoutSideRows(rightWrapper, 1);
    layoutSideRows(leftWrapper, -1);

    const DEPTH_X = fitColumns(nodes);
    nodes.forEach((d) => {
      d.screenX = d.depth === 0 ? 0 : d.side * DEPTH_X[d.depth];
    });

    posById.clear();
    nodes.forEach((d) => posById.set(d.master.id, { x: d.screenX, y: d.screenY }));

    nodeMerge.attr("transform", (d) => `translate(${d.screenX},${d.screenY})`);

    nodeMerge.each(function (d) {
      const type = d.master.data.type;
      const expandable = type === "question" || type === "paragraph";
      const collapsedCount = d.master._children && !d.master.children ? d.master._children.length : 0;
      const badge = d3.select(this).select("g.badge");
      badge.selectAll("*").remove();
      if (expandable && collapsedCount > 0) {
        const dir = d.screenX < 0 ? -1 : 1;
        badge.attr("transform", `translate(${(dir * d.pillW) / 2},0)`).style("display", null);
        badge.append("circle").attr("r", 9);
        badge.append("text").attr("dy", "0.32em").attr("text-anchor", "middle").text(collapsedCount);
      } else {
        badge.style("display", "none");
      }

      // practice-count corner chip (questions only) — straddles the pill's
      // top-left corner so it never lands on the branch-count badge above,
      // which sits centered on the pill's outward side edge instead.
      const takeBadge = d3.select(this).select("g.take-badge");
      takeBadge.selectAll("*").remove();
      const practiceCount = type === "question" ? getPracticeCount(d.master.data.id) : 0;
      if (practiceCount > 0) {
        takeBadge.attr("transform", `translate(${-d.pillW / 2},${-d.pillH / 2})`).style("display", null);
        const label = `take#${practiceCount}`;
        const t = takeBadge.append("text").attr("text-anchor", "middle").attr("dy", "0.32em").text(label);
        const bbox = t.node().getBBox();
        const padX = 5, padY = 3;
        const w = bbox.width + padX * 2;
        const h = bbox.height + padY * 2;
        takeBadge.insert("rect", "text").attr("x", -w / 2).attr("y", -h / 2).attr("width", w).attr("height", h).attr("rx", h / 2);
      } else {
        takeBadge.style("display", "none");
      }
    });

    const links = nodes
      .filter((d) => d !== rootPseudo)
      .map((d) => ({ source: d.parent && d.parent.depth > 0 ? d.parent : rootPseudo, target: d }));

    const linkSel = linkLayer.selectAll("path.link").data(links, (d) => d.target.master.id);
    linkSel.exit().remove();
    linkSel
      .enter()
      .append("path")
      .attr("class", (d) => `link ${d.target.master.data.type[0]}-link`)
      .merge(linkSel)
      .attr("class", (d) => `link ${d.target.master.data.type[0]}-link`)
      .attr("d", (d) => {
        const sx = d.source.screenX, sy = d.source.screenY;
        const tx = d.target.screenX, ty = d.target.screenY;
        const mx = (sx + tx) / 2;
        return `M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`;
      });

    nodeMerge
      .attr("tabindex", (d) => (d.master.data.type === "topic" ? null : 0))
      .attr("role", (d) => (d.master.data.type === "topic" ? null : "button"))
      .on("click", (event, d) => {
        event.stopPropagation();
        setCurrent(d.master);
        if (d.master.data.type === "question") expandQuestionFully(d.master);
        else toggle(d.master);
      })
      .on("keydown", (event, d) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          setCurrent(d.master);
          if (d.master.data.type === "question") expandQuestionFully(d.master);
          else toggle(d.master);
        }
      });

    nodeMerge.classed("current", (d) => state.current && d.master.id === state.current.id);
    nodeMerge.classed("match", (d) => matchSet.has(d.master.id));

    // keep the whole visible tree in frame: every render (initial load,
    // topic switch, or a click that reveals/hides a branch) re-fits the
    // zoom so newly expanded nodes never land outside the canvas
    const pad = 130;
    const xs = nodes.map((d) => d.screenX);
    const ys = nodes.map((d) => d.screenY);
    const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
    const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
    const scale = Math.min(bounds.width / (maxX - minX), bounds.height / (maxY - minY), 1.8);
    const clamped = Math.max(scale, zoom.scaleExtent()[0]);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const t = d3.zoomIdentity.translate(bounds.width / 2 - cx * clamped, bounds.height / 2 - cy * clamped).scale(clamped);
    (recenter ? svg : svg.transition().duration(350)).call(zoom.transform, t);
  }

  // ---- expand / collapse all (within current topic) ----
  document.getElementById("expandAll").addEventListener("click", () => {
    roots[state.topicIndex].each((d) => {
      if (d._children) {
        d.children = d._children;
        d._children = null;
      }
    });
    renderTree(false);
  });
  document.getElementById("collapseAll").addEventListener("click", () => {
    roots[state.topicIndex].descendants().forEach((d) => {
      if (d.depth >= 1 && d.children) {
        d._children = d.children;
        d.children = null;
      }
    });
    renderTree(false);
  });

  // ---- global default for whether a question's script panel opens
  // expanded. The per-question "Show script" button still overrides this
  // for a single view; this just sets what a freshly opened question
  // starts as, and re-syncs the currently open one so the effect is
  // immediate rather than waiting for the next click. ----
  const scriptsVisibleToggle = document.getElementById("scriptsVisibleToggle");
  function setScriptsVisible(on) {
    state.scriptsVisible = on;
    try {
      localStorage.setItem("opic-scripts-visible", on ? "1" : "0");
    } catch (e) {}
    scriptsVisibleToggle.setAttribute("aria-pressed", String(on));
    scriptsVisibleToggle.textContent = on ? "👁 Hide all scripts" : "👁 View all scripts";
    if (state.current && state.current.data && state.current.data.type === "question") {
      setCurrent(state.current);
    }
  }
  setScriptsVisible(state.scriptsVisible);
  scriptsVisibleToggle.addEventListener("click", () => setScriptsVisible(!state.scriptsVisible));

  // ---- bulk script + kick export / import: every question, Q1-1 through
  // the last topic's last question, as one file. The heading lines
  // ("===== tag | topic | question =====") are how a re-imported file gets
  // matched back to the right question, so they're the one thing a viewer
  // (or Claude, handed this file back later) shouldn't rewrite — the body
  // under each heading is exactly what ends up in that question's script
  // box, and each "[kicks]" line under it is one script beat's kick
  // phrases, tagged with that beat's id in brackets so an edit still finds
  // its way back even if the label text or line order changes. ----
  const ALL_SCRIPTS_HEADING_RE = /^===== (\S+) \|/;
  const PRACTICE_MARKER = "[practice]";
  const KICKS_MARKER = "[kicks]";
  const KICK_LINE_RE = /^.*\[([\w-]+)\]:\s*(.*)$/;

  function buildAllScriptsText() {
    const lines = [
      "# OPIc Forest — all practice scripts and kick phrases",
      `# Exported ${new Date().toISOString().slice(0, 10)}.`,
      '# Edit the text under a heading, then use "Import all scripts" to load your edits back in.',
      "# Don't edit the heading lines themselves (===== tag | topic | question =====) or the [id] tag on a kicks line — they're how an edit gets matched back to the right question/beat.",
      "# Kick phrases for a beat go on one line, separated by semicolons.",
      "",
    ];
    questionIndex.forEach((e) => {
      lines.push(`===== ${e.tag} | ${e.topic} | ${e.question} =====`);
      lines.push(effectiveScriptFor(e.node));
      lines.push("");
      lines.push(PRACTICE_MARKER);
      lines.push(String(getPracticeCount(e.id)));
      lines.push("");
      lines.push(KICKS_MARKER);
      (e.node.children || []).forEach((p) => {
        lines.push(`${p.name} [${p.id}]: ${effectiveKicksFor(p).join("; ")}`);
      });
      lines.push("");
    });
    return lines.join("\n").trim() + "\n";
  }

  function parseAllScriptsText(text) {
    const lines = text.replace(/\r\n/g, "\n").split("\n");
    const rawEntries = [];
    let currentTag = null;
    let buf = [];
    function flush() {
      if (currentTag) rawEntries.push({ tag: currentTag, raw: buf.join("\n") });
      buf = [];
    }
    for (const line of lines) {
      const m = ALL_SCRIPTS_HEADING_RE.exec(line);
      if (m) {
        flush();
        currentTag = m[1];
      } else if (currentTag) {
        buf.push(line);
      }
    }
    flush();

    return rawEntries.map(({ tag, raw }) => {
      const kicksIdx = raw.indexOf(KICKS_MARKER);
      const beforeKicks = kicksIdx === -1 ? raw : raw.slice(0, kicksIdx);
      const kicksPart = kicksIdx === -1 ? "" : raw.slice(kicksIdx + KICKS_MARKER.length);

      const practiceIdx = beforeKicks.indexOf(PRACTICE_MARKER);
      const scriptPart = practiceIdx === -1 ? beforeKicks : beforeKicks.slice(0, practiceIdx);
      const practicePart = practiceIdx === -1 ? "" : beforeKicks.slice(practiceIdx + PRACTICE_MARKER.length);
      // null (not undefined) means "this file predates the [practice]
      // marker" — leave the existing count alone rather than reset it to 0.
      const practiceMatch = practicePart.match(/-?\d+/);
      const practiceCount = practiceMatch ? Math.max(0, parseInt(practiceMatch[0], 10)) : null;

      const kickEntries = [];
      kicksPart.split("\n").forEach((line) => {
        const km = KICK_LINE_RE.exec(line.trim());
        if (km) {
          kickEntries.push({ id: km[1], kicks: km[2].split(";").map((s) => s.trim()).filter((s) => s.length) });
        }
      });
      return { tag, body: scriptPart.trim(), practiceCount, kickEntries };
    });
  }

  function applyImportedScripts(entries) {
    let applied = 0;
    let kicksApplied = 0;
    let practiceApplied = 0;
    const unknown = [];
    entries.forEach(({ tag, body, practiceCount, kickEntries }) => {
      const e = questionByTag[tag];
      if (!e) {
        unknown.push(tag);
        return;
      }
      try {
        localStorage.setItem(`opic-script:${e.id}`, body);
      } catch (err) {}
      applied++;
      if (practiceCount !== null) {
        setPracticeCount(e.id, practiceCount);
        practiceApplied++;
      }

      (kickEntries || []).forEach(({ id: pid, kicks }) => {
        const paragraphData = paragraphById[pid];
        if (!paragraphData) return;
        try {
          localStorage.setItem(kicksKey(pid), JSON.stringify(kicks));
        } catch (err) {}
        paragraphData.children = kicks.map((text, i) => ({ id: `${pid}-k${i}`, name: text, type: "kick", full: text }));
        reindexKicksFor(paragraphData);
        kicksApplied++;
      });
    });
    // a bulk import can touch beats in topics that aren't on screen right
    // now, so rebuild every topic's tree fresh from the (already mutated)
    // FOREST data rather than trying to patch hierarchy nodes scattered
    // across roots we may not have visited yet.
    if (kicksApplied) {
      roots = FOREST.map(buildRoot);
      setCurrent(null);
      renderTree(true);
    } else if (applied || practiceApplied) {
      // no hierarchy change needed for a script/practice-only import —
      // just redraw so every question's corner chip picks up its new
      // count, and re-render the open panel (if it's a question) so its
      // script box and takes list reflect the import too.
      renderTree(false);
      if (state.current && state.current.data && state.current.data.type === "question") {
        setCurrent(state.current);
      }
    }
    return { applied, unknown, kicksApplied, practiceApplied };
  }

  // ---- "Export data" / "Import data": everything above, PLUS the actual
  // recording files. Recordings are binary, so the file is now JSON — a
  // "scriptsText" field carrying the exact same heading-based text
  // buildAllScriptsText() always produced (still handable to Claude as-is
  // for the Doc-editing workflow), a "takes" map with each question's full
  // take metadata (not just a bare count, so hasRecording/kicksMarked
  // round-trip losslessly), and a "recordings" array of every IndexedDB
  // entry, base64-encoded. Importing a JSON file like this REPLACES each
  // question's takes wholesale (a real restore, not the old count-only
  // pad-up) and restores every recording blob; importing an old plain
  // .txt export still works too, via the same pad-up-only path as before. ----
  const DATA_EXPORT_VERSION = 2;

  async function buildDataExportPayload() {
    const takesByQuestion = {};
    questionIndex.forEach((e) => {
      const t = takesFor(e.id);
      if (t.length) takesByQuestion[e.id] = t;
    });
    const recordings = await collectAllRecordings();
    return {
      version: DATA_EXPORT_VERSION,
      exportedAt: new Date().toISOString(),
      scriptsText: buildAllScriptsText(),
      takes: takesByQuestion,
      recordings,
    };
  }

  async function applyDataExportPayload(payload) {
    const entries = parseAllScriptsText(String(payload.scriptsText || ""));
    const { applied, unknown, kicksApplied } = applyImportedScripts(entries);
    let takesRestored = 0;
    const takesMap = payload.takes && typeof payload.takes === "object" ? payload.takes : {};
    Object.keys(takesMap).forEach((qid) => {
      const arr = takesMap[qid];
      if (Array.isArray(arr)) {
        saveTakes(qid, arr);
        takesRestored++;
      }
    });
    let recordingsRestored = 0;
    for (const rec of payload.recordings || []) {
      if (!rec || !rec.key || !rec.dataBase64) continue;
      try {
        const blob = base64ToBlob(rec.dataBase64, rec.mimeType);
        const ok = await putRecording(rec.key, { blob, mimeType: rec.mimeType, createdAt: rec.createdAt });
        if (ok) recordingsRestored++;
      } catch (e) {}
    }
    return { applied, unknown, kicksApplied, takesRestored, recordingsRestored };
  }

  const topbarStatus = document.getElementById("topbarStatus");

  document.getElementById("exportAllBtn").addEventListener("click", async () => {
    showScriptStatus(topbarStatus, "Gathering scripts, kicks, takes, and recordings…");
    try {
      const payload = await buildDataExportPayload();
      await saveTextFile(
        "opic-forest-data.json",
        JSON.stringify(payload),
        topbarStatus,
        `Exported ${questionIndex.length} scripts and ${payload.recordings.length} recording${payload.recordings.length === 1 ? "" : "s"}.`
      );
    } catch (e) {
      showScriptStatus(topbarStatus, "Couldn't export data.", true);
    }
  });

  const importAllInput = document.getElementById("importAllInput");
  document.getElementById("importAllBtn").addEventListener("click", () => importAllInput.click());
  importAllInput.addEventListener("change", () => {
    const file = importAllInput.files && importAllInput.files[0];
    importAllInput.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const text = String(reader.result || "");
      let payload = null;
      try {
        const parsed = JSON.parse(text);
        if (parsed && typeof parsed === "object" && typeof parsed.scriptsText === "string") payload = parsed;
      } catch (e) {}

      if (payload) {
        showScriptStatus(topbarStatus, "Restoring scripts, kicks, takes, and recordings…");
        try {
          const { applied, unknown, kicksApplied, takesRestored, recordingsRestored } = await applyDataExportPayload(payload);
          renderTree(false);
          if (state.current && state.current.data && state.current.data.type === "question") setCurrent(state.current);
          let msg = applied ? `Imported ${applied} script${applied === 1 ? "" : "s"}` : "No matching questions found in that file.";
          const extras = [];
          if (kicksApplied) extras.push(`${kicksApplied} beats' kick phrases`);
          if (takesRestored) extras.push(`${takesRestored} question${takesRestored === 1 ? "" : "s"}' takes`);
          if (recordingsRestored) extras.push(`${recordingsRestored} recording${recordingsRestored === 1 ? "" : "s"}`);
          msg += extras.length ? ` and ${extras.join(", ")}.` : ".";
          if (unknown.length) msg += ` ${unknown.length} unrecognized tag${unknown.length === 1 ? "" : "s"} skipped.`;
          showScriptStatus(topbarStatus, msg, applied === 0);
        } catch (e) {
          showScriptStatus(topbarStatus, "Couldn't restore that file.", true);
        }
        return;
      }

      // legacy plain-text export (from before recordings existed, or a
      // hand-edited .txt) — same pad-up-only path as always.
      const entries = parseAllScriptsText(text);
      const { applied, unknown, kicksApplied, practiceApplied } = applyImportedScripts(entries);
      let msg = applied ? `Imported ${applied} script${applied === 1 ? "" : "s"}` : "No matching questions found in that file.";
      if (applied) {
        const extras = [];
        if (practiceApplied) extras.push(`${practiceApplied} practice count${practiceApplied === 1 ? "" : "s"}`);
        if (kicksApplied) extras.push(`${kicksApplied} beats' kick phrases`);
        msg += extras.length ? ` and ${extras.join(", ")}.` : ".";
      }
      if (unknown.length) msg += ` ${unknown.length} unrecognized tag${unknown.length === 1 ? "" : "s"} skipped.`;
      showScriptStatus(topbarStatus, msg, applied === 0);
    };
    reader.onerror = () => showScriptStatus(topbarStatus, "Couldn't read that file.", true);
    reader.readAsText(file);
  });

  // ---- Google Drive sync: sign in once per device, and every signed-in
  // device stays caught up automatically — no more re-loading scripts/
  // kicks/takes/recordings by hand after switching phones or laptops.
  //
  // Only runs outside the claude.ai Artifact sandbox (same window.claude
  // check saveTextFile() uses above) — that sandbox's CSP blocks requests
  // to Google's own domains entirely, the same hard limit that already
  // keeps microphone recording GitHub-Pages-only.
  //
  // This is really just buildDataExportPayload()/applyDataExportPayload()
  // (the exact same pair "Export data"/"Import data" already use) pointed
  // at one fixed file in the signed-in account's Drive instead of a
  // downloaded/picked file. Whichever side's payload has the newer
  // exportedAt timestamp wins on each sync; if a remote change and a
  // local change both land between two syncs (two devices used within
  // the same window), the remote one is pulled in first and the local
  // edit still goes out on the very next sync right after — simple
  // last-write-wins on the whole payload, not a per-field merge, which
  // is a reasonable trade for one person's own practice data.
  //
  // Setup: needs a Google Cloud "OAuth client ID" (see README) —
  // GOOGLE_DRIVE_CLIENT_ID is a placeholder until that's filled in, and
  // the whole feature (including its topbar button) quietly stays off
  // until it is.
  const GOOGLE_DRIVE_CLIENT_ID = "711587343806-lq1mplnk653f4v46pq0t5hs8ap6pe0qp.apps.googleusercontent.com";
  const GOOGLE_DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
  const DRIVE_SYNC_FILENAME = "opic-forest-sync.json";
  const DRIVE_SYNC_REMEMBER_KEY = "opic-drive-sync-enabled";
  const DRIVE_SYNC_TOKEN_CACHE_KEY = "opic-drive-access-token"; // sessionStorage — see loadCachedToken() below
  const DRIVE_SYNC_INTERVAL_MS = 600000; // background sync tick — 10 minutes

  (function setupGoogleDriveSync() {
    const inArtifactSandbox = window.claude && typeof window.claude.use === "function";
    const configured = GOOGLE_DRIVE_CLIENT_ID && GOOGLE_DRIVE_CLIENT_ID.indexOf("YOUR_CLIENT_ID") !== 0;
    if (inArtifactSandbox || !configured) return;

    const btn = document.getElementById("driveSyncBtn");
    const statusEl = document.getElementById("driveSyncStatus");
    if (!btn) return;
    btn.hidden = false;

    let tokenClient = null;
    let gisLoadPromise = null;
    let accessToken = null;
    let fileId = null; // this account's Drive file id, once found or created
    let lastSyncedAt = null; // exportedAt of whatever we last successfully synced, either direction
    let syncTimer = null;
    let syncInFlight = false;

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.style.color = isError ? "var(--kick)" : "var(--muted)";
    }
    function setSignedInUi(on) {
      btn.textContent = on ? "🔄 Sync now" : "🔐 Sign in to sync";
      btn.setAttribute("aria-pressed", String(on));
    }

    // loaded lazily (only once sync is actually attempted), same reasoning
    // as loadLamejs() above — no point requesting it from a viewer who
    // never touches this feature.
    function loadGoogleIdentityServices() {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
      if (gisLoadPromise) return gisLoadPromise;
      gisLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://accounts.google.com/gsi/client";
        script.onload = () => (window.google && window.google.accounts ? resolve() : reject(new Error("Google sign-in didn't load")));
        script.onerror = () => reject(new Error("Google sign-in didn't load"));
        document.head.appendChild(script);
      });
      return gisLoadPromise;
    }

    // requestAccessToken() always briefly opens (and, if it succeeds
    // silently, auto-closes) a real popup window to accounts.google.com —
    // even with prompt:'' for an already-consented session. That's a
    // Google Identity Services characteristic this page's own code can't
    // suppress; the popup is a separate top-level window, not something
    // in this page's DOM. What *is* avoidable is triggering that popup on
    // every single page load: an access token is normally good for about
    // an hour, so caching it (with its own expiry) in sessionStorage
    // means every reload within that hour reuses the same token with NO
    // Google interaction at all — only once the cached token is actually
    // about to expire does a fresh (flashing) silent reauth happen again.
    function cacheToken(token, expiresInSec) {
      try {
        sessionStorage.setItem(DRIVE_SYNC_TOKEN_CACHE_KEY, JSON.stringify({ token, expiresAt: Date.now() + (expiresInSec || 3600) * 1000 }));
      } catch (e) {}
    }
    function loadCachedToken() {
      let raw = null;
      try {
        raw = sessionStorage.getItem(DRIVE_SYNC_TOKEN_CACHE_KEY);
      } catch (e) {}
      if (!raw) return null;
      try {
        const parsed = JSON.parse(raw);
        // a couple minutes' safety margin, so a sync mid-flight doesn't
        // start against a token that expires before it finishes
        if (parsed && parsed.token && parsed.expiresAt > Date.now() + 120000) return parsed.token;
      } catch (e) {}
      return null;
    }

    function ensureTokenClient() {
      if (tokenClient) return Promise.resolve(tokenClient);
      return loadGoogleIdentityServices().then(() => {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_DRIVE_CLIENT_ID,
          scope: GOOGLE_DRIVE_SCOPE,
          callback: (resp) => {
            if (resp && resp.access_token) {
              accessToken = resp.access_token;
              cacheToken(resp.access_token, resp.expires_in);
              onSignedIn();
            } else {
              setStatus("Sign-in didn't complete.", true);
              setSignedInUi(false);
            }
          },
          error_callback: () => {
            setStatus("Signed out — tap to sign in again.", true);
            setSignedInUi(false);
          },
        });
        return tokenClient;
      });
    }

    function driveHeaders(extra) {
      return Object.assign({ Authorization: `Bearer ${accessToken}` }, extra || {});
    }

    // Google's own error responses are JSON like {"error":{"code":403,
    // "message":"Google Drive API has not been used in project ... before
    // or it is disabled ..."}} — surfacing that real message (instead of
    // just "403") is the difference between a status bar someone can
    // actually act on and one that just says "something went wrong."
    async function driveErrorMessage(res) {
      let body = "";
      try {
        body = await res.text();
      } catch (e) {}
      try {
        const parsed = JSON.parse(body);
        if (parsed && parsed.error && parsed.error.message) return `${res.status}: ${parsed.error.message}`;
      } catch (e) {}
      return `${res.status}${body ? ": " + body.slice(0, 200) : ""}`;
    }

    async function driveFindFile() {
      const q = encodeURIComponent(`name='${DRIVE_SYNC_FILENAME}' and trashed=false`);
      const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id)`, {
        headers: driveHeaders(),
      });
      if (!res.ok) throw new Error(`Couldn't look up the sync file (${await driveErrorMessage(res)})`);
      const data = await res.json();
      return data.files && data.files[0] ? data.files[0].id : null;
    }

    async function driveDownload(id) {
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: driveHeaders() });
      if (!res.ok) throw new Error(`Couldn't download the sync file (${await driveErrorMessage(res)})`);
      return res.json();
    }

    // one multipart request carries both the file's metadata and its
    // (possibly large, with recordings embedded as base64) JSON content —
    // creates the file the first time (POST, no id yet), updates it every
    // sync after that (PATCH, same id).
    async function driveUpload(id, payload) {
      const boundary = "opicforest" + Math.random().toString(36).slice(2);
      const metadataPart = id ? {} : { name: DRIVE_SYNC_FILENAME, mimeType: "application/json" };
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadataPart)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n` +
        `--${boundary}--`;
      const url = id
        ? `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart`
        : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
      const res = await fetch(url, {
        method: id ? "PATCH" : "POST",
        headers: driveHeaders({ "Content-Type": `multipart/related; boundary=${boundary}` }),
        body,
      });
      if (!res.ok) throw new Error(`Couldn't upload the sync file (${await driveErrorMessage(res)})`);
      const data = await res.json();
      return data.id;
    }

    async function syncNow() {
      if (!accessToken || syncInFlight) return;
      syncInFlight = true;
      setStatus("Syncing…");
      try {
        if (!fileId) fileId = await driveFindFile();

        let remote = null;
        if (fileId) {
          try {
            remote = await driveDownload(fileId);
          } catch (e) {}
        }

        const remoteIsNewer = remote && remote.exportedAt && (!lastSyncedAt || remote.exportedAt > lastSyncedAt);
        if (remoteIsNewer) {
          applyingRemoteSyncPayload = true;
          try {
            await applyDataExportPayload(remote);
            renderTree(false);
            if (state.current && state.current.data && state.current.data.type === "question") setCurrent(state.current);
          } finally {
            applyingRemoteSyncPayload = false;
          }
          lastSyncedAt = remote.exportedAt;
          driveSyncDirty = false;
        }

        // still dirty after a possible pull (a real local change, not one
        // that just came FROM that pull) — or there's simply no file up
        // there yet at all — push. Uses the payload's own exportedAt
        // (stamped fresh by buildDataExportPayload) as the new watermark.
        if (driveSyncDirty || !fileId) {
          const payload = await buildDataExportPayload();
          const newId = await driveUpload(fileId, payload);
          fileId = fileId || newId;
          lastSyncedAt = payload.exportedAt;
          driveSyncDirty = false;
        }

        setStatus(`Synced ${new Date().toLocaleTimeString()}`);
      } catch (e) {
        // show the real reason (e.g. "403: Google Drive API has not been
        // used in project ... or it is disabled") rather than a generic
        // "something went wrong" — this is usually a one-time setup
        // problem (API not enabled, scope not granted) the viewer can
        // actually act on, not a transient network hiccup.
        setStatus(`Sync failed: ${(e && e.message) || "unknown error"} — will retry.`, true);
      } finally {
        syncInFlight = false;
      }
    }

    // gating this on driveSyncDirty would only ever let a device PUSH its
    // own edits on a timer — it would never notice another device's
    // edits on its own, since pulling only happens as a side effect of
    // syncNow() actually running. A device with nothing new to say still
    // needs to keep periodically asking "does Drive have something new
    // for ME" — so this runs every tick regardless of dirty state;
    // syncNow() itself is what skips the (more expensive) upload half
    // when there's nothing dirty to send.
    function scheduleSyncLoop() {
      if (syncTimer) return;
      syncTimer = window.setInterval(() => {
        if (accessToken) syncNow();
      }, DRIVE_SYNC_INTERVAL_MS);
    }

    function onSignedIn() {
      setSignedInUi(true);
      setStatus("Signed in — syncing…");
      try {
        localStorage.setItem(DRIVE_SYNC_REMEMBER_KEY, "1");
      } catch (e) {}
      scheduleSyncLoop();
      syncNow();
    }

    btn.addEventListener("click", () => {
