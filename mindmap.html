"t4-q3-p0", "name": "intro", "type": "paragraph", "full": "(intro) let me tell you my secret", "children": [{"id": "t4-q3-p0-k0", "name": "let me tell you my secret", "type": "kick", "full": "let me tell you my secret"}]}, {"id": "t4-q3-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) my mom's recommendation is always spot-on", "children": [{"id": "t4-q3-p1-k0", "name": "have always been spot-on", "type": "kick", "full": "have always been spot-on"}, {"id": "t4-q3-p1-k1", "name": "sign up for", "type": "kick", "full": "sign up for"}]}, {"id": "t4-q3-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the location, and subway 2 or 9 is fastest", "children": [{"id": "t4-q3-p2-k0", "name": "in the heart of Gangnam", "type": "kick", "full": "in the heart of Gangnam"}, {"id": "t4-q3-p2-k1", "name": "the fastest way", "type": "kick", "full": "the fastest way"}]}, {"id": "t4-q3-p3", "name": "body 3", "type": "paragraph", "full": "(body 3) the orange building with a digital clock", "children": [{"id": "t4-q3-p3-k0", "name": "the outstanding orange-color building", "type": "kick", "full": "the outstanding orange-color building"}]}, {"id": "t4-q3-p4", "name": "closing", "type": "paragraph", "full": "(closing) call me anytime for directions", "children": [{"id": "t4-q3-p4-k0", "name": "clear directions on how to get there", "type": "kick", "full": "clear directions on how to get there"}]}]}]}, {"id": "t5", "name": "Workplace", "type": "topic", "full": "Workplace", "scriptUrl": "https://docs.google.com/document/d/1BhvIr78GekPdqhoJsyEdy3FZD3nXfOdWGJRBmggH4zI/edit", "children": [{"id": "t5-q0", "name": "the office", "tag": "6-1", "type": "question", "full": "Describe your office in detail. What does it look like? What kind of furniture and equipment are there?", "script": "All right, my work place. Follow me, let me guide you to my workplace.\n\nEva, do you see that massive building with those three towers? The building is named DSR, and my workplace is located in Tower A. When you walk in through the rotating door, you can see Starbucks on the left and the Samsung mobile store on the right. Oh, my workplace is in the security area, so we have to go through the security gate. After passing the gate, you can find the testing lab on the sixth floor where various equipment is running 24/7. I often visit the lab to figure out a potential defect that may exist on my device. Well, the testers are fully automatic and connected to my company's intranet, so I can control or monitor all the processes at my seat. Let's go to the 17th floor. My seat is are there.\n\nThe 17th floor is my office. I belong to a design team where hundreds of employees are working. Well, there aren't any particular specials on my seat, it just looks like a normal office. I have my notebook connected to my dual monitors, the wireless keyboard and the wireless mouse on the desk mat.\n\nThat's it, Eva.", "children": [{"id": "t5-q0-p0", "name": "intro", "type": "paragraph", "full": "(intro) follow me, let me guide you to my workplace", "children": [{"id": "t5-q0-p0-k0", "name": "let me guide you to", "type": "kick", "full": "let me guide you to"}]}, {"id": "t5-q0-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) the massive building and the security gate", "children": [{"id": "t5-q0-p1-k0", "name": "massive building with three towers", "type": "kick", "full": "massive building with three towers"}, {"id": "t5-q0-p1-k1", "name": "the rotating door", "type": "kick", "full": "the rotating door"}, {"id": "t5-q0-p1-k2", "name": "go through the security gate", "type": "kick", "full": "go through the security gate"}]}, {"id": "t5-q0-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the testing lab on the sixth floor", "children": [{"id": "t5-q0-p2-k0", "name": "running 24/7", "type": "kick", "full": "running 24/7"}, {"id": "t5-q0-p2-k1", "name": "a potential defect", "type": "kick", "full": "a potential defect"}, {"id": "t5-q0-p2-k2", "name": "monitor all the processes at my seat", "type": "kick", "full": "monitor all the processes at my seat"}]}, {"id": "t5-q0-p3", "name": "body 3", "type": "paragraph", "full": "(body 3) the seventeenth floor, my desk in the design team", "children": [{"id": "t5-q0-p3-k0", "name": "I belong to a design team", "type": "kick", "full": "I belong to a design team"}, {"id": "t5-q0-p3-k1", "name": "aren't any particular specials", "type": "kick", "full": "aren't any particular specials"}, {"id": "t5-q0-p3-k2", "name": "on the desk mat", "type": "kick", "full": "on the desk mat"}]}, {"id": "t5-q0-p4", "name": "closing", "type": "paragraph", "full": "(closing) that's it", "children": []}]}, {"id": "t5-q1", "name": "office then vs. now", "tag": "6-2", "type": "question", "full": "Think about the office you work in now and offices in the past. What's different about the environment, the equipment, and the atmosphere?", "script": "Well, regarding the changes of my workplace, definitely, COVID-19 was the tipping point.\n\nYou know, during COVID-19, every kind of offline gathering was prohibited and changed to online. My company also went through the paradigm shift, so we had an online meeting, online teaching, an onlline conference, and even an online company dinner! Well, there was a positive side for sure, for example we could freely exit meetings without feeling self-conscious and we could attend international conferences remotely from Korea. But I felt a bit stuffy at that time, because I couldn't talk with other people freely and I had to always wear my dental mask all day long.\n\nAfter the pandemic subsided, our relaxing area reopened with a full renovation. I was so glad to use the canteen room again,as stopping by the coffee machine was a staple of my morning routine. You know what? Actually, the canteen is fully equipped with fun stuff, including a dartboard, a Playstation room, folding beds, and even some massage chairs in the corner.\n\nWell Eva, though I had a tough time during COVID-19, I really appreciated the upgraded canteen room anyway.", "children": [{"id": "t5-q1-p0", "name": "intro", "type": "paragraph", "full": "(intro) COVID-19 was the tipping point", "children": [{"id": "t5-q1-p0-k0", "name": "the tipping point", "type": "kick", "full": "the tipping point"}]}, {"id": "t5-q1-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) everything went online, the good and the stuffy", "children": [{"id": "t5-q1-p1-k0", "name": "went through the paradigm shift", "type": "kick", "full": "went through the paradigm shift"}, {"id": "t5-q1-p1-k1", "name": "without feeling self-conscious", "type": "kick", "full": "without feeling self-conscious"}, {"id": "t5-q1-p1-k2", "name": "felt a bit stuffy", "type": "kick", "full": "felt a bit stuffy"}]}, {"id": "t5-q1-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) after the pandemic, a fully renovated canteen", "children": [{"id": "t5-q1-p2-k0", "name": "the pandemic subsided", "type": "kick", "full": "the pandemic subsided"}, {"id": "t5-q1-p2-k1", "name": "a staple of my morning routine", "type": "kick", "full": "a staple of my morning routine"}, {"id": "t5-q1-p2-k2", "name": "fully equipped with fun stuff", "type": "kick", "full": "fully equipped with fun stuff"}]}, {"id": "t5-q1-p3", "name": "closing", "type": "paragraph", "full": "(closing) a tough time, but I appreciated the upgrade", "children": [{"id": "t5-q1-p3-k0", "name": "I really appreciated", "type": "kick", "full": "I really appreciated"}]}]}, {"id": "t5-q2", "name": "first job", "tag": "6-3", "type": "question", "full": "Tell me about your first job. What kind of company was it and what did you do there?", "script": "Well, my first job. That question takes me back to high school, when I first had to decide which college and department to pursue. At that time, I was at a crossroads between medical school and electrical engineering. But in fact, my father was an electrical engineer so he nudged me toward pursuing a career in engineering. So I got into Seoul National University and I continued my studies and obtained my Ph.D. at the same school. As I received a Samsung scholarship during my Ph.D. course, well it was natural to join Samsung after my graduation. When I was a graduate student, I was a lot curious about the life of an engineer in a big company. Because I heard from someone that engineers in a big company are treated as just another cog in the machine. However, after going through it myself, I came to realize that the place was a field to draw a future of both the company and me. I really enjoyed my role as a technical leader, collaborating with a brillant team to develop cutting-edge devices.\n\nI really grew a lot with the company. That's it Eva!", "children": [{"id": "t5-q2-p0", "name": "intro", "type": "paragraph", "full": "(intro) the question takes me back to high school", "children": [{"id": "t5-q2-p0-k0", "name": "takes me back to", "type": "kick", "full": "takes me back to"}, {"id": "t5-q2-p0-k1", "name": "at a crossroads between", "type": "kick", "full": "at a crossroads between"}, {"id": "t5-q2-p0-k2", "name": "nudged me toward", "type": "kick", "full": "nudged me toward"}]}, {"id": "t5-q2-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) the path from SNU to a Ph.D. to Samsung", "children": [{"id": "t5-q2-p1-k0", "name": "obtained my Ph.D.", "type": "kick", "full": "obtained my Ph.D."}, {"id": "t5-q2-p1-k1", "name": "it was natural to", "type": "kick", "full": "it was natural to"}]}, {"id": "t5-q2-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) I expected a cog in the machine, but found a field", "children": [{"id": "t5-q2-p2-k0", "name": "just another cog in the machine", "type": "kick", "full": "just another cog in the machine"}, {"id": "t5-q2-p2-k1", "name": "after going through it myself", "type": "kick", "full": "after going through it myself"}, {"id": "t5-q2-p2-k2", "name": "a field to draw a future", "type": "kick", "full": "a field to draw a future"}]}, {"id": "t5-q2-p3", "name": "closing", "type": "paragraph", "full": "(closing) I really grew a lot with the company", "children": [{"id": "t5-q2-p3-k0", "name": "as a technical leader", "type": "kick", "full": "as a technical leader"}, {"id": "t5-q2-p3-k1", "name": "cutting-edge devices", "type": "kick", "full": "cutting-edge devices"}, {"id": "t5-q2-p3-k2", "name": "grew a lot with", "type": "kick", "full": "grew a lot with"}]}]}]}, {"id": "t6", "name": "Technology", "type": "topic", "full": "Technology", "scriptUrl": "https://docs.google.com/document/d/1QiMFGqbfunsrDgxqrJnJWs1Ofph6imUmsr56VPoO7As/edit", "children": [{"id": "t6-q0", "name": "tech at school", "tag": "7-1", "type": "question", "full": "These days, lots of technologies are used at school. What are they? And how are they convenient? Tell me everything with examples", "script": "Technology has had a significant impact on schools, transforming both the teaching and learning experiences. This has been accelerated with the development of AI, resulting in both positive and negative impacts.\n\nActually, my wife has recently been appointed as a professor to Dongnam university, and she was concerned about preparing her lecture materials. Well, she was in panic realizing that she didn't have any materials made even a week before the start of a semester! Watching her struggle, I suggested her to use AI. AI made her 30-page long materials within an hour! Like this experience, I've heard that more and more lecture materials are being created using AI. The AI has significantly lessened the workload of preparing lecture materials, allowing professors to dedicate more time to their research.\n\nHowever, AI also brought some negative downsides for sure. Students often just dump their homework on AI without even thinking about it. Furthermore, some students tend to skip fundamentals altogether, relying on AI to predict the exam questions. The more they rely on AI, the less they think by themselves.\n\nWell, AI did bring us convenience, but also we need to be wary of its side effects. I think schools should teach students how to use AI wisely to prevent misuse of AI.", "children": [{"id": "t6-q0-p0", "name": "intro", "type": "paragraph", "full": "(intro) technology is transforming teaching and learning", "children": [{"id": "t6-q0-p0-k0", "name": "has had a significant impact", "type": "kick", "full": "has had a significant impact"}, {"id": "t6-q0-p0-k1", "name": "has been accelerated with", "type": "kick", "full": "has been accelerated with"}]}, {"id": "t6-q0-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) my wife was in panic a week before the semester", "children": [{"id": "t6-q0-p1-k0", "name": "was appointed as", "type": "kick", "full": "was appointed as"}, {"id": "t6-q0-p1-k1", "name": "she was in panic", "type": "kick", "full": "she was in panic"}]}, {"id": "t6-q0-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) AI made her materials within an hour", "children": [{"id": "t6-q0-p2-k0", "name": "within an hour", "type": "kick", "full": "within an hour"}, {"id": "t6-q0-p2-k1", "name": "lessened the workload", "type": "kick", "full": "lessened the workload"}, {"id": "t6-q0-p2-k2", "name": "dedicate more time to", "type": "kick", "full": "dedicate more time to"}]}, {"id": "t6-q0-p3", "name": "body 3", "type": "paragraph", "full": "(body 3) the downside, students dumping homework on AI", "children": [{"id": "t6-q0-p3-k0", "name": "dump their homework on AI", "type": "kick", "full": "dump their homework on AI"}, {"id": "t6-q0-p3-k1", "name": "skip fundamentals altogether", "type": "kick", "full": "skip fundamentals altogether"}, {"id": "t6-q0-p3-k2", "name": "the more they rely the less they think", "type": "kick", "full": "the more they rely the less they think"}]}, {"id": "t6-q0-p4", "name": "closing", "type": "paragraph", "full": "(closing) schools should teach how to use AI wisely", "children": [{"id": "t6-q0-p4-k0", "name": "be wary of its side effects", "type": "kick", "full": "be wary of its side effects"}, {"id": "t6-q0-p4-k1", "name": "use AI wisely", "type": "kick", "full": "use AI wisely"}]}]}, {"id": "t6-q1", "name": "daily tech", "tag": "7-2", "type": "question", "full": "Tell me about the technology that you use a lot in your daily life. What are the devices that you use and how are they convenient? Are there any problems appearing? Please tell me all the merits and demerits of current technology that you use daily.", "script": "We are living in the era of smartphones, and we can't call our days convenient without mentioning our smartphones.\n\nEverything can be done easily with a few finger taps, whether it may be checking our bank balance, or messaging our friends abroad. For me, mobile stock trading is the most useful feature among them. You know, I remember my father calling his fund manager to sell or buy stocks. That seemed so uncomfortable given that  stock trading is such a frequently-occurred and time-sensitive activity. With my mobile trading system on my smartphone, I can trade stocks whenever and wherever I want with unlimitied time and place.\n\nIronically, this convenience often takes the joy out of our daily lives. Convenient stock trading is indeed a double-edged sword in that some people do nothing but to look at their stock prices. People are always busy doing something with their smartphones, I'm not sure whether that is of any great importance though, they create a huge barrier to meaningful communication with others. This smartphone addiction took away valuable face-to-face communication even when they're together.\n\nWell, it's our responsibility to control our use of technology, and to not let it distract us from what's more important and meaningful in our lives.", "children": [{"id": "t6-q1-p0", "name": "intro", "type": "paragraph", "full": "(intro) we are living in the era of smartphones", "children": [{"id": "t6-q1-p0-k0", "name": "the era of smartphones", "type": "kick", "full": "the era of smartphones"}]}, {"id": "t6-q1-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) mobile trading, versus my father calling his fund manager", "children": [{"id": "t6-q1-p1-k0", "name": "with a few finger taps", "type": "kick", "full": "with a few finger taps"}, {"id": "t6-q1-p1-k1", "name": "time-sensitive", "type": "kick", "full": "time-sensitive"}, {"id": "t6-q1-p1-k2", "name": "whenever and wherever", "type": "kick", "full": "whenever and wherever"}]}, {"id": "t6-q1-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the same convenience takes the joy out of life", "children": [{"id": "t6-q1-p2-k0", "name": "takes the joy out of", "type": "kick", "full": "takes the joy out of"}, {"id": "t6-q1-p2-k1", "name": "a double-edged sword", "type": "kick", "full": "a double-edged sword"}, {"id": "t6-q1-p2-k2", "name": "a huge barrier to meaningful communication", "type": "kick", "full": "a huge barrier to meaningful communication"}]}, {"id": "t6-q1-p3", "name": "closing", "type": "paragraph", "full": "(closing) it's our responsibility to control our use", "children": [{"id": "t6-q1-p3-k0", "name": "distract us from", "type": "kick", "full": "distract us from"}]}]}, {"id": "t6-q2", "name": "home appliances", "tag": "7-3", "type": "question", "full": "Many homes today are equipped with new appliances or electronic devices that make everyday life more convenient. What are some of these new appliances or electronic devices in your home? How have they changed household responsibilities?", "script": "Alright Eva, as an engineer, I utilize my home appliances to its maximum. I'd love to tell you about some of my favorites.\n\nOne of my primary household chores is cleaning up after meals. To be honest, my dish washer does it, not me. My wife always says that it is better to wash the dishes by hand, not by the machine. Well, I'm firmly on the other side of that opinion. I believe that the dishwasher is one of the greatest inventings that mankind has ever made. I just open the door, load the dishes and add the detergent and hit the start button! It's such a huge time-saver that liberates me from one of the most monotonous and tedious house chores.\n\nAnother house chore I handle is laundry. Since our family is four, we generate a mountain of laundry every single day. Doing the whole cycle of washing and hanging clothes to dry daily would be physically draining.Well, I always have my plan. Eva, did you know that the brand-new laundry machine provides a full course from washing to drying? There is no need to manually pull out the washed clothes to dry! Just toss the laundry in, and add some detergent and fabric softeners, and hit the start! It's super easy huh?\n\nEva, my credo is to fully utilize the modern conveniences. Why don't you look around for your brand-new home appliances this weekend?", "children": [{"id": "t6-q2-p0", "name": "intro", "type": "paragraph", "full": "(intro) as an engineer, I use my appliances to the maximum", "children": [{"id": "t6-q2-p0-k0", "name": "to its maximum", "type": "kick", "full": "to its maximum"}]}, {"id": "t6-q2-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) cleaning up after meals, and my dishwasher does it", "children": [{"id": "t6-q2-p1-k0", "name": "the dish washer does it not me", "type": "kick", "full": "the dish washer does it not me"}, {"id": "t6-q2-p1-k1", "name": "such a huge time-saver", "type": "kick", "full": "such a huge time-saver"}, {"id": "t6-q2-p1-k2", "name": "monotonous and tedious", "type": "kick", "full": "monotonous and tedious"}]}, {"id": "t6-q2-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) laundry, a mountain of it, and a full course machine", "children": [{"id": "t6-q2-p2-k0", "name": "a mountain of laundry", "type": "kick", "full": "a mountain of laundry"}, {"id": "t6-q2-p2-k1", "name": "physically draining", "type": "kick", "full": "physically draining"}, {"id": "t6-q2-p2-k2", "name": "a full course from washing to drying", "type": "kick", "full": "a full course from washing to drying"}]}, {"id": "t6-q2-p3", "name": "closing", "type": "paragraph", "full": "(closing) my credo, look around this weekend", "children": [{"id": "t6-q2-p3-k0", "name": "my credo", "type": "kick", "full": "my credo"}, {"id": "t6-q2-p3-k1", "name": "look around for", "type": "kick", "full": "look around for"}]}]}, {"id": "t6-q3", "name": "tech then vs. now", "tag": "7-4", "type": "question", "full": "How had technology changed from the past to the present? What kind of technology have you used in the past? How is it different from the technology you use today?", "script": "You know, technology has transformed considerably in the past few decades. It has helped us get things done much easier and faster. And I'd say the smartphone is at the forefront of these changes.\n\nEven about ten years ago, a cell phone was basically what we used only for calling and texting others. Although we could access the internet with cell phones, it came at a hefty price. So for other tasks, we had to use our computers. But after Apple's iphone first unveiled to the world, our whole life has been changed. It was more than just a phone. Rather, it was closer to a mini computer. We could do anything once connected to the internet, such as doing online banking, playing games with friends, surfing the web, and you name it.\n\nIt's truly remarkable, isn't it?", "children": [{"id": "t6-q3-p0", "name": "intro", "type": "paragraph", "full": "(intro) technology has transformed, and the smartphone leads", "children": [{"id": "t6-q3-p0-k0", "name": "has transformed considerably", "type": "kick", "full": "has transformed considerably"}, {"id": "t6-q3-p0-k1", "name": "at the forefront of these changes", "type": "kick", "full": "at the forefront of these changes"}]}, {"id": "t6-q3-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) ten years ago, only calling and texting", "children": [{"id": "t6-q3-p1-k0", "name": "only for calling and texting", "type": "kick", "full": "only for calling and texting"}, {"id": "t6-q3-p1-k1", "name": "at a hefty price", "type": "kick", "full": "at a hefty price"}]}, {"id": "t6-q3-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) after the iPhone, closer to a mini computer", "children": [{"id": "t6-q3-p2-k0", "name": "more than just a phone", "type": "kick", "full": "more than just a phone"}, {"id": "t6-q3-p2-k1", "name": "closer to a mini computer", "type": "kick", "full": "closer to a mini computer"}, {"id": "t6-q3-p2-k2", "name": "and you name it", "type": "kick", "full": "and you name it"}]}, {"id": "t6-q3-p3", "name": "closing", "type": "paragraph", "full": "(closing) it's truly remarkable, isn't it", "children": [{"id": "t6-q3-p3-k0", "name": "truly remarkable", "type": "kick", "full": "truly remarkable"}]}]}, {"id": "t6-q4", "name": "learning new tech", "tag": "7-5", "type": "question", "full": "How did you learn certain skills or technology? Tell me all the steps that you went through to learn that specific skill or technology", "script": "You know, I'm not very tech savvy or an early adaptor. It takes me a while to learn advanced features of high-end devices. That's why I think that either asking my friends for know-hows or watching video clips is the best way to learn instructions of the devices.\n\nI've had a cell phone for a few years, actually I never really used its features other than calling and texting. But my friends were using their smart phones for things like a mini computer! learned a bit from them, but I felt like I still wasn't using my phone to its full potential.\n\nI wanted to learn more, but I didn't know how to. So I searched on Youtube, hoping to find some easy-to-follow tutorial videos with kind explanations. Fortunately, I was able to find videos that taught me how to master my smartphone! Now I can use my phone for everything, including banking, mobile trading, ordering food, you name it. I never realized just how versatile it really was!\n\nAll in all, that's how I feel about learning new skills and technology. Well, I have my friends to ask how, I feel self-conscious about bothering them.  That's why I'm relying on the instructional video! How about you Eva?", "children": [{"id": "t6-q4-p0", "name": "intro", "type": "paragraph", "full": "(intro) not tech savvy, so I ask friends or watch videos", "children": [{"id": "t6-q4-p0-k0", "name": "not very tech savvy", "type": "kick", "full": "not very tech savvy"}, {"id": "t6-q4-p0-k1", "name": "an early adaptor", "type": "kick", "full": "an early adaptor"}, {"id": "t6-q4-p0-k2", "name": "takes me a while", "type": "kick", "full": "takes me a while"}]}, {"id": "t6-q4-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) I had a phone but never used it beyond calls", "children": [{"id": "t6-q4-p1-k0", "name": "to its full potential", "type": "kick", "full": "to its full potential"}]}, {"id": "t6-q4-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) I searched Youtube for easy-to-follow tutorials", "children": [{"id": "t6-q4-p2-k0", "name": "easy-to-follow tutorials", "type": "kick", "full": "easy-to-follow tutorials"}, {"id": "t6-q4-p2-k1", "name": "how versatile it really was", "type": "kick", "full": "how versatile it really was"}]}, {"id": "t6-q4-p3", "name": "closing", "type": "paragraph", "full": "(closing) shy to keep asking, so I rely on videos", "children": [{"id": "t6-q4-p3-k0", "name": "all in all", "type": "kick", "full": "all in all"}, {"id": "t6-q4-p3-k1", "name": "feel self-conscious about", "type": "kick", "full": "feel self-conscious about"}]}]}, {"id": "t6-q5", "name": "tech for a project", "tag": "7-6", "type": "question", "full": "Tell me about the technology you used when you were doing a project. How was it convenient? Tell me about the project and the technology that you used in detail", "script": "One of the projects that I worked on was preparing a presentation at my English course. It was a team project, so you know, the main issue was communication. We had to meet at least twice a week in order to make progress, but it was hard to meet even once a week because of different schedules.\n\nI thought a lot about how to solve this problem, and a good idea hit my mind. I proposed that we switch most of our meetings to online gatherings using Zoom. Everyone agreed, and we could meet up regularly and frequently online. We assigned each other roles, shared information and constructive feedback, and discussed various issues for the presentation. Those were all done online, and we met in person only  when it was necessary such as the day before the presentation. Other than that, we would not be able to give our presentation on time.\n\nThanks to the development of modern technology, we were able to communicate seamlessly, overcoming the limit of physical and temporal constraints we faced before. Looking back on it, I think we used our time and energy as efficiently as possible. Not to mention that we had a very good job on the presentation!", "children": [{"id": "t6-q5-p0", "name": "intro", "type": "paragraph", "full": "(intro) a team presentation, and scheduling was the issue", "children": [{"id": "t6-q5-p0-k0", "name": "make progress", "type": "kick", "full": "make progress"}, {"id": "t6-q5-p0-k1", "name": "because of different schedules", "type": "kick", "full": "because of different schedules"}]}, {"id": "t6-q5-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) a good idea hit my mind, switch to Zoom", "children": [{"id": "t6-q5-p1-k0", "name": "a good idea hit my mind", "type": "kick", "full": "a good idea hit my mind"}, {"id": "t6-q5-p1-k1", "name": "switch to online gatherings", "type": "kick", "full": "switch to online gatherings"}]}, {"id": "t6-q5-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) roles, feedback, and meeting in person only when needed", "children": [{"id": "t6-q5-p2-k0", "name": "assigned each other roles", "type": "kick", "full": "assigned each other roles"}, {"id": "t6-q5-p2-k1", "name": "constructive feedback", "type": "kick", "full": "constructive feedback"}, {"id": "t6-q5-p2-k2", "name": "in person", "type": "kick", "full": "in person"}]}, {"id": "t6-q5-p3", "name": "closing", "type": "paragraph", "full": "(closing) seamless communication beyond time and place", "children": [{"id": "t6-q5-p3-k0", "name": "communicate seamlessly", "type": "kick", "full": "communicate seamlessly"}, {"id": "t6-q5-p3-k1", "name": "physical and temporal constraints", "type": "kick", "full": "physical and temporal constraints"}, {"id": "t6-q5-p3-k2", "name": "not to mention", "type": "kick", "full": "not to mention"}]}]}]}, {"id": "t7", "name": "Park", "type": "topic", "full": "Park", "scriptUrl": "https://docs.google.com/document/d/1VFxUeG0e9lyxTiqjhI-J9GyTjcpAaf_CwMHPuShoyc0/edit", "children": [{"id": "t7-q0", "name": "favorite park", "tag": "8-1", "type": "question", "full": "Can you tell me about your favorite park? Why do you like to go there rather than other places? And how often do you go there?", "script": "There is a park that I usually go to. It is called \"Han-river Park\" having both a beautiful river and plenty of greenery. And the location is perfect, I can go there within ten minutes by foot.\n\nLet me explain more about the park to you, Eva. Either morning or night, Han-river park has its beautiful landscape with lots of attractions. You know, in the morning, simply being out in the open air makes it special for me. Jogging along the riverside helps me clear my mind and relieve stress. It really cheers me up when I feel blue. Well, I also like to take a slow walk on vast, green lawns, which helps me unwind. Actually, I appreciate the landscape of the park more at night. You know what? At night, a variety of food trucks line up at the riverside where  you can see tons of people hanging out, enjoying food and drinks in such an electric atmosphere. The rainbow-colored fountain show is a grand finale of the night.\n\nWell, I try to hit the park at least once a week despite my hectic schedule. You know, my schedule is insane. I come back home at ten PM, so I literally have no time on weekdays. So I usually go to the park on weekends with my family. Well, I do han river aprk, but I also love the way to the river park from my home, as the path is also a park that follows Seongnae Stream with beautiful trees and blooming flowers. We can see many elderly people because there is \"Asan Hospital\" nearby. I'm sure that taking a stroll along this beautiful path would really help them recover much faster. After a ten minute-walk, I can arrive at \"Han-river Park\" , which has a beautiful landscape with lots of attractions. Jogging along the riverside helps me clear my mind and relieve stress. It really cheers me up when I feel blue. Well, I also like to take a slow walk on vast, green lawns, which really makes me unwind.\n\nThat's it Eva!", "children": [{"id": "t7-q0-p0", "name": "intro", "type": "paragraph", "full": "(intro) Han-river Park, a river and plenty of greenery", "children": [{"id": "t7-q0-p0-k0", "name": "plenty of greenery", "type": "kick", "full": "plenty of greenery"}, {"id": "t7-q0-p0-k1", "name": "helps me unwind", "type": "kick", "full": "helps me unwind"}]}, {"id": "t7-q0-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) mornings, jogging and slow walks on the lawns", "children": [{"id": "t7-q0-p1-k0", "name": "out in the open air", "type": "kick", "full": "out in the open air"}, {"id": "t7-q0-p1-k1", "name": "soaking in the peaceful atmosphere", "type": "kick", "full": "soaking in the peaceful atmosphere"}, {"id": "t7-q0-p1-k2", "name": "when I'm feeling blue", "type": "kick", "full": "when I'm feeling blue"}]}, {"id": "t7-q0-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) nights, food trucks and the fountain show", "children": [{"id": "t7-q0-p2-k0", "name": "food trucks line up", "type": "kick", "full": "food trucks line up"}, {"id": "t7-q0-p2-k1", "name": "such an electric atmosphere", "type": "kick", "full": "such an electric atmosphere"}, {"id": "t7-q0-p2-k2", "name": "a grand finale", "type": "kick", "full": "a grand finale"}]}, {"id": "t7-q0-p3", "name": "body 3", "type": "paragraph", "full": "(body 3) once a week, and the path there is a park too", "children": [{"id": "t7-q0-p3-k0", "name": "hit the park", "type": "kick", "full": "hit the park"}, {"id": "t7-q0-p3-k1", "name": "despite my hectic schedule", "type": "kick", "full": "despite my hectic schedule"}, {"id": "t7-q0-p3-k2", "name": "taking a stroll along", "type": "kick", "full": "taking a stroll along"}]}, {"id": "t7-q0-p4", "name": "closing", "type": "paragraph", "full": "(closing) that's it", "children": []}]}, {"id": "t7-q1", "name": "park problems", "tag": "8-2", "type": "question", "full": "Let's talk about issues that today's parks are faced with. What are the largest challenges faced by public parks these days? Discuss what has caused these concerns.", "script": "Well, this is a definitely tough question for me to answer. Let me think about it second.\n\nI think some people leave their trash after enjoying their time. I am pretty sure that you've seen tons of garbage at parks. You know, I went to Hanriver Park last week to hit the food trucks. But I couldn't believe my eyes because the park was covered with trash! People there littered a lot after having their snacks and drinks. It was not common sense at all.\n\nWhat's worse, drinking booze was also a big problem. Yes, I also like drinking beers at the park. However, the sight of beer bottles littering around all over the ground was definitely an eye sore. They should have disposed of their bottles in the trash bins, if they were responsible citizens, especially in public spaces. It was so ugly behavior and such a shameful act for the children.\n\nWow, still we have a long way to become an advanced country. The government should enforce the education of etiquette and moral things rather than just focusing on English, Math, and science. Eva, how do you think,?", "children": [{"id": "t7-q1-p0", "name": "intro", "type": "paragraph", "full": "(intro) a tough question, let me think for a second", "children": [{"id": "t7-q1-p0-k0", "name": "let me think about it for a second", "type": "kick", "full": "let me think about it for a second"}]}, {"id": "t7-q1-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) litter, the park was covered with trash", "children": [{"id": "t7-q1-p1-k0", "name": "couldn't believe my eyes", "type": "kick", "full": "couldn't believe my eyes"}, {"id": "t7-q1-p1-k1", "name": "was covered with trash", "type": "kick", "full": "was covered with trash"}, {"id": "t7-q1-p1-k2", "name": "littered a lot", "type": "kick", "full": "littered a lot"}]}, {"id": "t7-q1-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) drinking booze, and bottles all over the ground", "children": [{"id": "t7-q1-p2-k0", "name": "what's worse", "type": "kick", "full": "what's worse"}, {"id": "t7-q1-p2-k1", "name": "an eye sore", "type": "kick", "full": "an eye sore"}, {"id": "t7-q1-p2-k2", "name": "a shameful act", "type": "kick", "full": "a shameful act"}]}, {"id": "t7-q1-p3", "name": "closing", "type": "paragraph", "full": "(closing) teach etiquette, not just English and Math", "children": [{"id": "t7-q1-p3-k0", "name": "a long way to go", "type": "kick", "full": "a long way to go"}, {"id": "t7-q1-p3-k1", "name": "rather than just focusing on", "type": "kick", "full": "rather than just focusing on"}]}]}, {"id": "t7-q2", "name": "kids vs. adults at the park", "tag": "8-3", "type": "question", "full": "Compare the activities that children do at the park as opposed to what the adults do while at parks. Tell me about the many facilities at park that are intended to accommodate both children and adults like.", "script": "Okay, Eva, I think I can answer this question well because I often visit my favorite park with my two little boys.It's fascinating how people of different ages spend time at the park in their own unique ways. Well, special facilities are not needed at all, the vast open lawns are just enough to accommodate both children and adults.\n\nFirst off, if you look at the kids, they are essentially bundles of energy. They're usually full of energy, running around, playing tag, or climbing all over the trees. With only vast, open lawns, they basically make the whole place into their playground. Butterflies sitting on flowers, cicadas buzzing in trees, and praying mantises lurking for their prey, they all are their little friends. Everywhere is their playground, everything is their friend.\n\nIn contrast, adults generally go there to unwind. For many of us, it's about finding a moment of peace. Well, adults tend to be as lazy as they can, they blow out their stress away by sprawling out on the grass. My wife and I love to be laid-back while watching the sunset. Those moments are a great opportunity for us to clear our mind and relieve our stress.\n\nAll in all, it's wonderful to see how people of all ages gather together and enjoy their own way in the beautiful park.", "children": [{"id": "t7-q2-p0", "name": "intro", "type": "paragraph", "full": "(intro) I go with my two boys, and the lawns are enough", "children": [{"id": "t7-q2-p0-k0", "name": "in their own unique ways", "type": "kick", "full": "in their own unique ways"}, {"id": "t7-q2-p0-k1", "name": "enough to accommodate", "type": "kick", "full": "enough to accommodate"}]}, {"id": "t7-q2-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) children are essentially bundles of energy", "children": [{"id": "t7-q2-p1-k0", "name": "bundles of energy", "type": "kick", "full": "bundles of energy"}, {"id": "t7-q2-p1-k1", "name": "playing tag", "type": "kick", "full": "playing tag"}, {"id": "t7-q2-p1-k2", "name": "lurking for their prey", "type": "kick", "full": "lurking for their prey"}]}, {"id": "t7-q2-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) adults go there to unwind and sprawl out", "children": [{"id": "t7-q2-p2-k0", "name": "in contrast", "type": "kick", "full": "in contrast"}, {"id": "t7-q2-p2-k1", "name": "as lazy as they can", "type": "kick", "full": "as lazy as they can"}, {"id": "t7-q2-p2-k2", "name": "sprawling out on the grass", "type": "kick", "full": "sprawling out on the grass"}]}, {"id": "t7-q2-p3", "name": "closing", "type": "paragraph", "full": "(closing) all ages gather and enjoy it their own way", "children": [{"id": "t7-q2-p3-k0", "name": "all in all", "type": "kick", "full": "all in all"}, {"id": "t7-q2-p3-k1", "name": "people of all ages", "type": "kick", "full": "people of all ages"}]}]}]}, {"id": "t8", "name": "Role Play", "type": "topic", "full": "Role Play", "scriptUrl": "https://docs.google.com/document/d/1nFeGRJD9rPP34TyhMftwgs88PFSxxjQ-dGqeDYPxigc/edit", "children": [{"id": "t8-q0", "name": "park invite call", "tag": "10-1", "type": "question", "full": "I will give you a situation and ask you to act it out. You want to go to the park with your friend. Make a call to your friend and ask several questions about going to the park together.", "script": "Hey bro, what's up? It's me, Jungmin. I'm planning to go to the park tomorrow, and I'm calling you to join me. I remembered you telling me that you wanna hit the Han River Park sometime. How's that sound? oh ya? You're coming? Great!\n\nWhere should we meet? Hey, why don't I go and pick you up from your place? dont- worry I'll also give you a ride home afterwards.\n\nAnd what time do you want me to pick you up? I was thinking in the morning. You know, just being in the fresh air in the morning really makes us feel refreshed and relaxed. And then let's go jogging together, or we can just stroll over the green lawn if you wanna feel unwinded. Anyway, if you would like to do anything else there, please let me know.\n\nAll right, I'll see you tomorrow at nine AM. I'll call you when I arrive at your home. I'm already too excited about our time. See you!", "children": [{"id": "t8-q0-p0", "name": "intro", "type": "paragraph", "full": "(intro) calling Jungmin to invite him to the park tomorrow", "children": [{"id": "t8-q0-p0-k0", "name": "hit the Han River Park", "type": "kick", "full": "hit the Han River Park"}, {"id": "t8-q0-p0-k1", "name": "You're coming? Great", "type": "kick", "full": "You're coming? Great"}]}, {"id": "t8-q0-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) offering to pick him up and drive him home", "children": [{"id": "t8-q0-p1-k0", "name": "pick you up from your place", "type": "kick", "full": "pick you up from your place"}, {"id": "t8-q0-p1-k1", "name": "give you a ride home", "type": "kick", "full": "give you a ride home"}]}, {"id": "t8-q0-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) picking a morning time, jogging or a lawn stroll", "children": [{"id": "t8-q0-p2-k0", "name": "fresh air in the morning", "type": "kick", "full": "fresh air in the morning"}, {"id": "t8-q0-p2-k1", "name": "stroll over the green lawn", "type": "kick", "full": "stroll over the green lawn"}]}, {"id": "t8-q0-p3", "name": "closing", "type": "paragraph", "full": "(closing) confirming nine AM, already excited for it", "children": [{"id": "t8-q0-p3-k0", "name": "already too excited about our time", "type": "kick", "full": "already too excited about our time"}]}]}, {"id": "t8-q1", "name": "park closed, plan B", "tag": "10-2", "type": "question", "full": "I will give you a situation and ask you to act it out. You were planning to go to the park with your friend, but the park is closed. Make a call to your friend and explain the situation and give several suggestions to solve this situation.", "script": "Man,, I have a bad news to tell you. The park that we have planned to go to is closed for several days. There was a big fire last night.\n\nSo here's my suggestions. First, why don't we go to Seoungnae park instead? As you know, the park is on the way to the Han river park. Seoungnae park is also famous for its beautiful landscape with big street trees and blooming flowers along the river. So I don't think it is a bad option.\n\nOr, why don't we watch movies instead? Well, we can go to the park on the other day. Spiderman was released recently, and my friend told me that it is fun! So this can be a good option also.\n\nIf you have other alternatives in mind, plz let me know. I will follow your opinion. Take you time, and get back to me in 30 mins. Bye! '", "children": [{"id": "t8-q1-p0", "name": "intro", "type": "paragraph", "full": "(intro) breaking the bad news that the park is closed after a fire", "children": [{"id": "t8-q1-p0-k0", "name": "closed for several days", "type": "kick", "full": "closed for several days"}, {"id": "t8-q1-p0-k1", "name": "a big fire last night", "type": "kick", "full": "a big fire last night"}]}, {"id": "t8-q1-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) suggestion one, Seoungnae park instead", "children": [{"id": "t8-q1-p1-k0", "name": "Seoungnae park instead", "type": "kick", "full": "Seoungnae park instead"}, {"id": "t8-q1-p1-k1", "name": "blooming flowers along the river", "type": "kick", "full": "blooming flowers along the river"}]}, {"id": "t8-q1-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) suggestion two, watching Spiderman instead", "children": [{"id": "t8-q1-p2-k0", "name": "watch movies instead", "type": "kick", "full": "watch movies instead"}, {"id": "t8-q1-p2-k1", "name": "Spiderman was released recently", "type": "kick", "full": "Spiderman was released recently"}]}, {"id": "t8-q1-p3", "name": "closing", "type": "paragraph", "full": "(closing) leaving it open, asking for a reply within 30 minutes", "children": [{"id": "t8-q1-p3-k0", "name": "get back to me in 30 mins", "type": "kick", "full": "get back to me in 30 mins"}]}]}, {"id": "t8-q2", "name": "sick day reschedule", "tag": "10-3", "type": "question", "full": "I am sorry, but there is a problem that you have to resolve. You are not feeling well on the day that you have planned to go to the park with your friend. You don't think you can go to the park today. Make a call to your friend and explain the situation and give several solutions about this matter.", "script": "Hey bro, it's me. I'm afraid I won't be able to make it to the park we planned to visit today. I think I ate something wrong yesterday. I've got food poisoning. I threw up several times last night, and I don't have any energy to step out of bed. I'm so sorry.\n\nJanghoon, can I have a rain check? If you are free next Saturday, why don't we go to the park that day? I feel terrible for backing out our plans for today. I'm so sorry again.\n\nOr, why don't you go there with your wife Ara? I don't want to ruin your day and I already bought some burger and snacks for our lunch. So you can just drop by my home and take them from me. Of course you can! Never mind, it's not like I can eat them anyway. I don't want to ruin your day just because of me.\n\nYes, sure, go ahead. Let me give you a tip. ACt as if you prepared all of this for your wife. She must like it. Yeah, just give me a call if you're coming to pick up the foods. You can always go jogging with me, bro. Ok, talk to you later.", "children": [{"id": "t8-q2-p0", "name": "intro", "type": "paragraph", "full": "(intro) explaining he has food poisoning and can't make it", "children": [{"id": "t8-q2-p0-k0", "name": "got food poisoning", "type": "kick", "full": "got food poisoning"}, {"id": "t8-q2-p0-k1", "name": "threw up several times", "type": "kick", "full": "threw up several times"}]}, {"id": "t8-q2-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) asking for a rain check next Saturday", "children": [{"id": "t8-q2-p1-k0", "name": "have a rain check", "type": "kick", "full": "have a rain check"}, {"id": "t8-q2-p1-k1", "name": "backing out our plans", "type": "kick", "full": "backing out our plans"}]}, {"id": "t8-q2-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) suggesting he go with his wife Ara instead, pick up the snacks", "children": [{"id": "t8-q2-p2-k0", "name": "go there with your wife Ara", "type": "kick", "full": "go there with your wife Ara"}, {"id": "t8-q2-p2-k1", "name": "drop by my home", "type": "kick", "full": "drop by my home"}]}, {"id": "t8-q2-p3", "name": "closing", "type": "paragraph", "full": "(closing) a tip to pass the snacks off as his own idea", "children": [{"id": "t8-q2-p3-k0", "name": "act as if you prepared", "type": "kick", "full": "act as if you prepared"}, {"id": "t8-q2-p3-k1", "name": "talk to you later", "type": "kick", "full": "talk to you later"}]}]}]}];

  // whether a question's script panel starts open. On by default (the
  // script is the main thing you came here to read) — persisted so a
  // viewer who flips the topbar's "View all scripts" off gets that as the
  // default again next visit too.
  let initialScriptsVisible = true;
  try {
    const saved = localStorage.getItem("opic-scripts-visible");
    if (saved !== null) initialScriptsVisible = saved === "1";
  } catch (e) {}

  const state = { topicIndex: 0, current: null, scriptsVisible: initialScriptsVisible };

  const groveList = d3.select("#groveList");
  const svg = d3.select("#tree");
  const g = svg.append("g").attr("class", "viewport");
  const linkLayer = g.append("g").attr("class", "links");
  const nodeLayer = g.append("g").attr("class", "nodes");
  const readingBody = document.getElementById("readingBody");
  const reading = document.getElementById("reading");

  // ---- "resume where I left off": which topic tree, which node's panel
  // was open, whether it was showing the Takes page, and fullscreen —
  // saved on every change that affects any of those, restored once at the
  // very bottom of this script (after everything it needs is defined).
  // Matters most for a Home Screen shortcut, which always cold-starts the
  // page fresh rather than keeping a backgrounded tab alive. ----
  const APP_STATE_KEY = "opic-app-state";
  function persistAppState() {
    try {
      const pages = document.getElementById("readingPages");
      const appEl = document.getElementById("app");
      localStorage.setItem(
        APP_STATE_KEY,
        JSON.stringify({
          topicIndex: state.topicIndex,
          currentNodeId: state.current ? state.current.id : null,
          showTakes: !!(pages && pages.classList.contains("show-takes")),
          focusMode: !!(appEl && appEl.classList.contains("focus-mode")),
        })
      );
    } catch (e) {}
  }

  const zoom = d3.zoom()
    .scaleExtent([0.35, 3])
    .on("zoom", (event) => g.attr("transform", event.transform));
  svg.call(zoom).on("dblclick.zoom", null);

  // column gaps are computed fresh every render from the actual measured
  // pill widths (see fitColumns below) — this is just the minimum
  // clearance added between two adjacent columns' widest pills. Row spacing
  // is likewise computed fresh from measured pill heights (see renderTree)
  // since a script-beat pill now shows its full verbatim text and can run
  // to several lines — ROW_BUFFER is just the clearance added on top of the
  // tallest pill anywhere in the current view.
  const COLUMN_BUFFER = 34;
  const ROW_BUFFER = 16;
  const PILL_PAD_X = { topic: 16, question: 12, paragraph: 12, kick: 9 };
  const PILL_PAD_Y = { topic: 9, question: 7, paragraph: 8, kick: 5 };
  const WRAP_CHARS = { topic: 99, question: 30, paragraph: 32, kick: 18 };

  // remembers each node's last-drawn screen position, keyed by its id, so a
  // search jump can pan the camera to it right after expanding it
  const posById = new Map();

  // splits a label into as many lines as it takes to keep each one under
  // maxChars, so a pill never has to stretch to fit one very long line —
  // a script beat's full text can run to several lines, which is fine
  // since row height is measured and laid out after wrapping (see below)
  function wrapLabel(text, maxChars) {
    const words = text.split(/\s+/);
    const lines = [];
    let cur = "";
    for (const w of words) {
      const trial = cur ? `${cur} ${w}` : w;
      if (cur && trial.length > maxChars) {
        lines.push(cur);
        cur = w;
      } else {
        cur = trial;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ---- prepare per-topic hierarchy with collapse state ----
  function buildRoot(topicData) {
    const root = d3.hierarchy(topicData);
    root.descendants().forEach((d) => (d.id = d.data.id));
    root.descendants().forEach((d) => {
      if (d.depth >= 1 && d.children) {
        d._children = d.children;
        d.children = null;
      }
    });
    return root;
  }

  let roots = FOREST.map(buildRoot);

  function renderGrove() {
    const items = groveList.selectAll("li").data(FOREST, (d) => d.id);
    const li = items.enter().append("li");
    const btn = li.append("button").attr("class", "grove-item");
    btn.append("span").attr("class", "grove-ring");
    const text = btn.append("span");
    text.append("span").attr("class", "grove-name").style("display", "block");
    text.append("span").attr("class", "grove-count").style("display", "block");

    groveList.selectAll(".grove-item")
      .on("click", (event, d) => {
        state.topicIndex = FOREST.indexOf(d);
        setCurrent(null);
        renderTree(true);
        renderGrove();
      })
      .classed("active", (d, i) => i === state.topicIndex)
      .select(".grove-ring")
      .style("border-color", (d, i) => (i === state.topicIndex ? "var(--topic)" : "var(--line)"));

    groveList.selectAll(".grove-name").text((d) => d.name);
    groveList.selectAll(".grove-count").text((d) => `${d.children.length} questions`);
  }

  function crumbFor(d) {
    const chain = d
      .ancestors()
      .reverse()
      .map((n) => (n.data.tag ? `${n.data.tag} ${n.data.name}` : n.data.name));
    return chain.join(" ▸ ");
  }

  function typeLabel(t) {
    return { topic: "Topic", question: "Question", paragraph: "Script beat", kick: "Kick phrase" }[t];
  }

  function setCurrent(node) {
    state.current = node;
    nodeLayer.selectAll("g.node").classed("current", (d) => node && d.master.id === node.id);
    if (!node) {
      readingBody.innerHTML = '<p class="reading-empty">Select any node to read its full text here — the tree only ever shows short labels.</p>';
      persistAppState();
      return;
    }
    const t = node.data.type;
    let html = `<div class="reading-crumb">${crumbFor(node)}</div>`;
    html += `<div class="reading-chip chip-${t}"><span class="dot"></span>${typeLabel(t)}</div>`;
    html += `<h3>${escapeHtml(node.data.full || node.data.name)}</h3>`;
    if (t === "question") {
      const hasTakes = getPracticeCount(node.data.id) > 0;
      const takeCount = getPracticeCount(node.data.id);
      html += `<div class="reading-pages" id="readingPages">`;
      // page 1 (off-screen at rest, DOM-first so translateX(-50%) parks it
      // to the left, clipped by .reading's overflow-x:hidden — both pages
      // stay flex children the whole time, never display:none, since
      // removing one from the flex row would collapse the other to the
      // wrong slot): the Takes/recording view, swiped in from the right.
      html += `<div class="reading-page reading-page-takes" id="readingPageTakes">`;
      html += `<button type="button" class="reading-page-back" id="takesBack">‹ Back</button>`;
      html += `<div class="practice-head"><span class="script-label">Takes</span><div class="script-actions">`;
      html += `<button type="button" class="takes-record" id="takesRecord">🎙 Record</button>`;
      html += `<button type="button" class="practice-log" id="takesLog">+ Log without recording</button>`;
      html += `<button type="button" class="practice-reset" id="takesReset"${hasTakes ? "" : " hidden"}>↺ Reset all</button>`;
      html += `</div></div>`;
      html += `<span class="script-status" id="takesStatus"></span>`;
      html += `<div id="takesList"></div>`;
      html += `</div>`;
      // page 2 (the default view): what the panel looked like before Takes
      // was added — hint text, kicks-to-use, the script toggle — plus a
      // small nav button into the Takes page above.
      html += `<div class="reading-page reading-page-main" id="readingPageMain">`;
      html += `<p class="full-text">Tap this question in the tree to reveal its script beats, then tap a beat to reveal its kick phrases.</p>`;
      html += `<button type="button" class="reading-page-nav" id="takesNav">🎙 Takes${hasTakes ? ` · take#${takeCount}` : ""} ›</button>`;
      html += `<div id="allKicksWrap">${allKicksHtml(node.data)}</div>`;
      html += `<button type="button" class="script-toggle" id="scriptToggle" aria-expanded="${state.scriptsVisible}">${state.scriptsVisible ? "▾ Hide script" : "▸ Show script"}</button>`;
      html += `<div class="script-panel" id="scriptPanel"${state.scriptsVisible ? "" : " hidden"}>`;
      html += `<div class="script-head"><span class="script-label">Your script</span><div class="script-actions">`;
      html += `<button type="button" class="script-edit-toggle" id="scriptEditToggle" aria-pressed="false">✏️ Edit</button>`;
      html += `<button type="button" class="script-load">⬆ Load file</button>`;
      html += `<button type="button" class="script-download">⬇ Save as .txt</button>`;
      html += `<button type="button" class="script-reset">↺ Reset to original</button>`;
      html += `</div></div>`;
      html += `<textarea class="script-box locked" readonly spellcheck="false" aria-label="Editable script for this question — tap Edit above to select text or make changes"></textarea>`;
      html += `<span class="script-status"></span>`;
      html += `<input type="file" class="script-file-input" accept=".txt,.csv,text/plain,text/csv" aria-hidden="true" tabindex="-1">`;
      html += `</div>`;
      html += `</div>`;
      html += `</div>`;
    }
    if (t === "paragraph") {
      html += `<div class="kick-editor-head"><span class="script-label">Kick phrases</span><div class="kick-actions">`;
      html += `<button type="button" class="kick-add">+ Add</button>`;
      html += `<button type="button" class="kick-reset">↺ Reset</button>`;
      html += `</div></div>`;
      html += `<div class="reading-kicks" id="kickEditor"></div>`;
      html += `<span class="script-status" id="kickStatus"></span>`;
    }
    if (t === "topic") {
      const qCount = node.data.children.length;
      const pCount = node.data.children.reduce((s, q) => s + q.children.length, 0);
      html += `<p class="full-text">${qCount} questions, ${pCount} script beats in this tree.</p>`;
      if (node.data.scriptUrl) {
        html += `<a class="btn-script" href="${escapeHtml(node.data.scriptUrl)}" target="_blank" rel="noopener">Show script ↗</a>`;
      }
    }
    readingBody.innerHTML = html;
    if (t === "question") {
      wireScriptBox(node);
      const toggleBtn = readingBody.querySelector("#scriptToggle");
      const panel = readingBody.querySelector("#scriptPanel");
      if (toggleBtn && panel) {
        toggleBtn.addEventListener("click", () => {
          const nowHidden = !panel.hidden;
          panel.hidden = nowHidden;
          toggleBtn.textContent = nowHidden ? "▸ Show script" : "▾ Hide script";
          toggleBtn.setAttribute("aria-expanded", String(!nowHidden));
          // was sized while hidden (offsetParent null, scrollHeight 0) if
          // "View all scripts" wasn't on — measure for real now that it's
          // actually visible.
          if (!nowHidden) autoGrowTextarea(panel.querySelector(".script-box"));
        });
      }

      wireTakesSection(node);
      wireSwipePages(node);
    }
    if (t === "paragraph") wireKickEditor(node);
    if (window.matchMedia("(max-width: 900px)").matches) reading.classList.add("open");
    persistAppState();
  }

  // the editable per-question script box: defaults to that question's
  // polished script, copied verbatim from the original Google Doc (the
  // same doc the topic's "Show script" button opens) and keyed by
  // question tag — NOT a stitching of the CSV's short script-beat labels.
  // A viewer's own edits persist in this browser (localStorage) so the
  // same box comes back edited next time they open this question, until
  // they reset it. localStorage is a convenience only, though — it can be
  // cleared or unavailable — so the box also offers a real file round
  // trip: "Save as .txt" downloads the current text, and "Load file" reads
  // a .txt/.csv back in, so edits can be handed back for the source Doc
  // to be updated from.
  // works on a raw FOREST question object (id/script/children straight off
  // the data, no d3-hierarchy wrapping) — shared by defaultScriptFor below
  // and the bulk export, which walks questionIndex directly.
  function scriptTextFor(q) {
    if (q.script) return q.script;
    // fallback for a question whose Doc script hasn't been parsed yet:
    // stitch the CSV's own script-beat text together instead of leaving
    // the box empty.
    return (q.children || []).map((p) => p.full).join("\n\n");
  }

  function defaultScriptFor(node) {
    return scriptTextFor(node.data);
  }

  // the script text a viewer would actually see for a question right now:
  // their own saved edit if there is one, else the doc-sourced default.
  function effectiveScriptFor(q) {
    let saved = null;
    try {
      saved = localStorage.getItem(`opic-script:${q.id}`);
    } catch (e) {}
    return saved !== null ? saved : scriptTextFor(q);
  }

  // ---- takes: a question's practice history. Each entry is a "take" —
  // logged with or without an actual recording — carrying a stable take
  // number, whether audio exists for it, and which kick phrases the
  // viewer self-marked as used in that attempt. Metadata (small, text)
  // lives in localStorage; the audio itself (binary, potentially
  // sizeable) lives in IndexedDB — see the recordings store further
  // below. Take numbers are permanent once assigned (never renumbered on
  // delete, so a deleted take just leaves a gap) both because renumbering
  // would require migrating its IndexedDB key too, and because a visible
  // gap ("Take #1, Take #3") is an honest record that #2 existed.
  function takesKey(questionId) {
    return `opic-takes:${questionId}`;
  }

  function saveTakes(questionId, takes) {
    try {
      if (takes.length) localStorage.setItem(takesKey(questionId), JSON.stringify(takes));
      else localStorage.removeItem(takesKey(questionId));
    } catch (e) {}
    markDriveSyncDirty();
  }

  function takesFor(questionId) {
    let raw = null;
    try {
      raw = localStorage.getItem(takesKey(questionId));
    } catch (e) {}
    if (raw !== null) {
      try {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) return arr;
      } catch (e) {}
    }
    // migration: a viewer's prior session (before takes existed) may have
    // left behind a bare integer count at the old key — synthesize that
    // many empty takes once, so their tally isn't lost.
    let legacyRaw = null;
    try {
      legacyRaw = localStorage.getItem(`opic-practice:${questionId}`);
    } catch (e) {}
    const legacyCount = parseInt(legacyRaw, 10);
    if (Number.isFinite(legacyCount) && legacyCount > 0) {
      const synthesized = [];
      for (let i = 1; i <= legacyCount; i++) {
        synthesized.push({ n: i, hasRecording: false, mimeType: null, kicksMarked: [] });
      }
      saveTakes(questionId, synthesized);
      try {
        localStorage.removeItem(`opic-practice:${questionId}`);
      } catch (e) {}
      return synthesized;
    }
    return [];
  }

  function nextTakeNumber(takes) {
    return takes.reduce((max, t) => Math.max(max, t.n), 0) + 1;
  }

  // the tree's take#N corner badge and the bulk-export [practice] section
  // both just want "how many attempts total" — the highest take number
  // ever reached, which (unlike takes.length) stays correct even after a
  // mid-list delete.
  function getPracticeCount(questionId) {
    return takesFor(questionId).reduce((max, t) => Math.max(max, t.n), 0);
  }

  // used only by bulk import, to make sure at least N takes exist —
  // deliberately never truncates (a plain count from an imported .txt
  // has no way to say which takes to discard, and destroying real
  // recordings via a text-file import would be a bad surprise). The
  // explicit "Reset all" button below is the only thing that actually
  // clears a question's takes.
  function setPracticeCount(questionId, n) {
    const clamped = Math.max(0, Math.floor(n) || 0);
    const takes = takesFor(questionId);
    let highest = takes.reduce((max, t) => Math.max(max, t.n), 0);
    while (highest < clamped) {
      highest += 1;
      takes.push({ n: highest, hasRecording: false, mimeType: null, kicksMarked: [] });
    }
    saveTakes(questionId, takes);
    return highest;
  }

  function appendTake(questionId, opts) {
    const takes = takesFor(questionId);
    takes.push({
      n: nextTakeNumber(takes),
      hasRecording: !!(opts && opts.hasRecording),
      mimeType: (opts && opts.mimeType) || null,
      kicksMarked: [],
      createdAt: (opts && opts.createdAt) || Date.now(),
      durationSec: (opts && opts.durationSec) || null,
      rating: 0,
    });
    saveTakes(questionId, takes);
    return takes;
  }

  // ---- recordings: the actual audio, in IndexedDB (Blobs don't belong in
  // localStorage — small quota, and no native Blob support). One store,
  // keyed "<questionId>:<takeNumber>". Opened lazily on first use, not at
  // page load, so viewers who never record pay nothing for it. ----
  const REC_DB_NAME = "opic-recordings";
  const REC_STORE = "takes";
  let recDbPromise = null;
  function openRecDb() {
    if (recDbPromise) return recDbPromise;
    recDbPromise = new Promise((resolve) => {
      if (!window.indexedDB) {
        resolve(null);
        return;
      }
      const req = indexedDB.open(REC_DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(REC_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
    return recDbPromise;
  }
  function recKey(questionId, takeN) {
    return `${questionId}:${takeN}`;
  }
  async function putRecording(key, value) {
    const db = await openRecDb();
    if (!db) return false;
    return new Promise((resolve) => {
      const tx = db.transaction(REC_STORE, "readwrite");
      tx.objectStore(REC_STORE).put(value, key);
      tx.oncomplete = () => {
        markDriveSyncDirty();
        resolve(true);
      };
      tx.onerror = () => resolve(false);
    });
  }
  async function getRecording(key) {
    const db = await openRecDb();
    if (!db) return null;
    return new Promise((resolve) => {
      const tx = db.transaction(REC_STORE, "readonly");
      const req = tx.objectStore(REC_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  }
  async function deleteRecording(key) {
    const db = await openRecDb();
    if (!db) return false;
    return new Promise((resolve) => {
      const tx = db.transaction(REC_STORE, "readwrite");
      tx.objectStore(REC_STORE).delete(key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  }

  async function deleteTakeOne(questionId, n) {
    const takes = takesFor(questionId);
    const idx = takes.findIndex((t) => t.n === n);
    if (idx === -1) return;
    if (takes[idx].hasRecording) await deleteRecording(recKey(questionId, n));
    takes.splice(idx, 1);
    saveTakes(questionId, takes);
  }

  async function resetAllTakes(questionId) {
    const takes = takesFor(questionId);
    for (const t of takes) {
      if (t.hasRecording) await deleteRecording(recKey(questionId, t.n));
    }
    saveTakes(questionId, []);
  }

  function mimeToExt(mimeType) {
    if (mimeType && mimeType.includes("mp4")) return "mp4";
    if (mimeType && mimeType.includes("ogg")) return "ogg";
    return "webm";
  }

  // ---- downloading a take as .mp3: browsers only ever *record* webm/opus
  // (Chrome, Firefox, Android) or mp4/AAC (Safari) — never mp3 — so a real
  // .mp3 file needs an actual conversion, not just a renamed extension
  // (which would silently produce a file that fails to open in whatever
  // it's shared to). Converts client-side: decode the recorded blob to PCM
  // via the Web Audio API, then encode that PCM with lamejs, a pure-JS MP3
  // encoder loaded lazily (only once a download is actually requested) from
  // the same CDN allow-list every other script on this page uses. ----
  let lamejsPromise = null;
  function loadLamejs() {
    if (window.lamejs) return Promise.resolve(window.lamejs);
    if (lamejsPromise) return lamejsPromise;
    lamejsPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js";
      script.onload = () => (window.lamejs ? resolve(window.lamejs) : reject(new Error("mp3 encoder didn't load")));
      script.onerror = () => reject(new Error("mp3 encoder didn't load"));
      document.head.appendChild(script);
    });
    return lamejsPromise;
  }

  function floatTo16BitPCM(input) {
    const out = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      const s = Math.max(-1, Math.min(1, input[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  async function blobToMp3(blob) {
    const lamejs = await loadLamejs();
    const arrayBuf = await blob.arrayBuffer();
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    let audioBuffer;
    try {
      audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
    } finally {
      audioCtx.close();
    }
    const channels = Math.min(audioBuffer.numberOfChannels, 2);
    const left16 = floatTo16BitPCM(audioBuffer.getChannelData(0));
    const right16 = channels > 1 ? floatTo16BitPCM(audioBuffer.getChannelData(1)) : null;

    // mp3 is a less efficient codec than Opus per bit, so matching the
    // recording's own bitrate here isn't enough to avoid audibly
    // compounding the loss on this second, transcode pass — 192kbps keeps
    // it close to transparent too.
    const encoder = new lamejs.Mp3Encoder(channels, audioBuffer.sampleRate, 192);
    const blockSize = 1152;
    const chunks = [];
    for (let i = 0; i < left16.length; i += blockSize) {
      const leftChunk = left16.subarray(i, i + blockSize);
      const buf = right16
        ? encoder.encodeBuffer(leftChunk, right16.subarray(i, i + blockSize))
        : encoder.encodeBuffer(leftChunk);
      if (buf.length > 0) chunks.push(buf);
    }
    const tail = encoder.flush();
    if (tail.length > 0) chunks.push(tail);
    return new Blob(chunks, { type: "audio/mpeg" });
  }

  // recording length, decoded the same way blobToMp3 decodes for
  // conversion — but standalone (no lamejs needed) since this only reads
  // .duration off the decoded buffer, for the take-row title.
  async function getAudioDurationSec(blob) {
    const arrayBuf = await blob.arrayBuffer();
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    try {
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
      return audioBuffer.duration;
    } finally {
      audioCtx.close();
    }
  }

  // ---- Google Drive sync (see setupGoogleDriveSync, far below, for the
  // actual sign-in + upload/download): every place that changes anything
  // worth syncing (a script edit, a kick edit, a take/rating/kick-check
  // change, a new recording) calls markDriveSyncDirty() right where it
  // already writes to localStorage/IndexedDB, rather than this file
  // polling for changes. applyingRemoteSyncPayload guards against the
  // loop that would otherwise happen when a *pull* from Drive replays
  // through those exact same write paths — a change that came FROM Drive
  // shouldn't immediately look like a new local change to push back. ----
  let driveSyncDirty = false;
  let applyingRemoteSyncPayload = false;
  function markDriveSyncDirty() {
    if (!applyingRemoteSyncPayload) driveSyncDirty = true;
  }

  // Chrome (and other Chromium browsers) can't read a real duration out
  // of a MediaRecorder-produced blob's container up front — a fresh
  // <audio> pointed at a blob: URL for one of these recordings reports
  // .duration as Infinity/NaN, which breaks the native controls' time
  // display: it shows "0:00 / 0:00" the whole way through playback
  // instead of counting up, even though the seek bar itself still moves.
  // A well-known workaround for this specific Chromium bug: seek far
  // past the end once metadata loads, which forces Chrome to scan the
  // file and fix up its cached duration, then seek back to the start.
  function fixBlobAudioDuration(audioEl) {
    audioEl.addEventListener("loadedmetadata", () => {
      if (audioEl.duration !== Infinity && !isNaN(audioEl.duration)) return;
      audioEl.currentTime = 1e101;
      audioEl.addEventListener("timeupdate", () => (audioEl.currentTime = 0), { once: true });
    });
  }

  // "<node name>_Take#<n>_<date>_<duration>" — the date comes from the
  // take's own createdAt and the duration from its own durationSec (both
  // set when it was logged/recorded), so the on-screen title next to
  // ▶ Play always matches what actually downloads, give or take one
  // character: the title uses a colon in the duration ("02:30") since it's
  // only ever displayed, while the real saved filename swaps it for a
  // dash ("02-30") since ":" isn't valid in a Windows filename. Older
  // takes logged before these fields existed just omit that segment
  // rather than showing something wrong.
  function sanitizeFilePart(s) {
    const cleaned = String(s)
      .trim()
      .replace(/[\\/:*?"<>|]/g, "")
      .replace(/\s+/g, "_")
      .replace(/_{2,}/g, "_")
      .replace(/^[._]+|[._]+$/g, "");
    return cleaned || "recording";
  }
  function formatDateYYMMDD(ts) {
    const d = new Date(ts);
    const yy = String(d.getFullYear() % 100).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${yy}${mm}${dd}`;
  }
  function formatDurationMMSS(sec) {
    if (sec == null || !isFinite(sec)) return null;
    const total = Math.round(sec);
    const mm = Math.floor(total / 60);
    const ss = total % 60;
    return `${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
  }
  function takeTitleParts(node, take) {
    const tag = node.data.tag;
    const name = node.data.name || node.id;
    const parts = [sanitizeFilePart(tag ? `${tag} ${name}` : name), `Take#${take.n}`];
    if (take.createdAt) parts.push(formatDateYYMMDD(take.createdAt));
    const duration = formatDurationMMSS(take.durationSec);
    return { parts, duration };
  }
  // for on-screen display only (next to ▶ Play) — a colon in the duration.
  function takeDisplayTitle(node, take) {
    const { parts, duration } = takeTitleParts(node, take);
    return duration ? [...parts, duration].join("_") : parts.join("_");
  }
  // for the actual saved file — a dash instead, since ":" breaks on Windows.
  function takeDownloadFilename(node, take, ext) {
    const { parts, duration } = takeTitleParts(node, take);
    if (duration) parts.push(duration.replace(":", "-"));
    return `${parts.join("_")}.${ext}`;
  }

  // base64 <-> Blob, for folding recording audio into the JSON "Export
  // data" file (IndexedDB Blobs have no other portable text form).
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = String(reader.result || "");
        const comma = result.indexOf(",");
        resolve(comma === -1 ? result : result.slice(comma + 1));
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(blob);
    });
  }
  function base64ToBlob(base64, mimeType) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mimeType || "application/octet-stream" });
  }

  // every recording in IndexedDB, base64-encoded. The cursor walk stays
  // fully synchronous (just collecting {key, blob, ...} — an IDB
  // transaction auto-commits the moment the event loop goes idle with no
  // pending request, so awaiting blobToBase64 *between* cursor.continue()
  // calls would let it close mid-walk); base64 conversion happens
  // afterward, once the transaction is already done.
  async function collectAllRecordings() {
    const db = await openRecDb();
    if (!db) return [];
    const raw = await new Promise((resolve) => {
      const tx = db.transaction(REC_STORE, "readonly");
      const store = tx.objectStore(REC_STORE);
      const out = [];
      const req = store.openCursor();
      req.onsuccess = () => {
        const cursor = req.result;
        if (!cursor) {
          resolve(out);
          return;
        }
        const { blob, mimeType, createdAt } = cursor.value || {};
        if (blob) out.push({ key: cursor.key, blob, mimeType, createdAt });
        cursor.continue();
      };
      req.onerror = () => resolve(out);
    });
    const converted = [];
    for (const entry of raw) {
      try {
        const dataBase64 = await blobToBase64(entry.blob);
        converted.push({ key: entry.key, mimeType: entry.mimeType, dataBase64, createdAt: entry.createdAt });
      } catch (e) {}
    }
    return converted;
  }

  // ---- kick-phrase editing: same localStorage-override pattern as the
  // script box, but a kick is also a real node in the tree (not just text
  // in a panel), so an edit has to update three things in step: the raw
  // FOREST paragraph object's .children (so exports/search see it), the
  // d3-hierarchy node's own children/_children (so the tree redraws it),
  // and localStorage (so it survives a reload). ----
  function kicksKey(paragraphId) {
    return `opic-kicks:${paragraphId}`;
  }

  // works on a raw FOREST paragraph object — the kick-phrases a viewer
  // would actually see for this beat right now: their own saved edit if
  // there is one, else whatever .children currently holds (which is
  // itself the pristine parse until the first edit rewrites it in place).
  function effectiveKicksFor(paragraphData) {
    let saved = null;
    try {
      saved = localStorage.getItem(kicksKey(paragraphData.id));
    } catch (e) {}
    if (saved !== null) {
      try {
        const arr = JSON.parse(saved);
        if (Array.isArray(arr)) return arr;
      } catch (e) {}
    }
    return (paragraphData.children || []).map((k) => k.name);
  }

  // every kick phrase across every beat of a question, grouped by beat —
  // shown right under "Show script" on a question's panel, always visible
  // (unlike the script itself) so it can double as a practice cue sheet:
  // read the question, answer using just these phrases, only peek at the
  // full script if you get stuck.
  function allKicksHtml(questionData) {
    const beats = questionData.children || [];
    if (!beats.length) return "";
    let html = `<div class="all-kicks-head"><span class="script-label">Kick phrases to use</span></div>`;
    html += `<div class="all-kicks">`;
    beats.forEach((p) => {
      const kicks = effectiveKicksFor(p);
      html += `<div class="all-kicks-group">`;
      html += `<span class="all-kicks-cue">${escapeHtml(p.name)}</span>`;
      html += kicks.length
        ? `<div class="reading-kicks">` + kicks.map((k) => `<span class="kick-chip">${escapeHtml(k)}</span>`).join("") + `</div>`
        : `<p class="kick-empty">No kick phrases yet.</p>`;
      html += `</div>`;
    });
    html += `</div>`;
    return html;
  }

  // rebuilds a paragraph's kick-hierarchy children from its (already
  // updated) raw .children array. Kick nodes are leaves, so a fresh
  // d3.hierarchy() per kick — reparented onto the paragraph master node —
  // is simpler and safer than hand-patching the old node objects.
  function rebuildKickChildren(paragraphMaster, forceExpand) {
    const kickNodes = (paragraphMaster.data.children || []).map((kickData) => {
      const kn = d3.hierarchy(kickData);
      kn.parent = paragraphMaster;
      kn.depth = paragraphMaster.depth + 1;
      kn.height = 0;
      kn.id = kickData.id;
      return kn;
    });
    if (forceExpand || paragraphMaster.children) {
      paragraphMaster.children = kickNodes;
      paragraphMaster._children = null;
    } else {
      paragraphMaster._children = kickNodes;
      paragraphMaster.children = null;
    }
  }

  // ALL_NODES (built once, below, for search) is a flat list of raw data
  // objects; a kick edit has to patch it too or search would keep
  // matching removed kicks and never find new ones. Kick ids are always
  // "<paragraphId>-k<n>", so they're easy to pick out and replace. The
  // topic is looked up from the id's own "tN-" prefix rather than
  // state.topicIndex, since a bulk import can edit a paragraph that isn't
  // in the topic currently on screen.
  function reindexKicksFor(paragraphData) {
    const m = /^t(\d+)-/.exec(paragraphData.id);
    const topicData = m ? FOREST[Number(m[1])] : FOREST[state.topicIndex];
    for (let i = ALL_NODES.length - 1; i >= 0; i--) {
      if (ALL_NODES[i].node.id.startsWith(paragraphData.id + "-k")) ALL_NODES.splice(i, 1);
    }
