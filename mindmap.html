p3-k0", "name": "way better than", "type": "kick", "full": "way better than"}]}]}, {"id": "t3-q5", "name": "trip planning", "tag": "4-6", "type": "question", "full": "How do you plan for your vacations? Where do you get all the information you need when you plan for a trip? Please tell me all the steps you take to plan before leaving on a vacation", "script": "Well, it depends on whether it's a domestic or an international trip. For domestic trips, I just wing it. on the othet hand, For international trips,it requires some planning in advance.\n\nThe very first thing we should do when we made up our mind to go abroad, is to find the cheapest flight tickets. Well, we can redeem miles for bonus tickets, but it became nearly impossible these days due to fierce competition. So I usually book my tickets through online travel aggregators such as \"why pay more\". Remember it's always cheaper to buy a round-trip ticket than a one-way ticket.\n\nThen, I look for participating hotel branches within my loyalty program. As a platinum member of a global hotel chain \"Marriott\", I'm eligible for free breakfasts and an access to a club lounge during my stay. Those advantages make me open the Marriott App and search the properties nearby my destination!\n\nThe whole itinerary ends up prompting AI. Once I feed all the details into Claude, it generates a complete itinerary with detailed timelines and marked locations. That's it Eva!", "children": [{"id": "t3-q5-p0", "name": "intro", "type": "paragraph", "full": "(intro) domestic or international makes all the difference", "children": [{"id": "t3-q5-p0-k0", "name": "I just wing it", "type": "kick", "full": "I just wing it"}, {"id": "t3-q5-p0-k1", "name": "in advance", "type": "kick", "full": "in advance"}]}, {"id": "t3-q5-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) step one, the cheapest flight tickets", "children": [{"id": "t3-q5-p1-k0", "name": "redeem miles for bonus tickets", "type": "kick", "full": "redeem miles for bonus tickets"}, {"id": "t3-q5-p1-k1", "name": "due to fierce competition", "type": "kick", "full": "due to fierce competition"}, {"id": "t3-q5-p1-k2", "name": "online travel aggregators", "type": "kick", "full": "online travel aggregators"}]}, {"id": "t3-q5-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) step two, the hotel loyalty program", "children": [{"id": "t3-q5-p2-k0", "name": "within my loyalty program", "type": "kick", "full": "within my loyalty program"}, {"id": "t3-q5-p2-k1", "name": "as a platinum member", "type": "kick", "full": "as a platinum member"}, {"id": "t3-q5-p2-k2", "name": "eligible for", "type": "kick", "full": "eligible for"}]}, {"id": "t3-q5-p3", "name": "closing", "type": "paragraph", "full": "(closing) step three, the itinerary ends up prompting AI", "children": [{"id": "t3-q5-p3-k0", "name": "ends up prompting AI", "type": "kick", "full": "ends up prompting AI"}]}]}]}, {"id": "t4", "name": "Academy", "type": "topic", "full": "Academy", "scriptUrl": "https://docs.google.com/document/d/1QY5SjUoTOrKaEmOfgulH1USn8w19cvQhBA8gVuqXWXs/edit", "children": [{"id": "t4-q0", "name": "the academy", "tag": "5-1", "type": "question", "full": "Tell me about your English Academy. Where is it located and how are their conditions? Why are you taking a course there? Please tell me everything about your English Academy in as much detail as possible", "script": "Okay, I take an English speaking course at \"Hackers academy\", which's located in the heart of Gangnam where everyone all over the world knows. It has recently moved to a newly built building, so facilities are clean and new. Also, each classroom is well equipped with the latest technology to maximize students' potential. There are several study rooms that are spacious enough for seven students.\n\nYou know, English proficiency is a basic and essential skill in modern society. Whenever I attend an international conference, I feel a bit nervous about having casual conversations with people from other countries, which really limits my opportunities to expand my knowledge and experiences. To break it through, I enrolled for my free-talking English course.\n\nEva, if you have any friends who are interested in taking an English course, just give them my number. I can refer them to my academy.", "children": [{"id": "t4-q0-p0", "name": "intro", "type": "paragraph", "full": "(intro) Hackers Academy, in the heart of Gangnam, newly built", "children": [{"id": "t4-q0-p0-k0", "name": "in the heart of Gangnam", "type": "kick", "full": "in the heart of Gangnam"}, {"id": "t4-q0-p0-k1", "name": "well equipped with the latest technology", "type": "kick", "full": "well equipped with the latest technology"}, {"id": "t4-q0-p0-k2", "name": "spacious enough for seven students", "type": "kick", "full": "spacious enough for seven students"}]}, {"id": "t4-q0-p1", "name": "body", "type": "paragraph", "full": "(body) why I enrolled, nervous at international conferences", "children": [{"id": "t4-q0-p1-k0", "name": "a basic and essential skill", "type": "kick", "full": "a basic and essential skill"}, {"id": "t4-q0-p1-k1", "name": "limits my opportunities", "type": "kick", "full": "limits my opportunities"}, {"id": "t4-q0-p1-k2", "name": "to break it through", "type": "kick", "full": "to break it through"}]}, {"id": "t4-q0-p2", "name": "closing", "type": "paragraph", "full": "(closing) give them my number, I can refer them", "children": [{"id": "t4-q0-p2-k0", "name": "refer them to", "type": "kick", "full": "refer them to"}]}]}, {"id": "t4-q1", "name": "class curriculum", "tag": "5-2", "type": "question", "full": "Tell me about the curriculum of your English class. How's your class? Please tell me everything in as much detail as possible", "script": "The curriculum of my class? Well, I can tell you about my class I took last month.\n\nFirst of all, my classes are two-hours long with ten-minute breaks. Well, It's quite tough. What's worse, Everyday morning, we have a mini test to check whether we did our homework well or not. That's when we all get nervous because we have to face our true level of proficiency. Well, all the students get exhausted after the test, but without any breaktime, unfortunately, we get into the main curriculum. The teacher gives us today's topics with a brief overview of the day. The range of topics is incredibly vast from my daily routine to my music appetite, making it nearly impossible to prepare for everything. So it is always important to raise our fundamental English skills by learning vocabularies, expressions, and good examples! My favorite part of the class is speaking with my classmate. I think I benefit most from this portion of the class.\n\nIt was a very challenging class at the first time, but not so far I could get accustomed to it. My confidence improved week by week. I'm sure I can reach my goal. Cross fingers for me Eva!", "children": [{"id": "t4-q1-p0", "name": "intro", "type": "paragraph", "full": "(intro) the class I took last month", "children": []}, {"id": "t4-q1-p1", "name": "body", "type": "paragraph", "full": "(body) two hours, a morning test, then the main curriculum", "children": [{"id": "t4-q1-p1-k0", "name": "face our true level of proficiency", "type": "kick", "full": "face our true level of proficiency"}, {"id": "t4-q1-p1-k1", "name": "incredibly vast", "type": "kick", "full": "incredibly vast"}, {"id": "t4-q1-p1-k2", "name": "nearly impossible to prepare for everything", "type": "kick", "full": "nearly impossible to prepare for everything"}]}, {"id": "t4-q1-p2", "name": "closing", "type": "paragraph", "full": "(closing) tough at first, but my confidence grew", "children": [{"id": "t4-q1-p2-k0", "name": "get accustomed to it", "type": "kick", "full": "get accustomed to it"}, {"id": "t4-q1-p2-k1", "name": "week by week", "type": "kick", "full": "week by week"}, {"id": "t4-q1-p2-k2", "name": "cross fingers for me", "type": "kick", "full": "cross fingers for me"}]}]}, {"id": "t4-q2", "name": "the instructor", "tag": "5-3", "type": "question", "full": "Please describe your instructor. How does he or she teach? Do you like his or her teaching style? What does he or she look like? What was your first impression of him or her? Please tell me about your instructor", "script": "Sure, I can tell you about my most recent instructor, Sarah. I am really pleased with her and her teaching methods.\n\nLet me tell you more about her. Her name is Sarah and she appears to be in her mid-30's. To be honest, she appeared a little strict when I first met her, but as time went by, I realized that she is a friendly and warm person. Well, Don't get me wrong. But When she teaches classes, she becomes a professional teacher with a positive attitude that encourages the students. What I like most about her is that she manages to maintain a balance between professionalism and human kindness.\n\nI don't think her teaching method is particularly different from others, but she's very dedicated to giving constructive feedback to her students. She leaves a clear yet detailed comment in each piece of writing, which helps me get a better grasp of a good essay.\n\nIn the beginning of this course, I had no idea how to improve my English speaking proficiency. But thanks to her, now I can say that I've improved a lot over the past few weeks.", "children": [{"id": "t4-q2-p0", "name": "intro", "type": "paragraph", "full": "(intro) Sarah, and I am really pleased with her methods", "children": [{"id": "t4-q2-p0-k0", "name": "really pleased with", "type": "kick", "full": "really pleased with"}]}, {"id": "t4-q2-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) mid-30's, strict at first but warm underneath", "children": [{"id": "t4-q2-p1-k0", "name": "appeared a little strict", "type": "kick", "full": "appeared a little strict"}, {"id": "t4-q2-p1-k1", "name": "don't get me wrong", "type": "kick", "full": "don't get me wrong"}, {"id": "t4-q2-p1-k2", "name": "professionalism and human kindness", "type": "kick", "full": "professionalism and human kindness"}]}, {"id": "t4-q2-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) her real strength is the feedback", "children": [{"id": "t4-q2-p2-k0", "name": "dedicated to", "type": "kick", "full": "dedicated to"}, {"id": "t4-q2-p2-k1", "name": "a clear yet detailed comment", "type": "kick", "full": "a clear yet detailed comment"}, {"id": "t4-q2-p2-k2", "name": "get a better grasp of", "type": "kick", "full": "get a better grasp of"}]}, {"id": "t4-q2-p3", "name": "closing", "type": "paragraph", "full": "(closing) thanks to her, I've improved a lot", "children": [{"id": "t4-q2-p3-k0", "name": "I had no idea how to", "type": "kick", "full": "I had no idea how to"}, {"id": "t4-q2-p3-k1", "name": "thanks to her", "type": "kick", "full": "thanks to her"}, {"id": "t4-q2-p3-k2", "name": "improved a lot", "type": "kick", "full": "improved a lot"}]}]}, {"id": "t4-q3", "name": "finding it & directions", "tag": "5-4", "type": "question", "full": "How did you find out your English School? And how can you get there from your place?", "script": "How I found out my academy? ok, let me tell you my secret\n\nWell, when I told my mom about my concern regarding my English proficiency, my mom recommended this academy, where her friend's son got a high score after taking the course. Since my mom's recommendations have always been spot-on, I decided to sign up for the course.\n\nFurthermore, I really liked the location. It is in the heart of Gangnam where everyone in the world knows!. There are many ways to get there, like bus or subway, but for me, taking either subway number 2 or 9 is the fastest way for me to get there.\n\nOnce you come out from the Gangnam station, you will see the outstanding orange-color building with a digital clock. That's my academy.\n\nWell, Eva, If you need any help to find my academy, call me anytime. I can give you clear directions on how to get there.", "children": [{"id": "t4-q3-p0", "name": "intro", "type": "paragraph", "full": "(intro) let me tell you my secret", "children": [{"id": "t4-q3-p0-k0", "name": "let me tell you my secret", "type": "kick", "full": "let me tell you my secret"}]}, {"id": "t4-q3-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) my mom's recommendation is always spot-on", "children": [{"id": "t4-q3-p1-k0", "name": "have always been spot-on", "type": "kick", "full": "have always been spot-on"}, {"id": "t4-q3-p1-k1", "name": "sign up for", "type": "kick", "full": "sign up for"}]}, {"id": "t4-q3-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the location, and subway 2 or 9 is fastest", "children": [{"id": "t4-q3-p2-k0", "name": "in the heart of Gangnam", "type": "kick", "full": "in the heart of Gangnam"}, {"id": "t4-q3-p2-k1", "name": "the fastest way", "type": "kick", "full": "the fastest way"}]}, {"id": "t4-q3-p3", "name": "body 3", "type": "paragraph", "full": "(body 3) the orange building with a digital clock", "children": [{"id": "t4-q3-p3-k0", "name": "the outstanding orange-color building", "type": "kick", "full": "the outstanding orange-color building"}]}, {"id": "t4-q3-p4", "name": "closing", "type": "paragraph", "full": "(closing) call me anytime for directions", "children": [{"id": "t4-q3-p4-k0", "name": "clear directions on how to get there", "type": "kick", "full": "clear directions on how to get there"}]}]}]}, {"id": "t5", "name": "Workplace", "type": "topic", "full": "Workplace", "scriptUrl": "https://docs.google.com/document/d/1BhvIr78GekPdqhoJsyEdy3FZD3nXfOdWGJRBmggH4zI/edit", "children": [{"id": "t5-q0", "name": "the office", "tag": "6-1", "type": "question", "full": "Describe your office in detail. What does it look like? What kind of furniture and equipment are there?", "script": "All right, my work place. Follow me, let me guide you to my workplace.\n\nEva, do you see that massive building with those three towers? The building is named DSR, and my workplace is located in Tower A. When you walk in through the rotating door, you can see Starbucks on the left and the Samsung mobile store on the right. Oh, my workplace is in the security area, so we have to go through the security gate. After passing the gate, you can find the testing lab on the sixth floor where various equipment is running 24/7. I often visit the lab to figure out a potential defect that may exist on my device. Well, the testers are fully automatic and connected to my company's intranet, so I can control or monitor all the processes at my seat. Let's go to the 17th floor. My seat is are there.\n\nThe 17th floor is my office. I belong to a design team where hundreds of employees are working. Well, there aren't any particular specials on my seat, it just looks like a normal office. I have my notebook connected to my dual monitors, the wireless keyboard and the wireless mouse on the desk mat.\n\nThat's it, Eva.", "children": [{"id": "t5-q0-p0", "name": "intro", "type": "paragraph", "full": "(intro) follow me, let me guide you to my workplace", "children": [{"id": "t5-q0-p0-k0", "name": "let me guide you to", "type": "kick", "full": "let me guide you to"}]}, {"id": "t5-q0-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) the massive building and the security gate", "children": [{"id": "t5-q0-p1-k0", "name": "massive building with three towers", "type": "kick", "full": "massive building with three towers"}, {"id": "t5-q0-p1-k1", "name": "the rotating door", "type": "kick", "full": "the rotating door"}, {"id": "t5-q0-p1-k2", "name": "go through the security gate", "type": "kick", "full": "go through the security gate"}]}, {"id": "t5-q0-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the testing lab on the sixth floor", "children": [{"id": "t5-q0-p2-k0", "name": "running 24/7", "type": "kick", "full": "running 24/7"}, {"id": "t5-q0-p2-k1", "name": "a potential defect", "type": "kick", "full": "a potential defect"}, {"id": "t5-q0-p2-k2", "name": "monitor all the processes at my seat", "type": "kick", "full": "monitor all the processes at my seat"}]}, {"id": "t5-q0-p3", "name": "body 3", "type": "paragraph", "full": "(body 3) the seventeenth floor, my desk in the design team", "children": [{"id": "t5-q0-p3-k0", "name": "I belong to a design team", "type": "kick", "full": "I belong to a design team"}, {"id": "t5-q0-p3-k1", "name": "aren't any particular specials", "type": "kick", "full": "aren't any particular specials"}, {"id": "t5-q0-p3-k2", "name": "on the desk mat", "type": "kick", "full": "on the desk mat"}]}, {"id": "t5-q0-p4", "name": "closing", "type": "paragraph", "full": "(closing) that's it", "children": []}]}, {"id": "t5-q1", "name": "office then vs. now", "tag": "6-2", "type": "question", "full": "Think about the office you work in now and offices in the past. What's different about the environment, the equipment, and the atmosphere?", "script": "Well, regarding the changes of my workplace, definitely, COVID-19 was the tipping point.\n\nYou know, during COVID-19, every kind of offline gathering was prohibited and changed to online. My company also went through the paradigm shift, so we had an online meeting, online teaching, an onlline conference, and even an online company dinner! Well, there was a positive side for sure, for example we could freely exit meetings without feeling self-conscious and we could attend international conferences remotely from Korea. But I felt a bit stuffy at that time, because I couldn't talk with other people freely and I had to always wear my dental mask all day long.\n\nAfter the pandemic subsided, our relaxing area reopened with a full renovation. I was so glad to use the canteen room again,as stopping by the coffee machine was a staple of my morning routine. You know what? Actually, the canteen is fully equipped with fun stuff, including a dartboard, a Playstation room, folding beds, and even some massage chairs in the corner.\n\nWell Eva, though I had a tough time during COVID-19, I really appreciated the upgraded canteen room anyway.", "children": [{"id": "t5-q1-p0", "name": "intro", "type": "paragraph", "full": "(intro) COVID-19 was the tipping point", "children": [{"id": "t5-q1-p0-k0", "name": "the tipping point", "type": "kick", "full": "the tipping point"}]}, {"id": "t5-q1-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) everything went online, the good and the stuffy", "children": [{"id": "t5-q1-p1-k0", "name": "went through the paradigm shift", "type": "kick", "full": "went through the paradigm shift"}, {"id": "t5-q1-p1-k1", "name": "without feeling self-conscious", "type": "kick", "full": "without feeling self-conscious"}, {"id": "t5-q1-p1-k2", "name": "felt a bit stuffy", "type": "kick", "full": "felt a bit stuffy"}]}, {"id": "t5-q1-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) after the pandemic, a fully renovated canteen", "children": [{"id": "t5-q1-p2-k0", "name": "the pandemic subsided", "type": "kick", "full": "the pandemic subsided"}, {"id": "t5-q1-p2-k1", "name": "a staple of my morning routine", "type": "kick", "full": "a staple of my morning routine"}, {"id": "t5-q1-p2-k2", "name": "fully equipped with fun stuff", "type": "kick", "full": "fully equipped with fun stuff"}]}, {"id": "t5-q1-p3", "name": "closing", "type": "paragraph", "full": "(closing) a tough time, but I appreciated the upgrade", "children": [{"id": "t5-q1-p3-k0", "name": "I really appreciated", "type": "kick", "full": "I really appreciated"}]}]}, {"id": "t5-q2", "name": "first job", "tag": "6-3", "type": "question", "full": "Tell me about your first job. What kind of company was it and what did you do there?", "script": "Well, my first job. That question takes me back to high school, when I first had to decide which college and department to pursue. At that time, I was at a crossroads between medical school and electrical engineering. But in fact, my father was an electrical engineer so he nudged me toward pursuing a career in engineering. So I got into Seoul National University and I continued my studies and obtained my Ph.D. at the same school. As I received a Samsung scholarship during my Ph.D. course, well it was natural to join Samsung after my graduation. When I was a graduate student, I was a lot curious about the life of an engineer in a big company. Because I heard from someone that engineers in a big company are treated as just another cog in the machine. However, after going through it myself, I came to realize that the place was a field to draw a future of both the company and me. I really enjoyed my role as a technical leader, collaborating with a brillant team to develop cutting-edge devices.\n\nI really grew a lot with the company. That's it Eva!", "children": [{"id": "t5-q2-p0", "name": "intro", "type": "paragraph", "full": "(intro) the question takes me back to high school", "children": [{"id": "t5-q2-p0-k0", "name": "takes me back to", "type": "kick", "full": "takes me back to"}, {"id": "t5-q2-p0-k1", "name": "at a crossroads between", "type": "kick", "full": "at a crossroads between"}, {"id": "t5-q2-p0-k2", "name": "nudged me toward", "type": "kick", "full": "nudged me toward"}]}, {"id": "t5-q2-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) the path from SNU to a Ph.D. to Samsung", "children": [{"id": "t5-q2-p1-k0", "name": "obtained my Ph.D.", "type": "kick", "full": "obtained my Ph.D."}, {"id": "t5-q2-p1-k1", "name": "it was natural to", "type": "kick", "full": "it was natural to"}]}, {"id": "t5-q2-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) I expected a cog in the machine, but found a field", "children": [{"id": "t5-q2-p2-k0", "name": "just another cog in the machine", "type": "kick", "full": "just another cog in the machine"}, {"id": "t5-q2-p2-k1", "name": "after going through it myself", "type": "kick", "full": "after going through it myself"}, {"id": "t5-q2-p2-k2", "name": "a field to draw a future", "type": "kick", "full": "a field to draw a future"}]}, {"id": "t5-q2-p3", "name": "closing", "type": "paragraph", "full": "(closing) I really grew a lot with the company", "children": [{"id": "t5-q2-p3-k0", "name": "as a technical leader", "type": "kick", "full": "as a technical leader"}, {"id": "t5-q2-p3-k1", "name": "cutting-edge devices", "type": "kick", "full": "cutting-edge devices"}, {"id": "t5-q2-p3-k2", "name": "grew a lot with", "type": "kick", "full": "grew a lot with"}]}]}]}, {"id": "t6", "name": "Technology", "type": "topic", "full": "Technology", "scriptUrl": "https://docs.google.com/document/d/1QiMFGqbfunsrDgxqrJnJWs1Ofph6imUmsr56VPoO7As/edit", "children": [{"id": "t6-q0", "name": "tech at school", "tag": "7-1", "type": "question", "full": "These days, lots of technologies are used at school. What are they? And how are they convenient? Tell me everything with examples", "script": "Technology has had a significant impact on schools, transforming both the teaching and learning experiences. This has been accelerated with the development of AI, resulting in both positive and negative impacts.\n\nActually, my wife has recently been appointed as a professor to Dongnam university, and she was concerned about preparing her lecture materials. Well, she was in panic realizing that she didn't have any materials made even a week before the start of a semester! Watching her struggle, I suggested her to use AI. AI made her 30-page long materials within an hour! Like this experience, I've heard that more and more lecture materials are being created using AI. The AI has significantly lessened the workload of preparing lecture materials, allowing professors to dedicate more time to their research.\n\nHowever, AI also brought some negative downsides for sure. Students often just dump their homework on AI without even thinking about it. Furthermore, some students tend to skip fundamentals altogether, relying on AI to predict the exam questions. The more they rely on AI, the less they think by themselves.\n\nWell, AI did bring us convenience, but also we need to be wary of its side effects. I think schools should teach students how to use AI wisely to prevent misuse of AI.", "children": [{"id": "t6-q0-p0", "name": "intro", "type": "paragraph", "full": "(intro) technology is transforming teaching and learning", "children": [{"id": "t6-q0-p0-k0", "name": "has had a significant impact", "type": "kick", "full": "has had a significant impact"}, {"id": "t6-q0-p0-k1", "name": "has been accelerated with", "type": "kick", "full": "has been accelerated with"}]}, {"id": "t6-q0-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) my wife was in panic a week before the semester", "children": [{"id": "t6-q0-p1-k0", "name": "was appointed as", "type": "kick", "full": "was appointed as"}, {"id": "t6-q0-p1-k1", "name": "she was in panic", "type": "kick", "full": "she was in panic"}]}, {"id": "t6-q0-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) AI made her materials within an hour", "children": [{"id": "t6-q0-p2-k0", "name": "within an hour", "type": "kick", "full": "within an hour"}, {"id": "t6-q0-p2-k1", "name": "lessened the workload", "type": "kick", "full": "lessened the workload"}, {"id": "t6-q0-p2-k2", "name": "dedicate more time to", "type": "kick", "full": "dedicate more time to"}]}, {"id": "t6-q0-p3", "name": "body 3", "type": "paragraph", "full": "(body 3) the downside, students dumping homework on AI", "children": [{"id": "t6-q0-p3-k0", "name": "dump their homework on AI", "type": "kick", "full": "dump their homework on AI"}, {"id": "t6-q0-p3-k1", "name": "skip fundamentals altogether", "type": "kick", "full": "skip fundamentals altogether"}, {"id": "t6-q0-p3-k2", "name": "the more they rely the less they think", "type": "kick", "full": "the more they rely the less they think"}]}, {"id": "t6-q0-p4", "name": "closing", "type": "paragraph", "full": "(closing) schools should teach how to use AI wisely", "children": [{"id": "t6-q0-p4-k0", "name": "be wary of its side effects", "type": "kick", "full": "be wary of its side effects"}, {"id": "t6-q0-p4-k1", "name": "use AI wisely", "type": "kick", "full": "use AI wisely"}]}]}, {"id": "t6-q1", "name": "daily tech", "tag": "7-2", "type": "question", "full": "Tell me about the technology that you use a lot in your daily life. What are the devices that you use and how are they convenient? Are there any problems appearing? Please tell me all the merits and demerits of current technology that you use daily.", "script": "We are living in the era of smartphones, and we can't call our days convenient without mentioning our smartphones.\n\nEverything can be done easily with a few finger taps, whether it may be checking our bank balance, or messaging our friends abroad. For me, mobile stock trading is the most useful feature among them. You know, I remember my father calling his fund manager to sell or buy stocks. That seemed so uncomfortable given that  stock trading is such a frequently-occurred and time-sensitive activity. With my mobile trading system on my smartphone, I can trade stocks whenever and wherever I want with unlimitied time and place.\n\nIronically, this convenience often takes the joy out of our daily lives. Convenient stock trading is indeed a double-edged sword in that some people do nothing but to look at their stock prices. People are always busy doing something with their smartphones, I'm not sure whether that is of any great importance though, they create a huge barrier to meaningful communication with others. This smartphone addiction took away valuable face-to-face communication even when they're together.\n\nWell, it's our responsibility to control our use of technology, and to not let it distract us from what's more important and meaningful in our lives.", "children": [{"id": "t6-q1-p0", "name": "intro", "type": "paragraph", "full": "(intro) we are living in the era of smartphones", "children": [{"id": "t6-q1-p0-k0", "name": "the era of smartphones", "type": "kick", "full": "the era of smartphones"}]}, {"id": "t6-q1-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) mobile trading, versus my father calling his fund manager", "children": [{"id": "t6-q1-p1-k0", "name": "with a few finger taps", "type": "kick", "full": "with a few finger taps"}, {"id": "t6-q1-p1-k1", "name": "time-sensitive", "type": "kick", "full": "time-sensitive"}, {"id": "t6-q1-p1-k2", "name": "whenever and wherever", "type": "kick", "full": "whenever and wherever"}]}, {"id": "t6-q1-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) the same convenience takes the joy out of life", "children": [{"id": "t6-q1-p2-k0", "name": "takes the joy out of", "type": "kick", "full": "takes the joy out of"}, {"id": "t6-q1-p2-k1", "name": "a double-edged sword", "type": "kick", "full": "a double-edged sword"}, {"id": "t6-q1-p2-k2", "name": "a huge barrier to meaningful communication", "type": "kick", "full": "a huge barrier to meaningful communication"}]}, {"id": "t6-q1-p3", "name": "closing", "type": "paragraph", "full": "(closing) it's our responsibility to control our use", "children": [{"id": "t6-q1-p3-k0", "name": "distract us from", "type": "kick", "full": "distract us from"}]}]}, {"id": "t6-q2", "name": "home appliances", "tag": "7-3", "type": "question", "full": "Many homes today are equipped with new appliances or electronic devices that make everyday life more convenient. What are some of these new appliances or electronic devices in your home? How have they changed household responsibilities?", "script": "Alright Eva, as an engineer, I utilize my home appliances to its maximum. I'd love to tell you about some of my favorites.\n\nOne of my primary household chores is cleaning up after meals. To be honest, my dish washer does it, not me. My wife always says that it is better to wash the dishes by hand, not by the machine. Well, I'm firmly on the other side of that opinion. I believe that the dishwasher is one of the greatest inventings that mankind has ever made. I just open the door, load the dishes and add the detergent and hit the start button! It's such a huge time-saver that liberates me from one of the most monotonous and tedious house chores.\n\nAnother house chore I handle is laundry. Since our family is four, we generate a mountain of laundry every single day. Doing the whole cycle of washing and hanging clothes to dry daily would be physically draining.Well, I always have my plan. Eva, did you know that the brand-new laundry machine provides a full course from washing to drying? There is no need to manually pull out the washed clothes to dry! Just toss the laundry in, and add some detergent and fabric softeners, and hit the start! It's super easy huh?\n\nEva, my credo is to fully utilize the modern conveniences. Why don't you look around for your brand-new home appliances this weekend?", "children": [{"id": "t6-q2-p0", "name": "intro", "type": "paragraph", "full": "(intro) as an engineer, I use my appliances to the maximum", "children": [{"id": "t6-q2-p0-k0", "name": "to its maximum", "type": "kick", "full": "to its maximum"}]}, {"id": "t6-q2-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) cleaning up after meals, and my dishwasher does it", "children": [{"id": "t6-q2-p1-k0", "name": "the dish washer does it not me", "type": "kick", "full": "the dish washer does it not me"}, {"id": "t6-q2-p1-k1", "name": "such a huge time-saver", "type": "kick", "full": "such a huge time-saver"}, {"id": "t6-q2-p1-k2", "name": "monotonous and tedious", "type": "kick", "full": "monotonous and tedious"}]}, {"id": "t6-q2-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) laundry, a mountain of it, and a full course machine", "children": [{"id": "t6-q2-p2-k0", "name": "a mountain of laundry", "type": "kick", "full": "a mountain of laundry"}, {"id": "t6-q2-p2-k1", "name": "physically draining", "type": "kick", "full": "physically draining"}, {"id": "t6-q2-p2-k2", "name": "a full course from washing to drying", "type": "kick", "full": "a full course from washing to drying"}]}, {"id": "t6-q2-p3", "name": "closing", "type": "paragraph", "full": "(closing) my credo, look around this weekend", "children": [{"id": "t6-q2-p3-k0", "name": "my credo", "type": "kick", "full": "my credo"}, {"id": "t6-q2-p3-k1", "name": "look around for", "type": "kick", "full": "look around for"}]}]}, {"id": "t6-q3", "name": "tech then vs. now", "tag": "7-4", "type": "question", "full": "How had technology changed from the past to the present? What kind of technology have you used in the past? How is it different from the technology you use today?", "script": "You know, technology has transformed considerably in the past few decades. It has helped us get things done much easier and faster. And I'd say the smartphone is at the forefront of these changes.\n\nEven about ten years ago, a cell phone was basically what we used only for calling and texting others. Although we could access the internet with cell phones, it came at a hefty price. So for other tasks, we had to use our computers. But after Apple's iphone first unveiled to the world, our whole life has been changed. It was more than just a phone. Rather, it was closer to a mini computer. We could do anything once connected to the internet, such as doing online banking, playing games with friends, surfing the web, and you name it.\n\nIt's truly remarkable, isn't it?", "children": [{"id": "t6-q3-p0", "name": "intro", "type": "paragraph", "full": "(intro) technology has transformed, and the smartphone leads", "children": [{"id": "t6-q3-p0-k0", "name": "has transformed considerably", "type": "kick", "full": "has transformed considerably"}, {"id": "t6-q3-p0-k1", "name": "at the forefront of these changes", "type": "kick", "full": "at the forefront of these changes"}]}, {"id": "t6-q3-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) ten years ago, only calling and texting", "children": [{"id": "t6-q3-p1-k0", "name": "only for calling and texting", "type": "kick", "full": "only for calling and texting"}, {"id": "t6-q3-p1-k1", "name": "at a hefty price", "type": "kick", "full": "at a hefty price"}]}, {"id": "t6-q3-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) after the iPhone, closer to a mini computer", "children": [{"id": "t6-q3-p2-k0", "name": "more than just a phone", "type": "kick", "full": "more than just a phone"}, {"id": "t6-q3-p2-k1", "name": "closer to a mini computer", "type": "kick", "full": "closer to a mini computer"}, {"id": "t6-q3-p2-k2", "name": "and you name it", "type": "kick", "full": "and you name it"}]}, {"id": "t6-q3-p3", "name": "closing", "type": "paragraph", "full": "(closing) it's truly remarkable, isn't it", "children": [{"id": "t6-q3-p3-k0", "name": "truly remarkable", "type": "kick", "full": "truly remarkable"}]}]}, {"id": "t6-q4", "name": "learning new tech", "tag": "7-5", "type": "question", "full": "How did you learn certain skills or technology? Tell me all the steps that you went through to learn that specific skill or technology", "script": "You know, I'm not very tech savvy or an early adaptor. It takes me a while to learn advanced features of high-end devices. That's why I think that either asking my friends for know-hows or watching video clips is the best way to learn instructions of the devices.\n\nI've had a cell phone for a few years, actually I never really used its features other than calling and texting. But my friends were using their smart phones for things like a mini computer! learned a bit from them, but I felt like I still wasn't using my phone to its full potential.\n\nI wanted to learn more, but I didn't know how to. So I searched on Youtube, hoping to find some easy-to-follow tutorial videos with kind explanations. Fortunately, I was able to find videos that taught me how to master my smartphone! Now I can use my phone for everything, including banking, mobile trading, ordering food, you name it. I never realized just how versatile it really was!\n\nAll in all, that's how I feel about learning new skills and technology. Well, I have my friends to ask how, I feel self-conscious about bothering them.  That's why I'm relying on the instructional video! How about you Eva?", "children": [{"id": "t6-q4-p0", "name": "intro", "type": "paragraph", "full": "(intro) not tech savvy, so I ask friends or watch videos", "children": [{"id": "t6-q4-p0-k0", "name": "not very tech savvy", "type": "kick", "full": "not very tech savvy"}, {"id": "t6-q4-p0-k1", "name": "an early adaptor", "type": "kick", "full": "an early adaptor"}, {"id": "t6-q4-p0-k2", "name": "takes me a while", "type": "kick", "full": "takes me a while"}]}, {"id": "t6-q4-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) I had a phone but never used it beyond calls", "children": [{"id": "t6-q4-p1-k0", "name": "to its full potential", "type": "kick", "full": "to its full potential"}]}, {"id": "t6-q4-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) I searched Youtube for easy-to-follow tutorials", "children": [{"id": "t6-q4-p2-k0", "name": "easy-to-follow tutorials", "type": "kick", "full": "easy-to-follow tutorials"}, {"id": "t6-q4-p2-k1", "name": "how versatile it really was", "type": "kick", "full": "how versatile it really was"}]}, {"id": "t6-q4-p3", "name": "closing", "type": "paragraph", "full": "(closing) shy to keep asking, so I rely on videos", "children": [{"id": "t6-q4-p3-k0", "name": "all in all", "type": "kick", "full": "all in all"}, {"id": "t6-q4-p3-k1", "name": "feel self-conscious about", "type": "kick", "full": "feel self-conscious about"}]}]}, {"id": "t6-q5", "name": "tech for a project", "tag": "7-6", "type": "question", "full": "Tell me about the technology you used when you were doing a project. How was it convenient? Tell me about the project and the technology that you used in detail", "script": "One of the projects that I worked on was preparing a presentation at my English course. It was a team project, so you know, the main issue was communication. We had to meet at least twice a week in order to make progress, but it was hard to meet even once a week because of different schedules.\n\nI thought a lot about how to solve this problem, and a good idea hit my mind. I proposed that we switch most of our meetings to online gatherings using Zoom. Everyone agreed, and we could meet up regularly and frequently online. We assigned each other roles, shared information and constructive feedback, and discussed various issues for the presentation. Those were all done online, and we met in person only  when it was necessary such as the day before the presentation. Other than that, we would not be able to give our presentation on time.\n\nThanks to the development of modern technology, we were able to communicate seamlessly, overcoming the limit of physical and temporal constraints we faced before. Looking back on it, I think we used our time and energy as efficiently as possible. Not to mention that we had a very good job on the presentation!", "children": [{"id": "t6-q5-p0", "name": "intro", "type": "paragraph", "full": "(intro) a team presentation, and scheduling was the issue", "children": [{"id": "t6-q5-p0-k0", "name": "make progress", "type": "kick", "full": "make progress"}, {"id": "t6-q5-p0-k1", "name": "because of different schedules", "type": "kick", "full": "because of different schedules"}]}, {"id": "t6-q5-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) a good idea hit my mind, switch to Zoom", "children": [{"id": "t6-q5-p1-k0", "name": "a good idea hit my mind", "type": "kick", "full": "a good idea hit my mind"}, {"id": "t6-q5-p1-k1", "name": "switch to online gatherings", "type": "kick", "full": "switch to online gatherings"}]}, {"id": "t6-q5-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) roles, feedback, and meeting in person only when needed", "children": [{"id": "t6-q5-p2-k0", "name": "assigned each other roles", "type": "kick", "full": "assigned each other roles"}, {"id": "t6-q5-p2-k1", "name": "constructive feedback", "type": "kick", "full": "constructive feedback"}, {"id": "t6-q5-p2-k2", "name": "in person", "type": "kick", "full": "in person"}]}, {"id": "t6-q5-p3", "name": "closing", "type": "paragraph", "full": "(closing) seamless communication beyond time and place", "children": [{"id": "t6-q5-p3-k0", "name": "communicate seamlessly", "type": "kick", "full": "communicate seamlessly"}, {"id": "t6-q5-p3-k1", "name": "physical and temporal constraints", "type": "kick", "full": "physical and temporal constraints"}, {"id": "t6-q5-p3-k2", "name": "not to mention", "type": "kick", "full": "not to mention"}]}]}]}, {"id": "t7", "name": "Park", "type": "topic", "full": "Park", "scriptUrl": "https://docs.google.com/document/d/1VFxUeG0e9lyxTiqjhI-J9GyTjcpAaf_CwMHPuShoyc0/edit", "children": [{"id": "t7-q0", "name": "favorite park", "tag": "8-1", "type": "question", "full": "Can you tell me about your favorite park? Why do you like to go there rather than other places? And how often do you go there?", "script": "There is a park that I usually go to. It is called \"Han-river Park\" having both a beautiful river and plenty of greenery. And the location is perfect, I can go there within ten minutes by foot.\n\nLet me explain more about the park to you, Eva. Either morning or night, Han-river park has its beautiful landscape with lots of attractions. You know, in the morning, simply being out in the open air makes it special for me. Jogging along the riverside helps me clear my mind and relieve stress. It really cheers me up when I feel blue. Well, I also like to take a slow walk on vast, green lawns, which helps me unwind. Actually, I appreciate the landscape of the park more at night. You know what? At night, a variety of food trucks line up at the riverside where  you can see tons of people hanging out, enjoying food and drinks in such an electric atmosphere. The rainbow-colored fountain show is a grand finale of the night.\n\nWell, I try to hit the park at least once a week despite my hectic schedule. You know, my schedule is insane. I come back home at ten PM, so I literally have no time on weekdays. So I usually go to the park on weekends with my family. Well, I do han river aprk, but I also love the way to the river park from my home, as the path is also a park that follows Seongnae Stream with beautiful trees and blooming flowers. We can see many elderly people because there is \"Asan Hospital\" nearby. I'm sure that taking a stroll along this beautiful path would really help them recover much faster. After a ten minute-walk, I can arrive at \"Han-river Park\" , which has a beautiful landscape with lots of attractions. Jogging along the riverside helps me clear my mind and relieve stress. It really cheers me up when I feel blue. Well, I also like to take a slow walk on vast, green lawns, which really makes me unwind.\n\nThat's it Eva!", "children": [{"id": "t7-q0-p0", "name": "intro", "type": "paragraph", "full": "(intro) Han-river Park, a river and plenty of greenery", "children": [{"id": "t7-q0-p0-k0", "name": "plenty of greenery", "type": "kick", "full": "plenty of greenery"}, {"id": "t7-q0-p0-k1", "name": "helps me unwind", "type": "kick", "full": "helps me unwind"}]}, {"id": "t7-q0-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) mornings, jogging and slow walks on the lawns", "children": [{"id": "t7-q0-p1-k0", "name": "out in the open air", "type": "kick", "full": "out in the open air"}, {"id": "t7-q0-p1-k1", "name": "soaking in the peaceful atmosphere", "type": "kick", "full": "soaking in the peaceful atmosphere"}, {"id": "t7-q0-p1-k2", "name": "when I'm feeling blue", "type": "kick", "full": "when I'm feeling blue"}]}, {"id": "t7-q0-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) nights, food trucks and the fountain show", "children": [{"id": "t7-q0-p2-k0", "name": "food trucks line up", "type": "kick", "full": "food trucks line up"}, {"id": "t7-q0-p2-k1", "name": "such an electric atmosphere", "type": "kick", "full": "such an electric atmosphere"}, {"id": "t7-q0-p2-k2", "name": "a grand finale", "type": "kick", "full": "a grand finale"}]}, {"id": "t7-q0-p3", "name": "body 3", "type": "paragraph", "full": "(body 3) once a week, and the path there is a park too", "children": [{"id": "t7-q0-p3-k0", "name": "hit the park", "type": "kick", "full": "hit the park"}, {"id": "t7-q0-p3-k1", "name": "despite my hectic schedule", "type": "kick", "full": "despite my hectic schedule"}, {"id": "t7-q0-p3-k2", "name": "taking a stroll along", "type": "kick", "full": "taking a stroll along"}]}, {"id": "t7-q0-p4", "name": "closing", "type": "paragraph", "full": "(closing) that's it", "children": []}]}, {"id": "t7-q1", "name": "park problems", "tag": "8-2", "type": "question", "full": "Let's talk about issues that today's parks are faced with. What are the largest challenges faced by public parks these days? Discuss what has caused these concerns.", "script": "Well, this is a definitely tough question for me to answer. Let me think about it second.\n\nI think some people leave their trash after enjoying their time. I am pretty sure that you've seen tons of garbage at parks. You know, I went to Hanriver Park last week to hit the food trucks. But I couldn't believe my eyes because the park was covered with trash! People there littered a lot after having their snacks and drinks. It was not common sense at all.\n\nWhat's worse, drinking booze was also a big problem. Yes, I also like drinking beers at the park. However, the sight of beer bottles littering around all over the ground was definitely an eye sore. They should have disposed of their bottles in the trash bins, if they were responsible citizens, especially in public spaces. It was so ugly behavior and such a shameful act for the children.\n\nWow, still we have a long way to become an advanced country. The government should enforce the education of etiquette and moral things rather than just focusing on English, Math, and science. Eva, how do you think,?", "children": [{"id": "t7-q1-p0", "name": "intro", "type": "paragraph", "full": "(intro) a tough question, let me think for a second", "children": [{"id": "t7-q1-p0-k0", "name": "let me think about it for a second", "type": "kick", "full": "let me think about it for a second"}]}, {"id": "t7-q1-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) litter, the park was covered with trash", "children": [{"id": "t7-q1-p1-k0", "name": "couldn't believe my eyes", "type": "kick", "full": "couldn't believe my eyes"}, {"id": "t7-q1-p1-k1", "name": "was covered with trash", "type": "kick", "full": "was covered with trash"}, {"id": "t7-q1-p1-k2", "name": "littered a lot", "type": "kick", "full": "littered a lot"}]}, {"id": "t7-q1-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) drinking booze, and bottles all over the ground", "children": [{"id": "t7-q1-p2-k0", "name": "what's worse", "type": "kick", "full": "what's worse"}, {"id": "t7-q1-p2-k1", "name": "an eye sore", "type": "kick", "full": "an eye sore"}, {"id": "t7-q1-p2-k2", "name": "a shameful act", "type": "kick", "full": "a shameful act"}]}, {"id": "t7-q1-p3", "name": "closing", "type": "paragraph", "full": "(closing) teach etiquette, not just English and Math", "children": [{"id": "t7-q1-p3-k0", "name": "a long way to go", "type": "kick", "full": "a long way to go"}, {"id": "t7-q1-p3-k1", "name": "rather than just focusing on", "type": "kick", "full": "rather than just focusing on"}]}]}, {"id": "t7-q2", "name": "kids vs. adults at the park", "tag": "8-3", "type": "question", "full": "Compare the activities that children do at the park as opposed to what the adults do while at parks. Tell me about the many facilities at park that are intended to accommodate both children and adults like.", "script": "Okay, Eva, I think I can answer this question well because I often visit my favorite park with my two little boys.It's fascinating how people of different ages spend time at the park in their own unique ways. Well, special facilities are not needed at all, the vast open lawns are just enough to accommodate both children and adults.\n\nFirst off, if you look at the kids, they are essentially bundles of energy. They're usually full of energy, running around, playing tag, or climbing all over the trees. With only vast, open lawns, they basically make the whole place into their playground. Butterflies sitting on flowers, cicadas buzzing in trees, and praying mantises lurking for their prey, they all are their little friends. Everywhere is their playground, everything is their friend.\n\nIn contrast, adults generally go there to unwind. For many of us, it's about finding a moment of peace. Well, adults tend to be as lazy as they can, they blow out their stress away by sprawling out on the grass. My wife and I love to be laid-back while watching the sunset. Those moments are a great opportunity for us to clear our mind and relieve our stress.\n\nAll in all, it's wonderful to see how people of all ages gather together and enjoy their own way in the beautiful park.", "children": [{"id": "t7-q2-p0", "name": "intro", "type": "paragraph", "full": "(intro) I go with my two boys, and the lawns are enough", "children": [{"id": "t7-q2-p0-k0", "name": "in their own unique ways", "type": "kick", "full": "in their own unique ways"}, {"id": "t7-q2-p0-k1", "name": "enough to accommodate", "type": "kick", "full": "enough to accommodate"}]}, {"id": "t7-q2-p1", "name": "body 1", "type": "paragraph", "full": "(body 1) children are essentially bundles of energy", "children": [{"id": "t7-q2-p1-k0", "name": "bundles of energy", "type": "kick", "full": "bundles of energy"}, {"id": "t7-q2-p1-k1", "name": "playing tag", "type": "kick", "full": "playing tag"}, {"id": "t7-q2-p1-k2", "name": "lurking for their prey", "type": "kick", "full": "lurking for their prey"}]}, {"id": "t7-q2-p2", "name": "body 2", "type": "paragraph", "full": "(body 2) adults go there to unwind and sprawl out", "children": [{"id": "t7-q2-p2-k0", "name": "in contrast", "type": "kick", "full": "in contrast"}, {"id": "t7-q2-p2-k1", "name": "as lazy as they can", "type": "kick", "full": "as lazy as they can"}, {"id": "t7-q2-p2-k2", "name": "sprawling out on the grass", "type": "kick", "full": "sprawling out on the grass"}]}, {"id": "t7-q2-p3", "name": "closing", "type": "paragraph", "full": "(closing) all ages gather and enjoy it their own way", "children": [{"id": "t7-q2-p3-k0", "name": "all in all", "type": "kick", "full": "all in all"}, {"id": "t7-q2-p3-k1", "name": "people of all ages", "type": "kick", "full": "people of all ages"}]}]}]}];

  // flat index of every question across every topic, keyed by tag —
  // powers the bulk "Export all scripts" / "Import all scripts" round trip
  const questionIndex = [];
  FOREST.forEach((t) => {
    t.children.forEach((q) => {
      questionIndex.push({ tag: q.tag, id: q.id, topic: t.name, question: q.full, node: q });
    });
  });
  const questionByTag = {};
  questionIndex.forEach((e) => {
    questionByTag[e.tag] = e;
  });

  // flat lookup of every script-beat (paragraph) object across every
  // topic, keyed by its id — used to apply kick-phrase edits (from the
  // in-panel editor or a bulk import) to the right beat regardless of
  // which topic is currently on screen.
  const paragraphById = {};
  FOREST.forEach((t) => {
    t.children.forEach((q) => {
      (q.children || []).forEach((p) => {
        paragraphById[p.id] = p;
      });
    });
  });

  // whether a question's script panel starts open. Off by default (open it
  // per-question with its own "Show script" button) — persisted so a
  // viewer who flips the topbar's "View all scripts" on gets that as the
  // default again next visit too.
  let initialScriptsVisible = false;
  try {
    initialScriptsVisible = localStorage.getItem("opic-scripts-visible") === "1";
  } catch (e) {}

  const state = { topicIndex: 0, current: null, scriptsVisible: initialScriptsVisible };

  const groveList = d3.select("#groveList");
  const svg = d3.select("#tree");
  const g = svg.append("g").attr("class", "viewport");
  const linkLayer = g.append("g").attr("class", "links");
  const nodeLayer = g.append("g").attr("class", "nodes");
  const readingBody = document.getElementById("readingBody");
  const reading = document.getElementById("reading");

  const zoom = d3.zoom()
    .scaleExtent([0.35, 3])
    .on("zoom", (event) => g.attr("transform", event.transform));
  svg.call(zoom).on("dblclick.zoom", null);

  // column gaps are computed fresh every render from the actual measured
  // pill widths (see fitColumns below) — this is just the minimum
  // clearance added between two adjacent columns' widest pills. Row spacing
  // is likewise computed fresh from measured pill heights (see renderTree)
  // since a script-beat pill now shows its full verbatim text and can run
  // to several lines — ROW_BUFFER is just the clearance added on top of the
  // tallest pill anywhere in the current view.
  const COLUMN_BUFFER = 34;
  const ROW_BUFFER = 16;
  const PILL_PAD_X = { topic: 16, question: 12, paragraph: 12, kick: 9 };
  const PILL_PAD_Y = { topic: 9, question: 7, paragraph: 8, kick: 5 };
  const WRAP_CHARS = { topic: 99, question: 30, paragraph: 32, kick: 18 };

  // remembers each node's last-drawn screen position, keyed by its id, so a
  // search jump can pan the camera to it right after expanding it
  const posById = new Map();

  // splits a label into as many lines as it takes to keep each one under
  // maxChars, so a pill never has to stretch to fit one very long line —
  // a script beat's full text can run to several lines, which is fine
  // since row height is measured and laid out after wrapping (see below)
  function wrapLabel(text, maxChars) {
    const words = text.split(/\s+/);
    const lines = [];
    let cur = "";
    for (const w of words) {
      const trial = cur ? `${cur} ${w}` : w;
      if (cur && trial.length > maxChars) {
        lines.push(cur);
        cur = w;
      } else {
        cur = trial;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ---- prepare per-topic hierarchy with collapse state ----
  function buildRoot(topicData) {
    const root = d3.hierarchy(topicData);
    root.descendants().forEach((d) => (d.id = d.data.id));
    root.descendants().forEach((d) => {
      if (d.depth >= 1 && d.children) {
        d._children = d.children;
        d.children = null;
      }
    });
    return root;
  }

  let roots = FOREST.map(buildRoot);

  function renderGrove() {
    const items = groveList.selectAll("li").data(FOREST, (d) => d.id);
    const li = items.enter().append("li");
    const btn = li.append("button").attr("class", "grove-item");
    btn.append("span").attr("class", "grove-ring");
    const text = btn.append("span");
    text.append("span").attr("class", "grove-name").style("display", "block");
    text.append("span").attr("class", "grove-count").style("display", "block");

    groveList.selectAll(".grove-item")
      .on("click", (event, d) => {
        state.topicIndex = FOREST.indexOf(d);
        setCurrent(null);
        renderTree(true);
        renderGrove();
      })
      .classed("active", (d, i) => i === state.topicIndex)
      .select(".grove-ring")
      .style("border-color", (d, i) => (i === state.topicIndex ? "var(--topic)" : "var(--line)"));

    groveList.selectAll(".grove-name").text((d) => d.name);
    groveList.selectAll(".grove-count").text((d) => `${d.children.length} questions`);
  }

  function crumbFor(d) {
    const chain = d
      .ancestors()
      .reverse()
      .map((n) => (n.data.tag ? `${n.data.tag} ${n.data.name}` : n.data.name));
    return chain.join(" ▸ ");
  }

  function typeLabel(t) {
    return { topic: "Topic", question: "Question", paragraph: "Script beat", kick: "Kick phrase" }[t];
  }

  function setCurrent(node) {
    state.current = node;
    nodeLayer.selectAll("g.node").classed("current", (d) => node && d.master.id === node.id);
    if (!node) {
      readingBody.innerHTML = '<p class="reading-empty">Select any node to read its full text here — the tree only ever shows short labels.</p>';
      return;
    }
    const t = node.data.type;
    let html = `<div class="reading-crumb">${crumbFor(node)}</div>`;
    html += `<div class="reading-chip chip-${t}"><span class="dot"></span>${typeLabel(t)}</div>`;
    html += `<h3>${escapeHtml(node.data.full || node.data.name)}</h3>`;
    if (t === "question") {
      html += `<p class="full-text">Tap this question in the tree to reveal its script beats, then tap a beat to reveal its kick phrases.</p>`;
      html += `<button type="button" class="script-toggle" id="scriptToggle" aria-expanded="${state.scriptsVisible}">${state.scriptsVisible ? "▾ Hide script" : "▸ Show script"}</button>`;
      html += allKicksHtml(node.data);
      html += `<div class="script-panel" id="scriptPanel"${state.scriptsVisible ? "" : " hidden"}>`;
      html += `<div class="script-head"><span class="script-label">Your script</span><div class="script-actions">`;
      html += `<button type="button" class="script-load">⬆ Load file</button>`;
      html += `<button type="button" class="script-download">⬇ Save as .txt</button>`;
      html += `<button type="button" class="script-reset">↺ Reset to original</button>`;
      html += `</div></div>`;
      html += `<textarea class="script-box" spellcheck="false" aria-label="Editable script for this question"></textarea>`;
      html += `<span class="script-status"></span>`;
      html += `<input type="file" class="script-file-input" accept=".txt,.csv,text/plain,text/csv" aria-hidden="true" tabindex="-1">`;
      html += `</div>`;
    }
    if (t === "paragraph") {
      html += `<div class="kick-editor-head"><span class="script-label">Kick phrases</span><div class="kick-actions">`;
      html += `<button type="button" class="kick-add">+ Add</button>`;
      html += `<button type="button" class="kick-reset">↺ Reset</button>`;
      html += `</div></div>`;
      html += `<div class="reading-kicks" id="kickEditor"></div>`;
      html += `<span class="script-status" id="kickStatus"></span>`;
    }
    if (t === "topic") {
      const qCount = node.data.children.length;
      const pCount = node.data.children.reduce((s, q) => s + q.children.length, 0);
      html += `<p class="full-text">${qCount} questions, ${pCount} script beats in this tree.</p>`;
      if (node.data.scriptUrl) {
        html += `<a class="btn-script" href="${escapeHtml(node.data.scriptUrl)}" target="_blank" rel="noopener">Show script ↗</a>`;
      }
    }
    readingBody.innerHTML = html;
    if (t === "question") {
      wireScriptBox(node);
      const toggleBtn = readingBody.querySelector("#scriptToggle");
      const panel = readingBody.querySelector("#scriptPanel");
      if (toggleBtn && panel) {
        toggleBtn.addEventListener("click", () => {
          const nowHidden = !panel.hidden;
          panel.hidden = nowHidden;
          toggleBtn.textContent = nowHidden ? "▸ Show script" : "▾ Hide script";
          toggleBtn.setAttribute("aria-expanded", String(!nowHidden));
        });
      }
    }
    if (t === "paragraph") wireKickEditor(node);
    if (window.matchMedia("(max-width: 900px)").matches) reading.classList.add("open");
  }

  // the editable per-question script box: defaults to that question's
  // polished script, copied verbatim from the original Google Doc (the
  // same doc the topic's "Show script" button opens) and keyed by
  // question tag — NOT a stitching of the CSV's short script-beat labels.
  // A viewer's own edits persist in this browser (localStorage) so the
  // same box comes back edited next time they open this question, until
  // they reset it. localStorage is a convenience only, though — it can be
  // cleared or unavailable — so the box also offers a real file round
  // trip: "Save as .txt" downloads the current text, and "Load file" reads
  // a .txt/.csv back in, so edits can be handed back for the source Doc
  // to be updated from.
  // works on a raw FOREST question object (id/script/children straight off
  // the data, no d3-hierarchy wrapping) — shared by defaultScriptFor below
  // and the bulk export, which walks questionIndex directly.
  function scriptTextFor(q) {
    if (q.script) return q.script;
    // fallback for a question whose Doc script hasn't been parsed yet:
    // stitch the CSV's own script-beat text together instead of leaving
    // the box empty.
    return (q.children || []).map((p) => p.full).join("\n\n");
  }

  function defaultScriptFor(node) {
    return scriptTextFor(node.data);
  }

  // the script text a viewer would actually see for a question right now:
  // their own saved edit if there is one, else the doc-sourced default.
  function effectiveScriptFor(q) {
    let saved = null;
    try {
      saved = localStorage.getItem(`opic-script:${q.id}`);
    } catch (e) {}
    return saved !== null ? saved : scriptTextFor(q);
  }

  // ---- kick-phrase editing: same localStorage-override pattern as the
  // script box, but a kick is also a real node in the tree (not just text
  // in a panel), so an edit has to update three things in step: the raw
  // FOREST paragraph object's .children (so exports/search see it), the
  // d3-hierarchy node's own children/_children (so the tree redraws it),
  // and localStorage (so it survives a reload). ----
  function kicksKey(paragraphId) {
    return `opic-kicks:${paragraphId}`;
  }

  // works on a raw FOREST paragraph object — the kick-phrases a viewer
  // would actually see for this beat right now: their own saved edit if
  // there is one, else whatever .children currently holds (which is
  // itself the pristine parse until the first edit rewrites it in place).
  function effectiveKicksFor(paragraphData) {
    let saved = null;
    try {
      saved = localStorage.getItem(kicksKey(paragraphData.id));
    } catch (e) {}
    if (saved !== null) {
      try {
        const arr = JSON.parse(saved);
        if (Array.isArray(arr)) return arr;
      } catch (e) {}
    }
    return (paragraphData.children || []).map((k) => k.name);
  }

  // every kick phrase across every beat of a question, grouped by beat —
  // shown right under "Show script" on a question's panel, always visible
  // (unlike the script itself) so it can double as a practice cue sheet:
  // read the question, answer using just these phrases, only peek at the
  // full script if you get stuck.
  function allKicksHtml(questionData) {
    const beats = questionData.children || [];
    if (!beats.length) return "";
    let html = `<div class="all-kicks-head"><span class="script-label">Kick phrases to use</span></div>`;
    html += `<div class="all-kicks">`;
    beats.forEach((p) => {
      const kicks = effectiveKicksFor(p);
      html += `<div class="all-kicks-group">`;
      html += `<span class="all-kicks-cue">${escapeHtml(p.name)}</span>`;
      html += kicks.length
        ? `<div class="reading-kicks">` + kicks.map((k) => `<span class="kick-chip">${escapeHtml(k)}</span>`).join("") + `</div>`
        : `<p class="kick-empty">No kick phrases yet.</p>`;
      html += `</div>`;
    });
    html += `</div>`;
    return html;
  }

  // rebuilds a paragraph's kick-hierarchy children from its (already
  // updated) raw .children array. Kick nodes are leaves, so a fresh
  // d3.hierarchy() per kick — reparented onto the paragraph master node —
  // is simpler and safer than hand-patching the old node objects.
  function rebuildKickChildren(paragraphMaster, forceExpand) {
    const kickNodes = (paragraphMaster.data.children || []).map((kickData) => {
      const kn = d3.hierarchy(kickData);
      kn.parent = paragraphMaster;
      kn.depth = paragraphMaster.depth + 1;
      kn.height = 0;
      kn.id = kickData.id;
      return kn;
    });
    if (forceExpand || paragraphMaster.children) {
      paragraphMaster.children = kickNodes;
      paragraphMaster._children = null;
    } else {
      paragraphMaster._children = kickNodes;
      paragraphMaster.children = null;
    }
  }

  // ALL_NODES (built once, below, for search) is a flat list of raw data
  // objects; a kick edit has to patch it too or search would keep
  // matching removed kicks and never find new ones. Kick ids are always
  // "<paragraphId>-k<n>", so they're easy to pick out and replace. The
  // topic is looked up from the id's own "tN-" prefix rather than
  // state.topicIndex, since a bulk import can edit a paragraph that isn't
  // in the topic currently on screen.
  function reindexKicksFor(paragraphData) {
    const m = /^t(\d+)-/.exec(paragraphData.id);
    const topicData = m ? FOREST[Number(m[1])] : FOREST[state.topicIndex];
    for (let i = ALL_NODES.length - 1; i >= 0; i--) {
      if (ALL_NODES[i].node.id.startsWith(paragraphData.id + "-k")) ALL_NODES.splice(i, 1);
    }
    (paragraphData.children || []).forEach((k) => ALL_NODES.push({ node: k, topic: topicData }));
  }

  function scriptFilename(node) {
    const tag = node.data.tag || node.id;
    const slug = (node.data.name || "question").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return `opic-${tag}-${slug || "script"}.txt`;
  }

  function showScriptStatus(el, text, isError) {
    if (!el) return;
    el.textContent = text;
    el.style.color = isError ? "var(--kick)" : "var(--muted)";
    window.clearTimeout(el._fadeTimer);
    el._fadeTimer = window.setTimeout(() => {
      el.textContent = "";
    }, 3200);
  }

  // shared by the per-question "Save as .txt" button and the topbar's
  // "Export all scripts" button — offers a generated file to the viewer
  // via the artifact's downloads capability, never a direct download link.
  async function saveTextFile(filename, text, statusEl, successMessage) {
    if (!window.claude || typeof window.claude.use !== "function") {
      showScriptStatus(statusEl, "Downloads aren't available in this view.", true);
      return false;
    }
    try {
      const downloads = await window.claude.use("downloads");
      if (!downloads) {
        showScriptStatus(statusEl, "Downloads aren't available in this view.", true);
        return false;
      }
      await downloads.save({ filename, data: text });
      showScriptStatus(statusEl, successMessage || "Saved.");
      return true;
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") {
        showScriptStatus(statusEl, "Download declined.");
      } else if (code === "rate_limited") {
        showScriptStatus(statusEl, "Try again in a moment.", true);
      } else {
        showScriptStatus(statusEl, "Couldn't save the file.", true);
      }
      return false;
    }
  }

  function wireScriptBox(node) {
    const box = readingBody.querySelector(".script-box");
    const resetBtn = readingBody.querySelector(".script-reset");
    const downloadBtn = readingBody.querySelector(".script-download");
    const loadBtn = readingBody.querySelector(".script-load");
    const fileInput = readingBody.querySelector(".script-file-input");
    const status = readingBody.querySelector(".script-status");
    if (!box) return;
    const key = `opic-script:${node.id}`;
    const original = defaultScriptFor(node);

    let saved = null;
    try {
      saved = localStorage.getItem(key);
    } catch (e) {}
    box.value = saved !== null ? saved : original;

    box.addEventListener("input", () => {
      try {
        localStorage.setItem(key, box.value);
      } catch (e) {}
    });

    resetBtn.addEventListener("click", () => {
      box.value = original;
      try {
        localStorage.removeItem(key);
      } catch (e) {}
      box.focus();
      showScriptStatus(status, "Reset to the original script.");
    });

    if (downloadBtn) {
      downloadBtn.addEventListener("click", () => saveTextFile(scriptFilename(node), box.value, status));
    }

    if (loadBtn && fileInput) {
      loadBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          box.value = String(reader.result || "");
          try {
            localStorage.setItem(key, box.value);
          } catch (e) {}
          showScriptStatus(status, `Loaded ${file.name}.`);
        };
        reader.onerror = () => showScriptStatus(status, "Couldn't read that file.", true);
        reader.readAsText(file);
      });
    }
  }

  // the editable kick-phrase list on a script-beat panel: add / edit / delete
  // a chip and the change shows up immediately as kick nodes under that beat
  // in the tree (see rebuildKickChildren) — not just in this panel — and
  // persists to localStorage the same way the script box does.
  function wireKickEditor(node) {
    const editor = readingBody.querySelector("#kickEditor");
    const addBtn = readingBody.querySelector(".kick-add");
    const resetBtn = readingBody.querySelector(".kick-reset");
    const status = readingBody.querySelector("#kickStatus");
    if (!editor) return;

    // capture the pristine kick list once, before this session's first
    // edit ever touches node.data.children — this is what "Reset" restores.
    if (!node.data.__originalKicks) {
      node.data.__originalKicks = (node.data.children || []).map((k) => k.name);
    }

    function currentKicks() {
      return effectiveKicksFor(node.data);
    }

    function applyKicks(kicks, persist) {
      const cleaned = kicks.map((k) => k.trim()).filter((k) => k.length);
      try {
        if (persist === false) localStorage.removeItem(kicksKey(node.id));
        else localStorage.setItem(kicksKey(node.id), JSON.stringify(cleaned));
      } catch (e) {}
      node.data.children = cleaned.map((text, i) => ({ id: `${node.id}-k${i}`, name: text, type: "kick", full: text }));
      reindexKicksFor(node.data);
      rebuildKickChildren(node, true);
      renderTree(false);
      renderEditor(cleaned);
    }

    function renderEditor(kicks) {
      editor.innerHTML = "";
      kicks.forEach((text, i) => {
        const chip = document.createElement("span");
        chip.className = "kick-chip kick-chip-edit";

        const input = document.createElement("input");
        input.type = "text";
        input.className = "kick-input";
        input.value = text;
        input.setAttribute("aria-label", `Kick phrase ${i + 1}`);
        input.size = Math.max(4, text.length);
        input.addEventListener("input", () => {
          input.size = Math.max(4, input.value.length);
        });
        input.addEventListener("change", () => {
          const kicks2 = currentKicks();
          kicks2[i] = input.value;
          applyKicks(kicks2);
          showScriptStatus(status, "Saved.");
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            input.blur();
          }
        });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "kick-del";
        del.setAttribute("aria-label", `Remove kick phrase ${i + 1}`);
        del.textContent = "×";
        del.addEventListener("click", () => {
          const kicks2 = currentKicks();
          kicks2.splice(i, 1);
          applyKicks(kicks2);
          showScriptStatus(status, "Removed.");
        });

        chip.appendChild(input);
        chip.appendChild(del);
        editor.appendChild(chip);
      });
      if (!kicks.length) {
        const empty = document.createElement("p");
        empty.className = "kick-empty";
        empty.textContent = "No kick phrases yet.";
        editor.appendChild(empty);
      }
    }

    renderEditor(currentKicks());

    if (addBtn) {
      addBtn.addEventListener("click", () => {
        const kicks = currentKicks();
        kicks.push("new kick");
        applyKicks(kicks);
        showScriptStatus(status, "Added.");
        const inputs = editor.querySelectorAll(".kick-input");
        const last = inputs[inputs.length - 1];
        if (last) {
          last.focus();
          last.select();
        }
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener("click", () => {
        applyKicks(node.data.__originalKicks.slice(), false);
        showScriptStatus(status, "Reset to the original kick phrases.");
      });
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function toggle(d) {
    if (d.data.type !== "question" && d.data.type !== "paragraph") return;
    if (d.children) {
      d._children = d.children;
      d.children = null;
    } else if (d._children) {
      d.children = d._children;
      d._children = null;
    }
    renderTree(false);
  }

  // wraps a master (state-tracking) hierarchy node in a plain object so a
  // fresh, self-contained d3.hierarchy can be built for layout purposes
  // without disturbing the master's own .parent chain
  function mirrorVisible(masterNode) {
    return {
      master: masterNode,
      children: masterNode.children ? masterNode.children.map(mirrorVisible) : undefined,
    };
  }

  // builds one side's (an array of top-level question master-nodes)
  // self-contained hierarchy for layout purposes, without disturbing the
  // master's own .parent chain
  function buildSideHierarchy(questionNodes) {
    if (!questionNodes.length) return null;
    return d3.hierarchy({ children: questionNodes.map(mirrorVisible) });
  }

  // lays out one side's hierarchy as a tidy tree at the given row spacing,
  // converting each node's row into a screen Y recentered around this
  // side's own vertical middle so left and right can have different
  // extents. Screen X is filled in later, once every visible pill has been
  // measured (see fitColumns). Safe to call twice on the same wrapper:
  // d3.tree() re-lays-out the very same node objects in place, so calling
  // this again with the real row gap (once pill heights are known) just
  // updates .screenY on the exact objects the first, placeholder-gap call
  // already attached pill measurements to.
  function layoutSideRows(wrapper, side, rowGap) {
    if (!wrapper) return [];
    d3.tree()
      .nodeSize([rowGap, 1])
      .separation((a, b) => (a.parent === b.parent ? 1 : 1.7))(wrapper);

    const rows = wrapper.descendants().filter((d) => d.depth > 0);
    if (!rows.length) return [];
    const extent = d3.extent(rows, (d) => d.x);
    const mid = (extent[0] + extent[1]) / 2;
    rows.forEach((d) => {
      d.master = d.data.master;
      d.side = side;
      d.screenY = d.x - mid;
    });
    return rows;
  }

  // measures every node's wrapped label (as rendered, with its real font)
  // and returns a per-depth column X, wide enough that even the widest
  // pill at each depth clears its neighboring column with room to spare
  function fitColumns(nodes) {
    const maxHalf = [];
    nodes.forEach((d) => {
      maxHalf[d.depth] = Math.max(maxHalf[d.depth] || 0, d.pillW / 2);
    });
    const x = [0];
    for (let depth = 1; depth < maxHalf.length; depth++) {
      const prevHalf = maxHalf[depth - 1] || 0;
      const half = maxHalf[depth] || 0;
      x[depth] = x[depth - 1] + prevHalf + half + COLUMN_BUFFER;
    }
    return x;
  }

  function renderTree(recenter) {
    const root = roots[state.topicIndex];
    const bounds = svg.node().getBoundingClientRect();

    const rootPseudo = { master: root, depth: 0, screenX: 0, screenY: 0 };
    const rightQuestions = root.children.filter((_, i) => i % 2 === 0);
    const leftQuestions = root.children.filter((_, i) => i % 2 === 1);
    const rightWrapper = buildSideHierarchy(rightQuestions);
    const leftWrapper = buildSideHierarchy(leftQuestions);

    // pass 0: lay out rows at a placeholder gap just to get stable node
    // identities to attach measurements to — the real gap depends on pill
    // heights, which aren't known until those pills exist and are measured
    const rightRows = layoutSideRows(rightWrapper, 1, 40);
    const leftRows = layoutSideRows(leftWrapper, -1, 40);
    const nodes = [rootPseudo, ...rightRows, ...leftRows];

    const nodeSel = nodeLayer.selectAll("g.node").data(nodes, (d) => d.master.id);
    nodeSel.exit().remove();

    const nodeEnter = nodeSel.enter().append("g");
    nodeEnter.append("rect").attr("class", "pill");
    nodeEnter.append("text");
    nodeEnter.append("g").attr("class", "badge");

    const nodeMerge = nodeEnter.merge(nodeSel);
    nodeMerge.attr("class", (d) => `node ${d.master.data.type}`);

    // pass 1: set each node's label (as wrapped text) and measure the
    // rendered result to size its pill — this has to happen before we can
    // know how wide each depth's column needs to be
    nodeMerge.each(function (d) {
      const type = d.master.data.type;
      const data = d.master.data;
      let name;
      if (type === "topic") name = data.name.toUpperCase();
      else if (type === "question") name = `Q${data.tag}. ${data.name}`;
      else if (type === "paragraph") name = data.full; // the sheet's own column-C text, verbatim
      else name = data.name; // kick
      const lines = wrapLabel(name, WRAP_CHARS[type]);
      const lineH = 1.15;
      const startDy = -((lines.length - 1) * lineH) / 2 + 0.32;

      const text = d3.select(this).select("text");
      const tspans = text.selectAll("tspan").data(lines);
      tspans.exit().remove();
      tspans
        .enter()
        .append("tspan")
        .merge(tspans)
        .attr("x", 0)
        .attr("dy", (_, i) => (i === 0 ? startDy : lineH) + "em")
        .text((line) => line);

      // measure the text alone — this <g> can still hold the *previous*
      // render's pill rect and badge, which would otherwise bloat the box
      const bbox = text.node().getBBox();
      d.pillW = bbox.width + PILL_PAD_X[type] * 2;
      d.pillH = bbox.height + PILL_PAD_Y[type] * 2;

      d3.select(this)
        .select("rect.pill")
        .attr("x", -d.pillW / 2)
        .attr("y", -d.pillH / 2)
        .attr("width", d.pillW)
        .attr("height", d.pillH)
        .attr("rx", d.pillH / 2);
    });

    // pass 2: now that every pill's size is known, re-lay-out each side at
    // the real row gap (tall enough to clear the tallest pill anywhere in
    // this view — a script beat's full text can wrap to several lines) and
    // size each depth's column, then place every node (root at the origin).
    // layoutSideRows mutates the same node objects nodes[] already holds,
    // so this updates their .screenY in place — no need to rebuild nodes[].
    const rowGap = Math.max(...nodes.map((d) => d.pillH)) + ROW_BUFFER;
    layoutSideRows(rightWrapper, 1, rowGap);
    layoutSideRows(leftWrapper, -1, rowGap);

    const DEPTH_X = fitColumns(nodes);
    nodes.forEach((d) => {
      d.screenX = d.depth === 0 ? 0 : d.side * DEPTH_X[d.depth];
    });

    posById.clear();
    nodes.forEach((d) => posById.set(d.master.id, { x: d.screenX, y: d.screenY }));

    nodeMerge.attr("transform", (d) => `translate(${d.screenX},${d.screenY})`);

    nodeMerge.each(function (d) {
      const type = d.master.data.type;
      const expandable = type === "question" || type === "paragraph";
      const collapsedCount = d.master._children && !d.master.children ? d.master._children.length : 0;
      const badge = d3.select(this).select("g.badge");
      badge.selectAll("*").remove();
      if (expandable && collapsedCount > 0) {
        const dir = d.screenX < 0 ? -1 : 1;
